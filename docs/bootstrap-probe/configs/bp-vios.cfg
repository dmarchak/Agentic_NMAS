! Minimal bootstrap for a vIOS-L2 joining this lab.
!
! Shaped from s1.cfg's management-plane lines and NOTHING else: no loopback,
! no VLANs, no trunk, no routing process.
!
! Gi0/0 IS configured here, unlike the C8000v's Gi1. That asymmetry is real
! and is why the first probe's vIOS never came up: on this kind containerlab
! runs with CLAB_MGMT_PASSTHROUGH=false, so the node only acquires a
! management address because the startup config asks for one.
!
hostname bp-vios
!
no aaa new-model
no logging console
!
username admin privilege 15 secret 0 admin
!
ip domain-name rcn.lab
!
interface GigabitEthernet0/0
 description clab-mgmt
 no switchport
 ip address dhcp
 negotiation auto
 no shutdown
!
ip ssh version 2
!
line vty 0 4
 logging synchronous
 login local
 transport input ssh
!
end
