<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Save, from Devices. The plan reads only the tool&#x27;s own records: the inventory, the hourly startup check, reachability and the holds; nothing is sent. You confirm its hash. Then each device is held, saves its running configuration to startup and reads it back; a device whose startup lacks an account line is not recorded. The ones that matched are read for their running configuration and recorded as golden in one commit, as you; the whole network saved together may earn a baseline."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="70" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE PLAN · STORED RECORDS ONLY</text><text class="dg-sm" x="14" y="54" text-anchor="start">Inventory, startup check, reachability,</text><text class="dg-sm" x="14" y="67" text-anchor="start">holds. Nothing is sent.</text><rect class="dg-band" x="0" y="96" width="400" height="66" rx="6"/><text class="dg-hd" x="30" y="112" text-anchor="start">CONFIRM</text><rect class="dg-person" x="14" y="118" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="130.0" r="4"/><path class="dg-person" d="M23,141.0 Q30,132.0 37,141.0"/><text class="dg-tx" x="46" y="137.0" text-anchor="start">You confirm its hash</text><rect class="dg-band" x="0" y="168" width="400" height="296" rx="6"/><text class="dg-hd" x="30" y="184" text-anchor="start">THE RUN · A JOB, EACH DEVICE HELD</text><rect class="dg-dev" x="262" y="190" width="118" height="170" rx="5"/><rect class="dg-dev" x="274" y="359" width="8" height="5"/><rect class="dg-dev" x="288" y="359" width="8" height="5"/><rect class="dg-dev" x="302" y="359" width="8" height="5"/><text class="dg-tb" x="321.0" y="208" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="222" text-anchor="middle">six at once</text><circle class="dg-num" cx="22" cy="216" r="9"/><text class="dg-numt" x="22" y="219.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="220" text-anchor="start">Save</text><text class="dg-sm" x="36" y="232" text-anchor="start">running to startup</text><path class="dg-send" d="M202,216 L254.0,216.0"/><polygon class="dg-sendh" points="260.0,216.0 252.0,211.5 252.0,220.5"/><circle class="dg-num" cx="22" cy="258" r="9"/><text class="dg-numt" x="22" y="261.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="262" text-anchor="start">Read startup back</text><text class="dg-sm" x="36" y="274" text-anchor="start">every account line</text><path class="dg-read" d="M260,258 L208.0,258.0"/><polygon class="dg-readh" points="202.0,258.0 210.0,262.5 210.0,253.5"/><circle class="dg-num" cx="22" cy="300" r="9"/><text class="dg-numt" x="22" y="303.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="304" text-anchor="start">Read running</text><text class="dg-sm" x="36" y="316" text-anchor="start">the capture&#x27;s own read</text><path class="dg-read" d="M260,300 L208.0,300.0"/><polygon class="dg-readh" points="202.0,300.0 210.0,304.5 210.0,295.5"/><rect class="dg-store" x="14" y="330" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="330" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="346.0" text-anchor="middle">Persist row each</text><text class="dg-sm" x="109.0" y="360.0" text-anchor="middle">where job health reads it</text><path class="dg-repo" d="M14,386 V420 A93.0,6 0 0 0 200,420 V386"/><ellipse class="dg-repo" cx="107.0" cy="386" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="408.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="422.0" text-anchor="middle">Source: save, as you</text><circle class="dg-num" cx="14" cy="386" r="9"/><text class="dg-numt" x="14" y="389.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="448" text-anchor="start">Not matched on read-back: saved, not recorded.</text></svg>
