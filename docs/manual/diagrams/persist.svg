<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" role="img" aria-label="Persist. The device runs one configuration and boots from another. From the device page, persist saves the running configuration to startup on a held session, reads the startup configuration back and checks every account line is there verbatim, then records the outcome where job health reads it. The host chain after a rotation also updates the lab&#x27;s startup file: a lab integration, off the product&#x27;s path."><line class="dg-lane" x1="212" y1="20" x2="212" y2="364"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="210" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">FROM THE DEVICE PAGE</text><rect class="dg-dev" x="262" y="44" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="193" width="8" height="5"/><rect class="dg-dev" x="288" y="193" width="8" height="5"/><rect class="dg-dev" x="302" y="193" width="8" height="5"/><text class="dg-tb" x="321.0" y="62" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="76" r="9"/><text class="dg-numt" x="22" y="79.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="80" text-anchor="start">Save</text><text class="dg-sm" x="36" y="92" text-anchor="start">running to startup</text><path class="dg-send" d="M202,76 L254.0,76.0"/><polygon class="dg-sendh" points="260.0,76.0 252.0,71.5 252.0,80.5"/><circle class="dg-num" cx="22" cy="120" r="9"/><text class="dg-numt" x="22" y="123.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="124" text-anchor="start">Read startup back</text><text class="dg-sm" x="36" y="136" text-anchor="start">every account line</text><path class="dg-read" d="M260,120 L208.0,120.0"/><polygon class="dg-readh" points="202.0,120.0 210.0,124.5 210.0,115.5"/><rect class="dg-store" x="14" y="158" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="158" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="174.0" text-anchor="middle">Recorded</text><text class="dg-sm" x="109.0" y="188.0" text-anchor="middle">where job health reads it</text><circle class="dg-num" cx="14" cy="158" r="9"/><text class="dg-numt" x="14" y="161.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="236" width="400" height="128" rx="6"/><text class="dg-hd" x="30" y="252" text-anchor="start">THE HOST CHAIN, AFTER A ROTATION</text><text class="dg-sm" x="14" y="270" text-anchor="start">The device&#x27;s own save first, then:</text><path class="dg-labf" d="M14,284 H190 L200,294 V324 H14 Z"/><text class="dg-tb" x="107.0" y="302.0" text-anchor="middle">Lab startup file</text><text class="dg-sm" x="107.0" y="316.0" text-anchor="middle">synced, hash checked</text><rect class="dg-labtag" x="166" y="277" width="28" height="13" rx="3"/><text class="dg-labtx" x="180" y="287" text-anchor="middle">LAB</text><text class="dg-sm" x="214" y="300" text-anchor="start">A redeploy boots</text><text class="dg-sm" x="214" y="313" text-anchor="start">this, not NVRAM.</text><text class="dg-sm" x="14" y="344" text-anchor="start">Without the lab, these stages cannot pass.</text></svg>
