<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="A deploy. The plan sends nothing: committed intent is rendered through the approved template and compared with the device&#x27;s golden, giving the program, the lines intent has and the golden lacks; you confirm its hash. The run holds the device: it checks the dangerous lines before any session, reads the device, sends the program merge-only, reads it again on a new session and verifies within each protocol&#x27;s settle window. If verify fails it undoes what landed and reads it back. The golden is recorded as you, and a receipt whatever happened."><line class="dg-lane" x1="212" y1="20" x2="212" y2="594"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="212" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">BEFORE · THE PLAN · NOTHING SENT</text><path class="dg-intent" d="M14,42 H62 L72,52 V86 H14 Z"/><path class="dg-intent" d="M62,42 V52 H72"/><text class="dg-tb" x="43.0" y="62.0" text-anchor="middle">Intent</text><text class="dg-sm" x="43.0" y="76.0" text-anchor="middle">committed</text><path class="dg-box" d="M78,42 H126 L136,52 V86 H78 Z"/><path class="dg-box" d="M126,42 V52 H136"/><text class="dg-tb" x="107.0" y="62.0" text-anchor="middle">Template</text><text class="dg-sm" x="107.0" y="76.0" text-anchor="middle">approved</text><path class="dg-golden" d="M142,42 H190 L200,52 V86 H142 Z"/><path class="dg-golden" d="M190,42 V52 H200"/><text class="dg-tb" x="171.0" y="62.0" text-anchor="middle">Golden</text><text class="dg-sm" x="171.0" y="76.0" text-anchor="middle">captured</text><path class="dg-rec" d="M43,87 L73.9,119.6"/><polygon class="dg-rech" points="78.0,124.0 75.8,115.1 69.2,121.3"/><path class="dg-rec" d="M107,87 L107.0,118.0"/><polygon class="dg-rech" points="107.0,124.0 111.5,116.0 102.5,116.0"/><path class="dg-rec" d="M171,87 L140.1,119.6"/><polygon class="dg-rech" points="136.0,124.0 144.8,121.3 138.2,115.1"/><rect class="dg-box" x="14" y="126" width="186" height="42" rx="4"/><text class="dg-tb" x="107" y="144" text-anchor="middle">Program</text><text class="dg-sm" x="107" y="158" text-anchor="middle">what intent has, the golden lacks</text><rect class="dg-person" x="14" y="182" width="186" height="32" rx="16.0"/><circle class="dg-person" cx="30" cy="195.0" r="4"/><path class="dg-person" d="M23,206.0 Q30,197.0 37,206.0"/><text class="dg-tx" x="46" y="202.0" text-anchor="start">You confirm its hash</text><rect class="dg-devoff" x="240" y="56" width="140" height="48" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="78.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="92.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="150" r="11"/><line class="dg-nol" x1="302.5" y1="157.5" x2="317.5" y2="142.5"/><text class="dg-sm" x="310" y="176" text-anchor="middle">nothing is sent:</text><text class="dg-sm" x="310" y="189" text-anchor="middle">stored records only</text><rect class="dg-band" x="0" y="238" width="400" height="356" rx="6"/><text class="dg-hd" x="30" y="254" text-anchor="start">THE RUN · HOLDING THE DEVICE</text><rect class="dg-dev" x="262" y="262" width="118" height="222" rx="5"/><rect class="dg-dev" x="274" y="483" width="8" height="5"/><rect class="dg-dev" x="288" y="483" width="8" height="5"/><rect class="dg-dev" x="302" y="483" width="8" height="5"/><text class="dg-tb" x="321.0" y="280" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="272" r="9"/><text class="dg-numt" x="22" y="275.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="276" text-anchor="start">Dangerous lines</text><text class="dg-sm" x="36" y="288" text-anchor="start">checked before any session</text><circle class="dg-num" cx="22" cy="306" r="9"/><text class="dg-numt" x="22" y="309.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="310" text-anchor="start">Read before</text><text class="dg-sm" x="36" y="322" text-anchor="start">config, neighbours, routes</text><path class="dg-read" d="M260,306 L208.0,306.0"/><polygon class="dg-readh" points="202.0,306.0 210.0,310.5 210.0,301.5"/><circle class="dg-num" cx="22" cy="338" r="9"/><text class="dg-numt" x="22" y="341.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="342" text-anchor="start">Send the program</text><text class="dg-sm" x="36" y="354" text-anchor="start">merge-only, as confirmed</text><path class="dg-send" d="M202,338 L254.0,338.0"/><polygon class="dg-sendh" points="260.0,338.0 252.0,333.5 252.0,342.5"/><circle class="dg-num" cx="22" cy="370" r="9"/><text class="dg-numt" x="22" y="373.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="374" text-anchor="start">Read after</text><text class="dg-sm" x="36" y="386" text-anchor="start">on a new session</text><path class="dg-read" d="M260,370 L208.0,370.0"/><polygon class="dg-readh" points="202.0,370.0 210.0,374.5 210.0,365.5"/><circle class="dg-num" cx="22" cy="402" r="9"/><text class="dg-numt" x="22" y="405.6" text-anchor="middle">8</text><text class="dg-tb" x="36" y="406" text-anchor="start">Verify</text><text class="dg-sm" x="36" y="418" text-anchor="start">OSPF 45 s, BGP 60 s, RIP 90 s</text><circle class="dg-clock" cx="214" cy="402" r="8"/><path class="dg-clock" d="M214,397 V402 L218,404"/><text class="dg-tb" x="36" y="446" text-anchor="start">If verify fails: undo</text><text class="dg-sm" x="36" y="458" text-anchor="start">what landed, then read back</text><path class="dg-undo" d="M202,442 L254.0,442.0"/><polygon class="dg-undoh" points="260.0,442.0 252.0,437.5 252.0,446.5"/><path class="dg-golden" d="M14,506 H114 L124,516 V548 H14 Z"/><path class="dg-golden" d="M114,506 V516 H124"/><text class="dg-tb" x="69.0" y="525.0" text-anchor="middle">Golden</text><text class="dg-sm" x="69.0" y="539.0" text-anchor="middle">recorded as you</text><circle class="dg-num" cx="14" cy="506" r="9"/><text class="dg-numt" x="14" y="509.6" text-anchor="middle">9</text><rect class="dg-store" x="134" y="506" width="120" height="42" rx="3"/><rect class="dg-bar" x="134" y="506" width="4" height="42" rx="1"/><text class="dg-tb" x="196.0" y="525.0" text-anchor="middle">Receipt</text><text class="dg-sm" x="196.0" y="539.0" text-anchor="middle">whatever happened</text><circle class="dg-num" cx="134" cy="506" r="9"/><text class="dg-numt" x="134" y="509.6" text-anchor="middle">10</text><text class="dg-sm" x="14" y="576" text-anchor="start">Stages 1, 2 and 5 read records only and send nothing.</text></svg>
