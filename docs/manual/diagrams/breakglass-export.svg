<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Exporting the break-glass record. The preview names every device and the key the record would hold and reveals nothing. You type a passphrase twice; the record is built, sealed and verified in memory, opened with the passphrase and every device and the escrowed key checked, before anything is sent. A reveal row is written first; then it downloads to your browser and the export log records who and its hash. It never touches the host&#x27;s disk."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE HOST</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">YOUR BROWSER</text><rect class="dg-band" x="0" y="20" width="400" height="100" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW</text><path class="dg-box" d="M14,44 H190 L200,54 V84 H14 Z"/><path class="dg-box" d="M190,44 V54 H200"/><text class="dg-tb" x="107.0" y="62.0" text-anchor="middle">What it would hold</text><text class="dg-sm" x="107.0" y="76.0" text-anchor="middle">devices and the key, no value</text><rect class="dg-person" x="14" y="90" width="186" height="26" rx="13.0"/><circle class="dg-person" cx="30" cy="100.0" r="4"/><path class="dg-person" d="M23,111.0 Q30,102.0 37,111.0"/><text class="dg-tx" x="46" y="107.0" text-anchor="start">A passphrase, twice</text><rect class="dg-band" x="0" y="126" width="400" height="210" rx="6"/><text class="dg-hd" x="30" y="142" text-anchor="start">BUILT IN MEMORY</text><rect class="dg-store" x="14" y="150" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="150" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="165.0" text-anchor="middle">Sealed record</text><text class="dg-sm" x="109.0" y="179.0" text-anchor="middle">never on the host&#x27;s disk</text><circle class="dg-num" cx="14" cy="150" r="9"/><text class="dg-numt" x="14" y="153.6" text-anchor="middle">3</text><rect class="dg-store" x="14" y="194" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="194" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="209.0" text-anchor="middle">Verified</text><text class="dg-sm" x="109.0" y="223.0" text-anchor="middle">opened, every device checked</text><circle class="dg-num" cx="14" cy="194" r="9"/><text class="dg-numt" x="14" y="197.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="238" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="238" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="253.0" text-anchor="middle">Reveal row</text><text class="dg-sm" x="109.0" y="267.0" text-anchor="middle">before anything leaves</text><circle class="dg-num" cx="14" cy="238" r="9"/><text class="dg-numt" x="14" y="241.6" text-anchor="middle">5</text><path class="dg-rec" d="M202,296 L232.0,296.0"/><polygon class="dg-rech" points="238.0,296.0 230.0,291.5 230.0,300.5"/><path class="dg-box" d="M240,276 H370 L380,286 V316 H240 Z"/><path class="dg-box" d="M370,276 V286 H380"/><text class="dg-tb" x="310.0" y="294.0" text-anchor="middle">The file</text><text class="dg-sm" x="310.0" y="308.0" text-anchor="middle">on your laptop</text><rect class="dg-store" x="14" y="290" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="290" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="305.0" text-anchor="middle">Export log</text><text class="dg-sm" x="109.0" y="319.0" text-anchor="middle">who, when, its hash</text><circle class="dg-num" cx="14" cy="290" r="9"/><text class="dg-numt" x="14" y="293.6" text-anchor="middle">6</text><rect class="dg-band" x="0" y="342" width="400" height="122" rx="6"/><text class="dg-hd" x="30" y="358" text-anchor="start">AFTERWARDS</text><text class="dg-sm" x="14" y="374" text-anchor="start">A rotation makes it stale: job health</text><text class="dg-sm" x="14" y="387" text-anchor="start">names the device until you export again.</text><text class="dg-sm" x="14" y="413" text-anchor="start">Keep the file and the passphrase apart.</text></svg>
