! Image: flash0:/vios_l2-adventerprisek9-m
! Chassis type: processor
! VTP: VTP Operating Mode                : Server
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec show-timezone
no service password-encryption
service compress-config
!
hostname s3
!
boot-start-marker
boot-end-marker
!
no logging console
!
username admin privilege 15 secret 5 $1$eF7z$M1nOpQrStUvWxYz2345678
no aaa new-model
!
ip domain-name rcn.lab
ip cef
ipv6 unicast-routing
ipv6 cef
!
spanning-tree mode pvst
spanning-tree extend system-id
!
lldp run
!
interface Loopback0
 description mgmt identity
 ip address 10.255.1.23 255.255.255.255
 ipv6 address 2001:DB8:1::23/128
!
interface GigabitEthernet0/0
 description clab-mgmt
 no switchport
 ip address dhcp
 negotiation auto
!
interface GigabitEthernet0/1
 negotiation auto
!
interface GigabitEthernet0/2
 description r3 Gi3 - VLAN 100 CORE
 switchport access vlan 100
 switchport mode access
 negotiation auto
!
interface GigabitEthernet0/3
 description trunk to s4 Gi0/3 - carries VLAN 100
 switchport trunk allowed vlan 100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
!
interface GigabitEthernet1/0
 description r1 Gi2 - VLAN 100 CORE
 switchport access vlan 100
 switchport mode access
 negotiation auto
!
interface GigabitEthernet1/1
 description NMAS via br-mgmt -> Proxmox vmbr10
 switchport access vlan 99
 switchport mode access
 negotiation auto
!
interface Vlan99
 description NMAS management segment
 ip address 10.255.0.1 255.255.255.0
 ipv6 address 2001:DB8:255::1/64
!
interface Vlan100
 description CORE - OSPF segment with r1-r4 and s4
 ip address 10.255.3.23 255.255.255.0
 ip ospf priority 0
 ipv6 address 2001:DB8:3::23/64
 ipv6 enable
!
router ospf 1
 router-id 10.255.1.23
 redistribute static subnets
 passive-interface Loopback0
 passive-interface Vlan99
 network 10.255.0.0 0.0.255.255 area 0
!
ip forward-protocol nd
!
ip http server
!
ip ssh time-out 60
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip route 10.255.1.10 255.255.255.255 10.255.0.10
!
ip sla 1
 icmp-echo 10.255.1.11 source-interface Loopback0
 frequency 10
ip sla schedule 1 life forever start-time now
logging trap critical
logging origin-id hostname
logging source-interface Loopback0
logging host 10.255.1.10
ipv6 route ::/0 2001:DB8:3::13
!
snmp-server community public RO
snmp-server trap-source Loopback0
snmp-server location containerlab-rcn-lab1
snmp-server contact dmarchak
snmp-server enable traps snmp linkdown linkup
snmp-server host 10.255.1.10 version 2c public 
snmp ifmib ifindex persist
!
control-plane
!
banner exec ^C
**************************************************************************
* IOSv is strictly limited to use for evaluation, demonstration and IOS  *
**************************************************************************^C
banner login ^C
**************************************************************************
* IOSv is strictly limited to use for evaluation, demonstration and IOS  *
**************************************************************************^C
!
line con 0
line aux 0
line vty 0 4
 login local
 transport input telnet ssh
line vty 5 15
 login local
 transport input telnet ssh
!
ntp server 10.255.1.10
!
end
