# A worked example's app (modules/jobs/templates/AUTHORING.md, "A worked app"), a fixture of
# tests/test_mercury_cli.py: its logic is a plain function over plain data, so the app gate's
# runner tests it without a controller. Documentation values only.
name: dns_overrides
version: 0.1.0
summary: Decides a DNS query by the app's overrides, before any verdict is asked.
controllers:
  ryu: ">=4.34"
openflow_versions: ["1.3"]
requires: []
config_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [overrides]
  properties:
    overrides:
      description: Domains decided here; block wins over allow.
      type: object
      additionalProperties: false
      properties:
        allow: {type: array, items: {type: string}}
        block: {type: array, items: {type: string}}
rest:
  prefix: /dns_overrides
  endpoints:
    - path: /health
      methods: [GET]
      summary: The app is loaded and answers.
tests:
  - test_app.py
