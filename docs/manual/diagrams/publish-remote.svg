<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Publishing the record to the remote. Every commit hands itself to the push hook, which holds a push carrying a new secret value or kind until a person acknowledges it; otherwise it pushes the branch and the tags it was told about, records the push and asks the remote again. Push now does the same on request. Verify the remote reads it with the key: readable, private, the right repository. The remote is never force-pushed."><line class="dg-lane" x1="212" y1="20" x2="212" y2="494"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE REMOTE</text><rect class="dg-band" x="0" y="20" width="400" height="230" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">EVERY COMMIT</text><path class="dg-repo" d="M14,50 V82 A93.0,6 0 0 0 200,82 V50"/><ellipse class="dg-repo" cx="107.0" cy="50" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="71.0" text-anchor="middle">A commit</text><text class="dg-sm" x="107.0" y="85.0" text-anchor="middle">handed to the push hook</text><circle class="dg-num" cx="14" cy="50" r="9"/><text class="dg-numt" x="14" y="53.6" text-anchor="middle">1</text><rect class="dg-store" x="14" y="100" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="100" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="116.0" text-anchor="middle">Publication gate</text><text class="dg-sm" x="109.0" y="130.0" text-anchor="middle">new secret value or kind?</text><circle class="dg-num" cx="14" cy="100" r="9"/><text class="dg-numt" x="14" y="103.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="156" text-anchor="start">Held: acknowledge, then Push now.</text><rect class="dg-svc" x="240" y="170" width="140" height="36" rx="18.0"/><text class="dg-tb" x="310.0" y="186.0" text-anchor="middle">The remote</text><text class="dg-sm" x="310.0" y="200.0" text-anchor="middle">branch and tags</text><path class="dg-rec" d="M202,188 L232.0,188.0"/><polygon class="dg-rech" points="238.0,188.0 230.0,183.5 230.0,192.5"/><circle class="dg-num" cx="220" cy="178" r="9"/><text class="dg-numt" x="220" y="181.6" text-anchor="middle">3</text><rect class="dg-store" x="14" y="206" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="206" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="222.0" text-anchor="middle">Push recorded</text><text class="dg-sm" x="109.0" y="236.0" text-anchor="middle">the remote asked again</text><circle class="dg-num" cx="14" cy="206" r="9"/><text class="dg-numt" x="14" y="209.6" text-anchor="middle">5</text><rect class="dg-band" x="0" y="256" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="272" text-anchor="start">PUSH NOW · VERIFY</text><rect class="dg-person" x="14" y="280" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="292.0" r="4"/><path class="dg-person" d="M23,303.0 Q30,294.0 37,303.0"/><text class="dg-tx" x="46" y="299.0" text-anchor="start">You press Push now</text><path class="dg-rec" d="M202,296 L232.0,296.0"/><polygon class="dg-rech" points="238.0,296.0 230.0,291.5 230.0,300.5"/><rect class="dg-svc" x="240" y="280" width="140" height="34" rx="17.0"/><text class="dg-tb" x="310.0" y="301.0" text-anchor="middle">The remote</text><path class="dg-read" d="M238,346 L208.0,346.0"/><polygon class="dg-readh" points="202.0,346.0 210.0,350.5 210.0,341.5"/><text class="dg-tb" x="14" y="350" text-anchor="start">Verify: read and private</text><rect class="dg-band" x="0" y="382" width="400" height="112" rx="6"/><text class="dg-hd" x="30" y="398" text-anchor="start">NEVER</text><text class="dg-sm" x="14" y="408" text-anchor="start">Never force-pushed, never unpublished.</text><text class="dg-sm" x="14" y="421" text-anchor="start">Whether history is on the remote is read</text><text class="dg-sm" x="14" y="434" text-anchor="start">from the remote&#x27;s own branch.</text></svg>
