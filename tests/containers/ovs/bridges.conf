# The harness's bridges: two switches with datapath ids 3 and 4 (the lab's two Open vSwitch
# hosts' fixed ids, tests/fixtures/lab9_captures/2026-11-06/ryu-rest.txt), one cable between
# them, and a port held down, on one switch container. OVS's port names are unique across one
# ovs-vswitchd, so each carries its bridge's number. Every bridge is datapath_type=netdev
# (ovs-start sets it, and refuses to start when a bridge has any other).
#
#   bridge NAME DPID(16 hex)
#   port BRIDGE NAME OFPORT up|down      an OVS dummy port; "down" sets it administratively down,
#                                        which OVS reports as config PORT_DOWN and state LINK_DOWN
#   patch BRIDGE_A NAME_A OFPORT_A BRIDGE_B NAME_B OFPORT_B    a cable between two bridges
bridge br3 0000000000000003
bridge br4 0000000000000004
port br3 s3-eth1 1 up
port br4 s4-eth1 1 up
patch br3 s3-eth2 2 br4 s4-eth2 2
port br4 s4-eth3 3 down
