<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Switching a network&#x27;s settings: making it standalone or inheriting again, or one group inherit, its own or not applicable. The preview reads the network&#x27;s settings and Default&#x27;s and shows each group or setting today and after, a secret only as set. You confirm against the preview&#x27;s fingerprint; the switch reads both again and refuses, naming what moved, if either changed; then it writes the network&#x27;s own settings file and appends who, when and what changed to its settings record, which keeps any value removed. No device is contacted."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICES</text><rect class="dg-band" x="0" y="20" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW · NOTHING IS WRITTEN</text><rect class="dg-store" x="14" y="44" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="44" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="60.0" text-anchor="middle">The network&#x27;s settings</text><text class="dg-sm" x="109.0" y="74.0" text-anchor="middle">its mode, its groups</text><rect class="dg-store" x="14" y="90" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="90" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="106.0" text-anchor="middle">Default&#x27;s settings</text><text class="dg-sm" x="109.0" y="120.0" text-anchor="middle">the base it may inherit</text><path class="dg-box" d="M14,134 H190 L200,144 V164 H14 Z"/><path class="dg-box" d="M190,134 V144 H200"/><text class="dg-tb" x="107.0" y="147.0" text-anchor="middle">Today and after</text><text class="dg-sm" x="107.0" y="161.0" text-anchor="middle">a secret as set</text><circle class="dg-num" cx="14" cy="134" r="9"/><text class="dg-numt" x="14" y="137.6" text-anchor="middle">1</text><rect class="dg-band" x="0" y="176" width="400" height="230" rx="6"/><text class="dg-hd" x="30" y="192" text-anchor="start">THE SWITCH</text><rect class="dg-person" x="14" y="198" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="210.0" r="4"/><path class="dg-person" d="M23,221.0 Q30,212.0 37,221.0"/><text class="dg-tx" x="46" y="217.0" text-anchor="start">You confirm its fingerprint</text><circle class="dg-num" cx="14" cy="198" r="9"/><text class="dg-numt" x="14" y="201.6" text-anchor="middle">2</text><path class="dg-box" d="M14,240 H190 L200,250 V274 H14 Z"/><path class="dg-box" d="M190,240 V250 H200"/><text class="dg-tb" x="107.0" y="255.0" text-anchor="middle">Both read again</text><text class="dg-sm" x="107.0" y="269.0" text-anchor="middle">moved: refused, named</text><circle class="dg-num" cx="14" cy="240" r="9"/><text class="dg-numt" x="14" y="243.6" text-anchor="middle">3</text><path class="dg-rec" d="M107,276 L107.0,290.0"/><polygon class="dg-rech" points="107.0,296.0 111.5,288.0 102.5,288.0"/><rect class="dg-store" x="14" y="298" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="298" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="314.0" text-anchor="middle">The network&#x27;s own file</text><text class="dg-sm" x="109.0" y="328.0" text-anchor="middle">owner-only, a secret encrypted</text><circle class="dg-num" cx="14" cy="298" r="9"/><text class="dg-numt" x="14" y="301.6" text-anchor="middle">4</text><path class="dg-rec" d="M107,336 L107.0,350.0"/><polygon class="dg-rech" points="107.0,356.0 111.5,348.0 102.5,348.0"/><path class="dg-repo" d="M14,364 V392 A93.0,6 0 0 0 200,392 V364"/><ellipse class="dg-repo" cx="107.0" cy="364" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="383.0" text-anchor="middle">Its settings record</text><text class="dg-sm" x="107.0" y="397.0" text-anchor="middle">who, when, what; removed kept</text><circle class="dg-num" cx="14" cy="358" r="9"/><text class="dg-numt" x="14" y="361.6" text-anchor="middle">5</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">Every device</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="240" r="11"/><line class="dg-nol" x1="302.5" y1="247.5" x2="317.5" y2="232.5"/><text class="dg-sm" x="310" y="266" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="279" text-anchor="middle">settings only</text><rect class="dg-band" x="0" y="412" width="400" height="52" rx="6"/><text class="dg-hd" x="30" y="428" text-anchor="start">AFTER</text><text class="dg-sm" x="14" y="436" text-anchor="start">Readers and pages use the new settings at their next read.</text></svg>
