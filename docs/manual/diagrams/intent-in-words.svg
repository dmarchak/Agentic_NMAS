<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Change it in words: the device and the interfaces, VLANs and networks the sentence names are read by code, and a sentence naming none stops there with nothing sent; one recorded, capped call through the AI gateway carries only those parts&#x27; current values and the keys a change may set, and answers with a patch; the patch is refused before any preview if it changes what the sentence did not name; the intent editor previews it, its diff and what a deploy would send; nothing is written and no device is asked."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICES</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The named parts</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">read by code</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">none named: nothing sent</text><rect class="dg-svc" x="250" y="118" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="134.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="148.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,136 L242.0,136.0"/><polygon class="dg-sendh" points="248.0,136.0 240.0,131.5 240.0,140.5"/><path class="dg-box" d="M14,118 H190 L200,128 V154 H14 Z"/><path class="dg-box" d="M190,118 V128 H200"/><text class="dg-tb" x="107.0" y="134.0" text-anchor="middle">A patch</text><text class="dg-sm" x="107.0" y="148.0" text-anchor="middle">a strict schema</text><circle class="dg-num" cx="14" cy="118" r="9"/><text class="dg-numt" x="14" y="121.6" text-anchor="middle">2</text><path class="dg-box" d="M14,186 H190 L200,196 V226 H14 Z"/><path class="dg-box" d="M190,186 V196 H200"/><text class="dg-tb" x="107.0" y="204.0" text-anchor="middle">Checked</text><text class="dg-sm" x="107.0" y="218.0" text-anchor="middle">only what was named</text><circle class="dg-num" cx="14" cy="186" r="9"/><text class="dg-numt" x="14" y="189.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="240" text-anchor="start">anything else: refused</text><path class="dg-box" d="M14,262 H190 L200,272 V302 H14 Z"/><path class="dg-box" d="M190,262 V272 H200"/><text class="dg-tb" x="107.0" y="280.0" text-anchor="middle">The editor&#x27;s preview</text><text class="dg-sm" x="107.0" y="294.0" text-anchor="middle">what a deploy would send</text><circle class="dg-num" cx="14" cy="262" r="9"/><text class="dg-numt" x="14" y="265.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="330" text-anchor="start">Nothing is written.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device is asked or changed.</text></svg>
