[pytest]
# Without pythonpath, `pytest tests/` fails with "No module named 'modules'" —
# only `python -m pytest` from the repo root worked, because that puts cwd on
# sys.path. Both invocations work now.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# The per-TEST bound, from a measurement (2026-09-28, laptop, serial): the
# slowest single item is a 17.3 s module-scoped setup (the POST secret sweep's
# planting) and the slowest test body 6.3 s; 45 s is 2.5x the slowest. It
# dumps every thread's stack for a test that runs longer, naming the test and
# the line it waits on, and does not stop the run: the suite's own bound
# (scripts/nmas-test, 300 s) does that.
faulthandler_timeout = 45
filterwarnings =
    ignore::DeprecationWarning
markers =
    real_identity: the test meets the real identity layer, not the default verified person (tests/conftest.py)
    real_measurements: the test meets the committed removal measurements, not the all-exact table (tests/test_removal.py)
    real_receipts_path: the test writes deploy receipts to the list's real path, not the test's temp directory (tests/conftest.py)
    fleet_words_allowed: the test plants fleet wording in a device card to check the C408 guard (tests/conftest.py)
