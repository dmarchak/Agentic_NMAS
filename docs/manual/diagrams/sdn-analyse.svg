<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Analyse this network: Collect now runs a read job, never a page view, that reads every switch&#x27;s flows, its port counters twice and its port descriptions, and the controller&#x27;s links, through the controller&#x27;s driver; the collection is kept as a snapshot under its own id, each fact with its evidence id, masked and sealed; Analyse sends that snapshot&#x27;s facts and nothing else in one recorded, capped call through the AI gateway, while the topology class is allowed; the answer is parsed strictly and each finding&#x27;s evidence held to the snapshot, a finding citing nothing it holds dropped and counted; each planted issue is marked found or missed by the evidence its findings cite. Nothing is sent to a switch."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CONTROLLER</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You press Collect now</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-svc" x="250" y="84" width="130" height="50" rx="25.0"/><text class="dg-tb" x="315.0" y="107.0" text-anchor="middle">Its REST API</text><text class="dg-sm" x="315.0" y="121.0" text-anchor="middle">flows, ports, links</text><text class="dg-tb" x="36" y="100" text-anchor="start">A read job</text><text class="dg-sm" x="36" y="112" text-anchor="start">the counters twice, 5 s apart</text><path class="dg-read" d="M260,96 L208.0,96.0"/><polygon class="dg-readh" points="202.0,96.0 210.0,100.5 210.0,91.5"/><text class="dg-tb" x="36" y="130" text-anchor="start">one at a time</text><text class="dg-sm" x="36" y="142" text-anchor="start">bounded, announced</text><rect class="dg-store" x="14" y="160" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="160" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="178.0" text-anchor="middle">The snapshot</text><text class="dg-sm" x="109.0" y="192.0" text-anchor="middle">its own id, masked, sealed</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="216" text-anchor="start">kept, so it can be analysed again</text><rect class="dg-band" x="0" y="232" width="400" height="128" rx="6"/><text class="dg-hd" x="30" y="248" text-anchor="start">THE CALL · A PERSON&#x27;S PRESS</text><rect class="dg-svc" x="250" y="262" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="278.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="292.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,280 L242.0,280.0"/><polygon class="dg-sendh" points="248.0,280.0 240.0,275.5 240.0,284.5"/><path class="dg-box" d="M14,262 H190 L200,272 V298 H14 Z"/><path class="dg-box" d="M190,262 V272 H200"/><text class="dg-tb" x="107.0" y="278.0" text-anchor="middle">The snapshot&#x27;s facts</text><text class="dg-sm" x="107.0" y="292.0" text-anchor="middle">each with its evidence id</text><circle class="dg-num" cx="14" cy="262" r="9"/><text class="dg-numt" x="14" y="265.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="316" text-anchor="start">no planted issue is sent</text><text class="dg-sm" x="14" y="340" text-anchor="start">the topology class off: nothing sent</text><path class="dg-box" d="M14,376 H190 L200,386 V416 H14 Z"/><path class="dg-box" d="M190,376 V386 H200"/><text class="dg-tb" x="107.0" y="394.0" text-anchor="middle">Checked in code</text><text class="dg-sm" x="107.0" y="408.0" text-anchor="middle">every id held to the snapshot</text><circle class="dg-num" cx="14" cy="376" r="9"/><text class="dg-numt" x="14" y="379.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="432" text-anchor="start">citing nothing it holds: dropped, counted</text><path class="dg-box" d="M14,446 H190 L200,456 V482 H14 Z"/><path class="dg-box" d="M190,446 V456 H200"/><text class="dg-tb" x="107.0" y="462.0" text-anchor="middle">Found or missed</text><text class="dg-sm" x="107.0" y="476.0" text-anchor="middle">each planted issue</text><circle class="dg-num" cx="14" cy="446" r="9"/><text class="dg-numt" x="14" y="449.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="506" text-anchor="start">Nothing is sent to a switch.</text></svg>
