<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Approving a template. Every bound device&#x27;s captured configuration is parsed, rendered back through the template and compared line by line, and the lines the parser does not model are judged against the acknowledgement in the device&#x27;s committed intent. At least one device must reproduce exactly. You confirm, bound to the template&#x27;s fingerprint and the check you read; the approval is recorded as you with each device&#x27;s result, and committed. A revocation records its reason the same way. No device is contacted."><line class="dg-lane" x1="212" y1="20" x2="212" y2="434"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-repo" d="M14,46 V74 A93.0,6 0 0 0 200,74 V46"/><ellipse class="dg-repo" cx="107.0" cy="46" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="65.0" text-anchor="middle">Each bound device</text><text class="dg-sm" x="107.0" y="79.0" text-anchor="middle">its golden, its intent</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,82 L107.0,96.0"/><polygon class="dg-rech" points="107.0,102.0 111.5,94.0 102.5,94.0"/><path class="dg-box" d="M14,104 H190 L200,114 V144 H14 Z"/><path class="dg-box" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="122.0" text-anchor="middle">Parsed, rendered back</text><text class="dg-sm" x="107.0" y="136.0" text-anchor="middle">compared line by line</text><path class="dg-box" d="M14,156 H190 L200,166 V190 H14 Z"/><path class="dg-box" d="M190,156 V166 H200"/><text class="dg-tb" x="107.0" y="171.0" text-anchor="middle">Every failing line</text><text class="dg-sm" x="107.0" y="185.0" text-anchor="middle">and each acknowledgement</text><rect class="dg-person" x="14" y="204" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="216.0" r="4"/><path class="dg-person" d="M23,227.0 Q30,218.0 37,227.0"/><text class="dg-tx" x="46" y="223.0" text-anchor="start">You approve, as you</text><circle class="dg-num" cx="14" cy="204" r="9"/><text class="dg-numt" x="14" y="207.6" text-anchor="middle">2</text><path class="dg-rec" d="M107,236 L107.0,250.0"/><polygon class="dg-rech" points="107.0,256.0 111.5,248.0 102.5,248.0"/><path class="dg-repo" d="M14,264 V292 A93.0,6 0 0 0 200,292 V264"/><ellipse class="dg-repo" cx="107.0" cy="264" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="283.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="297.0" text-anchor="middle">the approvals record</text><circle class="dg-num" cx="14" cy="258" r="9"/><text class="dg-numt" x="14" y="261.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="322" text-anchor="start">Revoke…: your reason, recorded</text><circle class="dg-num" cx="14" cy="312" r="9"/><text class="dg-numt" x="14" y="315.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="335" text-anchor="start">and committed the same way.</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">The devices</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="200" r="11"/><line class="dg-nol" x1="302.5" y1="207.5" x2="317.5" y2="192.5"/><text class="dg-sm" x="310" y="226" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="239" text-anchor="middle">a deploy does that</text></svg>
