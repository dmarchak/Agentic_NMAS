<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="Marking a device drained, or clearing the mark. You give a reason; the tool checks that you are a verified person, that the reason has the shape of one and that the device is not already in that state, then appends who, when and why to the network&#x27;s drained record. The Devices list and the device page draw the badge, History shows the event, and Needs attention holds back Grafana alerts on drained devices only. Nothing is sent."><line class="dg-lane" x1="212" y1="20" x2="212" y2="264"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You give a reason</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,72 L107.0,86.0"/><polygon class="dg-rech" points="107.0,92.0 111.5,84.0 102.5,84.0"/><rect class="dg-store" x="14" y="94" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="94" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="112.0" text-anchor="middle">The drained record</text><text class="dg-sm" x="109.0" y="126.0" text-anchor="middle">who, when, why</text><circle class="dg-num" cx="14" cy="94" r="9"/><text class="dg-numt" x="14" y="97.6" text-anchor="middle">2</text><path class="dg-rec" d="M107,136 L107.0,150.0"/><polygon class="dg-rech" points="107.0,156.0 111.5,148.0 102.5,148.0"/><rect class="dg-store" x="14" y="158" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="158" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="176.0" text-anchor="middle">Badge and History</text><text class="dg-sm" x="109.0" y="190.0" text-anchor="middle">alerts on it held back</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="150" r="11"/><line class="dg-nol" x1="302.5" y1="157.5" x2="317.5" y2="142.5"/><text class="dg-sm" x="310" y="176" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="189" text-anchor="middle">a person&#x27;s word</text></svg>
