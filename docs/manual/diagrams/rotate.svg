<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Rotating a device&#x27;s credential. The preview reads the account&#x27;s line on the device and shows the program with the password masked; you confirm its fingerprint. The apply generates a password and stages it before anything is sent, holds one session, sends the change, and proves it on a fresh login before trusting it, putting the old line back on the held session if the login fails. Then it records the new credential, clears the staged copy and persists. On the lab, persist also updates the lab startup file."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="110" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW</text><rect class="dg-dev" x="262" y="40" width="118" height="60" rx="5"/><rect class="dg-dev" x="274" y="99" width="8" height="5"/><rect class="dg-dev" x="288" y="99" width="8" height="5"/><rect class="dg-dev" x="302" y="99" width="8" height="5"/><text class="dg-tb" x="321.0" y="58" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="66" r="9"/><text class="dg-numt" x="22" y="69.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="70" text-anchor="start">Read the account</text><text class="dg-sm" x="36" y="82" text-anchor="start">the line, live</text><path class="dg-read" d="M260,66 L208.0,66.0"/><polygon class="dg-readh" points="202.0,66.0 210.0,70.5 210.0,61.5"/><rect class="dg-person" x="14" y="92" width="186" height="28" rx="14.0"/><circle class="dg-person" cx="30" cy="103.0" r="4"/><path class="dg-person" d="M23,114.0 Q30,105.0 37,114.0"/><text class="dg-tx" x="46" y="110.0" text-anchor="start">You confirm it</text><rect class="dg-band" x="0" y="136" width="400" height="300" rx="6"/><text class="dg-hd" x="30" y="152" text-anchor="start">THE APPLY · ONE HELD SESSION</text><rect class="dg-store" x="14" y="158" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="158" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="173.0" text-anchor="middle">Staged copy</text><text class="dg-sm" x="109.0" y="187.0" text-anchor="middle">before anything is sent</text><circle class="dg-num" cx="14" cy="158" r="9"/><text class="dg-numt" x="14" y="161.6" text-anchor="middle">3</text><rect class="dg-dev" x="262" y="206" width="118" height="210" rx="5"/><rect class="dg-dev" x="274" y="415" width="8" height="5"/><rect class="dg-dev" x="288" y="415" width="8" height="5"/><rect class="dg-dev" x="302" y="415" width="8" height="5"/><text class="dg-tb" x="321.0" y="224" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="230" r="9"/><text class="dg-numt" x="22" y="233.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="234" text-anchor="start">Push</text><text class="dg-sm" x="36" y="246" text-anchor="start">the new secret</text><path class="dg-send" d="M202,230 L254.0,230.0"/><polygon class="dg-sendh" points="260.0,230.0 252.0,225.5 252.0,234.5"/><circle class="dg-num" cx="22" cy="266" r="9"/><text class="dg-numt" x="22" y="269.6" text-anchor="middle">8</text><text class="dg-tb" x="36" y="270" text-anchor="start">Fresh login</text><text class="dg-sm" x="36" y="282" text-anchor="start">proves it works</text><path class="dg-read" d="M260,266 L208.0,266.0"/><polygon class="dg-readh" points="202.0,266.0 210.0,270.5 210.0,261.5"/><text class="dg-tb" x="36" y="306" text-anchor="start">If it fails</text><text class="dg-sm" x="36" y="318" text-anchor="start">the old line, put back</text><path class="dg-undo" d="M202,302 L254.0,302.0"/><polygon class="dg-undoh" points="260.0,302.0 252.0,297.5 252.0,306.5"/><circle class="dg-num" cx="22" cy="342" r="9"/><text class="dg-numt" x="22" y="345.6" text-anchor="middle">11</text><text class="dg-tb" x="36" y="346" text-anchor="start">Record</text><text class="dg-sm" x="36" y="358" text-anchor="start">the inventory or override</text><circle class="dg-num" cx="22" cy="376" r="9"/><text class="dg-numt" x="22" y="379.6" text-anchor="middle">12</text><text class="dg-tb" x="36" y="380" text-anchor="start">Clear the staged copy</text><circle class="dg-num" cx="22" cy="410" r="9"/><text class="dg-numt" x="22" y="413.6" text-anchor="middle">13</text><text class="dg-tb" x="36" y="414" text-anchor="start">Persist</text><text class="dg-sm" x="36" y="426" text-anchor="start">save and read back</text><path class="dg-send" d="M202,410 L254.0,410.0"/><polygon class="dg-sendh" points="260.0,410.0 252.0,405.5 252.0,414.5"/><rect class="dg-band" x="0" y="442" width="400" height="112" rx="6"/><text class="dg-hd" x="30" y="458" text-anchor="start">ON THE LAB ONLY</text><path class="dg-labf" d="M14,466 H190 L200,476 V506 H14 Z"/><text class="dg-tb" x="107.0" y="484.0" text-anchor="middle">Lab startup file</text><text class="dg-sm" x="107.0" y="498.0" text-anchor="middle">re-synced</text><rect class="dg-labtag" x="166" y="459" width="28" height="13" rx="3"/><text class="dg-labtx" x="180" y="469" text-anchor="middle">LAB</text><text class="dg-sm" x="14" y="534" text-anchor="start">Without the lab, persistence reads unverified.</text></svg>
