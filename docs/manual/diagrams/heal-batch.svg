<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Turn on self-healing and fix all: guard 6 held several devices that departed at once, and each hold kept what its fix would send; Needs attention&#x27;s card says how many devices have faults and how many Mercury can fix, with each program, before you press; you press once, as a verified person who may change self-healing, bound to the card&#x27;s hash; the AI starts on each incident with no fix, as your press under every cap; a job turns on Auto for the network&#x27;s default duration and records the approval, then fixes one device first through the heal, held and verified, and only then the rest at once, each held and verified, starting none after a failure; guard 10 still counts every heal; the outcome is recorded and the strip shows each step."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">Guard 6&#x27;s hold</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">each fix kept, nothing sent</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,96 H190 L200,106 V132 H14 Z"/><path class="dg-box" d="M190,96 V106 H200"/><text class="dg-tb" x="107.0" y="112.0" text-anchor="middle">The batch card</text><text class="dg-sm" x="107.0" y="126.0" text-anchor="middle">N have faults, M fixable</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="148" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="160.0" r="4"/><path class="dg-person" d="M23,171.0 Q30,162.0 37,171.0"/><text class="dg-tx" x="46" y="167.0" text-anchor="start">You press, by its hash</text><circle class="dg-num" cx="14" cy="148" r="9"/><text class="dg-numt" x="14" y="151.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="196" text-anchor="start">The AI starts on each with no fix</text><rect class="dg-band" x="0" y="214" width="400" height="170" rx="6"/><text class="dg-hd" x="30" y="230" text-anchor="start">THE BATCH · A JOB, AS THE POLICY YOU TURNED ON</text><rect class="dg-dev" x="262" y="290" width="118" height="130" rx="5"/><rect class="dg-dev" x="274" y="419" width="8" height="5"/><rect class="dg-dev" x="288" y="419" width="8" height="5"/><rect class="dg-dev" x="302" y="419" width="8" height="5"/><text class="dg-tb" x="321.0" y="308" text-anchor="middle">Each device</text><text class="dg-sm" x="321.0" y="322" text-anchor="middle">its fix</text><circle class="dg-num" cx="22" cy="250" r="9"/><text class="dg-numt" x="22" y="253.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="254" text-anchor="start">Auto on, approval kept</text><text class="dg-sm" x="36" y="266" text-anchor="start">the default duration</text><circle class="dg-num" cx="22" cy="300" r="9"/><text class="dg-numt" x="22" y="303.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="304" text-anchor="start">One device first</text><text class="dg-sm" x="36" y="316" text-anchor="start">held, verified</text><path class="dg-read" d="M260,300 L208.0,300.0"/><polygon class="dg-readh" points="202.0,300.0 210.0,304.5 210.0,295.5"/><circle class="dg-num" cx="22" cy="350" r="9"/><text class="dg-numt" x="22" y="353.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="354" text-anchor="start">Then the rest at once</text><text class="dg-sm" x="36" y="366" text-anchor="start">none after a failure</text><rect class="dg-store" x="14" y="420" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="420" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="438.0" text-anchor="middle">The batch&#x27;s record</text><text class="dg-sm" x="109.0" y="452.0" text-anchor="middle">who, the hash, each device</text><circle class="dg-num" cx="14" cy="420" r="9"/><text class="dg-numt" x="14" y="423.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="482" text-anchor="start">Guard 10 still counts every heal.</text><text class="dg-sm" x="14" y="500" text-anchor="start">Rollback: each device&#x27;s own, the</text><text class="dg-sm" x="14" y="513" text-anchor="start">heal&#x27;s pipeline undoing what landed.</text></svg>
