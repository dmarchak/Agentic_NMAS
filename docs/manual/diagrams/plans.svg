<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="A plan of operations, approved once: the toolbar assistant may propose one of Mercury&#x27;s plans with its parameters, which Mercury holds to the plan&#x27;s schema; the preview shows every step previewed by its own operation, and one hash for the whole plan; you approve it with a reason; Mercury previews it again and refuses a moved hash, then runs each step in order through its own apply, verify and record; the first step that does not pass stops the plan, the steps after it do not run, and nothing is retried; the plan&#x27;s outcome is recorded beside each step&#x27;s own."><line class="dg-lane" x1="212" y1="20" x2="212" y2="414"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">EACH STEP&#x27;S OWN OPERATION</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The proposal</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">a plan and its values</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">held to the plan&#x27;s schema</text><path class="dg-box" d="M14,104 H190 L200,114 V140 H14 Z"/><path class="dg-box" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="120.0" text-anchor="middle">The preview</text><text class="dg-sm" x="107.0" y="134.0" text-anchor="middle">each step&#x27;s own, one hash</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="156" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="168.0" r="4"/><path class="dg-person" d="M23,179.0 Q30,170.0 37,179.0"/><text class="dg-tx" x="46" y="175.0" text-anchor="start">You approve, once, a reason</text><circle class="dg-num" cx="14" cy="156" r="9"/><text class="dg-numt" x="14" y="159.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="200" width="400" height="170" rx="6"/><text class="dg-hd" x="30" y="216" text-anchor="start">THE RUN · A JOB, AS YOU</text><rect class="dg-dev" x="262" y="220" width="118" height="140" rx="5"/><rect class="dg-dev" x="274" y="359" width="8" height="5"/><rect class="dg-dev" x="288" y="359" width="8" height="5"/><rect class="dg-dev" x="302" y="359" width="8" height="5"/><text class="dg-tb" x="321.0" y="238" text-anchor="middle">Step 1, step 2…</text><text class="dg-sm" x="321.0" y="252" text-anchor="middle">in order</text><circle class="dg-num" cx="22" cy="228" r="9"/><text class="dg-numt" x="22" y="231.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="232" text-anchor="start">Preview again</text><text class="dg-sm" x="36" y="244" text-anchor="start">a moved hash runs nothing</text><path class="dg-read" d="M260,228 L208.0,228.0"/><polygon class="dg-readh" points="202.0,228.0 210.0,232.5 210.0,223.5"/><circle class="dg-num" cx="22" cy="268" r="9"/><text class="dg-numt" x="22" y="271.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="272" text-anchor="start">Each step&#x27;s own apply</text><text class="dg-sm" x="36" y="284" text-anchor="start">then its own verify</text><path class="dg-send" d="M202,268 L254.0,268.0"/><polygon class="dg-sendh" points="260.0,268.0 252.0,263.5 252.0,272.5"/><circle class="dg-num" cx="22" cy="308" r="9"/><text class="dg-numt" x="22" y="311.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="312" text-anchor="start">First failure stops</text><text class="dg-sm" x="36" y="324" text-anchor="start">later steps do not run</text><text class="dg-sm" x="36" y="350" text-anchor="start">Nothing is retried.</text><rect class="dg-store" x="14" y="380" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="380" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="395.0" text-anchor="middle">The plan&#x27;s record</text><text class="dg-sm" x="109.0" y="409.0" text-anchor="middle">each step&#x27;s own</text><circle class="dg-num" cx="14" cy="380" r="9"/><text class="dg-numt" x="14" y="383.6" text-anchor="middle">7</text></svg>
