<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Publishing an app version: Run its tests stages the version from Mercury&#x27;s copy at its commit and runs its own tests in the container harness on the network&#x27;s controller Python, keeping the run with the version by its hash; Review and publish shows its pin, author, test run and who may publish under the network&#x27;s policy, bound to a hash; you confirm with a reason; the folder is read again from its blobs and the test run checked at that hash; the publication is kept with the version&#x27;s record, and the version can then be deployed. No device and no controller is contacted."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CONTAINER HARNESS</text><rect class="dg-person" x="14" y="44" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="56.0" r="4"/><path class="dg-person" d="M23,67.0 Q30,58.0 37,67.0"/><text class="dg-tx" x="46" y="63.0" text-anchor="start">You press Run its tests</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><path class="dg-repo" d="M14,92 V120 A93.0,6 0 0 0 200,120 V92"/><ellipse class="dg-repo" cx="107.0" cy="92" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="111.0" text-anchor="middle">Mercury&#x27;s copy</text><text class="dg-sm" x="107.0" y="125.0" text-anchor="middle">its blobs at the commit</text><rect class="dg-store" x="232" y="86" width="156" height="40" rx="3"/><rect class="dg-bar" x="232" y="86" width="4" height="40" rx="1"/><text class="dg-tb" x="312.0" y="104.0" text-anchor="middle">Its own tests</text><text class="dg-sm" x="312.0" y="118.0" text-anchor="middle">the controller&#x27;s Python</text><path class="dg-read" d="M202,106 L222.0,106.0"/><polygon class="dg-readh" points="228.0,106.0 220.0,101.5 220.0,110.5"/><rect class="dg-store" x="14" y="140" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="140" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="156.0" text-anchor="middle">The version&#x27;s record</text><text class="dg-sm" x="109.0" y="170.0" text-anchor="middle">the run, by its hash</text><circle class="dg-num" cx="14" cy="140" r="9"/><text class="dg-numt" x="14" y="143.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="190" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="202.0" r="4"/><path class="dg-person" d="M23,213.0 Q30,204.0 37,213.0"/><text class="dg-tx" x="46" y="209.0" text-anchor="start">Review and publish…</text><circle class="dg-num" cx="14" cy="190" r="9"/><text class="dg-numt" x="14" y="193.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="198" width="400" height="166" rx="6"/><text class="dg-hd" x="30" y="214" text-anchor="start">THE CONFIRM</text><path class="dg-box" d="M14,260 H190 L200,270 V294 H14 Z"/><path class="dg-box" d="M190,260 V270 H200"/><text class="dg-tb" x="107.0" y="275.0" text-anchor="middle">Read again</text><text class="dg-sm" x="107.0" y="289.0" text-anchor="middle">its hash and its test run</text><circle class="dg-num" cx="14" cy="260" r="9"/><text class="dg-numt" x="14" y="263.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="304" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="304" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="320.0" text-anchor="middle">The version&#x27;s record</text><text class="dg-sm" x="109.0" y="334.0" text-anchor="middle">Published, by you</text><circle class="dg-num" cx="14" cy="304" r="9"/><text class="dg-numt" x="14" y="307.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="372" text-anchor="start">SDN › Apps can deploy it now.</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">no device</text><text class="dg-sm" x="310" y="459" text-anchor="middle">no controller</text></svg>
