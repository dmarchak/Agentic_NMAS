# /etc/rsyslog.d/10-network-devices.conf -- NSOT_PLAN.md P.1.
#
# WRITES TO /var/log/network/<source-ip>.log -- the same directory as before.
# This file's name is not a path; it once sent a reader to an empty
# /var/log/network-devices/. Check: `logger -n 127.0.0.1 -P 514 test` must
# create /var/log/network/127.0.0.1.log at once (delete it after).
#
# Every message arriving on the UDP syslog INPUT is a network device's, and is
# filed by its source address. It replaces a filter on the address itself
# (`$fromhost-ip startswith "10.255.1."`), which hardcoded one addressing plan
# into a host file while the plan is Settings-driven: a device logging from
# any other address (r6's management 10.255.0.32, a new site's range) fell
# through to /var/log/syslog, where Alloy never looks, silently.
#
# Keyed on the INPUT, so local system logging (imuxsock/imklog) is untouched
# and nothing here needs editing when addressing changes. The file name is
# still the source address; the heartbeat rules key on the hostname in the
# message (`logging origin-id hostname`), not on this name.
module(load="imudp")
input(type="imudp" port="514" ruleset="network_devices")

template(name="DeviceFile" type="string"
         string="/var/log/network/%FROMHOST-IP%.log")

ruleset(name="network_devices") {
    action(type="omfile" dynaFile="DeviceFile" template="RSYSLOG_TraditionalFileFormat")
}
