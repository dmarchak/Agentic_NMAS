! Minimal bootstrap for a C8000v joining this lab.
!
! THE USERNAME LINE USES THE **PASSWORD** FORM, AND MUST.
!
! Measured in the patched launch script (line 89):
!     cfg = self.gen_bootstrap_config() + startup_cfg
! and gen_bootstrap_config() contains (line 157):
!     username admin privilege 15 password admin
!
! So vrnetlab's line is applied BEFORE this file, and admin already has a
! password by the time these lines arrive. IOS-XE refuses a secret for a user
! that has a password: "ERROR: Can not have both a user password and a user
! secret", the same refusal measured on r2 in stage 1. A `secret` line here
! would be silently rejected and could stall the bootstrap script waiting for
! a prompt it never gets.
!
! The VALUE matches vrnetlab's rather than being a throwaway, deliberately.
! vrnetlab authenticates to the console with --username/--password to apply
! the rest of this config; changing admin's password midway through its own
! session risks breaking the thing that is still typing. r1.cfg did the same.
! The node is on an isolated network and is destroyed at the end of the run.
!
! Gi1 is absent: vrnetlab owns the management interface on this kind, and
! r1.cfg does not configure it either.
!
hostname bp-c8k
!
no aaa new-model
!
username admin privilege 15 password 0 admin
!
ip domain-name rcn.lab
!
line vty 0 4
 logging synchronous
 login local
 transport input all
!
end
