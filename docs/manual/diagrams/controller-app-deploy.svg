<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="A controller app deploy: the plan reads the controller host&#x27;s unit, its app folder and its drop-in, stages each chosen version from git&#x27;s blobs at its pin and checks its hash, checks conformance for every expected switch and renders the drop-in; a refusal sends nothing. You confirm, bound to the plan&#x27;s hash; holding the controller, the plan is made again and a moved hash sends nothing; the planned-restart window is declared; the files and the request are staged over SFTP; the one command writes the drop-in and restarts the controller; the post-check waits for every expected switch, link and app&#x27;s /health; a miss applies the request before (or puts the drop-in before back) and post-checks again; the receipt records it, and History shows it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CONTROLLER HOST</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The plan</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">the host read; files and hashes</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: nothing sent</text><rect class="dg-person" x="14" y="110" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="122.0" r="4"/><path class="dg-person" d="M23,133.0 Q30,124.0 37,133.0"/><text class="dg-tx" x="46" y="129.0" text-anchor="start">You confirm, bound to its hash</text><circle class="dg-num" cx="14" cy="110" r="9"/><text class="dg-numt" x="14" y="113.6" text-anchor="middle">2</text><rect class="dg-band" x="0" y="156" width="400" height="190" rx="6"/><text class="dg-hd" x="30" y="172" text-anchor="start">THE DEPLOY · THE CONTROLLER HELD</text><rect class="dg-dev" x="262" y="226" width="118" height="160" rx="5"/><rect class="dg-dev" x="274" y="385" width="8" height="5"/><rect class="dg-dev" x="288" y="385" width="8" height="5"/><rect class="dg-dev" x="302" y="385" width="8" height="5"/><text class="dg-tb" x="321.0" y="244" text-anchor="middle">The controller</text><text class="dg-sm" x="321.0" y="258" text-anchor="middle">and its switches</text><circle class="dg-num" cx="22" cy="176" r="9"/><text class="dg-numt" x="22" y="179.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="180" text-anchor="start">Planned again</text><text class="dg-sm" x="36" y="192" text-anchor="start">a moved hash sends nothing</text><circle class="dg-num" cx="22" cy="218" r="9"/><text class="dg-numt" x="22" y="221.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="222" text-anchor="start">The window declared</text><text class="dg-sm" x="36" y="234" text-anchor="start">its switches expected to drop</text><circle class="dg-num" cx="22" cy="260" r="9"/><text class="dg-numt" x="22" y="263.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="264" text-anchor="start">Staged, the request last</text><text class="dg-sm" x="36" y="276" text-anchor="start">SFTP as the deploy account</text><path class="dg-send" d="M202,260 L254.0,260.0"/><polygon class="dg-sendh" points="260.0,260.0 252.0,255.5 252.0,264.5"/><circle class="dg-num" cx="22" cy="302" r="9"/><text class="dg-numt" x="22" y="305.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="306" text-anchor="start">The one command</text><text class="dg-sm" x="36" y="318" text-anchor="start">the drop-in, a restart</text><path class="dg-send" d="M202,302 L254.0,302.0"/><polygon class="dg-sendh" points="260.0,302.0 252.0,297.5 252.0,306.5"/><circle class="dg-num" cx="22" cy="344" r="9"/><text class="dg-numt" x="22" y="347.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="348" text-anchor="start">Post-checked</text><text class="dg-sm" x="36" y="360" text-anchor="start">switches, links, /health</text><path class="dg-read" d="M260,344 L208.0,344.0"/><polygon class="dg-readh" points="202.0,344.0 210.0,348.5 210.0,339.5"/><text class="dg-sm" x="14" y="396" text-anchor="start">A miss applies the request before,</text><text class="dg-sm" x="14" y="412" text-anchor="start">and post-checks again.</text><rect class="dg-store" x="14" y="430" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="430" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="448.0" text-anchor="middle">The receipt</text><text class="dg-sm" x="109.0" y="462.0" text-anchor="middle">kept with the receipts</text><circle class="dg-num" cx="14" cy="430" r="9"/><text class="dg-numt" x="14" y="433.6" text-anchor="middle">8</text><text class="dg-sm" x="14" y="494" text-anchor="start">History shows it.</text><text class="dg-sm" x="14" y="520" text-anchor="start">Nothing is sent to a switch.</text></svg>
