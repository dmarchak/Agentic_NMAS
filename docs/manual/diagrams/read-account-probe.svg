<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="Probing the read-only account (board R&#x27;s R8). The preview sends nothing: the probe&#x27;s own plan names the account it signs in as, every command in the order it is sent and what each is expected to answer, under one hash, which you confirm. The run holds the device and signs in as the read-only account, never escalating: it sends each AI read, expected answered, then show running-config, configure terminal, clear counters, debug ? and enable, each expected refused, answering nothing but end or n. Its verdict comes from the device&#x27;s own answers, and its masked record is kept under the device&#x27;s identity, read on History and in the coverage."><line class="dg-lane" x1="212" y1="20" x2="212" y2="424"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="130" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE PREVIEW · NOTHING SENT</text><path class="dg-box" d="M14,42 H192 L202,52 V84 H14 Z"/><path class="dg-box" d="M192,42 V52 H202"/><text class="dg-tb" x="108.0" y="61.0" text-anchor="middle">The probe&#x27;s program</text><text class="dg-sm" x="108.0" y="75.0" text-anchor="middle">every command, in order</text><circle class="dg-num" cx="14" cy="42" r="9"/><text class="dg-numt" x="14" y="45.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="98" width="188" height="32" rx="16.0"/><circle class="dg-person" cx="30" cy="111.0" r="4"/><path class="dg-person" d="M23,122.0 Q30,113.0 37,122.0"/><text class="dg-tx" x="46" y="118.0" text-anchor="start">You confirm its hash</text><circle class="dg-num" cx="14" cy="98" r="9"/><text class="dg-numt" x="14" y="101.6" text-anchor="middle">2</text><rect class="dg-devoff" x="240" y="50" width="140" height="48" rx="5"/><rect class="dg-devoff" x="252" y="97" width="8" height="5"/><rect class="dg-devoff" x="266" y="97" width="8" height="5"/><rect class="dg-devoff" x="280" y="97" width="8" height="5"/><text class="dg-tb" x="310.0" y="72.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="86.0" text-anchor="middle">not contacted</text><rect class="dg-band" x="0" y="156" width="400" height="210" rx="6"/><text class="dg-hd" x="30" y="172" text-anchor="start">THE RUN · HOLDING THE DEVICE</text><rect class="dg-dev" x="262" y="180" width="118" height="170" rx="5"/><rect class="dg-dev" x="274" y="349" width="8" height="5"/><rect class="dg-dev" x="288" y="349" width="8" height="5"/><rect class="dg-dev" x="302" y="349" width="8" height="5"/><text class="dg-tb" x="321.0" y="198" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="212" text-anchor="middle">as the read-only account</text><circle class="dg-num" cx="22" cy="200" r="9"/><text class="dg-numt" x="22" y="203.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="204" text-anchor="start">Hold, sign in</text><text class="dg-sm" x="36" y="216" text-anchor="start">as the read-only account</text><path class="dg-send" d="M202,200 L254.0,200.0"/><polygon class="dg-sendh" points="260.0,200.0 252.0,195.5 252.0,204.5"/><circle class="dg-num" cx="22" cy="242" r="9"/><text class="dg-numt" x="22" y="245.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="246" text-anchor="start">Each AI read</text><text class="dg-sm" x="36" y="258" text-anchor="start">expected answered</text><path class="dg-read" d="M260,242 L208.0,242.0"/><polygon class="dg-readh" points="202.0,242.0 210.0,246.5 210.0,237.5"/><circle class="dg-num" cx="22" cy="284" r="9"/><text class="dg-numt" x="22" y="287.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="288" text-anchor="start">Five commands</text><text class="dg-sm" x="36" y="300" text-anchor="start">expected refused</text><path class="dg-read" d="M260,284 L208.0,284.0"/><polygon class="dg-readh" points="202.0,284.0 210.0,288.5 210.0,279.5"/><circle class="dg-num" cx="22" cy="326" r="9"/><text class="dg-numt" x="22" y="329.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="330" text-anchor="start">The verdict</text><text class="dg-sm" x="36" y="342" text-anchor="start">from the device&#x27;s answers</text><rect class="dg-store" x="14" y="378" width="188" height="40" rx="3"/><rect class="dg-bar" x="14" y="378" width="4" height="40" rx="1"/><text class="dg-tb" x="110.0" y="396.0" text-anchor="middle">The record</text><text class="dg-sm" x="110.0" y="410.0" text-anchor="middle">by the device&#x27;s identity</text><circle class="dg-num" cx="14" cy="378" r="9"/><text class="dg-numt" x="14" y="381.6" text-anchor="middle">7</text></svg>
