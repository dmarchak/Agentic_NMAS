<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="An alert&#x27;s evidence pack: the Grafana alerts reader stores an alert as firing; after that read, a pack is built once for each firing alert that has none; its device is resolved as Needs attention resolves it; History, the Intent check&#x27;s state, the neighbours and the log lines around the onset are read, each section naming its source, when it was read and whether it could be; every string is masked, every section and piece given its own reference, and the pack hashed; it is kept in the evidence pack record, and Monitoring&#x27;s Alerts tab draws it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SOURCES</text><rect class="dg-svc" x="250" y="36" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="52.0" text-anchor="middle">Grafana</text><text class="dg-sm" x="315.0" y="66.0" text-anchor="middle">via its reader</text><path class="dg-read" d="M248,56 L208.0,56.0"/><polygon class="dg-readh" points="202.0,56.0 210.0,60.5 210.0,51.5"/><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">Firing, no pack yet</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">after the alerts&#x27; read</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,92 H190 L200,102 V128 H14 Z"/><path class="dg-box" d="M190,92 V102 H200"/><text class="dg-tb" x="107.0" y="108.0" text-anchor="middle">Its device</text><text class="dg-sm" x="107.0" y="122.0" text-anchor="middle">as Needs attention finds it</text><circle class="dg-num" cx="14" cy="92" r="9"/><text class="dg-numt" x="14" y="95.6" text-anchor="middle">2</text><rect class="dg-band" x="0" y="146" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="162" text-anchor="start">EACH SECTION · ITS SOURCE, ITS TIME</text><rect class="dg-svc" x="250" y="168" width="130" height="30" rx="15.0"/><text class="dg-tb" x="315.0" y="181.0" text-anchor="middle">History, intent</text><text class="dg-sm" x="315.0" y="195.0" text-anchor="middle">the repository</text><rect class="dg-svc" x="250" y="214" width="130" height="30" rx="15.0"/><text class="dg-tb" x="315.0" y="227.0" text-anchor="middle">Prometheus, Loki</text><text class="dg-sm" x="315.0" y="241.0" text-anchor="middle">neighbours, logs</text><circle class="dg-num" cx="22" cy="182" r="9"/><text class="dg-numt" x="22" y="185.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="186" text-anchor="start">History, Intent state</text><text class="dg-sm" x="36" y="198" text-anchor="start">never a configuration line</text><path class="dg-read" d="M248,182 L208.0,182.0"/><polygon class="dg-readh" points="202.0,182.0 210.0,186.5 210.0,177.5"/><text class="dg-tb" x="36" y="232" text-anchor="start">Neighbours, log lines</text><text class="dg-sm" x="36" y="244" text-anchor="start">around the onset</text><path class="dg-read" d="M248,228 L208.0,228.0"/><polygon class="dg-readh" points="202.0,228.0 210.0,232.5 210.0,223.5"/><path class="dg-box" d="M14,284 H190 L200,294 V324 H14 Z"/><path class="dg-box" d="M190,284 V294 H200"/><text class="dg-tb" x="107.0" y="302.0" text-anchor="middle">Masked and hashed</text><text class="dg-sm" x="107.0" y="316.0" text-anchor="middle">a reference for each piece</text><circle class="dg-num" cx="14" cy="284" r="9"/><text class="dg-numt" x="14" y="287.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="340" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="340" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="358.0" text-anchor="middle">The evidence pack record</text><text class="dg-sm" x="109.0" y="372.0" text-anchor="middle">one per firing alert</text><circle class="dg-num" cx="14" cy="340" r="9"/><text class="dg-numt" x="14" y="343.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="402" text-anchor="start">Monitoring › Alerts draws it.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device is asked or changed.</text></svg>
