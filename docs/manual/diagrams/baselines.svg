<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="How a baseline is earned. A Save All, a deploy of the whole fleet or a restore reads every device in the inventory. The baseline is earned only when every device was captured and each capture matches its committed intent: then the commit is tagged baseline with its time. Otherwise the commit records the denial and names the device and its lines, and no tag is made. A baseline that predates a credential rotation can no longer be re-applied without changing that credential."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE RECORD</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE FLEET</text><rect class="dg-band" x="0" y="20" width="400" height="196" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">EVERY DEVICE IN THE INVENTORY</text><rect class="dg-dev" x="240" y="46" width="64" height="40" rx="5"/><rect class="dg-dev" x="252" y="85" width="8" height="5"/><rect class="dg-dev" x="266" y="85" width="8" height="5"/><rect class="dg-dev" x="280" y="85" width="8" height="5"/><text class="dg-tb" x="272.0" y="70.0" text-anchor="middle">Router</text><rect class="dg-dev" x="316" y="46" width="64" height="40" rx="5"/><rect class="dg-dev" x="328" y="85" width="8" height="5"/><rect class="dg-dev" x="342" y="85" width="8" height="5"/><rect class="dg-dev" x="356" y="85" width="8" height="5"/><text class="dg-tb" x="348.0" y="70.0" text-anchor="middle">Switch</text><rect class="dg-dev" x="240" y="112" width="140" height="40" rx="5"/><rect class="dg-dev" x="252" y="151" width="8" height="5"/><rect class="dg-dev" x="266" y="151" width="8" height="5"/><rect class="dg-dev" x="280" y="151" width="8" height="5"/><text class="dg-tb" x="310.0" y="130.0" text-anchor="middle">… every one</text><text class="dg-sm" x="310.0" y="144.0" text-anchor="middle">captured</text><path class="dg-read" d="M238,92 L207.7,102.1"/><polygon class="dg-readh" points="202.0,104.0 211.0,105.7 208.2,97.2"/><path class="dg-golden" d="M14,46 H190 L200,56 V86 H14 Z"/><path class="dg-golden" d="M190,46 V56 H200"/><text class="dg-tb" x="107.0" y="64.0" text-anchor="middle">Goldens</text><text class="dg-sm" x="107.0" y="78.0" text-anchor="middle">every capture, one commit</text><circle class="dg-num" cx="14" cy="46" r="9"/><text class="dg-numt" x="14" y="49.6" text-anchor="middle">1</text><path class="dg-intent" d="M14,104 H190 L200,114 V144 H14 Z"/><path class="dg-intent" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="122.0" text-anchor="middle">Intent</text><text class="dg-sm" x="107.0" y="136.0" text-anchor="middle">committed, per device</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="168" text-anchor="start">Each capture compared with its intent:</text><text class="dg-sm" x="14" y="181" text-anchor="start">the Intent-Match trailer.</text><rect class="dg-band" x="0" y="222" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="238" text-anchor="start">EARNED</text><path class="dg-repo" d="M14,252 V286 A93.0,6 0 0 0 200,286 V252"/><ellipse class="dg-repo" cx="107.0" cy="252" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="274.0" text-anchor="middle">Tag baseline/&lt;time&gt;</text><text class="dg-sm" x="107.0" y="288.0" text-anchor="middle">every device, every match</text><circle class="dg-num" cx="14" cy="252" r="9"/><text class="dg-numt" x="14" y="255.6" text-anchor="middle">3</text><text class="dg-sm" x="214" y="266" text-anchor="start">A restore point you</text><text class="dg-sm" x="214" y="279" text-anchor="start">can re-apply.</text><rect class="dg-band" x="0" y="348" width="400" height="116" rx="6"/><text class="dg-hd" x="30" y="364" text-anchor="start">DENIED</text><rect class="dg-store" x="14" y="372" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="372" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="390.0" text-anchor="middle">The decision, recorded</text><text class="dg-sm" x="109.0" y="404.0" text-anchor="middle">names the device and lines</text><circle class="dg-num" cx="14" cy="372" r="9"/><text class="dg-numt" x="14" y="375.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="438" text-anchor="start">No tag. Resolve the departure, then save again.</text></svg>
