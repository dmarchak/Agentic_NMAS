# dns_blacklist v0 (Lab 9 Objective 3; docs/LAB9_SDN_GAP.md A3): DNS steered to the controller,
# each queried name judged by an external verdict service asked FROM THE CONTROLLER, bad names
# blocked (or answered with the block page's address, the bonus) and good ones forwarded. It is
# the owner of the protected classes `dns` and `dns-ipv6` (docs/LAB9_NETBOX_STEPS.md section 9:
# owners ["app:dns_blacklist"]), so its UDP 53 flows are the ones Mercury lets through.
name: dns_blacklist
version: 0.1.0
summary: Steers DNS queries to the controller and blocks each name the verdict service calls bad.
controllers:
  ryu: ">=4.34"
# 1.3 only: the steering flows and the packet-in's cookie (how the app knows a punt is its own)
# are OpenFlow 1.3's; every lab switch negotiated 1.3 (C2598).
openflow_versions: ["1.3"]
requires: []
config_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  $defs:
    tables:
      type: object
      additionalProperties: false
      required: [forward_table]
      properties:
        forward_table:
          description: The table the steering flows go in, the one the host flows are in (the ProCurve's 100).
          type: integer
          minimum: 0
          maximum: 254
  properties:
    switches:
      description: Each switch's forward table, by datapath id in decimal, compiled by Mercury from its platform profile.
      type: object
      additionalProperties: false
      patternProperties:
        "^[0-9]+$": {$ref: "#/$defs/tables"}
      default: {}
    default_tables:
      description: The forward table of a switch the switches mapping does not name; absent, such a switch is not served.
      $ref: "#/$defs/tables"
    verdict_service:
      description: Where the controller asks each name's verdict, and how long it waits.
      type: object
      additionalProperties: false
      default: {}
      properties:
        url:
          description: >-
            Cloudflare's malware-filtering resolver (DNS-over-HTTPS JSON), the one service
            this app reads, so the one destination its egress reaches; chosen and measured
            2026-11-10 (docs/STANDING_APPROVAL_LOG.md). It needs no key.
          type: string
          pattern: '^https://security\.cloudflare-dns\.com(:443)?$'
          default: "https://security.cloudflare-dns.com:443"
        timeout_s:
          description: >-
            The bound on one lookup, in seconds; a query still waiting then follows the fail
            mode. 2 s: well inside a host's first DNS retry (glibc's resolver waits 5 s,
            resolv.conf(5)), so an answer reaches the host before it asks again. The service's
            answer time is NOT MEASURED yet: /health's verdict_service.lookup_seconds keeps the
            last and the slowest, and the bound is set from those at the lab.
          type: number
          minimum: 0.1
          maximum: 10
          default: 2
    fail_mode:
      description: >-
        What a query gets when no verdict can be had (the service does not answer in time, its
        answer cannot be read, or a frame cannot be read). open (the default): it is forwarded,
        since DNS is a protected flow every host must reach and a closed mode would break DNS
        for every host while the service is down; /health then says so (not ok, naming the
        service's error), and Mercury raises it. closed: it is blocked as a bad name is.
      enum: [open, closed]
      default: open
    cache:
      description: Verdicts kept, each for the lesser of its answer's TTL and the cap.
      type: object
      additionalProperties: false
      default: {}
      properties:
        ttl_cap_s:
          type: integer
          minimum: 1
          maximum: 86400
          default: 300
        max_entries:
          type: integer
          minimum: 1
          maximum: 100000
          default: 10000
    block_page:
      description: >-
        The block page's addresses (the bonus). Set, a blocked A query is answered with ipv4
        and a blocked AAAA query with ipv6 (any other type, NODATA); absent, a blocked query is
        dropped.
      type: object
      additionalProperties: false
      properties:
        ipv4:
          type: string
          pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
        ipv6:
          type: string
          pattern: '^[0-9A-Fa-f:.]{2,45}$'
    upstream:
      description: >-
        Where an allowed query goes. Absent (the default), it is re-injected unchanged into the
        tables of the switch it came in on and takes the normal path to the resolver the host
        asked. Set, it is sent unchanged out of this switch port, the one the resolver (or the
        router towards it) is on: for a switch that takes no packet-out to its own tables.
      type: object
      additionalProperties: false
      required: [dpid, port]
      properties:
        dpid:
          type: string
          pattern: '^[0-9]+$'
        port:
          type: integer
          minimum: 1
          maximum: 4294967040
rest:
  prefix: /dns_blacklist
  endpoints:
    - path: /health
      methods: [GET]
      summary: The counts of queries, allowed, blocked, verdict errors and cache hits, and whether the verdict service answers.
    - path: /config
      methods: [GET, PUT]
      summary: The app's config, read at load from its start-time file; a push replaces it.
    - path: /state
      methods: [GET]
      summary: The switches, their edge ports and steering flows, the cache, the lookups in flight and the last decisions.
owns_flows:
  cookie_prefix: "0x444e000000000000"
  cookie_mask: "0xffff000000000000"
  classes: [dns, dns-ipv6]
# Mercury compiles each expected switch's forward table from its platform profile into
# `switches` (modules/apps/app_config.py; the ProCurve's 100, table 0 elsewhere).
compiled:
  - key: switches
    per_switch: [forward_table]
# The one destination the app reaches, through mercury_app.egress("verdict_service", ...) from
# the controller; its address is the config's verdict_service.url, Cloudflare's resolver alone.
egress:
  - name: verdict_service
    from_config: verdict_service.url
    purpose: Asks Cloudflare's malware-filtering resolver for each queried name's verdict, from the controller.
tests:
  - tests/test_blacklist_wire.py
  - tests/test_blacklist_logic.py
