<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Restoring a moment. You choose the moment and which devices. The preview reads only the repository at that moment, golden and intent, and computes each device&#x27;s program against its stored golden: lines the moment has and the golden lacks. A line that would change or re-add a credential is refused or needs a stated reason. You confirm the hash; the run is the deploy&#x27;s ten stages, merge-only, verified; residue is left. The moment&#x27;s intent is committed with the device&#x27;s new golden, in one commit."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="230" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE PREVIEW · NOTHING SENT</text><path class="dg-repo" d="M14,50 V84 A93.0,6 0 0 0 200,84 V50"/><ellipse class="dg-repo" cx="107.0" cy="50" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="72.0" text-anchor="middle">The moment</text><text class="dg-sm" x="107.0" y="86.0" text-anchor="middle">a baseline or a golden tag</text><circle class="dg-num" cx="14" cy="50" r="9"/><text class="dg-numt" x="14" y="53.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,92 L107.0,104.0"/><polygon class="dg-rech" points="107.0,110.0 111.5,102.0 102.5,102.0"/><path class="dg-golden" d="M14,112 H94 L104,122 V152 H14 Z"/><path class="dg-golden" d="M94,112 V122 H104"/><text class="dg-tb" x="59.0" y="130.0" text-anchor="middle">Golden</text><text class="dg-sm" x="59.0" y="144.0" text-anchor="middle">then</text><path class="dg-intent" d="M110,112 H190 L200,122 V152 H110 Z"/><path class="dg-intent" d="M190,112 V122 H200"/><text class="dg-tb" x="155.0" y="130.0" text-anchor="middle">Intent</text><text class="dg-sm" x="155.0" y="144.0" text-anchor="middle">then</text><path class="dg-rec" d="M107,154 L107.0,166.0"/><polygon class="dg-rech" points="107.0,172.0 111.5,164.0 102.5,164.0"/><rect class="dg-box" x="14" y="174" width="186" height="40" rx="4"/><text class="dg-tb" x="107" y="190" text-anchor="middle">Program</text><text class="dg-sm" x="107" y="204" text-anchor="middle">against today&#x27;s stored golden</text><circle class="dg-num" cx="14" cy="174" r="9"/><text class="dg-numt" x="14" y="177.6" text-anchor="middle">5</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="150" r="11"/><line class="dg-nol" x1="302.5" y1="157.5" x2="317.5" y2="142.5"/><text class="dg-sm" x="310" y="176" text-anchor="middle">credentials: refused</text><text class="dg-sm" x="310" y="189" text-anchor="middle">or a stated reason</text><rect class="dg-band" x="0" y="256" width="400" height="56" rx="6"/><text class="dg-hd" x="30" y="272" text-anchor="start">CONFIRM</text><rect class="dg-person" x="14" y="276" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="288.0" r="4"/><path class="dg-person" d="M23,299.0 Q30,290.0 37,299.0"/><text class="dg-tx" x="46" y="295.0" text-anchor="start">You confirm its hash</text><rect class="dg-band" x="0" y="318" width="400" height="236" rx="6"/><text class="dg-hd" x="30" y="334" text-anchor="start">THE RUN · THE DEPLOY&#x27;S TEN STAGES</text><rect class="dg-dev" x="262" y="340" width="118" height="120" rx="5"/><rect class="dg-dev" x="274" y="459" width="8" height="5"/><rect class="dg-dev" x="288" y="459" width="8" height="5"/><rect class="dg-dev" x="302" y="459" width="8" height="5"/><text class="dg-tb" x="321.0" y="358" text-anchor="middle">The device</text><text class="dg-tb" x="36" y="364" text-anchor="start">Read before</text><text class="dg-sm" x="36" y="376" text-anchor="start">the snapshot</text><path class="dg-read" d="M260,360 L208.0,360.0"/><polygon class="dg-readh" points="202.0,360.0 210.0,364.5 210.0,355.5"/><text class="dg-tb" x="36" y="396" text-anchor="start">Send the program</text><text class="dg-sm" x="36" y="408" text-anchor="start">merge-only; residue stays</text><path class="dg-send" d="M202,392 L254.0,392.0"/><polygon class="dg-sendh" points="260.0,392.0 252.0,387.5 252.0,396.5"/><text class="dg-tb" x="36" y="428" text-anchor="start">Read after, verify</text><text class="dg-sm" x="36" y="440" text-anchor="start">settle windows</text><path class="dg-read" d="M260,424 L208.0,424.0"/><polygon class="dg-readh" points="202.0,424.0 210.0,428.5 210.0,419.5"/><path class="dg-repo" d="M14,484 V518 A93.0,6 0 0 0 200,518 V484"/><ellipse class="dg-repo" cx="107.0" cy="484" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="506.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="520.0" text-anchor="middle">new golden + the moment&#x27;s intent</text><text class="dg-sm" x="214" y="498" text-anchor="start">A baseline only if every</text><text class="dg-sm" x="214" y="511" text-anchor="start">device equals the moment.</text></svg>
