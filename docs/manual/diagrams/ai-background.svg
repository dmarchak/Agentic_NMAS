<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Turning a background AI feature on for one network. Turn on shows the estimate, labelled as one, with its digest; you type the day and month caps and accept it. Mercury checks you are a verified person and the caps are within the installation&#x27;s day cap, measures the estimate again and refuses if it moved, then writes the switch with who, when, the estimate and the caps, and records the decision. The gateway reads the switch at every call; Turn off removes it and the next call is refused. No provider call is made."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE GATEWAY</text><rect class="dg-band" x="0" y="20" width="400" height="236" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">TURN ON</text><path class="dg-box" d="M14,44 H190 L200,54 V78 H14 Z"/><path class="dg-box" d="M190,44 V54 H200"/><text class="dg-tb" x="107.0" y="59.0" text-anchor="middle">The estimate, shown</text><text class="dg-sm" x="107.0" y="73.0" text-anchor="middle">calls, dollars, its digest</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="88" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="100.0" r="4"/><path class="dg-person" d="M23,111.0 Q30,102.0 37,111.0"/><text class="dg-tx" x="46" y="107.0" text-anchor="start">You type caps and accept</text><circle class="dg-num" cx="14" cy="88" r="9"/><text class="dg-numt" x="14" y="91.6" text-anchor="middle">2</text><rect class="dg-store" x="14" y="128" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="128" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="143.0" text-anchor="middle">The estimate, measured again</text><text class="dg-sm" x="109.0" y="157.0" text-anchor="middle">same digest, or refused</text><circle class="dg-num" cx="14" cy="128" r="9"/><text class="dg-numt" x="14" y="131.6" text-anchor="middle">3</text><rect class="dg-store" x="14" y="172" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="172" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="187.0" text-anchor="middle">The switch, this network</text><text class="dg-sm" x="109.0" y="201.0" text-anchor="middle">who, when, estimate, caps</text><circle class="dg-num" cx="14" cy="172" r="9"/><text class="dg-numt" x="14" y="175.6" text-anchor="middle">4</text><path class="dg-repo" d="M14,220 V244 A93.0,6 0 0 0 200,244 V220"/><ellipse class="dg-repo" cx="107.0" cy="220" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="237.0" text-anchor="middle">The settings record</text><text class="dg-sm" x="107.0" y="251.0" text-anchor="middle">History draws it</text><circle class="dg-num" cx="14" cy="214" r="9"/><text class="dg-numt" x="14" y="217.6" text-anchor="middle">5</text><rect class="dg-svc" x="232" y="160" width="156" height="40" rx="20.0"/><text class="dg-tb" x="310.0" y="178.0" text-anchor="middle">Each background call</text><text class="dg-sm" x="310.0" y="192.0" text-anchor="middle">reads the switch</text><path class="dg-read" d="M230,189 L208.0,189.0"/><polygon class="dg-readh" points="202.0,189.0 210.0,193.5 210.0,184.5"/><rect class="dg-band" x="0" y="276" width="400" height="180" rx="6"/><text class="dg-hd" x="30" y="292" text-anchor="start">TURN OFF · CHANGE CAPS</text><rect class="dg-person" x="14" y="300" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="312.0" r="4"/><path class="dg-person" d="M23,323.0 Q30,314.0 37,323.0"/><text class="dg-tx" x="46" y="319.0" text-anchor="start">You press Turn off</text><rect class="dg-store" x="14" y="340" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="340" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="355.0" text-anchor="middle">The switch removed</text><text class="dg-sm" x="109.0" y="369.0" text-anchor="middle">the next call refused</text><rect class="dg-person" x="14" y="386" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="398.0" r="4"/><path class="dg-person" d="M23,409.0 Q30,400.0 37,409.0"/><text class="dg-tx" x="46" y="405.0" text-anchor="start">You change the caps</text><path class="dg-box" d="M14,424 H190 L200,434 V454 H14 Z"/><path class="dg-box" d="M190,424 V434 H200"/><text class="dg-tb" x="107.0" y="437.0" text-anchor="middle">Recorded</text><text class="dg-sm" x="107.0" y="451.0" text-anchor="middle">old and new caps</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">no provider</text><text class="dg-sm" x="310" y="459" text-anchor="middle">call is made</text></svg>
