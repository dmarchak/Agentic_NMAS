<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-hidden="true">
  <text class="dg-text" x="20" y="24">Intent</text>
  <rect class="dg-box" x="20" y="34" width="190" height="96" rx="6"></rect>
  <text class="dg-small" x="32" y="58">logging host A</text>
  <text class="dg-small" x="32" y="80">ntp server B</text>
  <text class="dg-small" x="32" y="102">snmp-server location C</text>

  <text class="dg-text" x="265" y="24">The device before</text>
  <rect class="dg-box" x="265" y="34" width="190" height="96" rx="6"></rect>
  <text class="dg-small" x="277" y="58">logging host A</text>
  <text class="dg-small" x="277" y="80">load-interval 30</text>

  <text class="dg-text" x="510" y="24">After a MERGE (what NMAS does)</text>
  <rect class="dg-key" x="510" y="34" width="190" height="96" rx="6"></rect>
  <text class="dg-small" x="522" y="58">logging host A</text>
  <text class="dg-small" x="522" y="80">load-interval 30 (residue, kept)</text>
  <text class="dg-small" x="522" y="102">+ ntp server B</text>
  <text class="dg-small" x="522" y="122">+ snmp-server location C</text>

  <text class="dg-text" x="510" y="160">A replace (never done)</text>
  <rect class="dg-warn" x="510" y="170" width="190" height="52" rx="6"></rect>
  <text class="dg-small" x="522" y="192">would also remove</text>
  <text class="dg-small" x="522" y="210">load-interval 30</text>

  <text class="dg-small" x="20" y="160">The program sent is only the "+" lines.</text>
  <text class="dg-small" x="20" y="180">Residue is reported, and removing it is a</text>
  <text class="dg-small" x="20" y="200">separate, line-by-line choice (Mode B).</text>
</svg>
