<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="The toolbar assistant&#x27;s answer. You ask how to do something; Mercury chooses the manual&#x27;s passages for the question by code (keyword ranking with the aliases and the boost for the screen you are on; below the floor, the manual&#x27;s gap, and no call); it sends one recorded, capped call through the AI gateway, the instructions and the screens cached, then your question masked and the passages; it checks that every citation is a passage it sent and every screen named exists; and it draws the answer with its passages&#x27; links, or says the manual does not cover it and records the gap. Nothing changes anywhere."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICES</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You ask</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,84 H190 L200,94 V124 H14 Z"/><path class="dg-box" d="M190,84 V94 H200"/><text class="dg-tb" x="107.0" y="102.0" text-anchor="middle">The passages, chosen</text><text class="dg-sm" x="107.0" y="116.0" text-anchor="middle">by code; none: a gap</text><circle class="dg-num" cx="14" cy="84" r="9"/><text class="dg-numt" x="14" y="87.6" text-anchor="middle">2</text><path class="dg-box" d="M14,138 H190 L200,148 V174 H14 Z"/><path class="dg-box" d="M190,138 V148 H200"/><text class="dg-tb" x="107.0" y="154.0" text-anchor="middle">Your question, masked</text><text class="dg-sm" x="107.0" y="168.0" text-anchor="middle">secrets never leave</text><circle class="dg-num" cx="14" cy="138" r="9"/><text class="dg-numt" x="14" y="141.6" text-anchor="middle">3</text><rect class="dg-svc" x="250" y="138" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="154.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="168.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,156 L242.0,156.0"/><polygon class="dg-sendh" points="248.0,156.0 240.0,151.5 240.0,160.5"/><circle class="dg-num" cx="14" cy="188" r="9"/><text class="dg-numt" x="14" y="191.6" text-anchor="middle">4</text><path class="dg-box" d="M14,202 H190 L200,212 V238 H14 Z"/><path class="dg-box" d="M190,202 V212 H200"/><text class="dg-tb" x="107.0" y="218.0" text-anchor="middle">Checked</text><text class="dg-sm" x="107.0" y="232.0" text-anchor="middle">cites only what it sent</text><circle class="dg-num" cx="14" cy="250" r="9"/><text class="dg-numt" x="14" y="253.6" text-anchor="middle">5</text><path class="dg-box" d="M14,264 H190 L200,274 V304 H14 Z"/><path class="dg-box" d="M190,264 V274 H200"/><text class="dg-tb" x="107.0" y="282.0" text-anchor="middle">The answer, drawn</text><text class="dg-sm" x="107.0" y="296.0" text-anchor="middle">or the gap, recorded</text><text class="dg-sm" x="14" y="330" text-anchor="start">It never changes, deploys or saves.</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="459" text-anchor="middle">to a device</text></svg>
