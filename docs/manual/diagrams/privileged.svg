<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Run a privileged command: the plan refuses a command that is not offered or not yet measured, an interface the device&#x27;s committed golden does not hold, or the one carrying the address Mercury reaches it on, before anything is read; the preview reads the before-state through the reads engine, recorded; you confirm with a reason, bound to the plan; holding the device, the before-state is read again and kept, the command is sent once and only its measured prompt is answered; the after-state is read back and judged; the run is recorded, and History shows it. Rollback does not apply."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The plan</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">offered, measured, its own</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: nothing read or sent</text><path class="dg-box" d="M14,110 H190 L200,120 V146 H14 Z"/><path class="dg-box" d="M190,110 V120 H200"/><text class="dg-tb" x="107.0" y="126.0" text-anchor="middle">The preview</text><text class="dg-sm" x="107.0" y="140.0" text-anchor="middle">the before-state, read</text><circle class="dg-num" cx="14" cy="110" r="9"/><text class="dg-numt" x="14" y="113.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="160" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="172.0" r="4"/><path class="dg-person" d="M23,183.0 Q30,174.0 37,183.0"/><text class="dg-tx" x="46" y="179.0" text-anchor="start">You confirm, with a reason</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="206" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="222" text-anchor="start">THE RUN · A JOB, THE DEVICE HELD</text><rect class="dg-dev" x="262" y="226" width="118" height="120" rx="5"/><rect class="dg-dev" x="274" y="345" width="8" height="5"/><rect class="dg-dev" x="288" y="345" width="8" height="5"/><rect class="dg-dev" x="302" y="345" width="8" height="5"/><text class="dg-tb" x="321.0" y="244" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="258" text-anchor="middle">one command</text><circle class="dg-num" cx="22" cy="236" r="9"/><text class="dg-numt" x="22" y="239.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="240" text-anchor="start">Before kept, then sent</text><text class="dg-sm" x="36" y="252" text-anchor="start">only its prompt answered</text><circle class="dg-num" cx="22" cy="286" r="9"/><text class="dg-numt" x="22" y="289.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="290" text-anchor="start">Verified</text><text class="dg-sm" x="36" y="302" text-anchor="start">the measured rule</text><path class="dg-read" d="M260,286 L208.0,286.0"/><polygon class="dg-readh" points="202.0,286.0 210.0,290.5 210.0,281.5"/><rect class="dg-store" x="14" y="380" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="380" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="398.0" text-anchor="middle">The run&#x27;s record</text><text class="dg-sm" x="109.0" y="412.0" text-anchor="middle">who, why, before, verdict</text><circle class="dg-num" cx="14" cy="380" r="9"/><text class="dg-numt" x="14" y="383.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="444" text-anchor="start">History shows it.</text><text class="dg-sm" x="14" y="470" text-anchor="start">Rollback does not apply: what is cleared</text><text class="dg-sm" x="14" y="483" text-anchor="start">cannot be put back.</text></svg>
