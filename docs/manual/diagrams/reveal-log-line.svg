<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-label="Revealing a log line: a verified person gives a reason; the line is named by its Loki stream, its time and a digest of the masked line shown; it is read from Loki again, now; the reveal is recorded with who, when, which line and the reason, never the value; then the line is drawn unmasked under its row to that person, and History lists the record."><line class="dg-lane" x1="212" y1="20" x2="212" y2="444"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">LOKI</text><rect class="dg-person" x="14" y="34" width="186" height="28" rx="14.0"/><circle class="dg-person" cx="30" cy="45.0" r="4"/><path class="dg-person" d="M23,56.0 Q30,47.0 37,56.0"/><text class="dg-tx" x="46" y="52.0" text-anchor="start">A verified person</text><circle class="dg-num" cx="14" cy="34" r="9"/><text class="dg-numt" x="14" y="37.6" text-anchor="middle">1</text><path class="dg-box" d="M14,74 H190 L200,84 V110 H14 Z"/><path class="dg-box" d="M190,74 V84 H200"/><text class="dg-tb" x="107.0" y="90.0" text-anchor="middle">A reason</text><text class="dg-sm" x="107.0" y="104.0" text-anchor="middle">three words or more</text><circle class="dg-num" cx="14" cy="74" r="9"/><text class="dg-numt" x="14" y="77.6" text-anchor="middle">2</text><path class="dg-box" d="M14,122 H190 L200,132 V158 H14 Z"/><path class="dg-box" d="M190,122 V132 H200"/><text class="dg-tb" x="107.0" y="138.0" text-anchor="middle">The line named</text><text class="dg-sm" x="107.0" y="152.0" text-anchor="middle">stream, time, digest shown</text><circle class="dg-num" cx="14" cy="122" r="9"/><text class="dg-numt" x="14" y="125.6" text-anchor="middle">3</text><rect class="dg-svc" x="250" y="170" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="186.0" text-anchor="middle">Loki</text><text class="dg-sm" x="315.0" y="200.0" text-anchor="middle">asked now</text><circle class="dg-num" cx="22" cy="190" r="9"/><text class="dg-numt" x="22" y="193.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="194" text-anchor="start">Read again</text><text class="dg-sm" x="36" y="206" text-anchor="start">the one line shown</text><path class="dg-read" d="M248,190 L208.0,190.0"/><polygon class="dg-readh" points="202.0,190.0 210.0,194.5 210.0,185.5"/><rect class="dg-store" x="14" y="230" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="230" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="248.0" text-anchor="middle">The reveal record</text><text class="dg-sm" x="109.0" y="262.0" text-anchor="middle">who, when, which, why</text><circle class="dg-num" cx="14" cy="230" r="9"/><text class="dg-numt" x="14" y="233.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="288" text-anchor="start">never the line or its value;</text><text class="dg-sm" x="14" y="301" text-anchor="start">unrecorded, nothing is shown</text><path class="dg-box" d="M14,320 H190 L200,330 V360 H14 Z"/><path class="dg-box" d="M190,320 V330 H200"/><text class="dg-tb" x="107.0" y="338.0" text-anchor="middle">Your page</text><text class="dg-sm" x="107.0" y="352.0" text-anchor="middle">the line unmasked, in place</text><circle class="dg-num" cx="14" cy="320" r="9"/><text class="dg-numt" x="14" y="323.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="384" text-anchor="start">History&#x27;s Timeline lists the record.</text><text class="dg-sm" x="14" y="428" text-anchor="start">No device is asked or changed.</text></svg>
