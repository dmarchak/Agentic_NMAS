<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="A path trace: From and To are checked before any device is asked; the first device is asked show ip cef for the destination through the reads engine, held while read and recorded; each next hop its answer names is followed to the device holding that address, which is read next, equal-cost next hops branching; a branch stops when the packet is delivered, dropped, not readable, in a loop, leaves the network, or reaches a bound; the trace is recorded with each read, and Topology draws it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">From and To</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">checked first</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: no device asked</text><rect class="dg-band" x="0" y="110" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="126" text-anchor="start">THE TRACE · A JOB, HOP BY HOP</text><rect class="dg-dev" x="262" y="128" width="118" height="110" rx="5"/><rect class="dg-dev" x="274" y="237" width="8" height="5"/><rect class="dg-dev" x="288" y="237" width="8" height="5"/><rect class="dg-dev" x="302" y="237" width="8" height="5"/><text class="dg-tb" x="321.0" y="146" text-anchor="middle">Each hop</text><text class="dg-sm" x="321.0" y="160" text-anchor="middle">show ip cef</text><circle class="dg-num" cx="22" cy="142" r="9"/><text class="dg-numt" x="22" y="145.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="146" text-anchor="start">Held, then read</text><text class="dg-sm" x="36" y="158" text-anchor="start">a step&#x27;s devices together</text><path class="dg-read" d="M260,142 L208.0,142.0"/><polygon class="dg-readh" points="202.0,142.0 210.0,146.5 210.0,137.5"/><circle class="dg-num" cx="22" cy="192" r="9"/><text class="dg-numt" x="22" y="195.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="196" text-anchor="start">Its next hops followed</text><text class="dg-sm" x="36" y="208" text-anchor="start">to the device holding each</text><path class="dg-box" d="M14,276 H190 L200,286 V316 H14 Z"/><path class="dg-box" d="M190,276 V286 H200"/><text class="dg-tb" x="107.0" y="294.0" text-anchor="middle">Each branch ends</text><text class="dg-sm" x="107.0" y="308.0" text-anchor="middle">delivered, dropped, not read</text><circle class="dg-num" cx="14" cy="276" r="9"/><text class="dg-numt" x="14" y="279.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="334" text-anchor="start">a loop, leaves, or a bound</text><rect class="dg-store" x="14" y="352" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="352" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="370.0" text-anchor="middle">The trace&#x27;s record</text><text class="dg-sm" x="109.0" y="384.0" text-anchor="middle">with each read</text><circle class="dg-num" cx="14" cy="352" r="9"/><text class="dg-numt" x="14" y="355.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="414" text-anchor="start">Topology draws it; History shows the reads.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device&#x27;s configuration is changed.</text></svg>
