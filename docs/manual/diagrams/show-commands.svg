<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Show commands, and Ask the device its one-device form. Every command is checked against the read-only allowlist before any device is asked; a refused run asks none and is recorded. Then each device is held while it is read, several at once up to the network&#x27;s limit; a device another operation holds is skipped and named. Each answer is masked, as a golden is, and kept up to the network&#x27;s cap, saying when it was cut. The run is recorded: who, when, the commands, each device&#x27;s outcome. Nothing is changed on any device."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The allowlist</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">every command, whole</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: no device asked,</text><text class="dg-sm" x="14" y="105" text-anchor="start">the refusal recorded</text><rect class="dg-band" x="0" y="120" width="400" height="190" rx="6"/><text class="dg-hd" x="30" y="136" text-anchor="start">THE RUN · A JOB, DEVICES HELD WHILE READ</text><rect class="dg-dev" x="262" y="144" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="293" width="8" height="5"/><rect class="dg-dev" x="288" y="293" width="8" height="5"/><rect class="dg-dev" x="302" y="293" width="8" height="5"/><text class="dg-tb" x="321.0" y="162" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="176" text-anchor="middle">several at once</text><circle class="dg-num" cx="22" cy="160" r="9"/><text class="dg-numt" x="22" y="163.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="164" text-anchor="start">Held, then read</text><text class="dg-sm" x="36" y="176" text-anchor="start">held elsewhere: skipped</text><path class="dg-read" d="M260,160 L208.0,160.0"/><polygon class="dg-readh" points="202.0,160.0 210.0,164.5 210.0,155.5"/><circle class="dg-num" cx="22" cy="196" r="9"/><text class="dg-numt" x="22" y="199.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="200" text-anchor="start">Masked</text><text class="dg-sm" x="36" y="212" text-anchor="start">as a golden is</text><circle class="dg-num" cx="22" cy="232" r="9"/><text class="dg-numt" x="22" y="235.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="236" text-anchor="start">Capped</text><text class="dg-sm" x="36" y="248" text-anchor="start">a cut answer says so</text><rect class="dg-store" x="14" y="330" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="330" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="348.0" text-anchor="middle">The run&#x27;s record</text><text class="dg-sm" x="109.0" y="362.0" text-anchor="middle">who, when, each outcome</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="394" text-anchor="start">History shows it; answers move to</text><text class="dg-sm" x="14" y="407" text-anchor="start">the archive after the retention.</text><text class="dg-sm" x="14" y="444" text-anchor="start">Nothing is changed on any device.</text></svg>
