<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Close the collector&#x27;s stale session, then re-subscribe: Mercury&#x27;s diagnosis has read both ends, the device&#x27;s telemetry connection Disconnecting and the collector&#x27;s session from it established and idle; the plan reads the collector&#x27;s sessions on Mercury&#x27;s host and the close helper&#x27;s dry run names the one session it would close, closing nothing; you confirm by the selection&#x27;s hash, which holds that session&#x27;s two ends; holding the device, the run reads before, then the helper closes the session and reads it back gone, its code, exit code and words kept as the receipt; a close that did not happen stops the run with nothing sent to the device; the device&#x27;s connections are read until the one that read Disconnecting is gone; then each receiver is removed and added back and the stream verified, as Re-subscribe does, and the run is recorded."><line class="dg-lane" x1="212" y1="20" x2="212" y2="454"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE COLLECTOR · THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The plan</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">the dry run names one</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">closes nothing; refused: none sent</text><rect class="dg-person" x="14" y="104" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="116.0" r="4"/><path class="dg-person" d="M23,127.0 Q30,118.0 37,127.0"/><text class="dg-tx" x="46" y="123.0" text-anchor="start">You confirm, by its hash</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><rect class="dg-band" x="0" y="150" width="400" height="230" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE RUN · A JOB, THE DEVICE HELD</text><rect class="dg-dev" x="262" y="170" width="118" height="200" rx="5"/><rect class="dg-dev" x="274" y="369" width="8" height="5"/><rect class="dg-dev" x="288" y="369" width="8" height="5"/><rect class="dg-dev" x="302" y="369" width="8" height="5"/><text class="dg-tb" x="321.0" y="188" text-anchor="middle">Collector, device</text><text class="dg-sm" x="321.0" y="202" text-anchor="middle">the session closed</text><circle class="dg-num" cx="22" cy="178" r="9"/><text class="dg-numt" x="22" y="181.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="182" text-anchor="start">Read before</text><text class="dg-sm" x="36" y="194" text-anchor="start">connections, sessions</text><path class="dg-read" d="M260,178 L208.0,178.0"/><polygon class="dg-readh" points="202.0,178.0 210.0,182.5 210.0,173.5"/><circle class="dg-num" cx="22" cy="218" r="9"/><text class="dg-numt" x="22" y="221.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="222" text-anchor="start">Close the one session</text><text class="dg-sm" x="36" y="234" text-anchor="start">the helper reads it gone</text><path class="dg-send" d="M202,218 L254.0,218.0"/><polygon class="dg-sendh" points="260.0,218.0 252.0,213.5 252.0,222.5"/><circle class="dg-num" cx="22" cy="258" r="9"/><text class="dg-numt" x="22" y="261.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="262" text-anchor="start">Until the connection goes</text><text class="dg-sm" x="36" y="274" text-anchor="start">every 5 s, at most 60 s</text><path class="dg-read" d="M260,258 L208.0,258.0"/><polygon class="dg-readh" points="202.0,258.0 210.0,262.5 210.0,253.5"/><circle class="dg-num" cx="22" cy="298" r="9"/><text class="dg-numt" x="22" y="301.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="302" text-anchor="start">Re-subscribe</text><text class="dg-sm" x="36" y="314" text-anchor="start">remove, wait, re-add</text><path class="dg-send" d="M202,298 L254.0,298.0"/><polygon class="dg-sendh" points="260.0,298.0 252.0,293.5 252.0,302.5"/><circle class="dg-num" cx="22" cy="338" r="9"/><text class="dg-numt" x="22" y="341.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="342" text-anchor="start">Verify each, up to 290 s</text><text class="dg-sm" x="36" y="354" text-anchor="start">device, stream, collector</text><path class="dg-read" d="M260,338 L208.0,338.0"/><polygon class="dg-readh" points="202.0,338.0 210.0,342.5 210.0,333.5"/><text class="dg-sm" x="36" y="396" text-anchor="start">Not closed: the run stops,</text><text class="dg-sm" x="36" y="409" text-anchor="start">nothing sent to the device.</text><rect class="dg-store" x="14" y="420" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="420" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="435.0" text-anchor="middle">The run&#x27;s record</text><text class="dg-sm" x="109.0" y="449.0" text-anchor="middle">the helper&#x27;s receipt</text><circle class="dg-num" cx="14" cy="420" r="9"/><text class="dg-numt" x="14" y="423.6" text-anchor="middle">8</text></svg>
