<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="A change to an SDN switch&#x27;s flows, a person&#x27;s or a response&#x27;s: the plan reads the switch&#x27;s flow table through its controller, checks OpenFlow 1.3&#x27;s match prerequisites and refuses before any request exists, and renders the exact REST requests and the undo of each; you confirm, bound to their hash; holding the switch, the plan is made again and a moved hash sends nothing; each request is sent through the controller; Verify reads the table back, a meter&#x27;s counters twice; a failed request or check rolls back what landed, newest first, and reads the table back; the run is recorded in the network&#x27;s flow intent, and History shows it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CONTROLLER</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The plan</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">the table read; prerequisites</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: nothing sent</text><path class="dg-box" d="M14,110 H190 L200,120 V146 H14 Z"/><path class="dg-box" d="M190,110 V120 H200"/><text class="dg-tb" x="107.0" y="126.0" text-anchor="middle">Exactly these requests</text><text class="dg-sm" x="107.0" y="140.0" text-anchor="middle">each with its undo</text><circle class="dg-num" cx="14" cy="110" r="9"/><text class="dg-numt" x="14" y="113.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="160" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="172.0" r="4"/><path class="dg-person" d="M23,183.0 Q30,174.0 37,183.0"/><text class="dg-tx" x="46" y="179.0" text-anchor="start">You confirm, bound to their hash</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="206" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="222" text-anchor="start">THE APPLY · THE SWITCH HELD</text><rect class="dg-dev" x="262" y="226" width="118" height="140" rx="5"/><rect class="dg-dev" x="274" y="365" width="8" height="5"/><rect class="dg-dev" x="288" y="365" width="8" height="5"/><rect class="dg-dev" x="302" y="365" width="8" height="5"/><text class="dg-tb" x="321.0" y="244" text-anchor="middle">The controller</text><text class="dg-sm" x="321.0" y="258" text-anchor="middle">and its switch</text><circle class="dg-num" cx="22" cy="236" r="9"/><text class="dg-numt" x="22" y="239.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="240" text-anchor="start">Planned again</text><text class="dg-sm" x="36" y="252" text-anchor="start">a moved hash sends nothing</text><circle class="dg-num" cx="22" cy="278" r="9"/><text class="dg-numt" x="22" y="281.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="282" text-anchor="start">Each request sent</text><text class="dg-sm" x="36" y="294" text-anchor="start">exactly the rendered body</text><circle class="dg-num" cx="22" cy="320" r="9"/><text class="dg-numt" x="22" y="323.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="324" text-anchor="start">Verified</text><text class="dg-sm" x="36" y="336" text-anchor="start">the table read back</text><path class="dg-read" d="M260,320 L208.0,320.0"/><polygon class="dg-readh" points="202.0,320.0 210.0,324.5 210.0,315.5"/><text class="dg-sm" x="14" y="372" text-anchor="start">A failure rolls back what landed.</text><rect class="dg-store" x="14" y="390" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="390" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="408.0" text-anchor="middle">The flow intent</text><text class="dg-sm" x="109.0" y="422.0" text-anchor="middle">the flows, the run</text><circle class="dg-num" cx="14" cy="390" r="9"/><text class="dg-numt" x="14" y="393.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="454" text-anchor="start">History shows it.</text><text class="dg-sm" x="14" y="480" text-anchor="start">Traffic between hosts is yours to test.</text></svg>
