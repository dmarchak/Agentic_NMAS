# The per-test coverage measurement, nightly (C773, the operator, 2026-10-14).
#
# A push measures each test's run phase BY TIER (ci.yml, tests/coverage_tiers.py), lines only,
# so sys.monitoring runs and a push takes about half the time. What that cannot say is measured
# here, once a night, on main: the tests that reach each function (a context per test,
# `--cov-context=test`) and branch coverage (`--cov-branch`), both of which need coverage's C
# tracer. Its report (coverage.html, coverage.json) is this run's `coverage-drilldown`
# artifact; a push's report names the newest successful run of this workflow and its date.
# Never on a push. The same four shards and setup as ci.yml's test job, step for step
# (tests/test_ci_workflow.py holds them to it).
name: coverage-nightly

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-nightly
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [browser1, browser2, a, b]
    runs-on: ubuntu-24.04
    # The per-test measurement's bound (2026-10-23, nightly #17 at c4716675, cancelled by the
    # old 26-minute bound): the tests steps took 931 s (b), 915 s (browser1), 618 s (browser2),
    # and a passed 97% at its cancel, about 1,100 s; the step's bound 2.5x that
    # (NMAS_TEST_TIMEOUT 2750 s), the job's that plus the setup and the upload (about 660 s,
    # browser2's 21.3-minute job less its 618 s of tests), rounded up. Before: run #752's 587 s.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # CI's: the tests that read the shipped templates' history (C786)
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # the host's interpreter
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.txt
            requirements-test.txt

      # Bounded (C1631): ci.yml's comment.
      - name: Install the host's versions, exactly
        timeout-minutes: 2
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-test.txt

      - name: The runner's environment (information, not a gate)
        run: python scripts/nmas-env-facts --annotate || true

      - name: Where PyPI's metadata disagrees with the host (information, not a gate)
        run: python -m pip check || true

      # The setup caches and their bounds: ci.yml's comment (C1637, C1631).
      - name: The runner image, for the setup caches' keys
        id: image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: promtool, cached by the runner image (C1637)
        id: promtool-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nmas-promtool
          key: nmas-promtool-${{ steps.image.outputs.key }}-v1

      - name: promtool for the PromQL tests, downloaded when not cached (unpacked, not installed)
        if: steps.promtool-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          d=$(mktemp -d) && cd "$d"
          sudo apt-get update -qq
          apt-get download promtool 2>/dev/null || apt-get download prometheus
          mkdir -p "$HOME/.local/share/nmas-promtool"   # dpkg -x makes only the last folder
          dpkg -x ./*.deb "$HOME/.local/share/nmas-promtool"

      - name: promtool answers
        run: |
          "$HOME/.local/share/nmas-promtool/usr/bin/promtool" --version

      - name: PostgreSQL 18's packages, cached by the runner image (C1637)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nmas-pg-debs
          key: nmas-pg18-debs-${{ steps.image.outputs.key }}-v1

      - name: PostgreSQL 18's packages from PGDG, downloaded when not cached
        if: steps.pg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get install -y -qq --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          deps=$(apt-cache depends postgresql-18 | sed -n 's/^ *Depends: \(lib[^ <>]*\)$/\1/p' | sort -u)
          debs="$HOME/.cache/nmas-pg-debs" && mkdir -p "$debs/partial"   # apt needs partial/
          sudo apt-get install -y -qq --no-install-recommends --download-only \
            -o Dir::Cache::archives="$debs" libpq5 $deps
          cd "$debs" && apt-get download postgresql-18
          sudo rm -rf "$debs/partial" "$debs/lock" && sudo chown -R "$(id -u)" "$debs"

      - name: PostgreSQL 18 for the records tests, from PGDG (libpq5 installed; the server unpacked)
        run: |
          debs="$HOME/.cache/nmas-pg-debs"
          libs=$(ls "$debs"/*.deb | grep -v '/postgresql-18_' || true)
          [ -z "$libs" ] || sudo dpkg -i $libs
          mkdir -p "$HOME/.local/share/nmas-pg"
          dpkg -x "$debs"/postgresql-18_*.deb "$HOME/.local/share/nmas-pg"
          bin=$(ls -d "$HOME"/.local/share/nmas-pg/usr/lib/postgresql/18/bin)
          if ldd "$bin/postgres" "$bin/initdb" | grep "not found"; then
            echo "::error::the unpacked PostgreSQL lacks a library (above)"; exit 1
          fi
          "$bin/postgres" --version | tee /dev/stderr | grep -q " 18\." \
            || { echo "::error::the unpacked server is not PostgreSQL 18"; exit 1; }
          python -c "import psycopg; print('psycopg', psycopg.__version__, 'libpq', psycopg.pq.version())"

      - name: Allow a network namespace for the suite (this VM only)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: A folder for each test's tier
        run: mkdir -p "tiers-${{ matrix.shard }}"

      # A context per test, with branches: the C tracer, the measurement a push no longer takes.
      # The per-test bound (pytest.ini's faulthandler_timeout, 120 s) is 450 s here (C1616,
      # 2026-10-23): under the C tracer test_source_index's population setup measured 60 s on
      # the laptop and about 180 s on the runner (shard b about 3x slower in this mode), so a
      # dump fired inside an xdist worker and took it down (C647's shape), its coverage file
      # half-written; 450 s is 2.5x the runner's 180 s.
      - name: Tests (R1, R4), confined to loopback, measured per test
        env:
          COVERAGE_CORE: ctrace
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          NMAS_TEST_TIERS: ${{ github.workspace }}/tiers-${{ matrix.shard }}
          NMAS_TEST_TIMEOUT: "2750"
          NMAS_REQUIRE_PG: "1"
        run: >
          scripts/nmas-test -q -p no:cacheprovider -n auto -o faulthandler_timeout=450
          --cov=modules --cov=routes --cov=app --cov-report=
          --cov-context=test --cov-branch
          $(python scripts/nmas-shards ${{ matrix.shard }})

      - name: Keep this shard's measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: drilldown-${{ matrix.shard }}
          path: |
            .coverage.${{ matrix.shard }}*
            tiers-${{ matrix.shard }}/
          include-hidden-files: true
          retention-days: 3

  report:
    name: the drill-down (each function's tests; branches)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install coverage, as the tests' jobs do
        run: python -m pip install --no-deps -r requirements-ci.txt

      - name: The four shards' measurements
        uses: actions/download-artifact@v4
        with:
          pattern: drilldown-*
          path: measured
          merge-multiple: true

      - name: Combine them
        run: |
          python -m coverage combine --keep --data-file=.coverage measured/.coverage.*
          mkdir -p tiers
          for d in measured/tiers-*/; do
            for f in "$d"*.jsonl; do cp "$f" "tiers/$(basename "$d")-$(basename "$f")"; done
          done
          echo "tier records: $(cat tiers/*.jsonl | wc -l)"

      - name: The report, per test, with branches
        run: >
          python scripts/nmas-coverage report --data .coverage --tiers tiers
          --json coverage.json --html coverage.html --summary "$GITHUB_STEP_SUMMARY"

      # With each test's tier record (tiers/): the nightly mutation run reads both, each function's
      # tests and which of them start a child (C796, C834).
      - name: Keep the drill-down
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-drilldown
          path: |
            coverage.html
            coverage.json
            tiers/
          retention-days: 30
