<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="An Installation card. Save checks each field, writes the ones that changed to the installation&#x27;s settings for every network, and appends who, when and which fields to the installation&#x27;s settings record. Test asks the service now with what is saved. Replace stores a new token as a secret, records it and tests it. Turn off writes NetBox&#x27;s master switch off and records it; turning it on is the confirm of an authorised NetBox write. No device is contacted."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICE</text><rect class="dg-band" x="0" y="20" width="400" height="160" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">SAVE</text><rect class="dg-person" x="14" y="44" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="56.0" r="4"/><path class="dg-person" d="M23,67.0 Q30,58.0 37,67.0"/><text class="dg-tx" x="46" y="63.0" text-anchor="start">You save a card</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><rect class="dg-store" x="14" y="84" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="84" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="99.0" text-anchor="middle">The installation&#x27;s settings</text><text class="dg-sm" x="109.0" y="113.0" text-anchor="middle">every network</text><circle class="dg-num" cx="14" cy="84" r="9"/><text class="dg-numt" x="14" y="87.6" text-anchor="middle">2</text><path class="dg-repo" d="M14,134 V162 A93.0,6 0 0 0 200,162 V134"/><ellipse class="dg-repo" cx="107.0" cy="134" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="153.0" text-anchor="middle">Its settings record</text><text class="dg-sm" x="107.0" y="167.0" text-anchor="middle">who, when, fields</text><circle class="dg-num" cx="14" cy="128" r="9"/><text class="dg-numt" x="14" y="131.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="188" width="400" height="112" rx="6"/><text class="dg-hd" x="30" y="204" text-anchor="start">TEST · REPLACE A TOKEN</text><rect class="dg-store" x="14" y="212" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="212" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="227.0" text-anchor="middle">The secrets store</text><text class="dg-sm" x="109.0" y="241.0" text-anchor="middle">a replaced token</text><path class="dg-box" d="M14,254 H190 L200,264 V288 H14 Z"/><path class="dg-box" d="M190,254 V264 H200"/><text class="dg-tb" x="107.0" y="269.0" text-anchor="middle">Recorded, then the Test</text><text class="dg-sm" x="107.0" y="283.0" text-anchor="middle">with what is saved</text><rect class="dg-store" x="232" y="212" width="156" height="44" rx="3"/><rect class="dg-bar" x="232" y="212" width="4" height="44" rx="1"/><text class="dg-tb" x="312.0" y="232.0" text-anchor="middle">NetBox · Proxmox</text><text class="dg-sm" x="312.0" y="246.0" text-anchor="middle">asked now</text><rect class="dg-band" x="0" y="308" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="324" text-anchor="start">TURN OFF · NETBOX WRITES</text><rect class="dg-store" x="14" y="332" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="332" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="348.0" text-anchor="middle">Writes allowed: off</text><text class="dg-sm" x="109.0" y="362.0" text-anchor="middle">every network</text><circle class="dg-num" cx="14" cy="332" r="9"/><text class="dg-numt" x="14" y="335.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,370 L107.0,382.0"/><polygon class="dg-rech" points="107.0,388.0 111.5,380.0 102.5,380.0"/><path class="dg-box" d="M14,390 H190 L200,400 V420 H14 Z"/><path class="dg-box" d="M190,390 V400 H200"/><text class="dg-tb" x="107.0" y="403.0" text-anchor="middle">Recorded</text><text class="dg-sm" x="107.0" y="417.0" text-anchor="middle">who and when</text><circle class="dg-num" cx="14" cy="390" r="9"/><text class="dg-numt" x="14" y="393.6" text-anchor="middle">2</text><rect class="dg-person" x="232" y="332" width="156" height="34" rx="17.0"/><circle class="dg-person" cx="248" cy="346.0" r="4"/><path class="dg-person" d="M241,357.0 Q248,348.0 255,357.0"/><text class="dg-tx" x="264" y="353.0" text-anchor="start">An authorised write&#x27;s confirm</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">no device</text><text class="dg-sm" x="310" y="459" text-anchor="middle">is contacted</text></svg>
