<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Removing a line (Mode B). A line the device has and intent lacks is residue. You tick the unit and state a reason; only a shape measured on that platform to remove exactly itself is offered, and the management path, accounts and used objects are refused. The removal is the device&#x27;s own line negated, at the end of the deploy&#x27;s program, in its hash. Verify reads it gone; a rollback puts back the device&#x27;s own line from the snapshot."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="168" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">CHOOSE · NOTHING SENT</text><rect class="dg-dev" x="240" y="44" width="140" height="44" rx="5"/><rect class="dg-dev" x="252" y="87" width="8" height="5"/><rect class="dg-dev" x="266" y="87" width="8" height="5"/><rect class="dg-dev" x="280" y="87" width="8" height="5"/><text class="dg-tb" x="310.0" y="64.0" text-anchor="middle">A line it has</text><text class="dg-sm" x="310.0" y="78.0" text-anchor="middle">intent lacks: residue</text><rect class="dg-person" x="14" y="50" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="62.0" r="4"/><path class="dg-person" d="M23,73.0 Q30,64.0 37,73.0"/><text class="dg-tx" x="46" y="69.0" text-anchor="start">You tick it, with a reason</text><circle class="dg-num" cx="14" cy="50" r="9"/><text class="dg-numt" x="14" y="53.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="104" text-anchor="start">Offered only for a shape measured on</text><text class="dg-sm" x="14" y="117" text-anchor="start">the platform; the management path,</text><text class="dg-sm" x="14" y="130" text-anchor="start">accounts and used objects refused.</text><text class="dg-sm" x="14" y="156" text-anchor="start">In the program&#x27;s hash with its reason.</text><rect class="dg-band" x="0" y="194" width="400" height="196" rx="6"/><text class="dg-hd" x="30" y="210" text-anchor="start">THE RUN · THE DEPLOY&#x27;S STAGES</text><rect class="dg-dev" x="262" y="216" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="365" width="8" height="5"/><rect class="dg-dev" x="288" y="365" width="8" height="5"/><rect class="dg-dev" x="302" y="365" width="8" height="5"/><text class="dg-tb" x="321.0" y="234" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="236" r="9"/><text class="dg-numt" x="22" y="239.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="240" text-anchor="start">The negation</text><text class="dg-sm" x="36" y="252" text-anchor="start">the device&#x27;s own line, verbatim</text><path class="dg-send" d="M202,236 L254.0,236.0"/><polygon class="dg-sendh" points="260.0,236.0 252.0,231.5 252.0,240.5"/><circle class="dg-num" cx="22" cy="280" r="9"/><text class="dg-numt" x="22" y="283.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="284" text-anchor="start">Verify: read it gone</text><text class="dg-sm" x="36" y="296" text-anchor="start">still there fails</text><path class="dg-read" d="M260,280 L208.0,280.0"/><polygon class="dg-readh" points="202.0,280.0 210.0,284.5 210.0,275.5"/><text class="dg-tb" x="36" y="330" text-anchor="start">Rollback: put it back</text><text class="dg-sm" x="36" y="342" text-anchor="start">the snapshot&#x27;s own line</text><path class="dg-undo" d="M202,326 L254.0,326.0"/><polygon class="dg-undoh" points="260.0,326.0 252.0,321.5 252.0,330.5"/><rect class="dg-band" x="0" y="396" width="400" height="68" rx="6"/><text class="dg-hd" x="30" y="412" text-anchor="start">RECORDED</text><rect class="dg-store" x="14" y="416" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="416" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="432.0" text-anchor="middle">Receipt</text><text class="dg-sm" x="109.0" y="446.0" text-anchor="middle">each removal, its reason</text><path class="dg-golden" d="M214,416 H370 L380,426 V452 H214 Z"/><path class="dg-golden" d="M370,416 V426 H380"/><text class="dg-tb" x="297.0" y="432.0" text-anchor="middle">Golden</text><text class="dg-sm" x="297.0" y="446.0" text-anchor="middle">without the line</text></svg>
