<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Was this right? under an AI answer. You press Yes, or No with what was wrong and a sentence. Mercury checks you are a verified person, reads the call from the record of AI calls, refuses a second answer from you on the same call, and keeps your verdict with the call&#x27;s id and hashes, your words masked. A No waits on Settings, Answers said wrong, until a reviewer accepts it into a case draft or dismisses it with a reason. No model call is made."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE RECORDS</text><rect class="dg-band" x="0" y="20" width="400" height="236" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">WAS THIS RIGHT?</text><rect class="dg-person" x="14" y="44" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="56.0" r="4"/><path class="dg-person" d="M23,67.0 Q30,58.0 37,67.0"/><text class="dg-tx" x="46" y="63.0" text-anchor="start">You press Yes, or No…</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><rect class="dg-store" x="232" y="82" width="156" height="36" rx="3"/><rect class="dg-bar" x="232" y="82" width="4" height="36" rx="1"/><text class="dg-tb" x="312.0" y="98.0" text-anchor="middle">The record of AI calls</text><text class="dg-sm" x="312.0" y="112.0" text-anchor="middle">the call and its answer</text><path class="dg-read" d="M230,100 L208.0,100.0"/><polygon class="dg-readh" points="202.0,100.0 210.0,104.5 210.0,95.5"/><circle class="dg-num" cx="14" cy="88" r="9"/><text class="dg-numt" x="14" y="91.6" text-anchor="middle">2</text><path class="dg-box" d="M14,84 H190 L200,94 V118 H14 Z"/><path class="dg-box" d="M190,84 V94 H200"/><text class="dg-tb" x="107.0" y="99.0" text-anchor="middle">The call, read</text><text class="dg-sm" x="107.0" y="113.0" text-anchor="middle">absent or no answer: refused</text><rect class="dg-store" x="14" y="130" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="130" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="145.0" text-anchor="middle">Once per person</text><text class="dg-sm" x="109.0" y="159.0" text-anchor="middle">a second answer refused</text><circle class="dg-num" cx="14" cy="130" r="9"/><text class="dg-numt" x="14" y="133.6" text-anchor="middle">3</text><rect class="dg-store" x="14" y="176" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="176" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="191.0" text-anchor="middle">Your verdict, kept</text><text class="dg-sm" x="109.0" y="205.0" text-anchor="middle">call id, hashes, words masked</text><circle class="dg-num" cx="14" cy="176" r="9"/><text class="dg-numt" x="14" y="179.6" text-anchor="middle">4</text><rect class="dg-band" x="0" y="276" width="400" height="180" rx="6"/><text class="dg-hd" x="30" y="292" text-anchor="start">THE REVIEW</text><rect class="dg-person" x="14" y="300" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="312.0" r="4"/><path class="dg-person" d="M23,323.0 Q30,314.0 37,323.0"/><text class="dg-tx" x="46" y="319.0" text-anchor="start">A reviewer opens a No</text><circle class="dg-num" cx="14" cy="300" r="9"/><text class="dg-numt" x="14" y="303.6" text-anchor="middle">5</text><path class="dg-box" d="M14,340 H190 L200,350 V374 H14 Z"/><path class="dg-box" d="M190,340 V350 H200"/><text class="dg-tb" x="107.0" y="355.0" text-anchor="middle">Accept into a case draft</text><text class="dg-sm" x="107.0" y="369.0" text-anchor="middle">bound to the draft&#x27;s hash</text><path class="dg-box" d="M14,386 H190 L200,396 V420 H14 Z"/><path class="dg-box" d="M190,386 V396 H200"/><text class="dg-tb" x="107.0" y="401.0" text-anchor="middle">Or Dismiss</text><text class="dg-sm" x="107.0" y="415.0" text-anchor="middle">with a reason</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">no model</text><text class="dg-sm" x="310" y="459" text-anchor="middle">call is made</text></svg>
