[pytest]
# Without pythonpath, `pytest tests/` fails with "No module named 'modules'" —
# only `python -m pytest` from the repo root worked, because that puts cwd on
# sys.path. Both invocations work now.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
