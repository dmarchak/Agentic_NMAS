<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Ask in words: the question&#x27;s words choose the metrics to offer, never the whole catalogue, and a question matching none stops there with nothing sent; one recorded, capped call through the AI gateway, the builder&#x27;s vocabulary as its cached prefix and the question and the offered metrics as data, answers with the builder&#x27;s choices; the builder reads them back as it reads a person&#x27;s, a metric not offered refused and a device the network lacks left out; one time-limited count of the query&#x27;s series tests it; the builder is drawn filled, and nothing runs until the person presses Ask."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICES</text><rect class="dg-svc" x="250" y="36" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="52.0" text-anchor="middle">Prometheus</text><text class="dg-sm" x="315.0" y="66.0" text-anchor="middle">its metric names</text><path class="dg-read" d="M248,56 L208.0,56.0"/><polygon class="dg-readh" points="202.0,56.0 210.0,60.5 210.0,51.5"/><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The metrics offered</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">sharing the question&#x27;s words</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">none matched: nothing sent</text><rect class="dg-svc" x="250" y="118" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="134.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="148.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,136 L242.0,136.0"/><polygon class="dg-sendh" points="248.0,136.0 240.0,131.5 240.0,140.5"/><path class="dg-box" d="M14,118 H190 L200,128 V154 H14 Z"/><path class="dg-box" d="M190,118 V128 H200"/><text class="dg-tb" x="107.0" y="134.0" text-anchor="middle">The builder&#x27;s choices</text><text class="dg-sm" x="107.0" y="148.0" text-anchor="middle">a strict schema</text><circle class="dg-num" cx="14" cy="118" r="9"/><text class="dg-numt" x="14" y="121.6" text-anchor="middle">2</text><path class="dg-box" d="M14,186 H190 L200,196 V226 H14 Z"/><path class="dg-box" d="M190,186 V196 H200"/><text class="dg-tb" x="107.0" y="204.0" text-anchor="middle">Read back</text><text class="dg-sm" x="107.0" y="218.0" text-anchor="middle">by the builder&#x27;s own checks</text><circle class="dg-num" cx="14" cy="186" r="9"/><text class="dg-numt" x="14" y="189.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="240" text-anchor="start">a metric not offered: refused</text><rect class="dg-svc" x="250" y="262" width="130" height="30" rx="15.0"/><text class="dg-tb" x="315.0" y="275.0" text-anchor="middle">Prometheus</text><text class="dg-sm" x="315.0" y="289.0" text-anchor="middle">count, 10 s at most</text><path class="dg-send" d="M202,280 L242.0,280.0"/><polygon class="dg-sendh" points="248.0,280.0 240.0,275.5 240.0,284.5"/><path class="dg-box" d="M14,262 H190 L200,272 V298 H14 Z"/><path class="dg-box" d="M190,262 V272 H200"/><text class="dg-tb" x="107.0" y="278.0" text-anchor="middle">The test run</text><text class="dg-sm" x="107.0" y="292.0" text-anchor="middle">how many series now</text><circle class="dg-num" cx="14" cy="262" r="9"/><text class="dg-numt" x="14" y="265.6" text-anchor="middle">4</text><path class="dg-box" d="M14,330 H190 L200,340 V370 H14 Z"/><path class="dg-box" d="M190,330 V340 H200"/><text class="dg-tb" x="107.0" y="348.0" text-anchor="middle">The builder, filled</text><text class="dg-sm" x="107.0" y="362.0" text-anchor="middle">the query shown</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="392" text-anchor="start">You press Ask: then it runs.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device is asked or changed.</text></svg>
