<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="The toolbar assistant&#x27;s answer. You ask on any page; Mercury notes what you are looking at from the page&#x27;s path (the screen, the network, the device and the incident), chooses the manual&#x27;s passages for the question by code (below the floor, the manual&#x27;s gap, and no call), and sends one recorded, capped call through the AI gateway, your question masked. When the answer asks for reads, Mercury runs them on the device in view only, each judged by its read-only check and recorded, then makes one more recorded call with their answers. It checks that every citation is a passage it sent or a read that ran, and draws the answer with its sources, the model and the cost, offering a hand-off to the gated flow for a change, or says the manual does not cover it and records the gap. Only reads reach a device; nothing is changed."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICES</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You ask, on a page</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,84 H190 L200,94 V124 H14 Z"/><path class="dg-box" d="M190,84 V94 H200"/><text class="dg-tb" x="107.0" y="102.0" text-anchor="middle">What you are looking at</text><text class="dg-sm" x="107.0" y="116.0" text-anchor="middle">from the page&#x27;s path</text><circle class="dg-num" cx="14" cy="84" r="9"/><text class="dg-numt" x="14" y="87.6" text-anchor="middle">2</text><path class="dg-box" d="M14,138 H190 L200,148 V178 H14 Z"/><path class="dg-box" d="M190,138 V148 H200"/><text class="dg-tb" x="107.0" y="156.0" text-anchor="middle">The passages, chosen</text><text class="dg-sm" x="107.0" y="170.0" text-anchor="middle">by code; none: a gap</text><circle class="dg-num" cx="14" cy="138" r="9"/><text class="dg-numt" x="14" y="141.6" text-anchor="middle">3</text><path class="dg-box" d="M14,192 H190 L200,202 V232 H14 Z"/><path class="dg-box" d="M190,192 V202 H200"/><text class="dg-tb" x="107.0" y="210.0" text-anchor="middle">Your question, masked</text><text class="dg-sm" x="107.0" y="224.0" text-anchor="middle">secrets never leave</text><circle class="dg-num" cx="14" cy="192" r="9"/><text class="dg-numt" x="14" y="195.6" text-anchor="middle">4</text><rect class="dg-svc" x="250" y="194" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="210.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="224.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,212 L242.0,212.0"/><polygon class="dg-sendh" points="248.0,212.0 240.0,207.5 240.0,216.5"/><path class="dg-box" d="M14,246 H190 L200,256 V286 H14 Z"/><path class="dg-box" d="M190,246 V256 H200"/><text class="dg-tb" x="107.0" y="264.0" text-anchor="middle">Reads it asks for</text><text class="dg-sm" x="107.0" y="278.0" text-anchor="middle">the device in view, checked</text><circle class="dg-num" cx="14" cy="246" r="9"/><text class="dg-numt" x="14" y="249.6" text-anchor="middle">5</text><rect class="dg-svc" x="250" y="248" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="264.0" text-anchor="middle">The device</text><text class="dg-sm" x="315.0" y="278.0" text-anchor="middle">read-only commands</text><path class="dg-send" d="M202,266 L242.0,266.0"/><polygon class="dg-sendh" points="248.0,266.0 240.0,261.5 240.0,270.5"/><text class="dg-sm" x="14" y="302" text-anchor="start">then one more recorded call</text><path class="dg-box" d="M14,316 H190 L200,326 V356 H14 Z"/><path class="dg-box" d="M190,316 V326 H200"/><text class="dg-tb" x="107.0" y="334.0" text-anchor="middle">Checked</text><text class="dg-sm" x="107.0" y="348.0" text-anchor="middle">cites only what it sent or read</text><circle class="dg-num" cx="14" cy="316" r="9"/><text class="dg-numt" x="14" y="319.6" text-anchor="middle">6</text><path class="dg-box" d="M14,370 H190 L200,380 V410 H14 Z"/><path class="dg-box" d="M190,370 V380 H200"/><text class="dg-tb" x="107.0" y="388.0" text-anchor="middle">The answer, drawn</text><text class="dg-sm" x="107.0" y="402.0" text-anchor="middle">sources, model, cost</text><circle class="dg-num" cx="14" cy="370" r="9"/><text class="dg-numt" x="14" y="373.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="428" text-anchor="start">A change is handed to its gated flow;</text><text class="dg-sm" x="14" y="442" text-anchor="start">it never changes, deploys or saves.</text><circle class="dg-no" cx="310" cy="480" r="11"/><line class="dg-nol" x1="302.5" y1="487.5" x2="317.5" y2="472.5"/><text class="dg-sm" x="310" y="506" text-anchor="middle">no change is sent</text><text class="dg-sm" x="310" y="519" text-anchor="middle">to a device</text></svg>
