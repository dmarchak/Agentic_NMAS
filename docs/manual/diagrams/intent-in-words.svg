<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Change it in words: quoted text is held back as placeholders, and the device and the interfaces, VLANs and networks the sentence names are read by code, a sentence naming none or leaving a quote open stopping there with nothing sent; the names as people say them (G1/0, the host port, the uplink to edge1) are resolved by code against the device&#x27;s intent and neighbours, several matches and alternatives asked about with controls that continue the draft, both ends of a link made one draft of both devices, and a change no operation makes refused, before any call; one recorded, capped call through the AI gateway carries only the resolved parts&#x27; current values and the keys a change may set, and answers with a patch; the patch is refused before any preview if it changes what the sentence did not name or misuses a placeholder, and the quoted text is put back; the intent editor previews it, its diff and what a deploy would send; nothing is written and no device is asked."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICES</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The named parts</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">quotes held, names read</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">none named, a quote open: nothing sent</text><path class="dg-box" d="M14,104 H190 L200,114 V140 H14 Z"/><path class="dg-box" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="120.0" text-anchor="middle">Names resolved</text><text class="dg-sm" x="107.0" y="134.0" text-anchor="middle">the host port: Gi1/0</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="156" text-anchor="start">several, 40 or 41: asked, then on</text><rect class="dg-svc" x="250" y="182" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="198.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="212.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,200 L242.0,200.0"/><polygon class="dg-sendh" points="248.0,200.0 240.0,195.5 240.0,204.5"/><path class="dg-box" d="M14,182 H190 L200,192 V218 H14 Z"/><path class="dg-box" d="M190,182 V192 H200"/><text class="dg-tb" x="107.0" y="198.0" text-anchor="middle">A patch</text><text class="dg-sm" x="107.0" y="212.0" text-anchor="middle">a strict schema</text><circle class="dg-num" cx="14" cy="182" r="9"/><text class="dg-numt" x="14" y="185.6" text-anchor="middle">3</text><path class="dg-box" d="M14,246 H190 L200,256 V286 H14 Z"/><path class="dg-box" d="M190,246 V256 H200"/><text class="dg-tb" x="107.0" y="264.0" text-anchor="middle">Checked</text><text class="dg-sm" x="107.0" y="278.0" text-anchor="middle">only what was named</text><circle class="dg-num" cx="14" cy="246" r="9"/><text class="dg-numt" x="14" y="249.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="300" text-anchor="start">anything else: refused; quotes put back</text><path class="dg-box" d="M14,318 H190 L200,328 V358 H14 Z"/><path class="dg-box" d="M190,318 V328 H200"/><text class="dg-tb" x="107.0" y="336.0" text-anchor="middle">The editor&#x27;s preview</text><text class="dg-sm" x="107.0" y="350.0" text-anchor="middle">what a deploy would send</text><circle class="dg-num" cx="14" cy="318" r="9"/><text class="dg-numt" x="14" y="321.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="386" text-anchor="start">Nothing is written.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device is asked or changed.</text></svg>
