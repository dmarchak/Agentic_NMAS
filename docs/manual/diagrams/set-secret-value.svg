<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Setting a secret reference&#x27;s value, write-only. You type the value twice with a reason. It is checked: the two match, one token a device&#x27;s CLI accepts, the reference named in the device&#x27;s committed intent and not the account Mercury signs in with; any failure stores nothing. The value is stored encrypted for this device, never shown again, and the set is committed with who, when and the reason, never the value. Nothing is sent to the device now: the next deploy sends it, and once that deploy verifies, the device&#x27;s own form of the value replaces what you typed."><line class="dg-lane" x1="212" y1="20" x2="212" y2="394"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You type it twice, a reason</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,86 H190 L200,96 V126 H14 Z"/><path class="dg-box" d="M190,86 V96 H200"/><text class="dg-tb" x="107.0" y="104.0" text-anchor="middle">The checks, by name</text><text class="dg-sm" x="107.0" y="118.0" text-anchor="middle">a failure: nothing stored</text><circle class="dg-num" cx="14" cy="86" r="9"/><text class="dg-numt" x="14" y="89.6" text-anchor="middle">2</text><rect class="dg-store" x="14" y="142" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="142" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="160.0" text-anchor="middle">Stored, encrypted</text><text class="dg-sm" x="109.0" y="174.0" text-anchor="middle">this device and reference</text><circle class="dg-num" cx="14" cy="142" r="9"/><text class="dg-numt" x="14" y="145.6" text-anchor="middle">3</text><path class="dg-repo" d="M14,204 V238 A93.0,6 0 0 0 200,238 V204"/><ellipse class="dg-repo" cx="107.0" cy="204" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="226.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="240.0" text-anchor="middle">who, when, why; never the value</text><circle class="dg-num" cx="14" cy="198" r="9"/><text class="dg-numt" x="14" y="201.6" text-anchor="middle">4</text><text class="dg-sm" x="262" y="60" text-anchor="start">Nothing sent now</text><rect class="dg-band" x="0" y="264" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="280" text-anchor="start">LATER · THE NEXT DEPLOY</text><rect class="dg-dev" x="262" y="286" width="118" height="80" rx="5"/><rect class="dg-dev" x="274" y="365" width="8" height="5"/><rect class="dg-dev" x="288" y="365" width="8" height="5"/><rect class="dg-dev" x="302" y="365" width="8" height="5"/><text class="dg-tb" x="321.0" y="304" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="318" text-anchor="middle">stores its own form</text><circle class="dg-num" cx="22" cy="314" r="9"/><text class="dg-numt" x="22" y="317.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="318" text-anchor="start">The deploy sends it</text><text class="dg-sm" x="36" y="330" text-anchor="start">verified</text><path class="dg-send" d="M202,314 L254.0,314.0"/><polygon class="dg-sendh" points="260.0,314.0 252.0,309.5 252.0,318.5"/><rect class="dg-store" x="14" y="330" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="330" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="348.0" text-anchor="middle">Its own form kept</text><text class="dg-sm" x="109.0" y="362.0" text-anchor="middle">in place of what you typed</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">6</text></svg>
