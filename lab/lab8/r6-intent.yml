# R6's committed intent at its retirement (network Default, host_vars/r6.yml, read masked through
# scripts/nmas-config-read on 2026-10-20 19:5x UTC), kept for R6's redo after the one-file
# redeploy (docs/LAB_ONE_TOPOLOGY_PLAN.md A2). LAB TOOLING: never read by the product.
# Secrets are references (`secret_refs`, `__secret__:`), never values.
# RE-USE: Seed intent… on the re-onboarded R6, then apply this file as edits to the seed, KEEPING
# the new seed's GigabitEthernet2 entry: its `ip dhcp client client-id ascii <serial>` (in Gi2's
# `unmodeled` and in `unmodeled_ack`) is the boot's serial, which vrnetlab makes anew each boot.
# `routing.rip.networks`: `<rip-network>` stands for the classful network R6's intent held,
# copied from r2's RIP stanza (the walk's section 4); copy r2's again at re-use.
# `call_home` is left out here (the image's own default, with Cisco's contact address, which
# the publication check refuses): KEEP the new seed's `call_home` as it is.
acls: []
control_plane:
  settings: []
diagnostic:
- bootup level minimal
domain_name: rcn.lab
enable_secret_keyword: ''
enable_secret_ref: ''
fhrp_version_vrrp: ''
flags:
  aaa new-model: false
  cdp run: true
  ipv6 unicast-routing: true
  lldp run: true
  netconf-yang: true
forward_protocol:
- nd
hostname: r6
http:
  authentication local: true
  client source_interface GigabitEthernet2: true
  secure_server: true
  server: true
interfaces:
- channel_group: ''
  description: mgmt identity
  dhcpv6_relay: []
  encapsulation: ''
  helper_addresses: []
  ip_nat: []
  ipv4: 10.255.1.16 255.255.255.255
  ipv6:
  - 2001:DB8:1::16/128
  ipv6_enable: false
  ipv6_nd: []
  mop: []
  mtu: ''
  name: Loopback0
  negotiation: ''
  no_ip_address: false
  no_shutdown: false
  no_switchport: false
  ospf: []
  ospf_interface: {}
  ospfv3:
  - 1 area 10
  ospfv3_interface: {}
  ripng: []
  ripng_interface: []
  shutdown: false
  switchport: []
  switchport_access_vlan: ''
  switchport_mode: ''
  switchport_trunk_encapsulation: ''
  switchport_trunk_vlans: []
  unmodeled: []
  vrf: ''
  vrrp: []
  vrrp_groups: []
- channel_group: ''
  description: ''
  dhcpv6_relay: []
  encapsulation: ''
  helper_addresses: []
  ip_nat: []
  ipv4: ''
  ipv6: []
  ipv6_enable: false
  ipv6_nd: []
  mop: []
  mtu: ''
  name: GigabitEthernet1
  negotiation: auto
  no_ip_address: true
  no_shutdown: false
  no_switchport: false
  ospf: []
  ospf_interface: {}
  ospfv3: []
  ospfv3_interface: {}
  ripng: []
  ripng_interface: []
  shutdown: false
  switchport: []
  switchport_access_vlan: ''
  switchport_mode: ''
  switchport_trunk_encapsulation: ''
  switchport_trunk_vlans: []
  unmodeled: []
  vrf: ''
  vrrp: []
  vrrp_groups: []
- channel_group: ''
  description: to R4 Gi5 - OSPF area 10 uplink (management)
  dhcpv6_relay: []
  encapsulation: ''
  helper_addresses: []
  ip_nat: []
  ipv4: dhcp
  ipv6:
  - 2001:DB8:2:46::2/64
  ipv6_enable: false
  ipv6_nd: []
  mop: []
  mtu: ''
  name: GigabitEthernet2
  negotiation: auto
  no_ip_address: false
  no_shutdown: false
  no_switchport: false
  ospf: []
  ospf_interface: {}
  ospfv3:
  - 1 area 10
  ospfv3_interface: {}
  ripng: []
  ripng_interface: []
  shutdown: false
  switchport: []
  switchport_access_vlan: ''
  switchport_mode: ''
  switchport_trunk_encapsulation: ''
  switchport_trunk_vlans: []
  unmodeled:
  - ip dhcp client client-id ascii <serial>
  vrf: ''
  vrrp: []
  vrrp_groups: []
- channel_group: ''
  description: to R7 Gi2 - RIPv2 and RIPng, R7 ZTP relay, 10.255.4.4/30
  dhcpv6_relay: []
  encapsulation: ''
  helper_addresses:
  - 10.255.0.10
  ip_nat: []
  ipv4: 10.255.4.5 255.255.255.252
  ipv6:
  - 2001:DB8:2:67::1/64
  ipv6_enable: false
  ipv6_nd: []
  mop: []
  mtu: ''
  name: GigabitEthernet3
  negotiation: auto
  no_ip_address: false
  no_shutdown: true
  no_switchport: false
  ospf: []
  ospf_interface: {}
  ospfv3: []
  ospfv3_interface: {}
  ripng:
  - RCN enable
  - RCN default-information originate
  ripng_interface: []
  shutdown: false
  switchport: []
  switchport_access_vlan: ''
  switchport_mode: ''
  switchport_trunk_encapsulation: ''
  switchport_trunk_vlans: []
  unmodeled: []
  vrf: ''
  vrrp: []
  vrrp_groups: []
ip_nat: []
ip_sla: []
ip_sla_schedules: []
license_settings: []
lines:
- settings:
  - exec-timeout 0 0
  - stopbits 1
  spec: con 0
- settings: []
  spec: aux 0
- settings:
  - logging synchronous
  - login local
  - transport input ssh
  spec: vty 0 4
logging:
  hosts: []
  settings: []
  syslog:
    heartbeat: 300
    hosts:
    - 10.255.1.10
    origin_id: hostname
    source_interface: Loopback0
    trap: notifications
login:
- on-success log
memory:
- free low-watermark processor 68484
mgcp: []
multilink:
- bundle-name authenticated
netconf_settings: []
ntp_servers:
- 10.255.1.10
pki_trustpoints:
- name: SLA-TrustPoint
  settings:
  - enrollment pkcs12
  - revocation-check crl
platform: cisco_iosxe
platform_settings:
- platform qfp utilization monitor load 80
- platform punt-keepalive disable-kernel-core
- platform console serial
prefix_lists: []
redundancy:
  settings: []
routing:
  bgp: null
  ospf:
  - neighbors: []
    networks:
    - network 10.255.1.16 0.0.0.0 area 10
    - network 10.255.4.0 0.0.0.3 area 10
    process: '1'
    settings:
    - router-id 10.255.1.16
    - redistribute rip
    - passive-interface Loopback0
  ospfv3:
  - process: '1'
    raw:
    - router-id 10.255.1.16
    - redistribute rip RCN include-connected
  rip:
    networks:
    - network <rip-network>
    settings:
    - version 2
    - passive-interface default
    - no passive-interface GigabitEthernet3
    - default-information originate
    - no auto-summary
  ripng:
  - name: RCN
secret_refs:
- snmp_community_ro
- user_admin_secret
services:
- service timestamps debug datetime msec
- service timestamps log datetime msec
- service call-home
snmp:
  communities:
  - access: RO
    ref: snmp_community_ro
  hosts:
  - address: 10.255.1.10
    options: version 2c __secret__:snmp_community_ro
  settings:
  - trap-source Loopback0
  - enable traps snmp linkdown linkup
  - snmp ifmib ifindex persist
source_interfaces:
  ssh: Loopback0
  tftp: Loopback0
spanning_tree: {}
ssh:
- version 2
static_routes:
- family: ipv4
  spec: 0.0.0.0 0.0.0.0 10.255.4.1
subscriber:
- templating
telemetry:
- settings:
  - encoding encode-kvgpb
  - filter xpath /process-cpu-ios-xe-oper:cpu-usage/cpu-utilization
  - stream yang-push
  - update-policy periodic 1000
  - receiver ip address 10.255.1.10 57000 protocol grpc-tcp
  subscription: '101'
- settings:
  - encoding encode-kvgpb
  - filter xpath /interfaces-ios-xe-oper:interfaces/interface/statistics
  - stream yang-push
  - update-policy periodic 1000
  - receiver ip address 10.255.1.10 57000 protocol grpc-tcp
  subscription: '102'
tracks: []
unmodeled: []
users:
- name: admin
  privilege: 15
  secret_kind: secret
  secret_ref: user_admin_secret
vlans: []
vrfs: []
vtp: []
vtp_mode: ''
unmodeled_ack:
  lines:
  - ip dhcp client client-id ascii <serial>
