# Nightly mutation testing of the CHANGED automation code (docs/TESTING.md, "Mutation testing";
# the operator, 2026-10-14). Coverage says a test ran a line; this says whether a test would
# notice the line being wrong. Each night: the automation functions changed since the commit the
# last night covered, and those the record keeps (unfinished, or holding an open survivor),
# mutated by mutmut, each mutant run against the test files that import its module; a canary
# first. Never on a push or a pull request, never on the NMAS host, never in the gate.
#
# A night fails when an open VERDICT survivor remains (a mutant no test killed whose change can
# decide a result, not in tests/mutation_equivalent.py, the hand-kept list; MESSAGE survivors,
# words only, are listed and never fail it; a logging call's arguments are never mutated),
# or when the measurement or the run broke
# (the canary survived, a mutant outside the plan ran, mutmut failed): GitHub's own
# failed-workflow email is the notice; no issue is opened. The record is kept after every night
# whose results stand, so a large function is finished across nights and an open survivor is
# run again each night until a test kills it or a person lists it as equivalent (C769).
name: mutation-nightly

on:
  schedule:
    # 08:17 UTC = 02:17 America/Denver while daylight time holds (UTC−6), 01:17 in winter (UTC−7).
    - cron: "17 8 * * *"
  # By hand, from the Actions tab (the demo, or after a change worth checking at once).
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Functions to mutate whole tonight besides the night's own, space-separated,
          each path::qualname (e.g. modules/nsot/config_check.py::_check_device); empty for none
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

env:
  # THE setting: how long a night may mutate. What does not fit is named in the summary and
  # carried to the next night, first in line.
  MUTATION_BUDGET_MINUTES: "120"

jobs:
  mutate:
    runs-on: ubuntu-24.04
    # The budget, plus about 20 minutes for the install, mutmut's own setup run and the report.
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the night diffs from the last covered commit
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # the host's interpreter, as CI
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.txt
            requirements-test.txt
            requirements-mutation.txt

      - name: Install the host's versions, CI's tools and mutmut, exactly
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-test.txt
          python -m pip install --no-deps -r requirements-mutation.txt

      # The setup ci.yml's tests stand on, step for step (its comments say why each is there):
      # a test that skips here for want of one kills no mutant, and the night would read a
      # missing setup as a weak test. tests/test_ci_workflow.py holds every setup step of
      # ci.yml's test job, its `run` word for word, to have a twin here, and the tests' own
      # environment (NMAS_REQUIRE_PG) to be the mutate step's (the operator, 2026-10-14: the
      # first GitHub night had none of PostgreSQL, promtool or NMAS_REQUIRE_PG).
      - name: The runner's environment (information, not a gate)
        run: python scripts/nmas-env-facts --annotate || true

      - name: Where PyPI's metadata disagrees with the host (information, not a gate)
        run: python -m pip check || true

      - name: promtool for the PromQL tests (unpacked, not installed)
        run: |
          d=$(mktemp -d) && cd "$d"
          sudo apt-get update -qq
          apt-get download promtool 2>/dev/null || apt-get download prometheus
          mkdir -p "$HOME/.local/share/nmas-promtool"   # dpkg -x makes only the last folder
          dpkg -x ./*.deb "$HOME/.local/share/nmas-promtool"
          "$HOME/.local/share/nmas-promtool/usr/bin/promtool" --version

      - name: PostgreSQL 18 for the records tests, from PGDG (libpq5 installed; the server unpacked)
        run: |
          sudo apt-get install -y -qq --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq --no-install-recommends libpq5
          deps=$(apt-cache depends postgresql-18 | sed -n 's/^ *Depends: \(lib[^ <>]*\)$/\1/p' | sort -u)
          sudo apt-get install -y -qq --no-install-recommends $deps
          d=$(mktemp -d) && cd "$d" && apt-get download postgresql-18
          mkdir -p "$HOME/.local/share/nmas-pg"
          dpkg -x ./*.deb "$HOME/.local/share/nmas-pg"
          bin=$(ls -d "$HOME"/.local/share/nmas-pg/usr/lib/postgresql/18/bin)
          if ldd "$bin/postgres" "$bin/initdb" | grep "not found"; then
            echo "::error::the unpacked PostgreSQL lacks a library (above)"; exit 1
          fi
          "$bin/postgres" --version | tee /dev/stderr | grep -q " 18\." \
            || { echo "::error::the unpacked server is not PostgreSQL 18"; exit 1; }
          python -c "import psycopg; print('psycopg', psycopg.__version__, 'libpq', psycopg.pq.version())"

      - name: Allow a network namespace for the tests (this VM only)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: The last night's record (the commit it covered, and what it left over)
        uses: actions/cache/restore@v4
        with:
          path: .mutation-state
          key: mutation-state-${{ github.run_id }}
          restore-keys: mutation-state-

      # The dispatch's `functions` reach the script through the environment, never pasted into
      # it: each word becomes one --also argument, and the plan refuses a name it cannot find.
      - name: Plan the night
        id: plan
        env:
          ALSO_FUNCTIONS: ${{ inputs.functions }}
        run: |
          mkdir -p .mutation-state
          set -f
          set --
          for f in $ALSO_FUNCTIONS; do set -- "$@" --also "$f"; done
          python scripts/nmas-mutation plan --state .mutation-state/state.json \
            --head "$GITHUB_SHA" --out mutation-out --summary mutation-out/summary.md "$@"
          # The summary in the job's log too (readable through the API, which returns no job
          # summary), and on the run's page.
          if [ -f mutation-out/summary.md ]; then
            cat mutation-out/summary.md
            cat mutation-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s mutation-out/patterns.txt ] && grep -q . mutation-out/patterns.txt; then
            echo "work=yes" >> "$GITHUB_OUTPUT"
          else
            echo "work=no" >> "$GITHUB_OUTPUT"
          fi

      # Confined as scripts/nmas-test confines the suite: a namespace with only loopback, brought
      # up (a new namespace's loopback starts DOWN, and a test's own 127.0.0.1 listener then
      # reads "Network is unreachable": measured 2026-10-14). ONE mutant at a time
      # (--max-children 1): mutmut forks its children from a process that has already imported
      # the tests' conftest, so parallel children share one test store and fail each other's
      # tests, which mutmut counts as kills (measured 2026-10-14: in parallel a log.debug mutant
      # was "killed" and 13 real survivors were hidden; serially, two runs agreed mutant for
      # mutant). `nmas-mutation run` runs mutmut three times: the canary in process, then (the
      # tests that start a child added to every planned function's tests) the canary in a child,
      # then the night. Bytecode is WRITTEN here (no PYTHONDONTWRITEBYTECODE): mutmut's copy of a
      # module holds every mutant of it (config_check.py: 2168, 7.5 MB, 7.7 s to compile), and a
      # test's child process compiled it afresh each time, so one surviving mutant's tests took
      # 107 s instead of 7 (measured 2026-10-14). The copy is scratch; no stale bytecode can
      # reach the checkout.
      # Its exit goes to the report: 0 finished, 124 the budget ran out, anything else a failed
      # setup or clean run, which fails the night (no verdict stands on it).
      - name: Mutate, within the budget, confined to loopback
        id: mutate
        if: steps.plan.outputs.work == 'yes'
        env:
          NMAS_REQUIRE_PG: "1"
        run: |
          set +e
          timeout "${MUTATION_BUDGET_MINUTES}m" unshare -rn sh -c '
            ip link set lo up || { echo "could not bring loopback up" >&2; exit 2; }
            exec unshare --map-user='"$(id -u)"' --map-group='"$(id -g)"' \
              env NMAS_REQUIRE_NETWORK_CONFINEMENT=1 \
              python scripts/nmas-mutation run --out mutation-out'
          code=$?
          echo "nmas-mutation run exit $code"
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      # Its summary in the job's log and on the run's page; the step's result is the report's.
      - name: The report
        if: steps.plan.outputs.work == 'yes'
        env:
          MUTMUT_EXIT: ${{ steps.mutate.outputs.exit }}
        run: |
          set +e
          python scripts/nmas-mutation report --plan mutation-out/plan.json \
            --summary mutation-out/summary.md --state-out .mutation-state/state.json \
            --budget "$MUTATION_BUDGET_MINUTES" --mutmut-exit "$MUTMUT_EXIT"
          code=$?
          cat mutation-out/summary.md
          cat mutation-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Kept after every night whose results stand, open survivors and all: the report writes the
      # record only then (a broken measurement or run leaves the restored one as it was).
      - name: Keep the record for the next night
        if: always() && hashFiles('.mutation-state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .mutation-state
          key: mutation-state-${{ github.run_id }}

      - name: Keep the full report
        if: always() && steps.plan.outputs.work == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-out/
            setup.cfg
          retention-days: 30
