<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Updating the app. The preview is the stored comparison with the pushed tip: the commits between, CI&#x27;s verdict and the host steps. You confirm; the app writes a request file and nothing else. A root-owned updater, started by a systemd path unit, validates it, re-checks CI itself, moves the checkout as the service user, restarts the app and waits for the new commit to answer; if it does not within 120 seconds it rolls back. No device is involved."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE APP</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE HOST, AS ROOT</text><rect class="dg-band" x="0" y="20" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW AND CONFIRM</text><path class="dg-box" d="M14,44 H190 L200,54 V84 H14 Z"/><path class="dg-box" d="M190,44 V54 H200"/><text class="dg-tb" x="107.0" y="62.0" text-anchor="middle">Stored comparison</text><text class="dg-sm" x="107.0" y="76.0" text-anchor="middle">commits, CI, host steps</text><rect class="dg-person" x="14" y="96" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="108.0" r="4"/><path class="dg-person" d="M23,119.0 Q30,110.0 37,119.0"/><text class="dg-tx" x="46" y="115.0" text-anchor="start">You confirm its hash</text><rect class="dg-band" x="0" y="146" width="400" height="72" rx="6"/><text class="dg-hd" x="30" y="162" text-anchor="start">THE REQUEST</text><rect class="dg-store" x="14" y="166" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="166" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="182.0" text-anchor="middle">Request file</text><text class="dg-sm" x="109.0" y="196.0" text-anchor="middle">the app writes only this</text><circle class="dg-num" cx="14" cy="166" r="9"/><text class="dg-numt" x="14" y="169.6" text-anchor="middle">1</text><rect class="dg-svc" x="240" y="166" width="140" height="36" rx="18.0"/><text class="dg-tb" x="310.0" y="182.0" text-anchor="middle">Path unit</text><text class="dg-sm" x="310.0" y="196.0" text-anchor="middle">starts the updater</text><circle class="dg-num" cx="240" cy="166" r="9"/><text class="dg-numt" x="240" y="169.6" text-anchor="middle">2</text><path class="dg-rec" d="M202,184 L232.0,184.0"/><polygon class="dg-rech" points="238.0,184.0 230.0,179.5 230.0,188.5"/><rect class="dg-band" x="0" y="224" width="400" height="250" rx="6"/><text class="dg-hd" x="30" y="240" text-anchor="start">THE UPDATER</text><circle class="dg-num" cx="232" cy="246" r="9"/><text class="dg-numt" x="232" y="249.6" text-anchor="middle">3</text><text class="dg-tb" x="246" y="250" text-anchor="start">Checkout clean, fetch</text><text class="dg-sm" x="246" y="262" text-anchor="start">as the service user</text><circle class="dg-num" cx="232" cy="286" r="9"/><text class="dg-numt" x="232" y="289.6" text-anchor="middle">4</text><text class="dg-tb" x="246" y="290" text-anchor="start">CI, again</text><text class="dg-sm" x="246" y="302" text-anchor="start">its own copy of the gate</text><circle class="dg-num" cx="232" cy="326" r="9"/><text class="dg-numt" x="232" y="329.6" text-anchor="middle">5</text><text class="dg-tb" x="246" y="330" text-anchor="start">Move and restart</text><text class="dg-sm" x="246" y="342" text-anchor="start">systemctl, as root</text><circle class="dg-num" cx="232" cy="366" r="9"/><text class="dg-numt" x="232" y="369.6" text-anchor="middle">6</text><text class="dg-tb" x="246" y="370" text-anchor="start">Wait: the new commit</text><text class="dg-sm" x="246" y="382" text-anchor="start">/health, 120 s</text><circle class="dg-num" cx="232" cy="406" r="9"/><text class="dg-numt" x="232" y="409.6" text-anchor="middle">7</text><text class="dg-tb" x="246" y="410" text-anchor="start">Running, or rolled back</text><text class="dg-sm" x="246" y="422" text-anchor="start">recorded</text><text class="dg-sm" x="14" y="290" text-anchor="start">The page waits on /health,</text><text class="dg-sm" x="14" y="303" text-anchor="start">never on a timer.</text><rect class="dg-band" x="0" y="480" width="400" height="54" rx="6"/><text class="dg-hd" x="30" y="496" text-anchor="start">NEVER</text><text class="dg-sm" x="14" y="508" text-anchor="start">No device is contacted by an update.</text></svg>
