<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Self-healing, one incident: a trigger (a log line, an alert, an adjacency, a drift record) opens an incident on a device; the detect pass reads the device, the same read as Check drift now, until the grace period settles it; the decision finds the approved state, the golden that matched intent, checks the guards in order and compares the device with it, classing each unit and its tier: in dry run it records what it would have done for a person to mark right or wrong; in Auto a Tier 1 fix is applied as the policy, holding the device, through the deploy&#x27;s nine stages, verified and rolled back on failure; a Tier 2 fix waits for a person; anything else is can&#x27;t fix. Every step is recorded in the step log and History, a healed device&#x27;s golden committed and read again, and the network&#x27;s team is told."><line class="dg-lane" x1="212" y1="20" x2="212" y2="594"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">A trigger</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">a log line, an alert, a drift</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><circle class="dg-clock" cx="186" cy="104" r="8"/><path class="dg-clock" d="M186,99 V104 L190,106"/><text class="dg-sm" x="14" y="108" text-anchor="start">the grace period: read, then read again</text><rect class="dg-band" x="0" y="122" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="138" text-anchor="start">DETECT · THE DEVICE READ, NOTHING SENT</text><rect class="dg-dev" x="262" y="150" width="118" height="330" rx="5"/><rect class="dg-dev" x="274" y="479" width="8" height="5"/><rect class="dg-dev" x="288" y="479" width="8" height="5"/><rect class="dg-dev" x="302" y="479" width="8" height="5"/><text class="dg-tb" x="321.0" y="168" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="182" text-anchor="middle">what it runs</text><circle class="dg-num" cx="22" cy="162" r="9"/><text class="dg-numt" x="22" y="165.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="166" text-anchor="start">Read again until settled</text><text class="dg-sm" x="36" y="178" text-anchor="start">Check drift now&#x27;s read</text><path class="dg-read" d="M260,162 L208.0,162.0"/><polygon class="dg-readh" points="202.0,162.0 210.0,166.5 210.0,157.5"/><rect class="dg-band" x="0" y="250" width="400" height="112" rx="6"/><text class="dg-hd" x="30" y="266" text-anchor="start">DECIDE · THE GUARDS IN ORDER</text><path class="dg-golden" d="M14,278 H190 L200,288 V314 H14 Z"/><path class="dg-golden" d="M190,278 V288 H200"/><text class="dg-tb" x="107.0" y="294.0" text-anchor="middle">The approved state</text><text class="dg-sm" x="107.0" y="308.0" text-anchor="middle">the golden that matched intent</text><circle class="dg-num" cx="14" cy="278" r="9"/><text class="dg-numt" x="14" y="281.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="336" text-anchor="start">each unit classed, its tier; the program</text><text class="dg-sm" x="14" y="349" text-anchor="start">and its hash; a guard that applies stops it</text><rect class="dg-band" x="0" y="370" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="386" text-anchor="start">ACT · AUTO, TIER 1, AS THE POLICY</text><circle class="dg-num" cx="22" cy="396" r="9"/><text class="dg-numt" x="22" y="399.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="400" text-anchor="start">Applied, the device held</text><text class="dg-sm" x="36" y="412" text-anchor="start">the deploy&#x27;s nine stages</text><path class="dg-send" d="M202,396 L254.0,396.0"/><polygon class="dg-sendh" points="260.0,396.0 252.0,391.5 252.0,400.5"/><circle class="dg-num" cx="22" cy="442" r="9"/><text class="dg-numt" x="22" y="445.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="446" text-anchor="start">Verified, symptom read again</text><text class="dg-sm" x="36" y="458" text-anchor="start">rolled back on failure</text><path class="dg-read" d="M260,442 L208.0,442.0"/><polygon class="dg-readh" points="202.0,442.0 210.0,446.5 210.0,437.5"/><text class="dg-sm" x="14" y="476" text-anchor="start">dry run: nothing sent; Tier 2: a person</text><rect class="dg-store" x="14" y="502" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="502" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="520.0" text-anchor="middle">The step log</text><text class="dg-sm" x="109.0" y="534.0" text-anchor="middle">each step, History</text><circle class="dg-num" cx="14" cy="502" r="9"/><text class="dg-numt" x="14" y="505.6" text-anchor="middle">6</text><path class="dg-golden" d="M262,502 H370 L380,512 V542 H262 Z"/><path class="dg-golden" d="M370,502 V512 H380"/><text class="dg-tb" x="321.0" y="520.0" text-anchor="middle">Its golden</text><text class="dg-sm" x="321.0" y="534.0" text-anchor="middle">committed, re-read</text><path class="dg-rec" d="M202,522 L254.0,522.0"/><polygon class="dg-rech" points="260.0,522.0 252.0,517.5 252.0,526.5"/><text class="dg-sm" x="14" y="566" text-anchor="start">Then the network&#x27;s team is told.</text><text class="dg-sm" x="14" y="580" text-anchor="start">Marked right or wrong in dry run.</text></svg>
