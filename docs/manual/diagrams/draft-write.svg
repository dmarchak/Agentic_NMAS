<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Adding an app as a Draft: you choose the app&#x27;s folder; the preview checks every file and reads the branch&#x27;s commit from the code repository now, into a throwaway repository removed again, and shows the exact commit and its hash; you confirm, bound to that hash; the program is made again and refused if the base commit or the files moved; the commit is built in a throwaway repository and pushed fast-forward only; the write is recorded, then the repository is fetched so the new folder registers as a Draft. Nothing already in the repository is changed, and no device or controller is contacted."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CODE REPOSITORY</text><rect class="dg-person" x="14" y="44" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="56.0" r="4"/><path class="dg-person" d="M23,67.0 Q30,58.0 37,67.0"/><text class="dg-tx" x="46" y="63.0" text-anchor="start">You choose the app&#x27;s folder</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><path class="dg-box" d="M14,84 H190 L200,94 V120 H14 Z"/><path class="dg-box" d="M190,84 V94 H200"/><text class="dg-tb" x="107.0" y="100.0" text-anchor="middle">The preview</text><text class="dg-sm" x="107.0" y="114.0" text-anchor="middle">the commit and its hash</text><circle class="dg-num" cx="14" cy="84" r="9"/><text class="dg-numt" x="14" y="87.6" text-anchor="middle">2</text><path class="dg-repo" d="M232,90 V122 A78.0,6 0 0 0 388,122 V90"/><ellipse class="dg-repo" cx="310.0" cy="90" rx="78.0" ry="6"/><text class="dg-tb" x="310.0" y="111.0" text-anchor="middle">Its branch</text><text class="dg-sm" x="310.0" y="125.0" text-anchor="middle">read now, fast-forward only</text><path class="dg-read" d="M230,102 L210.0,102.0"/><polygon class="dg-readh" points="204.0,102.0 212.0,106.5 212.0,97.5"/><rect class="dg-person" x="14" y="132" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="144.0" r="4"/><path class="dg-person" d="M23,155.0 Q30,146.0 37,155.0"/><text class="dg-tx" x="46" y="151.0" text-anchor="start">You confirm, bound to its hash</text><circle class="dg-num" cx="14" cy="132" r="9"/><text class="dg-numt" x="14" y="135.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="198" width="400" height="166" rx="6"/><text class="dg-hd" x="30" y="214" text-anchor="start">THE CONFIRM</text><path class="dg-box" d="M14,178 H190 L200,188 V212 H14 Z"/><path class="dg-box" d="M190,178 V188 H200"/><text class="dg-tb" x="107.0" y="193.0" text-anchor="middle">Made again</text><text class="dg-sm" x="107.0" y="207.0" text-anchor="middle">a moved base or files: refused</text><circle class="dg-num" cx="14" cy="178" r="9"/><text class="dg-numt" x="14" y="181.6" text-anchor="middle">4</text><path class="dg-repo" d="M14,228 V256 A93.0,6 0 0 0 200,256 V228"/><ellipse class="dg-repo" cx="107.0" cy="228" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="247.0" text-anchor="middle">A throwaway repository</text><text class="dg-sm" x="107.0" y="261.0" text-anchor="middle">one commit; removed after</text><circle class="dg-num" cx="14" cy="222" r="9"/><text class="dg-numt" x="14" y="225.6" text-anchor="middle">5</text><path class="dg-rec" d="M202,242 L222.0,242.0"/><polygon class="dg-rech" points="228.0,242.0 220.0,237.5 220.0,246.5"/><path class="dg-repo" d="M232,228 V260 A78.0,6 0 0 0 388,260 V228"/><ellipse class="dg-repo" cx="310.0" cy="228" rx="78.0" ry="6"/><text class="dg-tb" x="310.0" y="249.0" text-anchor="middle">apps/&lt;name&gt;/</text><text class="dg-sm" x="310.0" y="263.0" text-anchor="middle">a new folder only</text><rect class="dg-store" x="14" y="276" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="276" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="292.0" text-anchor="middle">The code repository&#x27;s record</text><text class="dg-sm" x="109.0" y="306.0" text-anchor="middle">who, when, the commit</text><circle class="dg-num" cx="14" cy="276" r="9"/><text class="dg-numt" x="14" y="279.6" text-anchor="middle">6</text><path class="dg-box" d="M14,322 H190 L200,332 V356 H14 Z"/><path class="dg-box" d="M190,322 V332 H200"/><text class="dg-tb" x="107.0" y="337.0" text-anchor="middle">Fetched</text><text class="dg-sm" x="107.0" y="351.0" text-anchor="middle">registered as a Draft</text><circle class="dg-num" cx="14" cy="322" r="9"/><text class="dg-numt" x="14" y="325.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="380" text-anchor="start">Publish stays a review and a passing run.</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">no device</text><text class="dg-sm" x="310" y="459" text-anchor="middle">no controller</text></svg>
