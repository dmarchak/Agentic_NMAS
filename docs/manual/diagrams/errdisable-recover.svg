<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Recover an err-disabled interface, a built-in command plan run on the deploy pipeline&#x27;s engine: its parameters are validated against Mercury&#x27;s model (the port in committed intent, an access port, never the management path) and its lines held to Mercury&#x27;s rule for raw lines; you approve by the plan&#x27;s hash; holding the device, the running configuration is read, then each precondition through the read engine (the port err-disabled by the cause now, no errdisable recovery for the cause, the cause cleared), else nothing is sent; then interface, shutdown and no shutdown, never saved; verify reads the port every 3 seconds until connected, up to 30, and no new err-disable 10 seconds later, then the port&#x27;s configuration must equal the one before, line for line (the whole running configuration where the check cannot be scoped to the port); anything else is rolled back by the pipeline; the receipt and the run are recorded and the engineer told the offending MAC, the port, the time and the cause."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The plan</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">model, rule for raw lines</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">a shape not measured: refused</text><rect class="dg-person" x="14" y="104" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="116.0" r="4"/><path class="dg-person" d="M23,127.0 Q30,118.0 37,127.0"/><text class="dg-tx" x="46" y="123.0" text-anchor="start">You approve by its hash</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><rect class="dg-band" x="0" y="150" width="400" height="330" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE RUN · THE PIPELINE, THE DEVICE HELD</text><rect class="dg-dev" x="262" y="170" width="118" height="300" rx="5"/><rect class="dg-dev" x="274" y="469" width="8" height="5"/><rect class="dg-dev" x="288" y="469" width="8" height="5"/><rect class="dg-dev" x="302" y="469" width="8" height="5"/><text class="dg-tb" x="321.0" y="188" text-anchor="middle">The switch</text><text class="dg-sm" x="321.0" y="202" text-anchor="middle">never saved</text><circle class="dg-num" cx="22" cy="172" r="9"/><text class="dg-numt" x="22" y="175.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="176" text-anchor="start">Read before</text><text class="dg-sm" x="36" y="188" text-anchor="start">running configuration</text><path class="dg-read" d="M260,172 L208.0,172.0"/><polygon class="dg-readh" points="202.0,172.0 210.0,176.5 210.0,167.5"/><circle class="dg-num" cx="22" cy="208" r="9"/><text class="dg-numt" x="22" y="211.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="212" text-anchor="start">Preconditions</text><text class="dg-sm" x="36" y="224" text-anchor="start">err-disabled; cleared</text><path class="dg-read" d="M260,208 L208.0,208.0"/><polygon class="dg-readh" points="202.0,208.0 210.0,212.5 210.0,203.5"/><circle class="dg-num" cx="22" cy="244" r="9"/><text class="dg-numt" x="22" y="247.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="248" text-anchor="start">shutdown, no shutdown</text><text class="dg-sm" x="36" y="260" text-anchor="start">config mode, one port</text><path class="dg-send" d="M202,244 L254.0,244.0"/><polygon class="dg-sendh" points="260.0,244.0 252.0,239.5 252.0,248.5"/><circle class="dg-num" cx="22" cy="280" r="9"/><text class="dg-numt" x="22" y="283.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="284" text-anchor="start">Connected within 30 s</text><text class="dg-sm" x="36" y="296" text-anchor="start">read every 3 s</text><path class="dg-read" d="M260,280 L208.0,280.0"/><polygon class="dg-readh" points="202.0,280.0 210.0,284.5 210.0,275.5"/><circle class="dg-num" cx="22" cy="316" r="9"/><text class="dg-numt" x="22" y="319.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="320" text-anchor="start">Net zero</text><text class="dg-sm" x="36" y="332" text-anchor="start">the port&#x27;s lines, unchanged</text><circle class="dg-clock" cx="214" cy="316" r="8"/><path class="dg-clock" d="M214,311 V316 L218,318"/><circle class="dg-num" cx="22" cy="352" r="9"/><text class="dg-numt" x="22" y="355.6" text-anchor="middle">8</text><text class="dg-tb" x="36" y="356" text-anchor="start">Roll back if not</text><text class="dg-sm" x="36" y="368" text-anchor="start">the pipeline&#x27;s rollback</text><text class="dg-sm" x="36" y="396" text-anchor="start">Not cleared: the port stays down,</text><text class="dg-sm" x="36" y="409" text-anchor="start">said and notified; nothing sent.</text><rect class="dg-store" x="14" y="490" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="490" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="508.0" text-anchor="middle">The receipt and run</text><text class="dg-sm" x="109.0" y="522.0" text-anchor="middle">MAC, port, time, cause</text><circle class="dg-num" cx="14" cy="490" r="9"/><text class="dg-numt" x="14" y="493.6" text-anchor="middle">9</text><text class="dg-sm" x="14" y="546" text-anchor="start">History shows it; the engineer is told.</text></svg>
