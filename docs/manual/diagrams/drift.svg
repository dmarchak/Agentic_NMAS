<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="Three things the tool compares. Intent is what the device should run, committed by a person. The golden is what the device did run, recorded at its last capture. The device is what it runs now. The device differing from its golden is drift. The golden differing from intent is a departure from intent. Capture moves the golden to the device, saying the device is right; a restore or a deploy moves the device back, saying the record is right."><line class="dg-lane" x1="212" y1="20" x2="212" y2="424"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE RECORD</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE NETWORK</text><path class="dg-intent" d="M14,40 H190 L200,50 V86 H14 Z"/><path class="dg-intent" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="61.0" text-anchor="middle">Intent</text><text class="dg-sm" x="107.0" y="75.0" text-anchor="middle">what it should run</text><path class="dg-golden" d="M14,180 H190 L200,190 V226 H14 Z"/><path class="dg-golden" d="M190,180 V190 H200"/><text class="dg-tb" x="107.0" y="201.0" text-anchor="middle">Golden</text><text class="dg-sm" x="107.0" y="215.0" text-anchor="middle">what it ran, last capture</text><rect class="dg-dev" x="240" y="180" width="140" height="46" rx="5"/><rect class="dg-dev" x="252" y="225" width="8" height="5"/><rect class="dg-dev" x="266" y="225" width="8" height="5"/><rect class="dg-dev" x="280" y="225" width="8" height="5"/><text class="dg-tb" x="310.0" y="201.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="215.0" text-anchor="middle">what it runs now</text><text class="dg-sm" x="107" y="122" text-anchor="middle">differ: a departure from intent</text><line class="dg-lane" x1="107" y1="88" x2="107" y2="176"/><text class="dg-tb" x="310" y="160" text-anchor="middle">differ: drift</text><line class="dg-lane" x1="202" y1="203" x2="238" y2="203"/><rect class="dg-band" x="0" y="250" width="400" height="174" rx="6"/><text class="dg-hd" x="30" y="266" text-anchor="start">RESOLVING DRIFT: TWO ANSWERS, OPPOSITE CLAIMS</text><rect class="dg-dev" x="262" y="274" width="118" height="90" rx="5"/><rect class="dg-dev" x="274" y="363" width="8" height="5"/><rect class="dg-dev" x="288" y="363" width="8" height="5"/><rect class="dg-dev" x="302" y="363" width="8" height="5"/><text class="dg-tb" x="321.0" y="292" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="294" r="9"/><text class="dg-numt" x="22" y="297.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="298" text-anchor="start">Capture</text><text class="dg-sm" x="36" y="310" text-anchor="start">the device is right: a new golden</text><path class="dg-read" d="M260,294 L208.0,294.0"/><polygon class="dg-readh" points="202.0,294.0 210.0,298.5 210.0,289.5"/><circle class="dg-num" cx="22" cy="338" r="9"/><text class="dg-numt" x="22" y="341.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="342" text-anchor="start">Restore</text><text class="dg-sm" x="36" y="354" text-anchor="start">the record is right: sent, verified</text><path class="dg-send" d="M202,338 L254.0,338.0"/><polygon class="dg-sendh" points="260.0,338.0 252.0,333.5 252.0,342.5"/><text class="dg-sm" x="14" y="392" text-anchor="start">A regenerated self-signed certificate is not drift;</text><text class="dg-sm" x="14" y="405" text-anchor="start">a CA-signed trustpoint that changes is.</text></svg>
