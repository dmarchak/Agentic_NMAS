<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="Seeding a device&#x27;s first full intent. The committed golden is parsed into intent, shown beside the intent committed now, and offered only when that is absent or only onboarding&#x27;s bootstrap. You confirm a hash of the document and the golden; at apply the golden is parsed again, its secrets stored, and exactly that device&#x27;s intent file is committed as you. Nothing is sent."><line class="dg-lane" x1="212" y1="20" x2="212" y2="324"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-golden" d="M14,40 H190 L200,50 V80 H14 Z"/><path class="dg-golden" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="58.0" text-anchor="middle">Golden</text><text class="dg-sm" x="107.0" y="72.0" text-anchor="middle">committed</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,82 L107.0,96.0"/><polygon class="dg-rech" points="107.0,102.0 111.5,94.0 102.5,94.0"/><path class="dg-intent" d="M14,104 H190 L200,114 V144 H14 Z"/><path class="dg-intent" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="122.0" text-anchor="middle">Intent, parsed</text><text class="dg-sm" x="107.0" y="136.0" text-anchor="middle">beside intent now</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="160" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="172.0" r="4"/><path class="dg-person" d="M23,183.0 Q30,174.0 37,183.0"/><text class="dg-tx" x="46" y="179.0" text-anchor="start">You confirm its hash</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">4</text><path class="dg-rec" d="M107,192 L107.0,206.0"/><polygon class="dg-rech" points="107.0,212.0 111.5,204.0 102.5,204.0"/><path class="dg-repo" d="M14,220 V254 A93.0,6 0 0 0 200,254 V220"/><ellipse class="dg-repo" cx="107.0" cy="220" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="242.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="256.0" text-anchor="middle">host_vars/&lt;device&gt;, as you</text><rect class="dg-store" x="14" y="272" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="272" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="287.0" text-anchor="middle">Secrets stored</text><text class="dg-sm" x="109.0" y="301.0" text-anchor="middle">the credential store</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="160" r="11"/><line class="dg-nol" x1="302.5" y1="167.5" x2="317.5" y2="152.5"/><text class="dg-sm" x="310" y="186" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="199" text-anchor="middle">intent only</text></svg>
