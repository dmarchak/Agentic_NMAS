<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Changing a subnet. The preview reads Mercury&#x27;s subnet file and asks Kea for its configuration and leases, and checks the pool lies inside the subnet and overlaps no other subnet&#x27;s pool, the gateway against intent&#x27;s first-hop address, and which leases held now the change affects. You confirm with a reason. The apply plans again and writes nothing if anything moved, tests the candidate file with Kea&#x27;s own check, writes it, reloads Kea through its API, and reads Kea&#x27;s configuration back: exactly this subnet changed, or the previous file is put back. Then the change is committed with your reason."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">KEA</text><path class="dg-box" d="M14,40 H190 L200,50 V80 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="58.0" text-anchor="middle">The preview asks Kea</text><text class="dg-sm" x="107.0" y="72.0" text-anchor="middle">leases affected, the checks</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="96" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="108.0" r="4"/><path class="dg-person" d="M23,119.0 Q30,110.0 37,119.0"/><text class="dg-tx" x="46" y="115.0" text-anchor="start">You confirm, with a reason</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><path class="dg-rec" d="M107,128 L107.0,142.0"/><polygon class="dg-rech" points="107.0,148.0 111.5,140.0 102.5,140.0"/><rect class="dg-band" x="0" y="150" width="400" height="300" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE APPLY · THE SUBNET FILE HELD</text><rect class="dg-store" x="262" y="172" width="118" height="150" rx="3"/><rect class="dg-bar" x="262" y="172" width="4" height="150" rx="1"/><text class="dg-tb" x="323.0" y="245.0" text-anchor="middle">Kea</text><text class="dg-sm" x="323.0" y="259.0" text-anchor="middle">Mercury&#x27;s subnet file</text><circle class="dg-num" cx="22" cy="170" r="9"/><text class="dg-numt" x="22" y="173.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="174" text-anchor="start">Plan again</text><text class="dg-sm" x="36" y="186" text-anchor="start">moved: nothing written</text><path class="dg-read" d="M260,170 L208.0,170.0"/><polygon class="dg-readh" points="202.0,170.0 210.0,174.5 210.0,165.5"/><circle class="dg-num" cx="22" cy="206" r="9"/><text class="dg-numt" x="22" y="209.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="210" text-anchor="start">Kea&#x27;s own check</text><text class="dg-sm" x="36" y="222" text-anchor="start">on a candidate copy</text><circle class="dg-num" cx="22" cy="242" r="9"/><text class="dg-numt" x="22" y="245.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="246" text-anchor="start">Write, reload</text><text class="dg-sm" x="36" y="258" text-anchor="start">a failure: file put back</text><path class="dg-send" d="M202,242 L254.0,242.0"/><polygon class="dg-sendh" points="260.0,242.0 252.0,237.5 252.0,246.5"/><circle class="dg-num" cx="22" cy="278" r="9"/><text class="dg-numt" x="22" y="281.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="282" text-anchor="start">Read back</text><text class="dg-sm" x="36" y="294" text-anchor="start">only this subnet moved</text><path class="dg-read" d="M260,278 L208.0,278.0"/><polygon class="dg-readh" points="202.0,278.0 210.0,282.5 210.0,273.5"/><path class="dg-repo" d="M14,336 V364 A93.0,6 0 0 0 200,364 V336"/><ellipse class="dg-repo" cx="107.0" cy="336" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="355.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="369.0" text-anchor="middle">dhcp/subnets.yml, your reason</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="400" text-anchor="start">A client left outside the pool keeps</text><text class="dg-sm" x="14" y="413" text-anchor="start">its address until its lease ends.</text></svg>
