<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="A flow-table trace: NetBox&#x27;s names are read once from the network&#x27;s committed NSOT export, for the hosts From offers and for an end given by name; the SDN reader&#x27;s stored read is read once; each end is found among the hosts the controller lists, by address, by MAC or by its NetBox interface&#x27;s MAC, or refused with nothing asked, and a destination that is only an address is followed too; the packet is built, ICMP echo or TCP or UDP to a port, in the addresses&#x27; family; it is walked through each switch&#x27;s flow tables by OpenFlow 1.3.5&#x27;s rules, switch to switch along the links the controller reports; each branch ends in one named outcome, and Topology draws the switches with their DPIDs and ports. Nothing is asked of the controller or any switch."><line class="dg-lane" x1="212" y1="20" x2="212" y2="494"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE STORED READ</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">NetBox&#x27;s names</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">the committed NSOT export</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">the hosts to choose from</text><rect class="dg-store" x="262" y="110" width="118" height="60" rx="3"/><rect class="dg-bar" x="262" y="110" width="4" height="60" rx="1"/><text class="dg-tb" x="323.0" y="138.0" text-anchor="middle">The SDN reader</text><text class="dg-sm" x="323.0" y="152.0" text-anchor="middle">tables, links, hosts</text><circle class="dg-num" cx="22" cy="126" r="9"/><text class="dg-numt" x="22" y="129.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="130" text-anchor="start">Read once</text><text class="dg-sm" x="36" y="142" text-anchor="start">the stored value</text><path class="dg-read" d="M260,126 L208.0,126.0"/><polygon class="dg-readh" points="202.0,126.0 210.0,130.5 210.0,121.5"/><path class="dg-box" d="M14,170 H190 L200,180 V206 H14 Z"/><path class="dg-box" d="M190,170 V180 H200"/><text class="dg-tb" x="107.0" y="186.0" text-anchor="middle">Each end found</text><text class="dg-sm" x="107.0" y="200.0" text-anchor="middle">the controller&#x27;s hosts</text><circle class="dg-num" cx="14" cy="170" r="9"/><text class="dg-numt" x="14" y="173.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="222" text-anchor="start">or an address only, followed</text><path class="dg-box" d="M14,240 H190 L200,250 V276 H14 Z"/><path class="dg-box" d="M190,240 V250 H200"/><text class="dg-tb" x="107.0" y="256.0" text-anchor="middle">The packet built</text><text class="dg-sm" x="107.0" y="270.0" text-anchor="middle">ICMP, TCP or UDP</text><circle class="dg-num" cx="14" cy="240" r="9"/><text class="dg-numt" x="14" y="243.6" text-anchor="middle">4</text><rect class="dg-band" x="0" y="292" width="400" height="92" rx="6"/><text class="dg-hd" x="30" y="308" text-anchor="start">THE WALK · OPENFLOW 1.3.5</text><circle class="dg-num" cx="22" cy="326" r="9"/><text class="dg-numt" x="22" y="329.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="330" text-anchor="start">Switch by switch</text><text class="dg-sm" x="36" y="342" text-anchor="start">each table&#x27;s flows, in order</text><text class="dg-tb" x="36" y="360" text-anchor="start">along the links</text><text class="dg-sm" x="36" y="372" text-anchor="start">the controller reports</text><path class="dg-box" d="M14,398 H190 L200,408 V438 H14 Z"/><path class="dg-box" d="M190,398 V408 H200"/><text class="dg-tb" x="107.0" y="416.0" text-anchor="middle">Each branch ends</text><text class="dg-sm" x="107.0" y="430.0" text-anchor="middle">delivered, dropped, cannot tell</text><circle class="dg-num" cx="14" cy="398" r="9"/><text class="dg-numt" x="14" y="401.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="456" text-anchor="start">Topology draws each DPID and its ports.</text><text class="dg-sm" x="14" y="484" text-anchor="start">Nothing is asked of the controller or a switch.</text></svg>
