<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="A capture, and Save All its fleet form. The preview runs as a job: it reads every chosen device now, judges each read, compares it with the golden and with committed intent, and shows whether a baseline would be earned; nothing is recorded. You confirm; the devices are held and read again, refused if anything moved; one commit records every changed golden as you and decides the baseline. Nothing is sent to a device at any step."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="228" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE PREVIEW · A JOB, NOTHING RECORDED</text><rect class="dg-dev" x="262" y="44" width="118" height="160" rx="5"/><rect class="dg-dev" x="274" y="203" width="8" height="5"/><rect class="dg-dev" x="288" y="203" width="8" height="5"/><rect class="dg-dev" x="302" y="203" width="8" height="5"/><text class="dg-tb" x="321.0" y="62" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="76" text-anchor="middle">each one, at once</text><circle class="dg-num" cx="22" cy="60" r="9"/><text class="dg-numt" x="22" y="63.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="64" text-anchor="start">Read now</text><text class="dg-sm" x="36" y="76" text-anchor="start">one session each, bounded</text><path class="dg-read" d="M260,60 L208.0,60.0"/><polygon class="dg-readh" points="202.0,60.0 210.0,64.5 210.0,55.5"/><circle class="dg-num" cx="22" cy="96" r="9"/><text class="dg-numt" x="22" y="99.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="100" text-anchor="start">Judge the read</text><text class="dg-sm" x="36" y="112" text-anchor="start">one config, not stitched</text><circle class="dg-num" cx="22" cy="132" r="9"/><text class="dg-numt" x="22" y="135.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="136" text-anchor="start">Compare twice</text><text class="dg-sm" x="36" y="148" text-anchor="start">with golden, with intent</text><circle class="dg-num" cx="22" cy="168" r="9"/><text class="dg-numt" x="22" y="171.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="172" text-anchor="start">Baseline decision</text><text class="dg-sm" x="36" y="184" text-anchor="start">earned, or why not</text><rect class="dg-band" x="0" y="254" width="400" height="70" rx="6"/><text class="dg-hd" x="30" y="270" text-anchor="start">CONFIRM</text><rect class="dg-person" x="14" y="278" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="290.0" r="4"/><path class="dg-person" d="M23,301.0 Q30,292.0 37,301.0"/><text class="dg-tx" x="46" y="297.0" text-anchor="start">You confirm its hash</text><rect class="dg-band" x="0" y="330" width="400" height="224" rx="6"/><text class="dg-hd" x="30" y="346" text-anchor="start">THE APPLY · HOLDING THE DEVICES</text><rect class="dg-dev" x="262" y="352" width="118" height="80" rx="5"/><rect class="dg-dev" x="274" y="431" width="8" height="5"/><rect class="dg-dev" x="288" y="431" width="8" height="5"/><rect class="dg-dev" x="302" y="431" width="8" height="5"/><text class="dg-tb" x="321.0" y="370" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="376" r="9"/><text class="dg-numt" x="22" y="379.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="380" text-anchor="start">Read again</text><text class="dg-sm" x="36" y="392" text-anchor="start">moved since? refused</text><path class="dg-read" d="M260,376 L208.0,376.0"/><polygon class="dg-readh" points="202.0,376.0 210.0,380.5 210.0,371.5"/><path class="dg-repo" d="M14,416 V450 A93.0,6 0 0 0 200,450 V416"/><ellipse class="dg-repo" cx="107.0" cy="416" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="438.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="452.0" text-anchor="middle">every changed golden, as you</text><circle class="dg-num" cx="14" cy="416" r="9"/><text class="dg-numt" x="14" y="419.6" text-anchor="middle">3</text><rect class="dg-store" x="14" y="470" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="470" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="485.0" text-anchor="middle">Baseline decided</text><text class="dg-sm" x="109.0" y="499.0" text-anchor="middle">tag, or the denial</text><circle class="dg-num" cx="14" cy="470" r="9"/><text class="dg-numt" x="14" y="473.6" text-anchor="middle">4</text><text class="dg-sm" x="214" y="470" text-anchor="start">Published; queue and</text><text class="dg-sm" x="214" y="483" text-anchor="start">drift items closed.</text><text class="dg-sm" x="14" y="534" text-anchor="start">Nothing is sent to any device.</text></svg>
