<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Declaring a fault drill. Before you inject a fault, you declare it on one device: the fault in words, at most 15 minutes, as you. It is refused when the device already has an incident open or a drill open, and nothing is sent, silenced or held. An incident that opens on the device before the drill ends is tagged a fault drill in the write that opens it. Self-healing then treats it as a real fault: every guard, the verify and the rollback, except the per-device rate and the same change healed twice; its heal is counted as a drill&#x27;s, never in the real figures."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="196" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">BEFORE THE FAULT · NOTHING SENT</text><rect class="dg-person" x="14" y="44" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="56.0" r="4"/><path class="dg-person" d="M23,67.0 Q30,58.0 37,67.0"/><text class="dg-tx" x="46" y="63.0" text-anchor="start">You declare it, before</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><path class="dg-box" d="M14,88 H190 L200,98 V128 H14 Z"/><path class="dg-box" d="M190,88 V98 H200"/><text class="dg-tb" x="107.0" y="106.0" text-anchor="middle">Checked</text><text class="dg-sm" x="107.0" y="120.0" text-anchor="middle">an open incident or drill: refused</text><circle class="dg-num" cx="14" cy="88" r="9"/><text class="dg-numt" x="14" y="91.6" text-anchor="middle">2</text><rect class="dg-store" x="14" y="142" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="142" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="160.0" text-anchor="middle">The declaration</text><text class="dg-sm" x="109.0" y="174.0" text-anchor="middle">recorded, at most 15 min</text><circle class="dg-num" cx="14" cy="142" r="9"/><text class="dg-numt" x="14" y="145.6" text-anchor="middle">3</text><rect class="dg-devoff" x="240" y="60" width="140" height="48" rx="5"/><rect class="dg-devoff" x="252" y="107" width="8" height="5"/><rect class="dg-devoff" x="266" y="107" width="8" height="5"/><rect class="dg-devoff" x="280" y="107" width="8" height="5"/><text class="dg-tb" x="310.0" y="82.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="96.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="150" r="11"/><line class="dg-nol" x1="302.5" y1="157.5" x2="317.5" y2="142.5"/><text class="dg-sm" x="310" y="176" text-anchor="middle">nothing is sent,</text><text class="dg-sm" x="310" y="189" text-anchor="middle">silenced or held</text><rect class="dg-band" x="0" y="226" width="400" height="238" rx="6"/><text class="dg-hd" x="30" y="242" text-anchor="start">THE FAULT · INSIDE THE DRILL</text><rect class="dg-dev" x="262" y="250" width="118" height="60" rx="5"/><rect class="dg-dev" x="274" y="309" width="8" height="5"/><rect class="dg-dev" x="288" y="309" width="8" height="5"/><rect class="dg-dev" x="302" y="309" width="8" height="5"/><text class="dg-tb" x="321.0" y="268" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="282" text-anchor="middle">you inject the fault</text><text class="dg-tb" x="36" y="284" text-anchor="start">The incident opens</text><text class="dg-sm" x="36" y="296" text-anchor="start">tagged a drill, same write</text><path class="dg-read" d="M260,280 L208.0,280.0"/><polygon class="dg-readh" points="202.0,280.0 210.0,284.5 210.0,275.5"/><path class="dg-box" d="M14,320 H190 L200,330 V366 H14 Z"/><path class="dg-box" d="M190,320 V330 H200"/><text class="dg-tb" x="107.0" y="341.0" text-anchor="middle">Every guard but 9 and 11</text><text class="dg-sm" x="107.0" y="355.0" text-anchor="middle">the verify, the rollback</text><path class="dg-rec" d="M107,296 L107.0,312.0"/><polygon class="dg-rech" points="107.0,318.0 111.5,310.0 102.5,310.0"/><rect class="dg-store" x="14" y="382" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="382" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="400.0" text-anchor="middle">The heal, recorded</text><text class="dg-sm" x="109.0" y="414.0" text-anchor="middle">counted as a drill&#x27;s</text><path class="dg-rec" d="M107,366 L107.0,374.0"/><polygon class="dg-rech" points="107.0,380.0 111.5,372.0 102.5,372.0"/><text class="dg-sm" x="14" y="444" text-anchor="start">After the drill ends, an incident is real.</text></svg>
