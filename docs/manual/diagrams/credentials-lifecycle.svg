<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" role="img" aria-label="Every place a device&#x27;s credential lives, and what keeps each current. The device runs it and boots from its startup configuration; the tool holds it, encrypted, in the inventory or its override store; a person keeps the break-glass record on their own machine. On the lab, the lab startup file and Oxidized&#x27;s copy hold it too. Rotate changes the device and the tool&#x27;s copy together, proven by a fresh login. Persist saves it to startup and reads it back. A new break-glass export follows every rotation."><line class="dg-lane" x1="212" y1="20" x2="212" y2="524"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE TOOL AND PEOPLE</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="216" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">ROTATE · ONE OPERATION</text><rect class="dg-store" x="14" y="46" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="46" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="64.0" text-anchor="middle">Inventory or override</text><text class="dg-sm" x="109.0" y="78.0" text-anchor="middle">encrypted, the one copy</text><circle class="dg-num" cx="14" cy="46" r="9"/><text class="dg-numt" x="14" y="49.6" text-anchor="middle">1</text><rect class="dg-dev" x="240" y="46" width="140" height="40" rx="5"/><rect class="dg-dev" x="252" y="85" width="8" height="5"/><rect class="dg-dev" x="266" y="85" width="8" height="5"/><rect class="dg-dev" x="280" y="85" width="8" height="5"/><text class="dg-tb" x="310.0" y="64.0" text-anchor="middle">Running config</text><text class="dg-sm" x="310.0" y="78.0" text-anchor="middle">what it runs</text><path class="dg-send" d="M202,58 L232.0,58.0"/><polygon class="dg-sendh" points="238.0,58.0 230.0,53.5 230.0,62.5"/><path class="dg-rec" d="M238,76 L208.0,76.0"/><polygon class="dg-rech" points="202.0,76.0 210.0,80.5 210.0,71.5"/><text class="dg-sm" x="14" y="112" text-anchor="start">A new credential, sent on a held session;</text><text class="dg-sm" x="14" y="125" text-anchor="start">a fresh login proves it; then recorded.</text><rect class="dg-store" x="14" y="146" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="146" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="164.0" text-anchor="middle">Break-glass record</text><text class="dg-sm" x="109.0" y="178.0" text-anchor="middle">on a person&#x27;s laptop</text><circle class="dg-num" cx="14" cy="146" r="9"/><text class="dg-numt" x="14" y="149.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="206" text-anchor="start">Stale after a rotation: export again.</text><rect class="dg-band" x="0" y="242" width="400" height="128" rx="6"/><text class="dg-hd" x="30" y="258" text-anchor="start">PERSIST · THE BOOT COPY</text><rect class="dg-dev" x="240" y="266" width="140" height="40" rx="5"/><rect class="dg-dev" x="252" y="305" width="8" height="5"/><rect class="dg-dev" x="266" y="305" width="8" height="5"/><rect class="dg-dev" x="280" y="305" width="8" height="5"/><text class="dg-tb" x="310.0" y="284.0" text-anchor="middle">Startup config</text><text class="dg-sm" x="310.0" y="298.0" text-anchor="middle">what it boots</text><path class="dg-send" d="M202,286 L232.0,286.0"/><polygon class="dg-sendh" points="238.0,286.0 230.0,281.5 230.0,290.5"/><text class="dg-tb" x="36" y="282" text-anchor="start">Save, then read the startup</text><circle class="dg-num" cx="22" cy="278" r="9"/><text class="dg-numt" x="22" y="281.6" text-anchor="middle">3</text><text class="dg-sm" x="36" y="296" text-anchor="start">config back: every account line.</text><text class="dg-sm" x="14" y="336" text-anchor="start">The hourly startup check keeps asking.</text><rect class="dg-band" x="0" y="376" width="400" height="148" rx="6"/><text class="dg-hd" x="30" y="392" text-anchor="start">ON THE LAB ONLY</text><path class="dg-labf" d="M14,404 H190 L200,414 V444 H14 Z"/><text class="dg-tb" x="107.0" y="422.0" text-anchor="middle">Lab startup file</text><text class="dg-sm" x="107.0" y="436.0" text-anchor="middle">a redeploy boots it</text><rect class="dg-labtag" x="166" y="397" width="28" height="13" rx="3"/><text class="dg-labtx" x="180" y="407" text-anchor="middle">LAB</text><rect class="dg-labf" x="14" y="462" width="186" height="40" rx="20.0"/><text class="dg-tb" x="107.0" y="480.0" text-anchor="middle">Oxidized&#x27;s copy</text><text class="dg-sm" x="107.0" y="494.0" text-anchor="middle">replayed by a redeploy</text><rect class="dg-labtag" x="170" y="455" width="28" height="13" rx="3"/><text class="dg-labtx" x="184" y="465" text-anchor="middle">LAB</text><text class="dg-sm" x="214" y="426" text-anchor="start">Built by the lab sync,</text><text class="dg-sm" x="214" y="439" text-anchor="start">not by the product.</text></svg>
