<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="A notification of a can&#x27;t-fix: the notifier finds each new can&#x27;t-fix recorded in the last ten minutes and not yet told, and takes it once under the store&#x27;s lock; if the network&#x27;s AI analysis is on it starts it as a background call and waits for it at most 60 seconds; it then sends Mercury&#x27;s facts, the analysis or its state (pending, not run, couldn&#x27;t analyse), and the link, to the network&#x27;s team: an email through the relay and each webhook, signed; each attempt is a row in the delivery log, a failure tried three times and then raised under Needs attention; a pending analysis that arrives later is sent on the same thread. Nothing reaches a device."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE TEAM</text><rect class="dg-store" x="14" y="40" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="40" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="58.0" text-anchor="middle">A can&#x27;t-fix</text><text class="dg-sm" x="109.0" y="72.0" text-anchor="middle">recorded, not yet told</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="98" text-anchor="start">taken once, under the store&#x27;s lock</text><path class="dg-box" d="M14,116 H190 L200,126 V152 H14 Z"/><path class="dg-box" d="M190,116 V126 H200"/><text class="dg-tb" x="107.0" y="132.0" text-anchor="middle">The AI analysis</text><text class="dg-sm" x="107.0" y="146.0" text-anchor="middle">a background call, if on</text><circle class="dg-num" cx="14" cy="116" r="9"/><text class="dg-numt" x="14" y="119.6" text-anchor="middle">2</text><circle class="dg-clock" cx="186" cy="170" r="8"/><path class="dg-clock" d="M186,165 V170 L190,172"/><text class="dg-sm" x="14" y="174" text-anchor="start">waited for at most 60 s</text><rect class="dg-band" x="0" y="190" width="400" height="130" rx="6"/><text class="dg-hd" x="30" y="206" text-anchor="start">SEND · THE FACTS FIRST</text><rect class="dg-svc" x="262" y="222" width="118" height="30" rx="15.0"/><text class="dg-tb" x="321.0" y="235.0" text-anchor="middle">Email</text><text class="dg-sm" x="321.0" y="249.0" text-anchor="middle">through the relay</text><rect class="dg-svc" x="262" y="272" width="118" height="30" rx="15.0"/><text class="dg-tb" x="321.0" y="285.0" text-anchor="middle">Webhook</text><text class="dg-sm" x="321.0" y="299.0" text-anchor="middle">signed, HMAC-SHA256</text><text class="dg-tb" x="36" y="232" text-anchor="start">Mercury&#x27;s facts, then</text><text class="dg-sm" x="36" y="246" text-anchor="start">the analysis or its state</text><circle class="dg-num" cx="22" cy="228" r="9"/><text class="dg-numt" x="22" y="231.6" text-anchor="middle">3</text><text class="dg-sm" x="36" y="300" text-anchor="start">then the link to Mercury</text><rect class="dg-store" x="14" y="336" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="336" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="354.0" text-anchor="middle">The delivery log</text><text class="dg-sm" x="109.0" y="368.0" text-anchor="middle">each attempt, History</text><circle class="dg-num" cx="14" cy="336" r="9"/><text class="dg-numt" x="14" y="339.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="394" text-anchor="start">a failure tried three times, then</text><text class="dg-sm" x="14" y="407" text-anchor="start">a Needs attention item</text><text class="dg-sm" x="14" y="432" text-anchor="start">A pending analysis follows</text><text class="dg-sm" x="14" y="445" text-anchor="start">on the same thread.</text><circle class="dg-no" cx="320" cy="380" r="11"/><line class="dg-nol" x1="312.5" y1="387.5" x2="327.5" y2="372.5"/><text class="dg-sm" x="320" y="406" text-anchor="middle">nothing reaches</text><text class="dg-sm" x="320" y="419" text-anchor="middle">a device</text></svg>
