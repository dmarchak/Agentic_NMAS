<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="A change record drafted from the deploy preview. You press Draft a change record; Mercury plans the preview again from the card&#x27;s own form and refuses if its program is not the one the card drew; it fills every fact code knows (the program and its hash, the stated reasons, Verify&#x27;s scope and checks, the rollback&#x27;s lines as the pipeline computes them, the risk&#x27;s level by its rule); it sends one recorded, capped call through the AI gateway carrying the program&#x27;s shape in keywords and Mercury&#x27;s own words, never a configuration value; it refuses words naming an interface or device the change does not hold; and it draws the draft in the preview, each section marked Mercury or AI. Nothing is sent to the device, and Deploy is unchanged."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SERVICES</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You press Draft…</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,84 H190 L200,94 V120 H14 Z"/><path class="dg-box" d="M190,84 V94 H200"/><text class="dg-tb" x="107.0" y="100.0" text-anchor="middle">The preview, planned again</text><text class="dg-sm" x="107.0" y="114.0" text-anchor="middle">moved: refused, both hashes</text><path class="dg-box" d="M14,134 H190 L200,144 V174 H14 Z"/><path class="dg-box" d="M190,134 V144 H200"/><text class="dg-tb" x="107.0" y="152.0" text-anchor="middle">Mercury&#x27;s facts</text><text class="dg-sm" x="107.0" y="166.0" text-anchor="middle">program, checks, rollback</text><circle class="dg-num" cx="14" cy="134" r="9"/><text class="dg-numt" x="14" y="137.6" text-anchor="middle">2</text><path class="dg-box" d="M14,188 H190 L200,198 V224 H14 Z"/><path class="dg-box" d="M190,188 V198 H200"/><text class="dg-tb" x="107.0" y="204.0" text-anchor="middle">The shape, in keywords</text><text class="dg-sm" x="107.0" y="218.0" text-anchor="middle">no line, no value</text><circle class="dg-num" cx="14" cy="188" r="9"/><text class="dg-numt" x="14" y="191.6" text-anchor="middle">3</text><rect class="dg-svc" x="250" y="188" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="204.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="218.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,206 L242.0,206.0"/><polygon class="dg-sendh" points="248.0,206.0 240.0,201.5 240.0,210.5"/><circle class="dg-num" cx="14" cy="238" r="9"/><text class="dg-numt" x="14" y="241.6" text-anchor="middle">4</text><path class="dg-box" d="M14,252 H190 L200,262 V288 H14 Z"/><path class="dg-box" d="M190,252 V262 H200"/><text class="dg-tb" x="107.0" y="268.0" text-anchor="middle">Checked</text><text class="dg-sm" x="107.0" y="282.0" text-anchor="middle">names only what it holds</text><circle class="dg-num" cx="14" cy="300" r="9"/><text class="dg-numt" x="14" y="303.6" text-anchor="middle">5</text><path class="dg-box" d="M14,314 H190 L200,324 V354 H14 Z"/><path class="dg-box" d="M190,314 V324 H200"/><text class="dg-tb" x="107.0" y="332.0" text-anchor="middle">The draft, drawn</text><text class="dg-sm" x="107.0" y="346.0" text-anchor="middle">Mercury and AI marked</text><circle class="dg-num" cx="14" cy="366" r="9"/><text class="dg-numt" x="14" y="369.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="392" text-anchor="start">Deploy is unchanged by it.</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="459" text-anchor="middle">to the device</text></svg>
