<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="The alert history: after each read of Grafana&#x27;s alerts, every transition it shows (pending, firing, resolved, no data, error), timed by Grafana, is recorded once in the alert history; Grafana&#x27;s own state history is read in once by the backfill, the same transition never recorded twice; History groups them into past alerts by rule; Build evidence rebuilds a past alert&#x27;s pack as of its time, each section marked captured, rebuilt or cannot be rebuilt, and keeps it frozen for Explain; past its network&#x27;s retention a transition moves to the data lake."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SOURCES</text><rect class="dg-svc" x="250" y="36" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="52.0" text-anchor="middle">Grafana</text><text class="dg-sm" x="315.0" y="66.0" text-anchor="middle">its alerts, each read</text><path class="dg-read" d="M248,56 L208.0,56.0"/><polygon class="dg-readh" points="202.0,56.0 210.0,60.5 210.0,51.5"/><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">Each transition</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">Grafana&#x27;s time, once</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-svc" x="250" y="96" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="112.0" text-anchor="middle">State history</text><text class="dg-sm" x="315.0" y="126.0" text-anchor="middle">read in once</text><path class="dg-read" d="M248,116 L208.0,116.0"/><polygon class="dg-readh" points="202.0,116.0 210.0,120.5 210.0,111.5"/><rect class="dg-store" x="14" y="100" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="100" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="116.0" text-anchor="middle">The alert history</text><text class="dg-sm" x="109.0" y="130.0" text-anchor="middle">one line a transition</text><circle class="dg-num" cx="14" cy="100" r="9"/><text class="dg-numt" x="14" y="103.6" text-anchor="middle">2</text><path class="dg-box" d="M14,160 H190 L200,170 V196 H14 Z"/><path class="dg-box" d="M190,160 V170 H200"/><text class="dg-tb" x="107.0" y="176.0" text-anchor="middle">History</text><text class="dg-sm" x="107.0" y="190.0" text-anchor="middle">past alerts, by rule</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="214" width="400" height="110" rx="6"/><text class="dg-hd" x="30" y="230" text-anchor="start">BUILD EVIDENCE · AS OF THE ALERT&#x27;S TIME</text><rect class="dg-svc" x="250" y="242" width="130" height="30" rx="15.0"/><text class="dg-tb" x="315.0" y="255.0" text-anchor="middle">Repository</text><text class="dg-sm" x="315.0" y="269.0" text-anchor="middle">at the commit then</text><rect class="dg-svc" x="250" y="284" width="130" height="30" rx="15.0"/><text class="dg-tb" x="315.0" y="297.0" text-anchor="middle">Prometheus, Loki</text><text class="dg-sm" x="315.0" y="311.0" text-anchor="middle">over its window</text><circle class="dg-num" cx="22" cy="252" r="9"/><text class="dg-numt" x="22" y="255.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="256" text-anchor="start">Rebuilt, each marked</text><text class="dg-sm" x="36" y="268" text-anchor="start">or said it cannot be</text><path class="dg-read" d="M248,252 L208.0,252.0"/><polygon class="dg-readh" points="202.0,252.0 210.0,256.5 210.0,247.5"/><rect class="dg-store" x="14" y="340" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="340" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="358.0" text-anchor="middle">The evidence pack record</text><text class="dg-sm" x="109.0" y="372.0" text-anchor="middle">frozen for Explain</text><circle class="dg-num" cx="14" cy="340" r="9"/><text class="dg-numt" x="14" y="343.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="402" text-anchor="start">Past its retention: the data lake.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device is asked or changed.</text></svg>
