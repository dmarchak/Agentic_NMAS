<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Editing intent in bulk sends nothing. A change file names each setting&#x27;s path, its value before and after; each device&#x27;s intent at HEAD is checked against the before value, and a device that differs is refused by name with both values. The rest are rendered before and after through the template and the monitoring profile and grouped by identical change; you confirm the preview&#x27;s hash; one commit records every device changed, and names those refused."><line class="dg-lane" x1="284" y1="20" x2="284" y2="464"/><text class="dg-hd" x="142.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="342.0" y="12" text-anchor="middle">DEVICES</text><rect class="dg-band" x="0" y="20" width="400" height="64" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE CHANGE</text><path class="dg-box" d="M14,40 H260 L270,50 V78 H14 Z"/><path class="dg-box" d="M260,40 V50 H270"/><text class="dg-tb" x="142.0" y="57.0" text-anchor="middle">Change file</text><text class="dg-sm" x="142.0" y="71.0" text-anchor="middle">summary, then path · before · after</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-band" x="0" y="90" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="106" text-anchor="start">COMPARE AND SET · PER DEVICE</text><path class="dg-repo" d="M14,118 V146 A60.0,6 0 0 0 134,146 V118"/><ellipse class="dg-repo" cx="74.0" cy="118" rx="60.0" ry="6"/><text class="dg-tb" x="74.0" y="137.0" text-anchor="middle">Repository</text><text class="dg-sm" x="74.0" y="151.0" text-anchor="middle">intent at HEAD</text><path class="dg-rec" d="M136,132 L154.0,132.0"/><polygon class="dg-rech" points="160.0,132.0 152.0,127.5 152.0,136.5"/><path class="dg-intent" d="M162,112 H260 L270,122 V152 H162 Z"/><path class="dg-intent" d="M260,112 V122 H270"/><text class="dg-tb" x="216.0" y="130.0" text-anchor="middle">Intent</text><text class="dg-sm" x="216.0" y="144.0" text-anchor="middle">before matches?</text><circle class="dg-num" cx="162" cy="112" r="9"/><text class="dg-numt" x="162" y="115.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="178" text-anchor="start">Matches: rendered before and after,</text><text class="dg-sm" x="14" y="191" text-anchor="start">template and profile, then grouped by</text><text class="dg-sm" x="14" y="204" text-anchor="start">identical change. Differs: refused by</text><text class="dg-sm" x="14" y="217" text-anchor="start">name, with both values.</text><rect class="dg-band" x="0" y="246" width="400" height="210" rx="6"/><text class="dg-hd" x="30" y="262" text-anchor="start">CONFIRM AND COMMIT</text><path class="dg-box" d="M14,270 H260 L270,280 V310 H14 Z"/><path class="dg-box" d="M260,270 V280 H270"/><text class="dg-tb" x="142.0" y="288.0" text-anchor="middle">Preview</text><text class="dg-sm" x="142.0" y="302.0" text-anchor="middle">groups · refused · one hash</text><circle class="dg-num" cx="14" cy="270" r="9"/><text class="dg-numt" x="14" y="273.6" text-anchor="middle">3</text><rect class="dg-person" x="14" y="322" width="256" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="334.0" r="4"/><path class="dg-person" d="M23,345.0 Q30,336.0 37,345.0"/><text class="dg-tx" x="46" y="341.0" text-anchor="start">You confirm the summary and hash</text><circle class="dg-num" cx="14" cy="322" r="9"/><text class="dg-numt" x="14" y="325.6" text-anchor="middle">4</text><path class="dg-rec" d="M142,354 L142.0,368.0"/><polygon class="dg-rech" points="142.0,374.0 146.5,366.0 137.5,366.0"/><path class="dg-repo" d="M14,382 V416 A128.0,6 0 0 0 270,416 V382"/><ellipse class="dg-repo" cx="142.0" cy="382" rx="128.0" ry="6"/><text class="dg-tb" x="142.0" y="404.0" text-anchor="middle">One commit</text><text class="dg-sm" x="142.0" y="418.0" text-anchor="middle">Source: bulk-intent · Refused: …</text><circle class="dg-num" cx="14" cy="382" r="9"/><text class="dg-numt" x="14" y="385.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="444" text-anchor="start">A failed commit puts every file back as committed.</text><circle class="dg-no" cx="342" cy="250" r="11"/><line class="dg-nol" x1="334.5" y1="257.5" x2="349.5" y2="242.5"/><text class="dg-sm" x="342" y="276" text-anchor="middle">nothing is</text><text class="dg-sm" x="342" y="289" text-anchor="middle">sent</text></svg>
