SWITCH_SET=19-23
OTHERS_SET=0-18
OTHERS="r1 r2 r3 r4 r5 r6 r7 r8 h1 h2 h3 h4 h5 h6 h7 web"
# The lab file, in the home of the user who runs the lab (the one who ran sudo, else this one).
