<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Analyse with the trace tool: the same kept snapshot as Analyse this network, its seal checked; a first recorded, capped call through the AI gateway with the snapshot&#x27;s facts and the hosts a trace can take, which answers or asks for up to three reads; Mercury checks each read against the closed set and what the snapshot holds, and answers the allowed ones from the snapshot alone, the trace walking its flow tables, never a live read, each answer masked, cut and logged first; a second call with the reads, which cannot ask again, within the loop&#x27;s total token cap; the final answer checked as the first analyst&#x27;s; then compared with it on the same snapshot. Nothing is sent to a switch."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE AI GATEWAY</text><rect class="dg-store" x="14" y="40" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="40" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="58.0" text-anchor="middle">The kept snapshot</text><text class="dg-sm" x="109.0" y="72.0" text-anchor="middle">its seal checked</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,100 H190 L200,110 V136 H14 Z"/><path class="dg-box" d="M190,100 V110 H200"/><text class="dg-tb" x="107.0" y="116.0" text-anchor="middle">Pass 1</text><text class="dg-sm" x="107.0" y="130.0" text-anchor="middle">the facts and the hosts</text><circle class="dg-num" cx="14" cy="100" r="9"/><text class="dg-numt" x="14" y="103.6" text-anchor="middle">2</text><rect class="dg-svc" x="250" y="100" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="116.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="130.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,118 L242.0,118.0"/><polygon class="dg-sendh" points="248.0,118.0 240.0,113.5 240.0,122.5"/><text class="dg-sm" x="14" y="152" text-anchor="start">it answers, or asks for up to 3 reads</text><path class="dg-box" d="M14,168 H190 L200,178 V208 H14 Z"/><path class="dg-box" d="M190,168 V178 H200"/><text class="dg-tb" x="107.0" y="186.0" text-anchor="middle">Each read checked</text><text class="dg-sm" x="107.0" y="200.0" text-anchor="middle">the closed set, the snapshot</text><circle class="dg-num" cx="14" cy="168" r="9"/><text class="dg-numt" x="14" y="171.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="224" text-anchor="start">anything else refused, naming why</text><path class="dg-box" d="M14,240 H190 L200,250 V280 H14 Z"/><path class="dg-box" d="M190,240 V250 H200"/><text class="dg-tb" x="107.0" y="258.0" text-anchor="middle">Answered from the seal</text><text class="dg-sm" x="107.0" y="272.0" text-anchor="middle">the trace walks its flows</text><circle class="dg-num" cx="14" cy="240" r="9"/><text class="dg-numt" x="14" y="243.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="296" text-anchor="start">never a live read; masked, cut, logged</text><rect class="dg-band" x="0" y="312" width="400" height="96" rx="6"/><text class="dg-hd" x="30" y="328" text-anchor="start">PASS 2 · WITHIN THE LOOP&#x27;S TOTAL CAP</text><path class="dg-box" d="M14,340 H190 L200,350 V376 H14 Z"/><path class="dg-box" d="M190,340 V350 H200"/><text class="dg-tb" x="107.0" y="356.0" text-anchor="middle">Pass 2</text><text class="dg-sm" x="107.0" y="370.0" text-anchor="middle">the reads; it cannot ask again</text><circle class="dg-num" cx="14" cy="340" r="9"/><text class="dg-numt" x="14" y="343.6" text-anchor="middle">5</text><rect class="dg-svc" x="250" y="340" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="356.0" text-anchor="middle">The AI gateway</text><text class="dg-sm" x="315.0" y="370.0" text-anchor="middle">capped, recorded</text><path class="dg-send" d="M202,358 L242.0,358.0"/><polygon class="dg-sendh" points="248.0,358.0 240.0,353.5 240.0,362.5"/><path class="dg-box" d="M14,420 H190 L200,430 V456 H14 Z"/><path class="dg-box" d="M190,420 V430 H200"/><text class="dg-tb" x="107.0" y="436.0" text-anchor="middle">Checked as the first</text><text class="dg-sm" x="107.0" y="450.0" text-anchor="middle">every id held</text><circle class="dg-num" cx="14" cy="420" r="9"/><text class="dg-numt" x="14" y="423.6" text-anchor="middle">6</text><path class="dg-box" d="M14,466 H190 L200,476 V502 H14 Z"/><path class="dg-box" d="M190,466 V476 H200"/><text class="dg-tb" x="107.0" y="482.0" text-anchor="middle">Compared</text><text class="dg-sm" x="107.0" y="496.0" text-anchor="middle">found, missed, false positives</text><circle class="dg-num" cx="14" cy="466" r="9"/><text class="dg-numt" x="14" y="469.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="512" text-anchor="start">Nothing is sent to a switch.</text></svg>
