<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="DHCP steering: the flows are compiled from the committed NSOT export alone (the DHCP server from its NetBox Service dhcp, its MAC and switch port; each end host&#x27;s edge port; the paths between switches from the cables); each switch&#x27;s table is read through the controller and one plan per switch renders every request and its REST body; you confirm, bound to their hash; the preview is made again and a moved hash sends nothing; each switch, the server&#x27;s first, is held, sent its requests and read back; a failure rolls that switch back and puts back the switches already changed; each flow is recorded with its owner, feature:dhcp-unicast. DHCPv6 is not steered."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CONTROLLER</text><path class="dg-repo" d="M14,46 V74 A93.0,6 0 0 0 200,74 V46"/><ellipse class="dg-repo" cx="107.0" cy="46" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="65.0" text-anchor="middle">The NSOT export</text><text class="dg-sm" x="107.0" y="79.0" text-anchor="middle">server, hosts, cables</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-box" d="M14,92 H190 L200,102 V128 H14 Z"/><path class="dg-box" d="M190,92 V102 H200"/><text class="dg-tb" x="107.0" y="108.0" text-anchor="middle">The compiled flows</text><text class="dg-sm" x="107.0" y="122.0" text-anchor="middle">per edge port, per path</text><circle class="dg-num" cx="14" cy="92" r="9"/><text class="dg-numt" x="14" y="95.6" text-anchor="middle">2</text><rect class="dg-dev" x="262" y="92" width="118" height="60" rx="5"/><rect class="dg-dev" x="274" y="151" width="8" height="5"/><rect class="dg-dev" x="288" y="151" width="8" height="5"/><rect class="dg-dev" x="302" y="151" width="8" height="5"/><text class="dg-tb" x="321.0" y="110" text-anchor="middle">Each switch</text><text class="dg-sm" x="321.0" y="124" text-anchor="middle">its table read</text><path class="dg-read" d="M260,118 L210.0,118.0"/><polygon class="dg-readh" points="204.0,118.0 212.0,122.5 212.0,113.5"/><path class="dg-box" d="M14,140 H190 L200,150 V176 H14 Z"/><path class="dg-box" d="M190,140 V150 H200"/><text class="dg-tb" x="107.0" y="156.0" text-anchor="middle">One plan per switch</text><text class="dg-sm" x="107.0" y="170.0" text-anchor="middle">every REST body; the hash</text><circle class="dg-num" cx="14" cy="140" r="9"/><text class="dg-numt" x="14" y="143.6" text-anchor="middle">3</text><rect class="dg-person" x="14" y="190" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="202.0" r="4"/><path class="dg-person" d="M23,213.0 Q30,204.0 37,213.0"/><text class="dg-tx" x="46" y="209.0" text-anchor="start">You confirm, bound to their hash</text><circle class="dg-num" cx="14" cy="190" r="9"/><text class="dg-numt" x="14" y="193.6" text-anchor="middle">4</text><rect class="dg-band" x="0" y="236" width="400" height="170" rx="6"/><text class="dg-hd" x="30" y="252" text-anchor="start">THE APPLY · EACH SWITCH HELD</text><rect class="dg-dev" x="262" y="256" width="118" height="140" rx="5"/><rect class="dg-dev" x="274" y="395" width="8" height="5"/><rect class="dg-dev" x="288" y="395" width="8" height="5"/><rect class="dg-dev" x="302" y="395" width="8" height="5"/><text class="dg-tb" x="321.0" y="274" text-anchor="middle">The controller</text><text class="dg-sm" x="321.0" y="288" text-anchor="middle">and its switches</text><circle class="dg-num" cx="22" cy="266" r="9"/><text class="dg-numt" x="22" y="269.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="270" text-anchor="start">Made again</text><text class="dg-sm" x="36" y="282" text-anchor="start">a moved hash sends nothing</text><circle class="dg-num" cx="22" cy="308" r="9"/><text class="dg-numt" x="22" y="311.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="312" text-anchor="start">Sent, server&#x27;s switch first</text><text class="dg-sm" x="36" y="324" text-anchor="start">exactly the rendered body</text><circle class="dg-num" cx="22" cy="350" r="9"/><text class="dg-numt" x="22" y="353.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="354" text-anchor="start">Verified</text><text class="dg-sm" x="36" y="366" text-anchor="start">each table read back</text><path class="dg-read" d="M260,350 L208.0,350.0"/><polygon class="dg-readh" points="202.0,350.0 210.0,354.5 210.0,345.5"/><text class="dg-sm" x="14" y="402" text-anchor="start">A failure puts back what landed.</text><rect class="dg-store" x="14" y="420" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="420" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="438.0" text-anchor="middle">The flow intent</text><text class="dg-sm" x="109.0" y="452.0" text-anchor="middle">each flow&#x27;s owner, the run</text><circle class="dg-num" cx="14" cy="420" r="9"/><text class="dg-numt" x="14" y="423.6" text-anchor="middle">8</text><text class="dg-sm" x="14" y="484" text-anchor="start">DHCPv6 is not steered: it floods.</text><text class="dg-sm" x="14" y="508" text-anchor="start">A lease from a host is yours to test.</text></svg>
