# CI for the APP repository only (NSOT_CI.md, P.4 step 3).
#
# It checks out THIS repository and nothing else. The config repository
# (rcn-nsot-config) holds plaintext device secrets by design and is never
# read here: no `repository:` input, no secrets, read-only token, and
# tests/test_ci_workflow.py fails on any of those. Actions are also disabled
# in the config repository's own settings, as a second, independent layer.
#
# Versions: requirements.lock, generated ON THE HOST (C37), on the host's
# Python. Coverage is REPORTED, never a threshold (course labs, NSOT_PLAN).
name: ci

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant: cancel it,
# rather than spend minutes on a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the removal check diffs the pushed range
          persist-credentials: false # nothing later needs the token

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # the host's interpreter

      - name: Install the host's versions
        run: python -m pip install -r requirements.lock -r requirements-ci.txt

      - name: Report what the resolver added beyond the lock (information, not a gate)
        run: |
          python - <<'PY'
          import re, subprocess
          norm = lambda n: re.sub(r"[-_.]+", "-", n).lower()
          locked = {norm(l.split("==")[0]) for l in open("requirements.lock")
                    if "==" in l and not l.startswith("#")}
          frozen = subprocess.run(["python", "-m", "pip", "freeze"], capture_output=True, text=True).stdout
          extra = sorted(l for l in frozen.splitlines() if "==" in l and norm(l.split("==")[0]) not in locked)
          print(f"{len(extra)} installed distribution(s) not in requirements.lock:")
          print("\n".join("  " + e for e in extra))
          PY

      - name: Tests (R1, R4), coverage reported
        run: >
          python -m pytest -q -p no:cacheprovider
          --cov=modules --cov=routes --cov=app --cov-report=term

      - name: No removed definition is still called (R2)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "checking $RANGE"
          python scripts/check_removed_definitions.py "$RANGE"
