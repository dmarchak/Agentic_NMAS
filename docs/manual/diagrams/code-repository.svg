<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="A network&#x27;s code repository: you set where its jobs and apps live, a local path or an https URL and a branch; Fetch now fetches that branch into Mercury&#x27;s own read-only copy, with only git&#x27;s file and https transports, no prompt and no hooks, bounded; each apps folder at the fetched commit is registered as a Draft, pinned by the location, the commit and its content hash, read from git&#x27;s blobs and never a working tree; the fetch is recorded, a failed one with why, and SDN › Apps lists what is registered. Nothing is written to the repository, and the configuration repository is never read."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CODE REPOSITORY</text><rect class="dg-person" x="14" y="44" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="56.0" r="4"/><path class="dg-person" d="M23,67.0 Q30,58.0 37,67.0"/><text class="dg-tx" x="46" y="63.0" text-anchor="start">You set its location</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><rect class="dg-store" x="14" y="84" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="84" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="99.0" text-anchor="middle">The network&#x27;s settings</text><text class="dg-sm" x="109.0" y="113.0" text-anchor="middle">location and branch</text><rect class="dg-person" x="14" y="132" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="144.0" r="4"/><path class="dg-person" d="M23,155.0 Q30,146.0 37,155.0"/><text class="dg-tx" x="46" y="151.0" text-anchor="start">You press Fetch now</text><circle class="dg-num" cx="14" cy="132" r="9"/><text class="dg-numt" x="14" y="135.6" text-anchor="middle">2</text><path class="dg-repo" d="M232,138 V170 A78.0,6 0 0 0 388,170 V138"/><ellipse class="dg-repo" cx="310.0" cy="138" rx="78.0" ry="6"/><text class="dg-tb" x="310.0" y="159.0" text-anchor="middle">Its repository</text><text class="dg-sm" x="310.0" y="173.0" text-anchor="middle">read, never written</text><path class="dg-read" d="M230,150 L210.0,150.0"/><polygon class="dg-readh" points="204.0,150.0 212.0,154.5 212.0,145.5"/><path class="dg-repo" d="M14,182 V210 A93.0,6 0 0 0 200,210 V182"/><ellipse class="dg-repo" cx="107.0" cy="182" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="201.0" text-anchor="middle">Mercury&#x27;s copy</text><text class="dg-sm" x="107.0" y="215.0" text-anchor="middle">git&#x27;s objects, no files</text><circle class="dg-num" cx="14" cy="176" r="9"/><text class="dg-numt" x="14" y="179.6" text-anchor="middle">3</text><path class="dg-box" d="M14,230 H190 L200,240 V266 H14 Z"/><path class="dg-box" d="M190,230 V240 H200"/><text class="dg-tb" x="107.0" y="246.0" text-anchor="middle">Each apps/ folder</text><text class="dg-sm" x="107.0" y="260.0" text-anchor="middle">a Draft: commit and hash</text><circle class="dg-num" cx="14" cy="230" r="9"/><text class="dg-numt" x="14" y="233.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="280" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="280" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="296.0" text-anchor="middle">The copy&#x27;s record</text><text class="dg-sm" x="109.0" y="310.0" text-anchor="middle">who, when, what, why</text><circle class="dg-num" cx="14" cy="280" r="9"/><text class="dg-numt" x="14" y="283.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="344" text-anchor="start">SDN › Apps lists what is registered.</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">nothing written</text><text class="dg-sm" x="310" y="459" text-anchor="middle">to the repository</text></svg>
