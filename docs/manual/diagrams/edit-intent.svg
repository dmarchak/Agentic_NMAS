<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Editing a device&#x27;s intent. The editor opens the document committed at HEAD and the blob it was read from. As you type, the document is checked (its line and column on an error) and rendered through the device&#x27;s template beside what is committed and the device&#x27;s golden, naming each line the parser does not model and whether it is acknowledged. You commit with a reason; the commit is refused, naming both versions, if the intent moved since you opened it. Nothing is sent to the device: a deploy does that."><line class="dg-lane" x1="212" y1="20" x2="212" y2="434"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-repo" d="M14,46 V74 A93.0,6 0 0 0 200,74 V46"/><ellipse class="dg-repo" cx="107.0" cy="46" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="65.0" text-anchor="middle">Intent at HEAD</text><text class="dg-sm" x="107.0" y="79.0" text-anchor="middle">the blob you opened</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,82 L107.0,96.0"/><polygon class="dg-rech" points="107.0,102.0 111.5,94.0 102.5,94.0"/><path class="dg-intent" d="M14,104 H190 L200,114 V144 H14 Z"/><path class="dg-intent" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="122.0" text-anchor="middle">Your edit</text><text class="dg-sm" x="107.0" y="136.0" text-anchor="middle">checked as you type</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><path class="dg-box" d="M14,156 H190 L200,166 V196 H14 Z"/><path class="dg-box" d="M190,156 V166 H200"/><text class="dg-tb" x="107.0" y="174.0" text-anchor="middle">Both diffs</text><text class="dg-sm" x="107.0" y="188.0" text-anchor="middle">the render, what a deploy sends</text><path class="dg-box" d="M14,208 H190 L200,218 V242 H14 Z"/><path class="dg-box" d="M190,208 V218 H200"/><text class="dg-tb" x="107.0" y="223.0" text-anchor="middle">Unmodelled lines</text><text class="dg-sm" x="107.0" y="237.0" text-anchor="middle">ticked: acknowledged</text><circle class="dg-num" cx="14" cy="208" r="9"/><text class="dg-numt" x="14" y="211.6" text-anchor="middle">3</text><rect class="dg-person" x="14" y="256" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="268.0" r="4"/><path class="dg-person" d="M23,279.0 Q30,270.0 37,279.0"/><text class="dg-tx" x="46" y="275.0" text-anchor="start">You commit, with a reason</text><circle class="dg-num" cx="14" cy="256" r="9"/><text class="dg-numt" x="14" y="259.6" text-anchor="middle">4</text><path class="dg-rec" d="M107,288 L107.0,302.0"/><polygon class="dg-rech" points="107.0,308.0 111.5,300.0 102.5,300.0"/><path class="dg-repo" d="M14,316 V344 A93.0,6 0 0 0 200,344 V316"/><ellipse class="dg-repo" cx="107.0" cy="316" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="335.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="349.0" text-anchor="middle">host_vars/&lt;device&gt;, as you</text><text class="dg-sm" x="14" y="372" text-anchor="start">Intent moved since you opened it: nothing</text><circle class="dg-num" cx="14" cy="362" r="9"/><text class="dg-numt" x="14" y="365.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="385" text-anchor="start">is written; both changes are shown.</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="200" r="11"/><line class="dg-nol" x1="302.5" y1="207.5" x2="317.5" y2="192.5"/><text class="dg-sm" x="310" y="226" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="239" text-anchor="middle">a deploy does that</text></svg>
