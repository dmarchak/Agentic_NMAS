# The laptop kit's NetBox for the final SDN lab (docs/LAB9_LAPTOP_RUN.md). The same images, at
# the same versions, as the NMAS host's netbox-docker stack (read from the host 2026-11-05).
# Bound to loopback only. Its secrets come from secrets.env, which `kit init` generates owner-only
# in the kit's own folder. Nobody types or reads them: they are NetBox's internal keys.
#
# The kit's Prometheus too (the operator's work order after the Lab 9 sitting, 2026-11-10:
# "Prometheus as part of the kit (started and stopped by ./kit, pinned v2.53.0, loopback)"),
# so Topology has one to ask. One Compose project: `kit start` brings both up, `kit stop`
# stops both. The project keeps its name, because NetBox's volumes are named by it.
name: nmas-sdn-lab-netbox

x-netbox: &netbox
  image: docker.io/netboxcommunity/netbox:v4.6-5.0.2
  env_file:
    - ${KIT_HOME:?KIT_HOME is unset}/netbox/secrets.env
  environment:
    DB_HOST: postgres
    DB_NAME: netbox
    DB_USER: netbox
    REDIS_HOST: valkey
    REDIS_DATABASE: "0"
    REDIS_CACHE_HOST: valkey
    REDIS_CACHE_DATABASE: "1"
    SKIP_SUPERUSER: "true"
    # The local-first rule (C2513): no census, no release check, no plugin catalogue.
    CENSUS_REPORTING_ENABLED: "false"
    ISOLATED_DEPLOYMENT: "true"
  depends_on: [postgres, valkey]
  volumes:
    - netbox-media:/opt/netbox/netbox/media
  restart: unless-stopped

services:
  netbox:
    <<: *netbox
    ports: ["127.0.0.1:${NETBOX_PORT:-8001}:8080"]
  netbox-worker:
    <<: *netbox
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    depends_on: [netbox]
  postgres:
    image: docker.io/postgres:18-alpine
    env_file:
      - ${KIT_HOME:?KIT_HOME is unset}/netbox/secrets.env
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
    volumes:
      - netbox-postgres:/var/lib/postgresql
    restart: unless-stopped
  valkey:
    image: docker.io/valkey/valkey:9.1-alpine
    env_file:
      - ${KIT_HOME:?KIT_HOME is unset}/netbox/secrets.env
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - netbox-valkey:/data
    restart: unless-stopped
  # Published on loopback only, as NetBox is (kit_net_check.py's `listen` judges what listens,
  # in the preflight). Its configuration is the kit's own file beside this one, read-only
  # (KIT_FILES is the folder `kit` runs from); its data is a volume of this project, emptied
  # by `kit reset` with NetBox's. The container is named, so `kit start` can tell its own
  # from one started by hand under that name, which it refuses and never removes.
  prometheus:
    image: docker.io/prom/prometheus:v2.53.0
    container_name: kit-prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ${KIT_FILES:?KIT_FILES is unset}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

volumes:
  netbox-media:
  netbox-postgres:
  netbox-valkey:
  prometheus-data:
