<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-hidden="true">
  <rect class="dg-key" x="20" y="20" width="200" height="60" rx="8"></rect>
  <text class="dg-text" x="120" y="46" text-anchor="middle">baseline/&lt;time&gt;</text>
  <text class="dg-small" x="120" y="66" text-anchor="middle">a tag naming one commit</text>

  <path class="dg-line" d="M220,50 L280,50"></path>

  <rect class="dg-box" x="280" y="20" width="420" height="190" rx="8"></rect>
  <text class="dg-text" x="296" y="44">One commit in the network's repository</text>
  <rect class="dg-box" x="296" y="58" width="190" height="96" rx="6"></rect>
  <text class="dg-small" x="308" y="80">golden/r1.cfg</text>
  <text class="dg-small" x="308" y="100">golden/r2.cfg</text>
  <text class="dg-small" x="308" y="120">golden/s1.cfg</text>
  <text class="dg-small" x="308" y="140">… every device</text>
  <rect class="dg-box" x="496" y="58" width="190" height="96" rx="6"></rect>
  <text class="dg-small" x="508" y="80">host_vars/r1.yml</text>
  <text class="dg-small" x="508" y="100">host_vars/r2.yml</text>
  <text class="dg-small" x="508" y="120">host_vars/s1.yml</text>
  <text class="dg-small" x="508" y="140">… every device's intent</text>
  <text class="dg-small" x="296" y="176">Recorded on the commit: Baseline: earned (or denied, and why)</text>
