hostname bp-vios
!
no aaa new-model
no logging console
!
username admin privilege 15 secret 0 admin
!
ip domain-name rcn.lab
!
interface GigabitEthernet0/0
 description clab-mgmt
 no switchport
 ip address dhcp
 negotiation auto
 no shutdown
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 logging synchronous
 login local
 transport input ssh
!
end
