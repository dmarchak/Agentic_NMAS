<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Diagnose: a person picks the runbook and its target from intent, and the card lists every read on each device before anything is asked; the plan is made again at the press and refused if it moved; each device is held for the diagnosis, one at a time per device, and read through the reads engine, read-only, its counters read twice; the logs of the last hour are read from Loki; what was read is compared with intent by the rule table, and the hypotheses are ranked; the diagnosis is recorded, and the card draws it. Nothing is changed on any device."><line class="dg-lane" x1="212" y1="20" x2="212" y2="494"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You pick the runbook and target</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-intent" d="M14,84 H190 L200,94 V120 H14 Z"/><path class="dg-intent" d="M190,84 V94 H200"/><text class="dg-tb" x="107.0" y="100.0" text-anchor="middle">The plan, from intent</text><text class="dg-sm" x="107.0" y="114.0" text-anchor="middle">every read, the worst case</text><circle class="dg-num" cx="14" cy="84" r="9"/><text class="dg-numt" x="14" y="87.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="136" text-anchor="start">refused: nothing read</text><rect class="dg-band" x="0" y="150" width="400" height="160" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE RUN · A JOB, EACH DEVICE HELD</text><rect class="dg-dev" x="262" y="170" width="118" height="124" rx="5"/><rect class="dg-dev" x="274" y="293" width="8" height="5"/><rect class="dg-dev" x="288" y="293" width="8" height="5"/><rect class="dg-dev" x="302" y="293" width="8" height="5"/><text class="dg-tb" x="321.0" y="188" text-anchor="middle">Each device</text><text class="dg-sm" x="321.0" y="202" text-anchor="middle">reads only</text><circle class="dg-num" cx="22" cy="186" r="9"/><text class="dg-numt" x="22" y="189.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="190" text-anchor="start">Read, then read again</text><text class="dg-sm" x="36" y="202" text-anchor="start">10 s apart, its counters</text><path class="dg-read" d="M260,186 L208.0,186.0"/><polygon class="dg-readh" points="202.0,186.0 210.0,190.5 210.0,181.5"/><circle class="dg-num" cx="22" cy="236" r="9"/><text class="dg-numt" x="22" y="239.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="240" text-anchor="start">Logs of the last hour</text><text class="dg-sm" x="36" y="252" text-anchor="start">Loki, configuration lines</text><text class="dg-sm" x="14" y="290" text-anchor="start">a device another holds: skipped, named</text><path class="dg-box" d="M14,326 H190 L200,336 V366 H14 Z"/><path class="dg-box" d="M190,326 V336 H200"/><text class="dg-tb" x="107.0" y="344.0" text-anchor="middle">Compare with intent</text><text class="dg-sm" x="107.0" y="358.0" text-anchor="middle">the rule table, ranked</text><circle class="dg-num" cx="14" cy="326" r="9"/><text class="dg-numt" x="14" y="329.6" text-anchor="middle">5</text><rect class="dg-store" x="14" y="384" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="384" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="402.0" text-anchor="middle">The diagnosis&#x27;s record</text><text class="dg-sm" x="109.0" y="416.0" text-anchor="middle">with each read</text><circle class="dg-num" cx="14" cy="384" r="9"/><text class="dg-numt" x="14" y="387.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="446" text-anchor="start">The card draws it; History › Reads holds the reads.</text><text class="dg-sm" x="14" y="474" text-anchor="start">No device&#x27;s configuration is changed.</text></svg>
