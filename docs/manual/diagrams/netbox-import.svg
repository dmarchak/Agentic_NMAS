<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Importing into NetBox, and removing. The import builds every object from committed goldens, never from a live device. Its preview is a dry run against NetBox that writes nothing and issues a one-time confirmation bound to the plan&#x27;s hash, valid five minutes. Confirming re-plans, refuses if NetBox moved, then writes, tagging what it creates and recording what it created and what it changed. Remove deletes only objects both tagged and recorded as created by the tool, and names what NetBox would take with them."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">NETBOX</text><rect class="dg-band" x="0" y="20" width="400" height="134" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW · WRITES NOTHING</text><path class="dg-repo" d="M14,50 V82 A93.0,6 0 0 0 200,82 V50"/><ellipse class="dg-repo" cx="107.0" cy="50" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="71.0" text-anchor="middle">Goldens</text><text class="dg-sm" x="107.0" y="85.0" text-anchor="middle">committed, never a device</text><circle class="dg-num" cx="14" cy="50" r="9"/><text class="dg-numt" x="14" y="53.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,90 L107.0,102.0"/><polygon class="dg-rech" points="107.0,108.0 111.5,100.0 102.5,100.0"/><path class="dg-box" d="M14,110 H190 L200,120 V146 H14 Z"/><path class="dg-box" d="M190,110 V120 H200"/><text class="dg-tb" x="107.0" y="126.0" text-anchor="middle">Plan</text><text class="dg-sm" x="107.0" y="140.0" text-anchor="middle">and its hash</text><circle class="dg-num" cx="14" cy="110" r="9"/><text class="dg-numt" x="14" y="113.6" text-anchor="middle">2</text><rect class="dg-svc" x="250" y="70" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="86.0" text-anchor="middle">NetBox</text><text class="dg-sm" x="315.0" y="100.0" text-anchor="middle">read: the dry run</text><path class="dg-read" d="M248,88 L206.5,124.1"/><polygon class="dg-readh" points="202.0,128.0 211.0,126.1 205.1,119.4"/><rect class="dg-band" x="0" y="160" width="400" height="210" rx="6"/><text class="dg-hd" x="30" y="176" text-anchor="start">CONFIRM AND WRITE</text><rect class="dg-person" x="14" y="184" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="196.0" r="4"/><path class="dg-person" d="M23,207.0 Q30,198.0 37,207.0"/><text class="dg-tx" x="46" y="203.0" text-anchor="start">You confirm (one-time)</text><circle class="dg-num" cx="14" cy="184" r="9"/><text class="dg-numt" x="14" y="187.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="234" text-anchor="start">Re-planned; refused if NetBox moved.</text><text class="dg-sm" x="14" y="247" text-anchor="start">The master switch must be on.</text><rect class="dg-svc" x="250" y="256" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="272.0" text-anchor="middle">NetBox</text><text class="dg-sm" x="315.0" y="286.0" text-anchor="middle">writes</text><path class="dg-rec" d="M202,270 L242.0,273.5"/><polygon class="dg-rech" points="248.0,274.0 240.4,268.8 239.6,277.8"/><rect class="dg-store" x="14" y="268" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="268" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="283.0" text-anchor="middle">Created</text><text class="dg-sm" x="109.0" y="297.0" text-anchor="middle">tagged nmas-managed</text><circle class="dg-num" cx="14" cy="268" r="9"/><text class="dg-numt" x="14" y="271.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="312" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="312" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="327.0" text-anchor="middle">Modified</text><text class="dg-sm" x="109.0" y="341.0" text-anchor="middle">with what it was before</text><circle class="dg-num" cx="14" cy="312" r="9"/><text class="dg-numt" x="14" y="315.6" text-anchor="middle">5</text><rect class="dg-band" x="0" y="376" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="392" text-anchor="start">REMOVE</text><path class="dg-box" d="M14,400 H190 L200,410 V440 H14 Z"/><path class="dg-box" d="M190,400 V410 H200"/><text class="dg-tb" x="107.0" y="418.0" text-anchor="middle">Preview</text><text class="dg-sm" x="107.0" y="432.0" text-anchor="middle">tagged AND recorded only</text><circle class="dg-num" cx="14" cy="400" r="9"/><text class="dg-numt" x="14" y="403.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="462" text-anchor="start">Each delete names what NetBox takes</text><text class="dg-sm" x="14" y="475" text-anchor="start">with it; a person&#x27;s objects are skipped.</text><rect class="dg-svc" x="250" y="420" width="130" height="36" rx="18.0"/><text class="dg-tb" x="315.0" y="436.0" text-anchor="middle">NetBox</text><text class="dg-sm" x="315.0" y="450.0" text-anchor="middle">deletes</text><path class="dg-rec" d="M202,438 L242.0,438.0"/><polygon class="dg-rech" points="248.0,438.0 240.0,433.5 240.0,442.5"/><text class="dg-sm" x="14" y="506" text-anchor="start">No device is contacted by either.</text></svg>
