{
    "Dhcp4": {
        "hooks-libraries": [
            {
                "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
            }
        ],
        "interfaces-config": {
            "interfaces": [
                "enp6s19"
            ]
        },
        "control-socket": {
            "socket-type": "unix",
            "socket-name": "/run/kea/kea4-ctrl-socket"
        },
        "lease-database": {
            "type": "memfile",
            "lfc-interval": 3600,
            "name": "/var/lib/kea/kea-leases4.csv"
        },
        "valid-lifetime": 31536000,
        "renew-timer": 15768000,
        "rebind-timer": 27594000,
        "client-classes": [
            {
                "name": "nmas-discovery-pnp",
                "test": "not member('KNOWN') and pkt4.giaddr == 0.0.0.0 and pkt.iface == 'enp6s19' and substring(option[60].hex,0,8) == 'ciscopnp'",
                "valid-lifetime": 300
            },
            {
                "name": "nmas-discovery",
                "test": "not member('KNOWN') and pkt4.giaddr == 0.0.0.0 and pkt.iface == 'enp6s19'",
                "valid-lifetime": 300
            }
        ],
        "subnet4": <?include "/etc/kea/nmas/subnets4.json"?>,
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output_options": [
                    {
                        "output": "/var/log/kea/kea-dhcp4.log"
                    }
                ],
                "severity": "INFO",
                "debuglevel": 0
            }
        ]
    }
}
