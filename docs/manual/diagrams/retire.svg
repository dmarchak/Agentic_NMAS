<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" role="img" aria-label="Retiring a device: the whole exit, sending nothing to it, and leaving nothing a new device of the same name inherits. The preview checks the break-glass export holds its current credential. The apply masks credentials NetBox holds in its context where the tool wrote them, clears the credential overrides and the staged credential, removes its Kea reservations, commits the exit as you (intent, golden and template override), archives its golden tags and rollback block, withdraws its queued items, policy memberships and Topology entries, removes its heartbeat rule, sets its NetBox record to Decommissioning and renames it, removes its legacy file only if its content survives, forgets the SSH host key kept for its address, and deletes its inventory row last. NetBox keeps the record and history is kept."><line class="dg-lane" x1="212" y1="20" x2="212" y2="634"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="70" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW</text><rect class="dg-store" x="14" y="40" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="40" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="56.0" text-anchor="middle">Break-glass export</text><text class="dg-sm" x="109.0" y="70.0" text-anchor="middle">holds the current credential?</text><rect class="dg-devoff" x="240" y="36" width="140" height="40" rx="5"/><rect class="dg-devoff" x="252" y="75" width="8" height="5"/><rect class="dg-devoff" x="266" y="75" width="8" height="5"/><rect class="dg-devoff" x="280" y="75" width="8" height="5"/><text class="dg-tb" x="310.0" y="54.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="68.0" text-anchor="middle">never contacted</text><rect class="dg-band" x="0" y="96" width="400" height="472" rx="6"/><text class="dg-hd" x="30" y="112" text-anchor="start">THE APPLY · IN ORDER</text><rect class="dg-svc" x="14" y="118" width="186" height="34" rx="17.0"/><text class="dg-tb" x="107.0" y="133.0" text-anchor="middle">NetBox context</text><text class="dg-sm" x="107.0" y="147.0" text-anchor="middle">credentials masked</text><circle class="dg-num" cx="14" cy="118" r="9"/><text class="dg-numt" x="14" y="121.6" text-anchor="middle">1</text><rect class="dg-store" x="14" y="162" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="162" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="177.0" text-anchor="middle">Credentials</text><text class="dg-sm" x="109.0" y="191.0" text-anchor="middle">overrides, staged: cleared</text><circle class="dg-num" cx="14" cy="162" r="9"/><text class="dg-numt" x="14" y="165.6" text-anchor="middle">2</text><rect class="dg-svc" x="14" y="206" width="186" height="34" rx="17.0"/><text class="dg-tb" x="107.0" y="221.0" text-anchor="middle">Kea reservations</text><text class="dg-sm" x="107.0" y="235.0" text-anchor="middle">removed, recorded</text><circle class="dg-num" cx="14" cy="206" r="9"/><text class="dg-numt" x="14" y="209.6" text-anchor="middle">3</text><path class="dg-repo" d="M14,256 V288 A93.0,6 0 0 0 200,288 V256"/><ellipse class="dg-repo" cx="107.0" cy="256" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="277.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="291.0" text-anchor="middle">the exit, as you</text><circle class="dg-num" cx="14" cy="256" r="9"/><text class="dg-numt" x="14" y="259.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="304" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="304" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="319.0" text-anchor="middle">Golden tags, block</text><text class="dg-sm" x="109.0" y="333.0" text-anchor="middle">archived, kept</text><circle class="dg-num" cx="14" cy="304" r="9"/><text class="dg-numt" x="14" y="307.6" text-anchor="middle">5</text><rect class="dg-store" x="14" y="348" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="348" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="363.0" text-anchor="middle">Queue, policies, map</text><text class="dg-sm" x="109.0" y="377.0" text-anchor="middle">withdrawn, recorded</text><circle class="dg-num" cx="14" cy="348" r="9"/><text class="dg-numt" x="14" y="351.6" text-anchor="middle">6</text><rect class="dg-store" x="14" y="392" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="392" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="407.0" text-anchor="middle">Heartbeat rule</text><text class="dg-sm" x="109.0" y="421.0" text-anchor="middle">removed; host step installs</text><circle class="dg-num" cx="14" cy="392" r="9"/><text class="dg-numt" x="14" y="395.6" text-anchor="middle">7</text><rect class="dg-svc" x="14" y="436" width="186" height="34" rx="17.0"/><text class="dg-tb" x="107.0" y="451.0" text-anchor="middle">NetBox record</text><text class="dg-sm" x="107.0" y="465.0" text-anchor="middle">Decommissioning, renamed</text><circle class="dg-num" cx="14" cy="436" r="9"/><text class="dg-numt" x="14" y="439.6" text-anchor="middle">8</text><rect class="dg-store" x="14" y="480" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="480" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="495.0" text-anchor="middle">Legacy file, SSH key</text><text class="dg-sm" x="109.0" y="509.0" text-anchor="middle">removed, forgotten</text><circle class="dg-num" cx="14" cy="480" r="9"/><text class="dg-numt" x="14" y="483.6" text-anchor="middle">9</text><rect class="dg-store" x="14" y="524" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="524" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="539.0" text-anchor="middle">Inventory row</text><text class="dg-sm" x="109.0" y="553.0" text-anchor="middle">deleted last</text><circle class="dg-num" cx="14" cy="524" r="9"/><text class="dg-numt" x="14" y="527.6" text-anchor="middle">10</text><circle class="dg-no" cx="310" cy="330" r="11"/><line class="dg-nol" x1="302.5" y1="337.5" x2="317.5" y2="322.5"/><text class="dg-sm" x="310" y="356" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="369" text-anchor="middle">to the device</text><rect class="dg-band" x="0" y="574" width="400" height="60" rx="6"/><text class="dg-hd" x="30" y="590" text-anchor="start">KEPT, BY DESIGN</text><text class="dg-sm" x="14" y="604" text-anchor="start">NetBox&#x27;s record, history,</text><text class="dg-sm" x="14" y="617" text-anchor="start">archived tags: each named in the commit.</text></svg>
