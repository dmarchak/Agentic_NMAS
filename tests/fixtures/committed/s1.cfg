!
line con 0
line aux 0
line vty 0 4
 login local
 transport input telnet ssh
line vty 5 15
 login local
 transport input telnet ssh
!
ntp server 10.255.1.10
netconf-yang
event manager applet NMAS-HEARTBEAT
 event timer watchdog time 300
 action 1.0 syslog priority notifications msg "NMAS-HEARTBEAT"
!
end
