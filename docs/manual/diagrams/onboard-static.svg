<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="Static address: a person applies the bootstrap configuration. The tool renders it on request, as a recorded reveal, carrying the one-time bootstrap credential in the clear. You download it and paste it at the device&#x27;s console, or place it as its startup configuration. The device boots on its static address; Verify then reaches it over SSH. The tool sends nothing to the device until Verify."><line class="dg-lane" x1="150" y1="20" x2="150" y2="354"/><line class="dg-lane" x1="268" y1="20" x2="268" y2="354"/><text class="dg-hd" x="75.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="209.0" y="12" text-anchor="middle">A PERSON</text><text class="dg-hd" x="334.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="140" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">GET THE FILE</text><path class="dg-box" d="M8,44 H134 L144,54 V84 H8 Z"/><path class="dg-box" d="M134,44 V54 H144"/><text class="dg-tb" x="76.0" y="62.0" text-anchor="middle">Bootstrap config</text><text class="dg-sm" x="76.0" y="76.0" text-anchor="middle">rendered now</text><circle class="dg-num" cx="8" cy="44" r="9"/><text class="dg-numt" x="8" y="47.6" text-anchor="middle">1</text><rect class="dg-store" x="8" y="96" width="136" height="34" rx="3"/><rect class="dg-bar" x="8" y="96" width="4" height="34" rx="1"/><text class="dg-tb" x="78.0" y="111.0" text-anchor="middle">Reveal row</text><text class="dg-sm" x="78.0" y="125.0" text-anchor="middle">who, when</text><path class="dg-rec" d="M146,64 L150.0,64.0"/><polygon class="dg-rech" points="156.0,64.0 148.0,59.5 148.0,68.5"/><rect class="dg-person" x="158" y="50" width="104" height="28" rx="14.0"/><circle class="dg-person" cx="174" cy="61.0" r="4"/><path class="dg-person" d="M167,72.0 Q174,63.0 181,72.0"/><text class="dg-tx" x="190" y="68.0" text-anchor="start">You</text><rect class="dg-band" x="0" y="166" width="400" height="110" rx="6"/><text class="dg-hd" x="30" y="182" text-anchor="start">APPLY IT</text><path class="dg-send" d="M262,200 L268.0,200.0"/><polygon class="dg-sendh" points="274.0,200.0 266.0,195.5 266.0,204.5"/><rect class="dg-dev" x="276" y="184" width="118" height="44" rx="5"/><rect class="dg-dev" x="288" y="227" width="8" height="5"/><rect class="dg-dev" x="302" y="227" width="8" height="5"/><rect class="dg-dev" x="316" y="227" width="8" height="5"/><text class="dg-tb" x="335.0" y="204.0" text-anchor="middle">The device</text><text class="dg-sm" x="335.0" y="218.0" text-anchor="middle">console paste</text><circle class="dg-num" cx="276" cy="184" r="9"/><text class="dg-numt" x="276" y="187.6" text-anchor="middle">2</text><text class="dg-sm" x="158" y="246" text-anchor="start">Paste, or place as</text><text class="dg-sm" x="158" y="259" text-anchor="start">its startup config.</text><rect class="dg-band" x="0" y="282" width="400" height="72" rx="6"/><text class="dg-hd" x="30" y="298" text-anchor="start">THEN VERIFY</text><path class="dg-read" d="M274,326 L152.0,326.0"/><polygon class="dg-readh" points="146.0,326.0 154.0,330.5 154.0,321.5"/><text class="dg-tb" x="8" y="322" text-anchor="start">Verify reaches it</text><text class="dg-sm" x="8" y="336" text-anchor="start">over SSH</text><circle class="dg-no" cx="335" cy="96" r="11"/><line class="dg-nol" x1="327.5" y1="103.5" x2="342.5" y2="88.5"/><text class="dg-sm" x="335" y="122" text-anchor="middle">nothing sent</text><text class="dg-sm" x="335" y="135" text-anchor="middle">by the tool</text></svg>
