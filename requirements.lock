# requirements.lock: the versions the DEPLOYMENT HOST runs (register C37).
#
# Generated by scripts/nmas-lock-from-host on the host (Python 3.12.3), for every
# distribution the code imports or the suite loads, plus the host's own
# dependency closure of those. CI installs THIS file, so a green run describes
# the machine that runs in production. requirements.txt describes no machine:
# see docs/OPEN_FINDINGS.md C37 for the measured differences.
#
# Absent here by design: minio. Where Ubuntu ships a package with no
# Python dependency metadata (netmiko, pysnmp, scp, textfsm), its Debian
# dependencies are followed instead, and a module with no distribution (cffi)
# carries Debian's version. INSTALL WITH --no-deps: PyPI's metadata refuses
# combinations the host really runs (netmiko 4.3.0 with textfsm 1.1.2).
