!
interface Loopback0
 description mgmt identity
 ip address 10.255.1.12 255.255.255.255
 ipv6 address 2001:DB8:1::12/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet1
 description Containerlab management interface
 vrf forwarding clab-mgmt
 ip address 192.0.2.15 255.255.255.0
 negotiation auto
 ipv6 address 2001:DB8::2/64
 no mop enabled
 no mop sysid
!
interface GigabitEthernet2
 description s4 Gi1/0 - VLAN 100 CORE
 ip address 10.255.3.12 255.255.255.0
 ip ospf priority 100
 negotiation auto
 ipv6 address 2001:DB8:3::12/64
 ipv6 ospf 1 area 0
 no mop enabled
 no mop sysid
!
interface GigabitEthernet3
 description P2P to s2 Gi0/2 - RIPng
 ip address 10.255.2.12 255.255.255.254
 negotiation auto
 ipv6 address 2001:DB8:2:C::1/64
 ipv6 rip RCN enable
 ipv6 rip RCN default-information originate
 no mop enabled
 no mop sysid
!
router ospf 1
 router-id 10.255.1.12
 max-metric router-lsa external-lsa on-startup 5
 redistribute rip
 passive-interface Loopback0
 network 10.255.1.12 0.0.0.0 area 0
 network 10.255.3.0 0.0.0.255 area 0
!
router rip
 version 2
 passive-interface default
 no passive-interface GigabitEthernet3
 network 192.0.2.0
 default-information originate
 no auto-summary
!
ip forward-protocol nd
no ip http server
ip http secure-server
!
ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 192.0.2.2
ip ssh maxstartups 128
ip ssh server algorithm mac hmac-sha2-512
!
!
ip sla 1
 icmp-echo 10.255.1.13 source-interface Loopback0
  frequency 10
ip sla schedule 1 life forever start-time now
logging trap notifications
logging origin-id hostname
logging source-interface Loopback0
logging host 10.255.1.10
ipv6 route vrf clab-mgmt ::/0 2001:DB8::1
ipv6 router ospf 1
 router-id 10.255.1.12
 max-metric router-lsa on-startup 5
 redistribute rip RCN include-connected
!
ipv6 router rip RCN
!
!
snmp-server community <redacted:snmp_community> RO
snmp-server trap-source Loopback0
snmp-server location containerlab-rcn-lab1
snmp-server contact noc
snmp-server enable traps snmp linkdown linkup
snmp-server host 10.255.1.10 version 2c <redacted:snmp_community> 
snmp ifmib ifindex persist
!
!
!
control-plane
!
!
mgcp behavior rsip-range tgcp-only
mgcp behavior comedia-role none
mgcp behavior comedia-check-media-src disable
mgcp behavior comedia-sdp-force disable
!
mgcp profile default
!
!
!
!
!
!
line con 0
 logging synchronous
 login local
 stopbits 1
line aux 0
line vty 0 4
 logging synchronous
 login local
 length 0
 transport input all
!
call-home
 ! If contact email address in call-home is configured as sch-smart-licensing@cisco.com
 ! the email address configured in Cisco Smart License Portal will be used as contact email address to send SCH notifications.
 contact-email-addr sch-smart-licensing@cisco.com
 profile "CiscoTAC-1"
  active
  destination transport-method http
ntp server 10.255.1.10
!
netconf detailed-error
netconf max-sessions 16
!
!
!
!
event manager applet NMAS-HEARTBEAT
 event timer watchdog time 300
 action 1.0 syslog priority notifications msg "NMAS-HEARTBEAT"
!
telemetry ietf subscription 101
 encoding encode-kvgpb
 filter xpath /process-cpu-ios-xe-oper:cpu-usage/cpu-utilization
 stream yang-push
 update-policy periodic 1000
 receiver ip address 10.255.1.10 57000 protocol grpc-tcp
telemetry ietf subscription 102
 encoding encode-kvgpb
 filter xpath /interfaces-ios-xe-oper:interfaces/interface/statistics
 stream yang-push
 update-policy periodic 1000
 receiver ip address 10.255.1.10 57000 protocol grpc-tcp
netconf-yang
restconf
end
