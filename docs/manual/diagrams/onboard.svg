<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 612" role="img" aria-label="Onboarding in two phases. Phase one, Create, sends nothing: it stages a bootstrap credential, commits the device as pending with its bootstrap intent, writes a Kea reservation for ZTP, and renders the bootstrap config. The device boots on that config. Phase two, Verify, holds the device: it signs in and reads its configuration, sends a new credential, the RW community&#x27;s removal, the monitoring profile and a save, reads it again for its first golden, records it in NetBox and adds it to the inventory last."><line class="dg-lane" x1="212" y1="20" x2="212" y2="606"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="232" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PHASE ONE · CREATE · NOTHING SENT</text><rect class="dg-store" x="14" y="46" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="46" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="61.0" text-anchor="middle">Credential store</text><text class="dg-sm" x="109.0" y="75.0" text-anchor="middle">bootstrap credential, staged</text><circle class="dg-num" cx="14" cy="46" r="9"/><text class="dg-numt" x="14" y="49.6" text-anchor="middle">1</text><path class="dg-repo" d="M14,96 V130 A93.0,6 0 0 0 200,130 V96"/><ellipse class="dg-repo" cx="107.0" cy="96" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="118.0" text-anchor="middle">Repository</text><text class="dg-sm" x="107.0" y="132.0" text-anchor="middle">bootstrap intent · pending</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><rect class="dg-svc" x="14" y="146" width="186" height="32" rx="16.0"/><text class="dg-tb" x="107.0" y="160.0" text-anchor="middle">Kea  (ZTP only)</text><text class="dg-sm" x="107.0" y="174.0" text-anchor="middle">the reservation, tested first</text><circle class="dg-num" cx="14" cy="146" r="9"/><text class="dg-numt" x="14" y="149.6" text-anchor="middle">3</text><path class="dg-box" d="M14,188 H190 L200,198 V228 H14 Z"/><path class="dg-box" d="M190,188 V198 H200"/><text class="dg-tb" x="107.0" y="206.0" text-anchor="middle">Bootstrap config</text><text class="dg-sm" x="107.0" y="220.0" text-anchor="middle">rendered, with the credential</text><circle class="dg-num" cx="14" cy="188" r="9"/><text class="dg-numt" x="14" y="191.6" text-anchor="middle">4</text><rect class="dg-devoff" x="240" y="64" width="140" height="48" rx="5"/><rect class="dg-devoff" x="252" y="111" width="8" height="5"/><rect class="dg-devoff" x="266" y="111" width="8" height="5"/><rect class="dg-devoff" x="280" y="111" width="8" height="5"/><text class="dg-tb" x="310.0" y="86.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="100.0" text-anchor="middle">not booted yet</text><circle class="dg-no" cx="310" cy="158" r="11"/><line class="dg-nol" x1="302.5" y1="165.5" x2="317.5" y2="150.5"/><text class="dg-sm" x="310" y="184" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="197" text-anchor="middle">in phase one</text><rect class="dg-band" x="0" y="258" width="400" height="74" rx="6"/><text class="dg-hd" x="30" y="274" text-anchor="start">BETWEEN · THE DEVICE BOOTS</text><path class="dg-rec" d="M200,214 Q226,214 238.9,286.1"/><polygon class="dg-rech" points="240.0,292.0 243.0,283.3 234.2,284.9"/><rect class="dg-dev" x="240" y="272" width="140" height="48" rx="5"/><rect class="dg-dev" x="252" y="319" width="8" height="5"/><rect class="dg-dev" x="266" y="319" width="8" height="5"/><rect class="dg-dev" x="280" y="319" width="8" height="5"/><text class="dg-tb" x="310.0" y="294.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="308.0" text-anchor="middle">boots on the bootstrap</text><text class="dg-sm" x="14" y="290" text-anchor="start">Static, DHCP: a person applies the file.</text><text class="dg-sm" x="14" y="303" text-anchor="start">ZTP: the tool&#x27;s TFTP responder serves it.</text><text class="dg-sm" x="14" y="320" text-anchor="start">Pending: in git, not in the inventory.</text><rect class="dg-band" x="0" y="338" width="400" height="268" rx="6"/><text class="dg-hd" x="30" y="354" text-anchor="start">PHASE TWO · VERIFY · HOLDING THE DEVICE</text><rect class="dg-dev" x="262" y="360" width="118" height="172" rx="5"/><rect class="dg-dev" x="274" y="531" width="8" height="5"/><rect class="dg-dev" x="288" y="531" width="8" height="5"/><rect class="dg-dev" x="302" y="531" width="8" height="5"/><text class="dg-tb" x="321.0" y="378" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="392" text-anchor="middle">one session</text><circle class="dg-num" cx="22" cy="376" r="9"/><text class="dg-numt" x="22" y="379.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="380" text-anchor="start">Sign in</text><text class="dg-sm" x="36" y="392" text-anchor="start">with the staged credential</text><path class="dg-read" d="M260,376 L208.0,376.0"/><polygon class="dg-readh" points="202.0,376.0 210.0,380.5 210.0,371.5"/><circle class="dg-num" cx="22" cy="404" r="9"/><text class="dg-numt" x="22" y="407.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="408" text-anchor="start">Capture</text><text class="dg-sm" x="36" y="420" text-anchor="start">held in memory, not recorded</text><path class="dg-read" d="M260,404 L208.0,404.0"/><polygon class="dg-readh" points="202.0,404.0 210.0,408.5 210.0,399.5"/><circle class="dg-num" cx="22" cy="432" r="9"/><text class="dg-numt" x="22" y="435.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="436" text-anchor="start">Rotate</text><text class="dg-sm" x="36" y="448" text-anchor="start">a credential the device hashes</text><path class="dg-send" d="M202,432 L254.0,432.0"/><polygon class="dg-sendh" points="260.0,432.0 252.0,427.5 252.0,436.5"/><circle class="dg-num" cx="22" cy="458" r="9"/><text class="dg-numt" x="22" y="461.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="462" text-anchor="start">Remove RW community</text><path class="dg-send" d="M202,458 L254.0,458.0"/><polygon class="dg-sendh" points="260.0,458.0 252.0,453.5 252.0,462.5"/><circle class="dg-num" cx="22" cy="480" r="9"/><text class="dg-numt" x="22" y="483.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="484" text-anchor="start">Monitoring profile</text><path class="dg-send" d="M202,480 L254.0,480.0"/><polygon class="dg-sendh" points="260.0,480.0 252.0,475.5 252.0,484.5"/><circle class="dg-num" cx="22" cy="502" r="9"/><text class="dg-numt" x="22" y="505.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="506" text-anchor="start">Save</text><text class="dg-sm" x="36" y="518" text-anchor="start">then read startup back</text><path class="dg-send" d="M202,502 L254.0,502.0"/><polygon class="dg-sendh" points="260.0,502.0 252.0,497.5 252.0,506.5"/><circle class="dg-num" cx="22" cy="530" r="9"/><text class="dg-numt" x="22" y="533.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="534" text-anchor="start">Read again</text><path class="dg-read" d="M260,530 L208.0,530.0"/><polygon class="dg-readh" points="202.0,530.0 210.0,534.5 210.0,525.5"/><path class="dg-golden" d="M14,552 H92 L102,562 V592 H14 Z"/><path class="dg-golden" d="M92,552 V562 H102"/><text class="dg-tb" x="58.0" y="570.0" text-anchor="middle">Golden</text><text class="dg-sm" x="58.0" y="584.0" text-anchor="middle">the first one</text><rect class="dg-svc" x="110" y="555" width="84" height="34" rx="17.0"/><text class="dg-tb" x="152.0" y="576.0" text-anchor="middle">NetBox</text><circle class="dg-num" cx="110" cy="555" r="9"/><text class="dg-numt" x="110" y="558.6" text-anchor="middle">8</text><rect class="dg-store" x="204" y="552" width="130" height="40" rx="3"/><rect class="dg-bar" x="204" y="552" width="4" height="40" rx="1"/><text class="dg-tb" x="271.0" y="570.0" text-anchor="middle">Inventory</text><text class="dg-sm" x="271.0" y="584.0" text-anchor="middle">promoted, last</text><circle class="dg-num" cx="204" cy="552" r="9"/><text class="dg-numt" x="204" y="555.6" text-anchor="middle">9</text></svg>
