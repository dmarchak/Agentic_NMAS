<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Approve a self-healing proposal: self-healing found a fix that needs a person and recorded it with its program and hash, sending nothing; its card on Needs attention says what happened, whether it needs you, the fix, what it affects, how Mercury checks it worked and what happens if you don&#x27;t, the program one press away; you approve by the proposal&#x27;s hash, a reason optional unless a line needs one, or decline with a reason, which sends nothing; approved, a job takes the proposal once and, holding the device as you, reads it again, recomputes the program and refuses if its hash moved, applies it through the deploy pipeline, then sends the measured reset and reads the adjacencies back; a failure before the reset puts the change back; the outcome is recorded and History shows it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The proposal</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">its program and hash</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">recorded; nothing sent</text><path class="dg-box" d="M14,110 H190 L200,120 V146 H14 Z"/><path class="dg-box" d="M190,110 V120 H200"/><text class="dg-tb" x="107.0" y="126.0" text-anchor="middle">Its card</text><text class="dg-sm" x="107.0" y="140.0" text-anchor="middle">what happened, the fix</text><circle class="dg-num" cx="14" cy="110" r="9"/><text class="dg-numt" x="14" y="113.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="160" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="172.0" r="4"/><path class="dg-person" d="M23,183.0 Q30,174.0 37,183.0"/><text class="dg-tx" x="46" y="179.0" text-anchor="start">You approve, by its hash</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="206" text-anchor="start">or decline: nothing is sent</text><rect class="dg-band" x="0" y="222" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="238" text-anchor="start">THE HEAL · A JOB, AS YOU, THE DEVICE HELD</text><rect class="dg-dev" x="262" y="300" width="118" height="120" rx="5"/><rect class="dg-dev" x="274" y="419" width="8" height="5"/><rect class="dg-dev" x="288" y="419" width="8" height="5"/><rect class="dg-dev" x="302" y="419" width="8" height="5"/><text class="dg-tb" x="321.0" y="318" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="332" text-anchor="middle">the fix</text><circle class="dg-num" cx="22" cy="258" r="9"/><text class="dg-numt" x="22" y="261.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="262" text-anchor="start">Read again, hash compared</text><text class="dg-sm" x="36" y="274" text-anchor="start">a moved hash sends nothing</text><path class="dg-read" d="M260,258 L208.0,258.0"/><polygon class="dg-readh" points="202.0,258.0 210.0,262.5 210.0,253.5"/><circle class="dg-num" cx="22" cy="308" r="9"/><text class="dg-numt" x="22" y="311.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="312" text-anchor="start">Applied as you</text><text class="dg-sm" x="36" y="324" text-anchor="start">the deploy&#x27;s nine stages</text><circle class="dg-num" cx="22" cy="348" r="9"/><text class="dg-numt" x="22" y="351.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="352" text-anchor="start">The measured reset</text><text class="dg-sm" x="36" y="364" text-anchor="start">only its prompt answered</text><rect class="dg-store" x="14" y="400" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="400" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="418.0" text-anchor="middle">The outcome&#x27;s record</text><text class="dg-sm" x="109.0" y="432.0" text-anchor="middle">who, why, each step</text><circle class="dg-num" cx="14" cy="400" r="9"/><text class="dg-numt" x="14" y="403.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="464" text-anchor="start">History shows it.</text><text class="dg-sm" x="14" y="490" text-anchor="start">Rollback: the change put back if a step</text><text class="dg-sm" x="14" y="503" text-anchor="start">fails before the reset; a reset</text><text class="dg-sm" x="14" y="516" text-anchor="start">cannot be undone.</text></svg>
