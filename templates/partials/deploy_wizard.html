{# Deploy from template — Phase 3c.

   Per-device diff, per-device confirmation, per-device outcome. A device you
   do not tick is not touched, and every device in a batch appears in the
   result — deployed, skipped, refused, failed or unattempted. #}

<div id="deployWizard" class="mb-3" data-list-name="{{ current_list }}"></div>

<div class="modal fade" id="deployPlanModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Deploy from template</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="deployPlanBody"></div>
      <div class="modal-footer d-block">
        <div class="small text-muted mb-2" id="deployPlanSummary"></div>
        <div class="text-end">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="deployApplyBtn"
                  onclick="applyDeploy()" disabled>Deploy confirmed devices</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/gen/partials__deploy_wizard.1.js') }}"></script>
