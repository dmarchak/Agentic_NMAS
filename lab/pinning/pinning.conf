# The lab's CPU pinning (C1485, the tuning sprint, 2026-10-21), read by pin-pit-threads.sh and
# check-pinning.sh: each switch's own lab-VM CPU, and the set every router and host keeps to.
# The same values as rcn-lab1.clab.yml's cpu-set lines (lab/pinning/cpuset.diff, lab repo
# 33916b7).
LAB_PREFIX=clab-rcn-lab1
SWITCHES="s1:20 s2:21 s3:22 s4:23"
SWITCH_SET=20-23
OTHERS_SET=0-19
OTHERS="r1 r2 r3 r4 r5 r6 r7 r8 h1 h2 h3 h4 h5 web"
# The lab file, in the home of the user who runs the lab (the one who ran sudo, else this one).
LAB_FILE=${LAB_FILE:-$(getent passwd "${SUDO_USER:-$(id -un)}" | cut -d: -f6)/labs/lab/rcn-lab1.clab.yml}
