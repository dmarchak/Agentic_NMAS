<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Reloading a device. The preview reads it (running and startup configurations, its image and boot variable) and judges six gates: it boots what it runs, its golden and intent, startup carries Mercury&#x27;s credential, the image exists, nothing holds it, and what else Mercury loses reach to. You confirm with a reason. The run reads it again and sends nothing if it moved, declares the planned-restart window before anything is sent, reloads, waits for SSH within the bound, verifies it runs what it ran, and records the run. A reload cannot be undone."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V80 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="58.0" text-anchor="middle">The preview reads it</text><text class="dg-sm" x="107.0" y="72.0" text-anchor="middle">six gates, by name</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="96" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="108.0" r="4"/><path class="dg-person" d="M23,119.0 Q30,110.0 37,119.0"/><text class="dg-tx" x="46" y="115.0" text-anchor="start">You confirm, with a reason</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><path class="dg-rec" d="M107,128 L107.0,142.0"/><polygon class="dg-rech" points="107.0,148.0 111.5,140.0 102.5,140.0"/><rect class="dg-band" x="0" y="150" width="400" height="300" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE RUN · A JOB, THE DEVICE HELD</text><rect class="dg-dev" x="262" y="172" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="321" width="8" height="5"/><rect class="dg-dev" x="288" y="321" width="8" height="5"/><rect class="dg-dev" x="302" y="321" width="8" height="5"/><text class="dg-tb" x="321.0" y="190" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="204" text-anchor="middle">restarts</text><circle class="dg-num" cx="22" cy="170" r="9"/><text class="dg-numt" x="22" y="173.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="174" text-anchor="start">Read again</text><text class="dg-sm" x="36" y="186" text-anchor="start">moved: nothing sent</text><path class="dg-read" d="M260,170 L208.0,170.0"/><polygon class="dg-readh" points="202.0,170.0 210.0,174.5 210.0,165.5"/><circle class="dg-num" cx="22" cy="206" r="9"/><text class="dg-numt" x="22" y="209.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="210" text-anchor="start">Window declared</text><text class="dg-sm" x="36" y="222" text-anchor="start">before anything is sent</text><circle class="dg-num" cx="22" cy="242" r="9"/><text class="dg-numt" x="22" y="245.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="246" text-anchor="start">Reload</text><text class="dg-sm" x="36" y="258" text-anchor="start">the session drops</text><path class="dg-send" d="M202,242 L254.0,242.0"/><polygon class="dg-sendh" points="260.0,242.0 252.0,237.5 252.0,246.5"/><circle class="dg-num" cx="22" cy="278" r="9"/><text class="dg-numt" x="22" y="281.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="282" text-anchor="start">Back, verified</text><text class="dg-sm" x="36" y="294" text-anchor="start">runs what it ran</text><path class="dg-read" d="M260,278 L208.0,278.0"/><polygon class="dg-readh" points="202.0,278.0 210.0,282.5 210.0,273.5"/><path class="dg-repo" d="M14,336 V364 A93.0,6 0 0 0 200,364 V336"/><ellipse class="dg-repo" cx="107.0" cy="336" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="355.0" text-anchor="middle">The reload&#x27;s record</text><text class="dg-sm" x="107.0" y="369.0" text-anchor="middle">and its restart, in History</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">7</text><text class="dg-sm" x="14" y="400" text-anchor="start">Not back within the bound:</text><text class="dg-sm" x="14" y="413" text-anchor="start">its break-glass record, the console.</text></svg>
