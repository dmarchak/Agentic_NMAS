hostname bp-eem-vios
!
no aaa new-model
no logging console
logging buffered 64000 debugging
!
username admin privilege 15 secret 0 admin
!
ip domain-name rcn.lab
!
interface GigabitEthernet0/0
 description clab-mgmt
 no switchport
 ip address dhcp
 negotiation auto
 no shutdown
!
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface Loopback0
 ip address 10.255.9.1 255.255.255.255
!
logging trap notifications
logging origin-id hostname
logging source-interface Loopback0
logging host 172.30.70.1
!
event manager applet NMAS-HEARTBEAT
 event timer watchdog time 300
 action 1.0 syslog priority notifications msg "NMAS-HEARTBEAT"
!
line vty 0 4
 logging synchronous
 login local
 transport input ssh
!
end
