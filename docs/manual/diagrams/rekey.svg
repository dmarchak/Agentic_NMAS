<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Re-keying a device. Every session compares the SSH host key the device presents with the one Mercury holds, before any credential is sent: the first contact keeps it, a different key is refused naming both. The re-key&#x27;s preview reads the key the device presents now with no credential and shows it beside the held one, with any restart recorded since. You confirm both keys. The apply holds the device, reads the key again and keeps nothing if it moved, replaces the held key, reads the record back, and keeps the old key in the record&#x27;s history."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="116" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">EVERY SESSION</text><rect class="dg-dev" x="262" y="40" width="118" height="80" rx="5"/><rect class="dg-dev" x="274" y="119" width="8" height="5"/><rect class="dg-dev" x="288" y="119" width="8" height="5"/><rect class="dg-dev" x="302" y="119" width="8" height="5"/><text class="dg-tb" x="321.0" y="58" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="72" text-anchor="middle">presents its key</text><text class="dg-tb" x="36" y="76" text-anchor="start">Its key, compared</text><text class="dg-sm" x="36" y="88" text-anchor="start">before any credential</text><path class="dg-read" d="M260,72 L208.0,72.0"/><polygon class="dg-readh" points="202.0,72.0 210.0,76.5 210.0,67.5"/><text class="dg-sm" x="36" y="108" text-anchor="start">Different: refused, nothing sent</text><path class="dg-box" d="M14,150 H190 L200,160 V190 H14 Z"/><path class="dg-box" d="M190,150 V160 H200"/><text class="dg-tb" x="107.0" y="168.0" text-anchor="middle">The preview reads it</text><text class="dg-sm" x="107.0" y="182.0" text-anchor="middle">the key now, no credential</text><circle class="dg-num" cx="14" cy="150" r="9"/><text class="dg-numt" x="14" y="153.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="204" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="216.0" r="4"/><path class="dg-person" d="M23,227.0 Q30,218.0 37,227.0"/><text class="dg-tx" x="46" y="223.0" text-anchor="start">You confirm both keys</text><circle class="dg-num" cx="14" cy="204" r="9"/><text class="dg-numt" x="14" y="207.6" text-anchor="middle">2</text><path class="dg-rec" d="M107,236 L107.0,250.0"/><polygon class="dg-rech" points="107.0,256.0 111.5,248.0 102.5,248.0"/><rect class="dg-band" x="0" y="258" width="400" height="200" rx="6"/><text class="dg-hd" x="30" y="274" text-anchor="start">THE APPLY · THE DEVICE HELD</text><rect class="dg-dev" x="262" y="280" width="118" height="60" rx="5"/><rect class="dg-dev" x="274" y="339" width="8" height="5"/><rect class="dg-dev" x="288" y="339" width="8" height="5"/><rect class="dg-dev" x="302" y="339" width="8" height="5"/><text class="dg-tb" x="321.0" y="298" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="310" r="9"/><text class="dg-numt" x="22" y="313.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="314" text-anchor="start">Read again</text><text class="dg-sm" x="36" y="326" text-anchor="start">moved: nothing kept</text><path class="dg-read" d="M260,310 L208.0,310.0"/><polygon class="dg-readh" points="202.0,310.0 210.0,314.5 210.0,305.5"/><rect class="dg-store" x="14" y="344" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="344" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="362.0" text-anchor="middle">The held key replaced</text><text class="dg-sm" x="109.0" y="376.0" text-anchor="middle">if it is still the one shown</text><circle class="dg-num" cx="14" cy="344" r="9"/><text class="dg-numt" x="14" y="347.6" text-anchor="middle">4</text><rect class="dg-store" x="14" y="398" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="398" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="416.0" text-anchor="middle">Read back, recorded</text><text class="dg-sm" x="109.0" y="430.0" text-anchor="middle">the old key in its history</text><circle class="dg-num" cx="14" cy="398" r="9"/><text class="dg-numt" x="14" y="401.6" text-anchor="middle">5</text></svg>
