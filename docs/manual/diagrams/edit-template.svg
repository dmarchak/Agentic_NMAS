<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Editing a template. The editor opens the template committed at HEAD and the blob it was read from. As you type it is checked: its syntax, then your edit rendered for every device it governs, in a copy of the library outside the repository, against that device&#x27;s committed golden, each failing line named. You commit with a reason, as you; a template moved since you opened it is refused naming both versions. The commit revokes every approval over the template, said before you commit. No device is contacted."><line class="dg-lane" x1="212" y1="20" x2="212" y2="434"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-repo" d="M14,46 V74 A93.0,6 0 0 0 200,74 V46"/><ellipse class="dg-repo" cx="107.0" cy="46" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="65.0" text-anchor="middle">The committed template</text><text class="dg-sm" x="107.0" y="79.0" text-anchor="middle">and its blob</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,82 L107.0,96.0"/><polygon class="dg-rech" points="107.0,102.0 111.5,94.0 102.5,94.0"/><path class="dg-box" d="M14,104 H190 L200,114 V144 H14 Z"/><path class="dg-box" d="M190,104 V114 H200"/><text class="dg-tb" x="107.0" y="122.0" text-anchor="middle">Your edit, checked</text><text class="dg-sm" x="107.0" y="136.0" text-anchor="middle">each device&#x27;s golden</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="160" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="172.0" r="4"/><path class="dg-person" d="M23,183.0 Q30,174.0 37,183.0"/><text class="dg-tx" x="46" y="179.0" text-anchor="start">You commit, as you</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">3</text><path class="dg-rec" d="M107,192 L107.0,206.0"/><polygon class="dg-rech" points="107.0,212.0 111.5,204.0 102.5,204.0"/><path class="dg-repo" d="M14,220 V248 A93.0,6 0 0 0 200,248 V220"/><ellipse class="dg-repo" cx="107.0" cy="220" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="239.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="253.0" text-anchor="middle">the template, approvals revoked</text><circle class="dg-num" cx="14" cy="214" r="9"/><text class="dg-numt" x="14" y="217.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="284" text-anchor="start">Moved since you opened it:</text><text class="dg-sm" x="14" y="297" text-anchor="start">refused, both versions named.</text><rect class="dg-devoff" x="240" y="60" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="103" width="8" height="5"/><rect class="dg-devoff" x="266" y="103" width="8" height="5"/><rect class="dg-devoff" x="280" y="103" width="8" height="5"/><text class="dg-tb" x="310.0" y="80.0" text-anchor="middle">The devices</text><text class="dg-sm" x="310.0" y="94.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="200" r="11"/><line class="dg-nol" x1="302.5" y1="207.5" x2="317.5" y2="192.5"/><text class="dg-sm" x="310" y="226" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="239" text-anchor="middle">a deploy does that</text></svg>
