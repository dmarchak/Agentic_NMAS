<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="A policy in words on SDN › Policies: quoted text is held back; every name is resolved in code against the committed NSOT export and the controller&#x27;s learned hosts, a word naming several hosts asked back and an unknown one refused, with no call; one recorded, capped AI call returns a structured policy only; code checks it (names, impossible, contradictory within the request and against committed policies, the installed flows, the protected flows) before any flow is shown; it is compiled on the source&#x27;s ingress switch and previewed by the flow-operation core; you confirm, bound to the requests&#x27; hash; every check runs again, the switch is held, each request is sent through the controller and the table read back, a failure rolled back; each flow is recorded as the policy, and later requests are checked against it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE CONTROLLER</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">Names, in code</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">NetBox and the controller</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">asked or refused: no call</text><path class="dg-box" d="M14,110 H190 L200,120 V146 H14 Z"/><path class="dg-box" d="M190,110 V120 H200"/><text class="dg-tb" x="107.0" y="126.0" text-anchor="middle">One AI call</text><text class="dg-sm" x="107.0" y="140.0" text-anchor="middle">a structured policy only</text><circle class="dg-num" cx="14" cy="110" r="9"/><text class="dg-numt" x="14" y="113.6" text-anchor="middle">2</text><path class="dg-box" d="M14,160 H190 L200,170 V196 H14 Z"/><path class="dg-box" d="M190,160 V170 H200"/><text class="dg-tb" x="107.0" y="176.0" text-anchor="middle">Every check, in code</text><text class="dg-sm" x="107.0" y="190.0" text-anchor="middle">before any flow is shown</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">3</text><path class="dg-box" d="M14,210 H190 L200,220 V246 H14 Z"/><path class="dg-box" d="M190,210 V220 H200"/><text class="dg-tb" x="107.0" y="226.0" text-anchor="middle">Compiled and previewed</text><text class="dg-sm" x="107.0" y="240.0" text-anchor="middle">the requests and their hash</text><circle class="dg-num" cx="14" cy="210" r="9"/><text class="dg-numt" x="14" y="213.6" text-anchor="middle">4</text><rect class="dg-person" x="14" y="260" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="272.0" r="4"/><path class="dg-person" d="M23,283.0 Q30,274.0 37,283.0"/><text class="dg-tx" x="46" y="279.0" text-anchor="start">You confirm, bound to the hash</text><circle class="dg-num" cx="14" cy="260" r="9"/><text class="dg-numt" x="14" y="263.6" text-anchor="middle">5</text><rect class="dg-band" x="0" y="306" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="322" text-anchor="start">THE APPLY · THE SWITCH HELD</text><rect class="dg-dev" x="262" y="382" width="118" height="140" rx="5"/><rect class="dg-dev" x="274" y="521" width="8" height="5"/><rect class="dg-dev" x="288" y="521" width="8" height="5"/><rect class="dg-dev" x="302" y="521" width="8" height="5"/><text class="dg-tb" x="321.0" y="400" text-anchor="middle">The controller</text><text class="dg-sm" x="321.0" y="414" text-anchor="middle">and its switch</text><circle class="dg-num" cx="22" cy="326" r="9"/><text class="dg-numt" x="22" y="329.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="330" text-anchor="start">Checked again</text><text class="dg-sm" x="36" y="342" text-anchor="start">the same requests compiled</text><circle class="dg-num" cx="22" cy="368" r="9"/><text class="dg-numt" x="22" y="371.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="372" text-anchor="start">Each request sent</text><text class="dg-sm" x="36" y="384" text-anchor="start">exactly the rendered body</text><circle class="dg-num" cx="22" cy="410" r="9"/><text class="dg-numt" x="22" y="413.6" text-anchor="middle">8</text><text class="dg-tb" x="36" y="414" text-anchor="start">Verified</text><text class="dg-sm" x="36" y="426" text-anchor="start">the table read back</text><path class="dg-read" d="M260,410 L208.0,410.0"/><polygon class="dg-readh" points="202.0,410.0 210.0,414.5 210.0,405.5"/><text class="dg-sm" x="14" y="470" text-anchor="start">A failure rolls back what landed.</text><rect class="dg-store" x="14" y="486" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="486" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="504.0" text-anchor="middle">The flow intent</text><text class="dg-sm" x="109.0" y="518.0" text-anchor="middle">each flow, as the policy</text><circle class="dg-num" cx="14" cy="486" r="9"/><text class="dg-numt" x="14" y="489.6" text-anchor="middle">9</text><text class="dg-sm" x="14" y="546" text-anchor="start">Later requests are checked against it.</text></svg>
