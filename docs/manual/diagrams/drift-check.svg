<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="The drift check. It reads the inventory, never the golden store, so every device lands in exactly one bucket: checked, no golden, stale, or not read. For each device it reads the running configuration and compares it with its committed golden, ignoring what is volatile and a regenerated self-signed certificate. It sends nothing. It records the run, with its coverage, and queues one item for each drifted device, which a person approves into a capture."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="118" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">POPULATION</text><rect class="dg-store" x="14" y="44" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="44" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="59.0" text-anchor="middle">Inventory</text><text class="dg-sm" x="109.0" y="73.0" text-anchor="middle">every device, not the store</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="100" text-anchor="start">checked · no golden · stale · not read:</text><text class="dg-sm" x="14" y="113" text-anchor="start">every device in exactly one bucket.</text><rect class="dg-dev" x="240" y="44" width="140" height="44" rx="5"/><rect class="dg-dev" x="252" y="87" width="8" height="5"/><rect class="dg-dev" x="266" y="87" width="8" height="5"/><rect class="dg-dev" x="280" y="87" width="8" height="5"/><text class="dg-tb" x="310.0" y="64.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="78.0" text-anchor="middle">read, never changed</text><rect class="dg-band" x="0" y="144" width="400" height="170" rx="6"/><text class="dg-hd" x="30" y="160" text-anchor="start">EACH DEVICE</text><rect class="dg-dev" x="262" y="168" width="118" height="126" rx="5"/><rect class="dg-dev" x="274" y="293" width="8" height="5"/><rect class="dg-dev" x="288" y="293" width="8" height="5"/><rect class="dg-dev" x="302" y="293" width="8" height="5"/><text class="dg-tb" x="321.0" y="186" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="186" r="9"/><text class="dg-numt" x="22" y="189.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="190" text-anchor="start">Read running config</text><text class="dg-sm" x="36" y="202" text-anchor="start">one session, bounded</text><path class="dg-read" d="M260,186 L208.0,186.0"/><polygon class="dg-readh" points="202.0,186.0 210.0,190.5 210.0,181.5"/><circle class="dg-num" cx="22" cy="224" r="9"/><text class="dg-numt" x="22" y="227.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="228" text-anchor="start">Compare with golden</text><text class="dg-sm" x="36" y="240" text-anchor="start">committed, volatile stripped</text><circle class="dg-num" cx="22" cy="258" r="9"/><text class="dg-numt" x="22" y="261.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="262" text-anchor="start">Bucket the result</text><text class="dg-sm" x="36" y="274" text-anchor="start">clean, drifted, or why not</text><text class="dg-sm" x="14" y="298" text-anchor="start">Nothing is sent to any device.</text><rect class="dg-band" x="0" y="320" width="400" height="138" rx="6"/><text class="dg-hd" x="30" y="336" text-anchor="start">RECORDED</text><rect class="dg-store" x="14" y="344" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="344" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="360.0" text-anchor="middle">The run</text><text class="dg-sm" x="109.0" y="374.0" text-anchor="middle">checked N of M, named</text><circle class="dg-num" cx="14" cy="344" r="9"/><text class="dg-numt" x="14" y="347.6" text-anchor="middle">5</text><rect class="dg-store" x="14" y="392" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="392" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="408.0" text-anchor="middle">One queue item</text><text class="dg-sm" x="109.0" y="422.0" text-anchor="middle">per drifted device</text><circle class="dg-num" cx="14" cy="392" r="9"/><text class="dg-numt" x="14" y="395.6" text-anchor="middle">6</text><text class="dg-sm" x="214" y="366" text-anchor="start">Needs attention reads it;</text><text class="dg-sm" x="214" y="379" text-anchor="start">the device page too.</text></svg>
