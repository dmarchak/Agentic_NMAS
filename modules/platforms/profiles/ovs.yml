# Open vSwitch: what a release's OpenFlow does, as measured (the SDN platform design revision 6,
# section 6 D; the minimum P2a needs). One entry per OS version range; every value names its
# source, and a value no source settles is listed under `unconfirmed`.
drivers: [ovs_linux]
family: Open vSwitch
entries:
  - os: {from: "3.3", below: "3.4"}
    openflow:
      versions: ["1.0", "1.3"]
      hello:
        rejects_above: null
      port_state:
        live_reliable: true
      pipeline: discover
      bind_change_requires: null
      openflow_ports_require: []
      port_numbering: add_order
    sources:
      openflow.versions: [ovs-template, harness-2026-11-07]
      openflow.hello.rejects_above: [harness-2026-11-07]
      openflow.port_state.live_reliable: [c2602, harness-2026-11-07]
      openflow.bind_change_requires: [db-transaction]
      openflow.openflow_ports_require: [c2600]
      openflow.port_numbering: [c2603, harness-ofport-request]
    unconfirmed: []
    note: "versions are what Mercury's OVS template sets (the bridge's protocols); OVS offers whatever a bridge's protocols name"
measurements:
  ovs-template:
    record: "modules/sdn/openflow_templates/ovs.yml"
    what: "the bridge's protocols Mercury renders: OpenFlow 1.0 and 1.3"
    evidence: "the template's protocols line and its db-protocols citation (the words OpenFlow10 and OpenFlow13, modules/sdn/openflow_templates.py derived)"
    read: "2026-11-05"
  harness-2026-11-07:
    record: "the container harness"
    what: "Open vSwitch 3.3 (Ubuntu 24.04's package) with protocols OpenFlow10,OpenFlow13 joined Ryu 4.34 offering 1.0 to 1.5 (no app pinning versions): it answers the hello by its version bitmap and refuses nothing; its working ports report LIVE (4) and a port held down LINK_DOWN (1)"
    evidence: "scripts/nmas-harness check --python 3.9 --apps <an empty folder>, 7 passed; tests/fixtures/sdn/harness/ovs-userspace-ryu-4.34-py3.5.json"
    read: "2026-11-07"
  db-transaction:
    record: "ovs-vsctl(8)"
    what: "a bridge's ports change in one OVSDB transaction, which ovs-vswitchd applies as it commits: no agent restart"
    evidence: "ovs-vsctl(8), cited by modules/sdn/openflow_templates/ovs.yml (vsctl-add-port)"
    read: "2026-11-05"
  c2600:
    record: C2600
    what: "the Open vSwitch bridges forwarded the controller's LLDP probes with no LLDP setting (ryu-rest.txt lists the OVS links both ways); only the Arista and ProCurve agents consume them"
    evidence: "tests/fixtures/lab9_captures/2026-11-06/ryu-rest.txt, the links (docs/OPEN_FINDINGS.md C2600)"
    read: "2026-11-06"
  c2603:
    record: C2603
    what: "a bridge numbers its ports in the order they are added (eno2, eno3, eno4 are 1, 2, 3), so NetBox's number is requested"
    evidence: "tests/fixtures/lab9_captures/2026-11-06/ovs1.txt and ovs2.txt (ofport), ryu-rest.txt portdesc of datapaths 3 and 4 (docs/OPEN_FINDINGS.md C2603)"
    read: "2026-11-06"
  harness-ofport-request:
    record: "the container harness"
    what: "set interface <port> ofport_request=<n> gives the port number n on Open vSwitch 3.3 (the ring's ports at their requested numbers)"
    evidence: "lab/lab9/fabric_forwarding_acceptance.py build_ring, passing in the container harness (P7a, 2026-11-07)"
    read: "2026-11-07"
  c2602:
    record: C2602
    what: "the lab's two OVS hosts (3.3.4) report working ports with state 4 (LIVE)"
    evidence: "tests/fixtures/lab9_captures/2026-11-06/ryu-rest.txt, portdesc of datapaths 3 and 4"
    read: "2026-11-06"
