// /etc/kea/kea-dhcp6.conf  -- on the NMAS VM
//
// VLAN 30 is IPv6-only (h4). S2 relays with:
//   interface Vlan30
//    ipv6 dhcp relay destination 2001:DB8:255::10
//
// The relay's link-address is the SVI's global address on VLAN 30, which is
// what Kea matches the subnet on. Both S1 and S2 SVIs are listed for the
// same reason as v4.
//
// NOTE: hosts learn their DEFAULT GATEWAY from router advertisements
// (FE80::1, the VRRPv3 virtual address) - NOT from DHCPv6. DHCPv6 has no
// router option by design. Confirmed working: h1 installed
// "default via fe80::1 dev eth1 proto ra".
{
  "Dhcp6": {
    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
      }
    ],

    "interfaces-config": {
      "interfaces": [ "enp6s19/2001:db8:255::10" ]
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea6-ctrl-socket"
    },

    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600,
      "name": "/var/lib/kea/kea-leases6.csv"
    },

    "valid-lifetime": 31536000,
    "preferred-lifetime": 31536000,
    "renew-timer": 15768000,
    "rebind-timer": 27594000,

    "subnet6": <?include "/etc/kea/nmas/subnets6.json"?>,

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [ { "output": "/var/log/kea/kea-dhcp6.log" } ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
