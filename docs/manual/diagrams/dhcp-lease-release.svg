<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Releasing one Kea lease (C1403). The preview asks Kea for its leases and its configuration and names the lease, its client and whether the address is reserved. You confirm with a reason. The apply reads Kea&#x27;s leases again and compares the hash, sends lease4-del or lease6-del for that address alone through Kea&#x27;s control agent, and reads the leases back. Then the release is committed with your reason. Retire and Abandon run the same release for the leases a device leaves."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">KEA</text><path class="dg-box" d="M14,40 H190 L200,50 V80 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="58.0" text-anchor="middle">The preview: the lease</text><text class="dg-sm" x="107.0" y="72.0" text-anchor="middle">its client, reserved or not</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="96" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="108.0" r="4"/><path class="dg-person" d="M23,119.0 Q30,110.0 37,119.0"/><text class="dg-tx" x="46" y="115.0" text-anchor="start">You confirm, with a reason</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><path class="dg-rec" d="M107,128 L107.0,142.0"/><polygon class="dg-rech" points="107.0,148.0 111.5,140.0 102.5,140.0"/><rect class="dg-band" x="0" y="150" width="400" height="300" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE RELEASE · THIS ADDRESS ALONE</text><rect class="dg-store" x="262" y="172" width="118" height="150" rx="3"/><rect class="dg-bar" x="262" y="172" width="4" height="150" rx="1"/><text class="dg-tb" x="323.0" y="245.0" text-anchor="middle">Kea</text><text class="dg-sm" x="323.0" y="259.0" text-anchor="middle">its leases</text><circle class="dg-num" cx="22" cy="170" r="9"/><text class="dg-numt" x="22" y="173.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="174" text-anchor="start">Plan again</text><text class="dg-sm" x="36" y="186" text-anchor="start">moved: nothing released</text><path class="dg-read" d="M260,170 L208.0,170.0"/><polygon class="dg-readh" points="202.0,170.0 210.0,174.5 210.0,165.5"/><circle class="dg-num" cx="22" cy="224" r="9"/><text class="dg-numt" x="22" y="227.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="228" text-anchor="start">Release</text><text class="dg-sm" x="36" y="240" text-anchor="start">lease4-del or lease6-del</text><path class="dg-send" d="M202,224 L254.0,224.0"/><polygon class="dg-sendh" points="260.0,224.0 252.0,219.5 252.0,228.5"/><circle class="dg-num" cx="22" cy="278" r="9"/><text class="dg-numt" x="22" y="281.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="282" text-anchor="start">Read back</text><text class="dg-sm" x="36" y="294" text-anchor="start">no lease for this client</text><path class="dg-read" d="M260,278 L208.0,278.0"/><polygon class="dg-readh" points="202.0,278.0 210.0,282.5 210.0,273.5"/><path class="dg-repo" d="M14,336 V364 A93.0,6 0 0 0 200,364 V336"/><ellipse class="dg-repo" cx="107.0" cy="336" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="355.0" text-anchor="middle">One commit</text><text class="dg-sm" x="107.0" y="369.0" text-anchor="middle">dhcp/released-leases.yml</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">6</text><text class="dg-sm" x="14" y="400" text-anchor="start">Kea keeps no copy of a deleted lease;</text><text class="dg-sm" x="14" y="413" text-anchor="start">the record is the commit.</text></svg>
