! tw-frr: C117's BGP peer for the throwaway session (docs/THROWAWAY_SESSION.md).
! eBGP to tw-ztp-a's Loopback1 over two hops; advertises nothing.
frr version 10.2.1
frr defaults traditional
hostname tw-frr
log stdout
!
router bgp 65098
 bgp router-id 10.255.98.1
 no bgp ebgp-requires-policy
 neighbor 10.255.99.1 remote-as 65099
 neighbor 10.255.99.1 ebgp-multihop 2
 neighbor 10.255.99.1 update-source 10.255.98.1
exit
!
