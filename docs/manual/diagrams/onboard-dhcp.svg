<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="DHCP reservation: Kea gives the device an address, not a configuration. A person writes the reservation in Kea for the device&#x27;s MAC before the plan; the tool only reads it, at the plan and again at Verify to find the lease. The configuration still arrives as on the static path: a person applies the file the tool renders."><line class="dg-lane" x1="150" y1="20" x2="150" y2="374"/><line class="dg-lane" x1="268" y1="20" x2="268" y2="374"/><text class="dg-hd" x="75.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="209.0" y="12" text-anchor="middle">A PERSON · KEA</text><text class="dg-hd" x="334.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="110" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">BEFORE THE PLAN</text><rect class="dg-person" x="158" y="44" width="104" height="28" rx="14.0"/><circle class="dg-person" cx="174" cy="55.0" r="4"/><path class="dg-person" d="M167,66.0 Q174,57.0 181,66.0"/><text class="dg-tx" x="190" y="62.0" text-anchor="start">You</text><path class="dg-rec" d="M210,74 L210.0,86.0"/><polygon class="dg-rech" points="210.0,92.0 214.5,84.0 205.5,84.0"/><rect class="dg-svc" x="158" y="94" width="104" height="30" rx="15.0"/><text class="dg-tb" x="210.0" y="107.0" text-anchor="middle">Kea</text><text class="dg-sm" x="210.0" y="121.0" text-anchor="middle">reservation</text><path class="dg-read" d="M156,108 L152.0,108.0"/><polygon class="dg-readh" points="146.0,108.0 154.0,112.5 154.0,103.5"/><text class="dg-tb" x="8" y="104" text-anchor="start">Plan reads it</text><text class="dg-sm" x="8" y="118" text-anchor="start">reserved?</text><rect class="dg-band" x="0" y="136" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="152" text-anchor="start">BOOT</text><rect class="dg-svc" x="158" y="160" width="104" height="30" rx="15.0"/><text class="dg-tb" x="210.0" y="173.0" text-anchor="middle">Kea</text><text class="dg-sm" x="210.0" y="187.0" text-anchor="middle">address only</text><path class="dg-send" d="M262,176 L268.0,176.0"/><polygon class="dg-sendh" points="274.0,176.0 266.0,171.5 266.0,180.5"/><rect class="dg-dev" x="276" y="160" width="118" height="44" rx="5"/><rect class="dg-dev" x="288" y="203" width="8" height="5"/><rect class="dg-dev" x="302" y="203" width="8" height="5"/><rect class="dg-dev" x="316" y="203" width="8" height="5"/><text class="dg-tb" x="335.0" y="180.0" text-anchor="middle">The device</text><text class="dg-sm" x="335.0" y="194.0" text-anchor="middle">leases its address</text><text class="dg-sm" x="158" y="216" text-anchor="start">No file, no server</text><text class="dg-sm" x="158" y="229" text-anchor="start">option on this path.</text><rect class="dg-band" x="0" y="262" width="400" height="112" rx="6"/><text class="dg-hd" x="30" y="278" text-anchor="start">THE CONFIGURATION</text><rect class="dg-person" x="158" y="282" width="104" height="28" rx="14.0"/><circle class="dg-person" cx="174" cy="293.0" r="4"/><path class="dg-person" d="M167,304.0 Q174,295.0 181,304.0"/><text class="dg-tx" x="190" y="300.0" text-anchor="start">You paste it</text><path class="dg-send" d="M262,296 L268.0,296.0"/><polygon class="dg-sendh" points="274.0,296.0 266.0,291.5 266.0,300.5"/><rect class="dg-dev" x="276" y="280" width="118" height="40" rx="5"/><rect class="dg-dev" x="288" y="319" width="8" height="5"/><rect class="dg-dev" x="302" y="319" width="8" height="5"/><rect class="dg-dev" x="316" y="319" width="8" height="5"/><text class="dg-tb" x="335.0" y="304.0" text-anchor="middle">The device</text><text class="dg-tb" x="8" y="300" text-anchor="start">Rendered as static</text><text class="dg-sm" x="8" y="314" text-anchor="start">a recorded reveal</text><text class="dg-sm" x="8" y="352" text-anchor="start">Verify reads the lease, then SSH.</text></svg>
