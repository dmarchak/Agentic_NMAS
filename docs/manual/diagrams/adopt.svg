<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="Adopting a device the tool did not build. The preview reads the device with the supplied login, which is held in memory and never written, and shows every refusal, what a save would make permanent and what NetBox would import. The apply holds the device: it adds the tool&#x27;s own account and proves it on a fresh login, sends the monitoring profile, saves, commits the first golden, records what already existed in NetBox as adopted, and adds the device to the inventory last. No screen starts it yet."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW · THE SUPPLIED LOGIN, IN MEMORY</text><rect class="dg-dev" x="262" y="44" width="118" height="116" rx="5"/><rect class="dg-dev" x="274" y="159" width="8" height="5"/><rect class="dg-dev" x="288" y="159" width="8" height="5"/><rect class="dg-dev" x="302" y="159" width="8" height="5"/><text class="dg-tb" x="321.0" y="62" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="72" r="9"/><text class="dg-numt" x="22" y="75.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="76" text-anchor="start">Read the device</text><text class="dg-sm" x="36" y="88" text-anchor="start">supplied login</text><path class="dg-read" d="M260,72 L208.0,72.0"/><polygon class="dg-readh" points="202.0,72.0 210.0,76.5 210.0,67.5"/><text class="dg-tb" x="36" y="116" text-anchor="start">Refusals, all at once</text><text class="dg-sm" x="36" y="128" text-anchor="start">accounts, AAA, names</text><text class="dg-sm" x="14" y="152" text-anchor="start">The supplied credential is never written.</text><rect class="dg-band" x="0" y="176" width="400" height="294" rx="6"/><text class="dg-hd" x="30" y="192" text-anchor="start">THE APPLY · HOLDING THE DEVICE</text><rect class="dg-dev" x="262" y="198" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="347" width="8" height="5"/><rect class="dg-dev" x="288" y="347" width="8" height="5"/><rect class="dg-dev" x="302" y="347" width="8" height="5"/><text class="dg-tb" x="321.0" y="216" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="218" r="9"/><text class="dg-numt" x="22" y="221.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="222" text-anchor="start">The tool&#x27;s account</text><text class="dg-sm" x="36" y="234" text-anchor="start">proven on a fresh login</text><path class="dg-send" d="M202,218 L254.0,218.0"/><polygon class="dg-sendh" points="260.0,218.0 252.0,213.5 252.0,222.5"/><circle class="dg-num" cx="22" cy="258" r="9"/><text class="dg-numt" x="22" y="261.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="262" text-anchor="start">Monitoring profile</text><text class="dg-sm" x="36" y="274" text-anchor="start">read back</text><path class="dg-send" d="M202,258 L254.0,258.0"/><polygon class="dg-sendh" points="260.0,258.0 252.0,253.5 252.0,262.5"/><circle class="dg-num" cx="22" cy="298" r="9"/><text class="dg-numt" x="22" y="301.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="302" text-anchor="start">Save</text><text class="dg-sm" x="36" y="314" text-anchor="start">startup read back</text><path class="dg-send" d="M202,298 L254.0,298.0"/><polygon class="dg-sendh" points="260.0,298.0 252.0,293.5 252.0,302.5"/><path class="dg-golden" d="M14,360 H124 L134,370 V400 H14 Z"/><path class="dg-golden" d="M124,360 V370 H134"/><text class="dg-tb" x="74.0" y="378.0" text-anchor="middle">First golden</text><text class="dg-sm" x="74.0" y="392.0" text-anchor="middle">Source: adopt</text><circle class="dg-num" cx="14" cy="360" r="9"/><text class="dg-numt" x="14" y="363.6" text-anchor="middle">6</text><rect class="dg-svc" x="142" y="362" width="110" height="36" rx="18.0"/><text class="dg-tb" x="197.0" y="378.0" text-anchor="middle">NetBox</text><text class="dg-sm" x="197.0" y="392.0" text-anchor="middle">adopted</text><circle class="dg-num" cx="142" cy="362" r="9"/><text class="dg-numt" x="142" y="365.6" text-anchor="middle">7</text><rect class="dg-store" x="260" y="362" width="120" height="36" rx="3"/><rect class="dg-bar" x="260" y="362" width="4" height="36" rx="1"/><text class="dg-tb" x="322.0" y="378.0" text-anchor="middle">Inventory</text><text class="dg-sm" x="322.0" y="392.0" text-anchor="middle">last</text><circle class="dg-num" cx="260" cy="362" r="9"/><text class="dg-numt" x="260" y="365.6" text-anchor="middle">8</text><text class="dg-sm" x="14" y="430" text-anchor="start">A stopped run resumes on the tool&#x27;s own</text><text class="dg-sm" x="14" y="443" text-anchor="start">record; no second account.</text><rect class="dg-band" x="0" y="476" width="400" height="58" rx="6"/><text class="dg-hd" x="30" y="492" text-anchor="start">TODAY</text><text class="dg-sm" x="14" y="506" text-anchor="start">No screen or route starts it yet; onboard instead.</text></svg>
