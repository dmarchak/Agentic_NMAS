<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Applying the network&#x27;s monitoring profile. Coverage reads each device&#x27;s committed golden and marks what it is configured for. You tick devices; the preview plans each from its stored golden and the profile, sending only the profile&#x27;s lines, and you set the rollout order and confirm. The apply runs one device after another in that order, each through the deploy&#x27;s ten stages, and records the goldens in one commit and a receipt per device."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="130" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">COVERAGE · STORED RECORDS ONLY</text><path class="dg-box" d="M14,44 H94 L104,54 V84 H14 Z"/><path class="dg-box" d="M94,44 V54 H104"/><text class="dg-tb" x="59.0" y="62.0" text-anchor="middle">Profile</text><text class="dg-sm" x="59.0" y="76.0" text-anchor="middle">committed</text><path class="dg-golden" d="M110,44 H190 L200,54 V84 H110 Z"/><path class="dg-golden" d="M190,44 V54 H200"/><text class="dg-tb" x="155.0" y="62.0" text-anchor="middle">Goldens</text><text class="dg-sm" x="155.0" y="76.0" text-anchor="middle">committed</text><text class="dg-sm" x="14" y="112" text-anchor="start">Each cell: configured, not, or not</text><text class="dg-sm" x="14" y="125" text-anchor="start">reporting.</text><rect class="dg-devoff" x="240" y="50" width="140" height="40" rx="5"/><rect class="dg-devoff" x="252" y="89" width="8" height="5"/><rect class="dg-devoff" x="266" y="89" width="8" height="5"/><rect class="dg-devoff" x="280" y="89" width="8" height="5"/><text class="dg-tb" x="310.0" y="68.0" text-anchor="middle">Devices</text><text class="dg-sm" x="310.0" y="82.0" text-anchor="middle">not contacted</text><rect class="dg-band" x="0" y="156" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="172" text-anchor="start">PREVIEW AND CONFIRM</text><path class="dg-box" d="M14,178 H190 L200,188 V218 H14 Z"/><path class="dg-box" d="M190,178 V188 H200"/><text class="dg-tb" x="107.0" y="196.0" text-anchor="middle">Program per device</text><text class="dg-sm" x="107.0" y="210.0" text-anchor="middle">the profile&#x27;s lines only</text><circle class="dg-num" cx="14" cy="178" r="9"/><text class="dg-numt" x="14" y="181.6" text-anchor="middle">1</text><rect class="dg-person" x="14" y="228" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="240.0" r="4"/><path class="dg-person" d="M23,251.0 Q30,242.0 37,251.0"/><text class="dg-tx" x="46" y="247.0" text-anchor="start">You set the order, confirm</text><circle class="dg-num" cx="14" cy="228" r="9"/><text class="dg-numt" x="14" y="231.6" text-anchor="middle">2</text><circle class="dg-no" cx="310" cy="216" r="11"/><line class="dg-nol" x1="302.5" y1="223.5" x2="317.5" y2="208.5"/><rect class="dg-band" x="0" y="282" width="400" height="182" rx="6"/><text class="dg-hd" x="30" y="298" text-anchor="start">THE RUN · ONE DEVICE AFTER ANOTHER</text><rect class="dg-dev" x="262" y="304" width="118" height="140" rx="5"/><rect class="dg-dev" x="274" y="443" width="8" height="5"/><rect class="dg-dev" x="288" y="443" width="8" height="5"/><rect class="dg-dev" x="302" y="443" width="8" height="5"/><text class="dg-tb" x="321.0" y="322" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="336" text-anchor="middle">each, in order</text><circle class="dg-num" cx="22" cy="332" r="9"/><text class="dg-numt" x="22" y="335.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="336" text-anchor="start">Read before</text><text class="dg-sm" x="36" y="348" text-anchor="start">the snapshot</text><path class="dg-read" d="M260,332 L208.0,332.0"/><polygon class="dg-readh" points="202.0,332.0 210.0,336.5 210.0,327.5"/><circle class="dg-num" cx="22" cy="368" r="9"/><text class="dg-numt" x="22" y="371.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="372" text-anchor="start">Send the profile lines</text><text class="dg-sm" x="36" y="384" text-anchor="start">merge-only</text><path class="dg-send" d="M202,368 L254.0,368.0"/><polygon class="dg-sendh" points="260.0,368.0 252.0,363.5 252.0,372.5"/><circle class="dg-num" cx="22" cy="404" r="9"/><text class="dg-numt" x="22" y="407.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="408" text-anchor="start">Read after, verify</text><text class="dg-sm" x="36" y="420" text-anchor="start">quick or full</text><path class="dg-read" d="M260,404 L208.0,404.0"/><polygon class="dg-readh" points="202.0,404.0 210.0,408.5 210.0,399.5"/><rect class="dg-store" x="14" y="474" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="474" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="489.0" text-anchor="middle">Goldens and receipts</text><text class="dg-sm" x="109.0" y="503.0" text-anchor="middle">one commit, a receipt each</text><text class="dg-sm" x="214" y="494" text-anchor="start">A failing device stops the batch.</text></svg>
