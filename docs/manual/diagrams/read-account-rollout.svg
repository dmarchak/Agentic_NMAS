<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="The read-only account&#x27;s rollout (board R). Add the read-only account committed it to each device&#x27;s intent; the rollout deploys that intent through the batch deploy&#x27;s engine. The preview sends nothing: each chosen device&#x27;s program comes from the deploy&#x27;s own plan, masked, in one order (the canary alone, then waves, then each device carrying Mercury&#x27;s management path last, after every device reached through it) with its options, under one hash, which you confirm once. Then the run goes by itself: each device held, sent, verified, probed signed in as the read-only account, and saved to startup; the settle waited between waves; a pause after the canary only when you chose one. The first failure, a failed probe included, is rolled back, stops the rest and tells the team. Each device&#x27;s receipt and golden are recorded."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE PREVIEW · NOTHING SENT</text><path class="dg-intent" d="M14,42 H94 L104,52 V84 H14 Z"/><path class="dg-intent" d="M94,42 V52 H104"/><text class="dg-tb" x="59.0" y="61.0" text-anchor="middle">Intent</text><text class="dg-sm" x="59.0" y="75.0" text-anchor="middle">the account added</text><path class="dg-rec" d="M104,63 L114.0,63.0"/><polygon class="dg-rech" points="120.0,63.0 112.0,58.5 112.0,67.5"/><path class="dg-box" d="M122,42 H192 L202,52 V84 H122 Z"/><path class="dg-box" d="M192,42 V52 H202"/><text class="dg-tb" x="162.0" y="61.0" text-anchor="middle">Programs</text><text class="dg-sm" x="162.0" y="75.0" text-anchor="middle">the deploy&#x27;s plan</text><circle class="dg-num" cx="14" cy="42" r="9"/><text class="dg-numt" x="14" y="45.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="104" text-anchor="start">canary · waves · management path last</text><rect class="dg-person" x="14" y="118" width="188" height="32" rx="16.0"/><circle class="dg-person" cx="30" cy="131.0" r="4"/><path class="dg-person" d="M23,142.0 Q30,133.0 37,142.0"/><text class="dg-tx" x="46" y="138.0" text-anchor="start">You confirm once, by hash</text><circle class="dg-num" cx="14" cy="118" r="9"/><text class="dg-numt" x="14" y="121.6" text-anchor="middle">2</text><rect class="dg-devoff" x="240" y="50" width="140" height="48" rx="5"/><rect class="dg-devoff" x="252" y="97" width="8" height="5"/><rect class="dg-devoff" x="266" y="97" width="8" height="5"/><rect class="dg-devoff" x="280" y="97" width="8" height="5"/><text class="dg-tb" x="310.0" y="72.0" text-anchor="middle">The devices</text><text class="dg-sm" x="310.0" y="86.0" text-anchor="middle">not contacted</text><circle class="dg-no" cx="310" cy="130" r="11"/><line class="dg-nol" x1="302.5" y1="137.5" x2="317.5" y2="122.5"/><text class="dg-sm" x="310" y="156" text-anchor="middle">nothing is sent</text><text class="dg-sm" x="310" y="169" text-anchor="middle">until you confirm</text><rect class="dg-band" x="0" y="176" width="400" height="270" rx="6"/><text class="dg-hd" x="30" y="192" text-anchor="start">THE RUN · BY ITSELF, WAVE BY WAVE</text><rect class="dg-dev" x="262" y="200" width="118" height="196" rx="5"/><rect class="dg-dev" x="274" y="395" width="8" height="5"/><rect class="dg-dev" x="288" y="395" width="8" height="5"/><rect class="dg-dev" x="302" y="395" width="8" height="5"/><text class="dg-tb" x="321.0" y="218" text-anchor="middle">Each device</text><text class="dg-sm" x="321.0" y="232" text-anchor="middle">held</text><circle class="dg-num" cx="22" cy="216" r="9"/><text class="dg-numt" x="22" y="219.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="220" text-anchor="start">Canary</text><text class="dg-sm" x="36" y="232" text-anchor="start">probed, saved; pause if chosen</text><path class="dg-send" d="M202,216 L254.0,216.0"/><polygon class="dg-sendh" points="260.0,216.0 252.0,211.5 252.0,220.5"/><circle class="dg-num" cx="22" cy="258" r="9"/><text class="dg-numt" x="22" y="261.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="262" text-anchor="start">Waves</text><text class="dg-sm" x="36" y="274" text-anchor="start">by themselves, the settle between</text><path class="dg-send" d="M202,258 L254.0,258.0"/><polygon class="dg-sendh" points="260.0,258.0 252.0,253.5 252.0,262.5"/><circle class="dg-num" cx="22" cy="300" r="9"/><text class="dg-numt" x="22" y="303.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="304" text-anchor="start">Management path</text><text class="dg-sm" x="36" y="316" text-anchor="start">last, after all it reaches</text><path class="dg-send" d="M202,300 L254.0,300.0"/><polygon class="dg-sendh" points="260.0,300.0 252.0,295.5 252.0,304.5"/><circle class="dg-num" cx="22" cy="342" r="9"/><text class="dg-numt" x="22" y="345.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="346" text-anchor="start">Verify or probe fails: undo</text><text class="dg-sm" x="36" y="358" text-anchor="start">stop, tell the team</text><path class="dg-undo" d="M202,342 L254.0,342.0"/><polygon class="dg-undoh" points="260.0,342.0 252.0,337.5 252.0,346.5"/><rect class="dg-store" x="14" y="460" width="120" height="42" rx="3"/><rect class="dg-bar" x="14" y="460" width="4" height="42" rx="1"/><text class="dg-tb" x="76.0" y="479.0" text-anchor="middle">Receipts</text><text class="dg-sm" x="76.0" y="493.0" text-anchor="middle">one per device</text><circle class="dg-num" cx="14" cy="460" r="9"/><text class="dg-numt" x="14" y="463.6" text-anchor="middle">7</text><path class="dg-golden" d="M144,460 H244 L254,470 V502 H144 Z"/><path class="dg-golden" d="M244,460 V470 H254"/><text class="dg-tb" x="199.0" y="479.0" text-anchor="middle">Golden</text><text class="dg-sm" x="199.0" y="493.0" text-anchor="middle">after its save</text></svg>
