! Minimal bootstrap for a vIOS-L2 joining this lab.
!
! THE USERNAME LINE USES THE **SECRET** FORM, AND CAN.
!
! Measured in the image's launch script: vIOS has no gen_bootstrap_config().
! apply_config() reads the startup config and applies it, and nothing else —
!     if not os.path.exists(STARTUP_CONFIG_FILE):
!         self.logger.fatal("Failed to find startup configuration file")
!
! Two consequences, both of which the first probe ran into:
!
!   1. There is no injected username line to collide with, so `secret` is
!      safe here where it is not on the C8000v. s1.cfg uses it.
!   2. A vIOS with NO startup config does not boot into a clean state — it
!      fails fatally. There is no such thing as an unconfigured vIOS in this
!      lab, only an unreachable one.
!
! Gi0/0 IS configured, unlike the C8000v's Gi1: with
! CLAB_MGMT_PASSTHROUGH=false this node only acquires a management address
! because this file asks for one.
!
! `secret 0 <plaintext>` lets the device hash it — no fleet hash is pasted in,
! and the value is this probe's own.
!
hostname bp-vios
!
no aaa new-model
no logging console
!
username admin privilege 15 secret 0 admin
!
ip domain-name rcn.lab
!
interface GigabitEthernet0/0
 description clab-mgmt
 no switchport
 ip address dhcp
 negotiation auto
 no shutdown
!
ip ssh version 2
!
line vty 0 4
 logging synchronous
 login local
 transport input ssh
!
end
