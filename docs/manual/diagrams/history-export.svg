<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" role="img" aria-label="History&#x27;s Export: a person chooses the network and the whole UTC days, at most 31, and a longer range is refused with nothing read; the call and cost log reads every AI call the ledger recorded in the range, one row each, with a total per UTC day and per feature, the dollars the ledger&#x27;s summed by day; the false-positive and failure log reads each network&#x27;s SDN responses and flow operations, every analysis&#x27;s planted-issue sheet, its record of evaluation runs (the false-positive runs, the analyst evaluations and the classification case recordings), the ledger&#x27;s evaluation calls and the answers said wrong; every text is masked on the way out, and the file, CSV or JSON, opens with its range, network, when and who. Nothing is written."><line class="dg-lane" x1="212" y1="20" x2="212" y2="504"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE RECORDS</text><rect class="dg-person" x="14" y="40" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="52.0" r="4"/><path class="dg-person" d="M23,63.0 Q30,54.0 37,63.0"/><text class="dg-tx" x="46" y="59.0" text-anchor="start">You choose network and days</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="88" text-anchor="start">past 31 days: refused, nothing read</text><rect class="dg-store" x="250" y="40" width="130" height="40" rx="3"/><rect class="dg-bar" x="250" y="40" width="4" height="40" rx="1"/><text class="dg-tb" x="317.0" y="58.0" text-anchor="middle">The AI call ledger</text><text class="dg-sm" x="317.0" y="72.0" text-anchor="middle">every call, its cost</text><rect class="dg-store" x="250" y="150" width="130" height="40" rx="3"/><rect class="dg-bar" x="250" y="150" width="4" height="40" rx="1"/><text class="dg-tb" x="317.0" y="168.0" text-anchor="middle">SDN records</text><text class="dg-sm" x="317.0" y="182.0" text-anchor="middle">responses, operations</text><rect class="dg-store" x="250" y="206" width="130" height="40" rx="3"/><rect class="dg-bar" x="250" y="206" width="4" height="40" rx="1"/><text class="dg-tb" x="317.0" y="224.0" text-anchor="middle">The planted sheets</text><text class="dg-sm" x="317.0" y="238.0" text-anchor="middle">every analysis</text><rect class="dg-store" x="250" y="262" width="130" height="40" rx="3"/><rect class="dg-bar" x="250" y="262" width="4" height="40" rx="1"/><text class="dg-tb" x="317.0" y="280.0" text-anchor="middle">Answers said wrong</text><text class="dg-sm" x="317.0" y="294.0" text-anchor="middle">and each review</text><rect class="dg-store" x="250" y="318" width="130" height="40" rx="3"/><rect class="dg-bar" x="250" y="318" width="4" height="40" rx="1"/><text class="dg-tb" x="317.0" y="336.0" text-anchor="middle">Evaluation runs</text><text class="dg-sm" x="317.0" y="350.0" text-anchor="middle">false positives, misses</text><rect class="dg-band" x="0" y="104" width="400" height="70" rx="6"/><text class="dg-hd" x="30" y="120" text-anchor="start">THE CALL AND COST LOG</text><path class="dg-box" d="M14,128 H190 L200,138 V164 H14 Z"/><path class="dg-box" d="M190,128 V138 H200"/><text class="dg-tb" x="107.0" y="144.0" text-anchor="middle">A row per call</text><text class="dg-sm" x="107.0" y="158.0" text-anchor="middle">totals by UTC day, feature</text><circle class="dg-num" cx="14" cy="128" r="9"/><text class="dg-numt" x="14" y="131.6" text-anchor="middle">2</text><path class="dg-read" d="M248,60 Q224,120 205.9,141.4"/><polygon class="dg-readh" points="202.0,146.0 210.6,142.8 203.7,137.0"/><rect class="dg-band" x="0" y="184" width="400" height="180" rx="6"/><text class="dg-hd" x="30" y="200" text-anchor="start">THE FAILURE LOG</text><path class="dg-box" d="M14,208 H190 L200,218 V248 H14 Z"/><path class="dg-box" d="M190,208 V218 H200"/><text class="dg-tb" x="107.0" y="226.0" text-anchor="middle">A row per failure</text><text class="dg-sm" x="107.0" y="240.0" text-anchor="middle">with its record&#x27;s link</text><circle class="dg-num" cx="14" cy="208" r="9"/><text class="dg-numt" x="14" y="211.6" text-anchor="middle">3</text><path class="dg-read" d="M248,170 L206.0,217.5"/><polygon class="dg-readh" points="202.0,222.0 210.7,219.0 203.9,213.0"/><path class="dg-read" d="M248,226 L208.0,229.5"/><polygon class="dg-readh" points="202.0,230.0 210.4,233.8 209.6,224.8"/><path class="dg-read" d="M248,282 L206.3,242.1"/><polygon class="dg-readh" points="202.0,238.0 204.7,246.8 210.9,240.3"/><path class="dg-read" d="M248,338 Q224,300 204.2,249.6"/><polygon class="dg-readh" points="202.0,244.0 200.7,253.1 209.1,249.8"/><text class="dg-sm" x="14" y="266" text-anchor="start">dismissed, refused, rolled back,</text><text class="dg-sm" x="14" y="280" text-anchor="start">missed, said wrong</text><path class="dg-box" d="M14,380 H190 L200,390 V416 H14 Z"/><path class="dg-box" d="M190,380 V390 H200"/><text class="dg-tb" x="107.0" y="396.0" text-anchor="middle">Masked on the way out</text><text class="dg-sm" x="107.0" y="410.0" text-anchor="middle">as History masks</text><circle class="dg-num" cx="14" cy="380" r="9"/><text class="dg-numt" x="14" y="383.6" text-anchor="middle">4</text><path class="dg-box" d="M14,432 H190 L200,442 V472 H14 Z"/><path class="dg-box" d="M190,432 V442 H200"/><text class="dg-tb" x="107.0" y="450.0" text-anchor="middle">CSV or JSON</text><text class="dg-sm" x="107.0" y="464.0" text-anchor="middle">range, network, when, who</text><circle class="dg-num" cx="14" cy="432" r="9"/><text class="dg-numt" x="14" y="435.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="496" text-anchor="start">Nothing is written.</text></svg>
