<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Test the logging path: the line is checked against Tier 1 of the command policy and a test is refused when Loki is not configured, before any device is asked; each device is held and sent one line, send log 6 MERCURY-LOGTEST and the run&#x27;s id, through the reads engine; Loki is asked every 2 seconds, once for the whole run, until each device&#x27;s line arrives or 30 seconds pass after its send; the result is recorded with the run, and History shows it."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">Tier 1, and Loki set</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">checked first</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: no device asked</text><rect class="dg-band" x="0" y="110" width="400" height="90" rx="6"/><text class="dg-hd" x="30" y="126" text-anchor="start">THE RUN · A JOB, DEVICES HELD WHILE SENT</text><rect class="dg-dev" x="262" y="128" width="118" height="70" rx="5"/><rect class="dg-dev" x="274" y="197" width="8" height="5"/><rect class="dg-dev" x="288" y="197" width="8" height="5"/><rect class="dg-dev" x="302" y="197" width="8" height="5"/><text class="dg-tb" x="321.0" y="146" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="160" text-anchor="middle">one log line</text><circle class="dg-num" cx="22" cy="136" r="9"/><text class="dg-numt" x="22" y="139.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="140" text-anchor="start">Held, then sent</text><text class="dg-sm" x="36" y="152" text-anchor="start">send log 6 MERCURY-LOGTEST</text><path class="dg-read" d="M260,136 L208.0,136.0"/><polygon class="dg-readh" points="202.0,136.0 210.0,140.5 210.0,131.5"/><rect class="dg-store" x="14" y="222" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="222" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="240.0" text-anchor="middle">Loki, every 2 s</text><text class="dg-sm" x="109.0" y="254.0" text-anchor="middle">one question for the run</text><circle class="dg-num" cx="14" cy="222" r="9"/><text class="dg-numt" x="14" y="225.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="284" text-anchor="start">received after N s, or</text><text class="dg-sm" x="14" y="297" text-anchor="start">not received within 30 s</text><rect class="dg-store" x="14" y="330" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="330" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="348.0" text-anchor="middle">The run&#x27;s record</text><text class="dg-sm" x="109.0" y="362.0" text-anchor="middle">each device&#x27;s result</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">4</text><text class="dg-sm" x="14" y="394" text-anchor="start">History shows it.</text><text class="dg-sm" x="14" y="444" text-anchor="start">No device&#x27;s configuration is changed.</text></svg>
