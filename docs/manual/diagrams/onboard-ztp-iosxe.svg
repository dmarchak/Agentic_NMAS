<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="ZTP on IOS-XE: the tool delivers the configuration. At Create it writes the device&#x27;s Kea reservation with options 12 (hostname), 66 (the tool&#x27;s address) and 67 (the file name), and never a route or resolver. The configless device asks DHCP, gets them, and asks the tool&#x27;s read-only TFTP responder for that one file. The responder serves it only to the reserved address, only while the device is pending, renders it per request and writes a reveal row first. TFTP is cleartext: the bootstrap credential is one-time, replaced at Verify. AutoInstall gives up after about 2.5 minutes."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="110" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">CREATE</text><rect class="dg-svc" x="14" y="44" width="186" height="34" rx="17.0"/><text class="dg-tb" x="107.0" y="59.0" text-anchor="middle">Kea reservation</text><text class="dg-sm" x="107.0" y="73.0" text-anchor="middle">12 · 66 · 67, never 3, 6, 33, 121</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="100" text-anchor="start">Written by the tool, tested first.</text><rect class="dg-devoff" x="240" y="44" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="87" width="8" height="5"/><rect class="dg-devoff" x="266" y="87" width="8" height="5"/><rect class="dg-devoff" x="280" y="87" width="8" height="5"/><text class="dg-tb" x="310.0" y="64.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="78.0" text-anchor="middle">configless, not booted</text><rect class="dg-band" x="0" y="136" width="400" height="100" rx="6"/><text class="dg-hd" x="30" y="152" text-anchor="start">BOOT</text><rect class="dg-dev" x="262" y="156" width="118" height="64" rx="5"/><rect class="dg-dev" x="274" y="219" width="8" height="5"/><rect class="dg-dev" x="288" y="219" width="8" height="5"/><rect class="dg-dev" x="302" y="219" width="8" height="5"/><text class="dg-tb" x="321.0" y="174" text-anchor="middle">The device</text><text class="dg-tb" x="36" y="192" text-anchor="start">Kea answers</text><text class="dg-sm" x="36" y="204" text-anchor="start">address and options</text><path class="dg-send" d="M202,188 L254.0,188.0"/><polygon class="dg-sendh" points="260.0,188.0 252.0,183.5 252.0,192.5"/><rect class="dg-band" x="0" y="242" width="400" height="196" rx="6"/><text class="dg-hd" x="30" y="258" text-anchor="start">FETCH · TFTP</text><rect class="dg-dev" x="262" y="262" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="411" width="8" height="5"/><rect class="dg-dev" x="288" y="411" width="8" height="5"/><rect class="dg-dev" x="302" y="411" width="8" height="5"/><text class="dg-tb" x="321.0" y="280" text-anchor="middle">The device</text><text class="dg-tb" x="36" y="290" text-anchor="start">Asks for &lt;device&gt;.cfg</text><text class="dg-sm" x="36" y="302" text-anchor="start">from option 66&#x27;s address</text><path class="dg-read" d="M260,286 L208.0,286.0"/><polygon class="dg-readh" points="202.0,286.0 210.0,290.5 210.0,281.5"/><text class="dg-tb" x="36" y="330" text-anchor="start">Responder checks</text><text class="dg-sm" x="36" y="342" text-anchor="start">reserved, named, pending</text><text class="dg-tb" x="36" y="366" text-anchor="start">Reveal row written</text><text class="dg-sm" x="36" y="378" text-anchor="start">its hash, never the text</text><text class="dg-tb" x="36" y="402" text-anchor="start">Serves the file</text><text class="dg-sm" x="36" y="414" text-anchor="start">rendered now, cleartext</text><path class="dg-send" d="M202,398 L254.0,398.0"/><polygon class="dg-sendh" points="260.0,398.0 252.0,393.5 252.0,402.5"/><circle class="dg-clock" cx="214" cy="438" r="8"/><path class="dg-clock" d="M214,433 V438 L218,440"/><text class="dg-sm" x="230" y="442" text-anchor="start">gives up after about 2.5 min</text><rect class="dg-band" x="0" y="444" width="400" height="70" rx="6"/><text class="dg-hd" x="30" y="460" text-anchor="start">THEN VERIFY</text><text class="dg-sm" x="14" y="478" text-anchor="start">The tool reads Kea&#x27;s lease, reaches it</text><text class="dg-sm" x="14" y="491" text-anchor="start">over SSH, rotates the bootstrap credential.</text></svg>
