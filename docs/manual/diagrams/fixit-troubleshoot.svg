<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="AI troubleshooting on an incident&#x27;s page: an attempt is a catalogue operation&#x27;s run on the incident&#x27;s device, read from the operation&#x27;s own record; a failed attempt stops the section, and nothing more runs until a person chooses. Troubleshoot with AI, or Retry with more information, asks the per-incident cap again at the press; then either Mercury&#x27;s own diagnosis, with no AI, or one AI investigation the person&#x27;s press asked for (at most two calls, its answer checked against what was sent) names a fix as one catalogue operation, checked against the incident, the heal guards and committed intent, and kept as one proposal line with the person&#x27;s note; a proposal that repeats a failed attempt is flagged. The fix runs only through its operation&#x27;s own card, previewed and confirmed by hash, and its run&#x27;s record names the incident, the attempt and the proposal. Cancel and Hand over each record one line, and Hand over keeps a write-up and sends its link to the teams chosen. Nothing in the section reaches the device but the operation a person confirmed."><line class="dg-lane" x1="212" y1="20" x2="212" y2="434"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-dev" x="262" y="40" width="118" height="250" rx="5"/><rect class="dg-dev" x="274" y="289" width="8" height="5"/><rect class="dg-dev" x="288" y="289" width="8" height="5"/><rect class="dg-dev" x="302" y="289" width="8" height="5"/><text class="dg-tb" x="321.0" y="58" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="72" text-anchor="middle">only through its operation</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">An attempt failed</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">the run&#x27;s own record</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="96" text-anchor="start">Stopped: nothing more runs</text><rect class="dg-person" x="14" y="108" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="120.0" r="4"/><path class="dg-person" d="M23,131.0 Q30,122.0 37,131.0"/><text class="dg-tx" x="46" y="127.0" text-anchor="start">Retry with more information</text><circle class="dg-num" cx="14" cy="108" r="9"/><text class="dg-numt" x="14" y="111.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="156" text-anchor="start">the cap asked again at the press</text><rect class="dg-store" x="14" y="166" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="166" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="182.0" text-anchor="middle">Mercury&#x27;s diagnosis or the AI</text><text class="dg-sm" x="109.0" y="196.0" text-anchor="middle">names one catalogue operation</text><circle class="dg-num" cx="14" cy="166" r="9"/><text class="dg-numt" x="14" y="169.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="220" text-anchor="start">checked: incident, guards, intent</text><rect class="dg-store" x="14" y="230" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="230" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="246.0" text-anchor="middle">The incident&#x27;s record</text><text class="dg-sm" x="109.0" y="260.0" text-anchor="middle">one proposal line, flagged</text><circle class="dg-num" cx="14" cy="230" r="9"/><text class="dg-numt" x="14" y="233.6" text-anchor="middle">4</text><circle class="dg-num" cx="22" cy="292" r="9"/><text class="dg-numt" x="22" y="295.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="296" text-anchor="start">Its card, confirmed</text><text class="dg-sm" x="36" y="308" text-anchor="start">by hash, by a person</text><path class="dg-send" d="M202,292 L254.0,292.0"/><polygon class="dg-sendh" points="260.0,292.0 252.0,287.5 252.0,296.5"/><text class="dg-sm" x="36" y="322" text-anchor="start">its run names the incident</text><rect class="dg-store" x="14" y="340" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="340" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="356.0" text-anchor="middle">Cancel, Hand over</text><text class="dg-sm" x="109.0" y="370.0" text-anchor="middle">one line each; nothing runs</text><circle class="dg-num" cx="14" cy="340" r="9"/><text class="dg-numt" x="14" y="343.6" text-anchor="middle">6</text><circle class="dg-no" cx="320" cy="340" r="11"/><line class="dg-nol" x1="312.5" y1="347.5" x2="327.5" y2="332.5"/><text class="dg-sm" x="320" y="366" text-anchor="middle">no AI call, no run</text><text class="dg-sm" x="320" y="379" text-anchor="middle">without a person&#x27;s press</text></svg>
