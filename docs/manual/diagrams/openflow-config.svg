<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Configuring a switch&#x27;s OpenFlow from NetBox: the values are read from the network&#x27;s committed NSOT export; the switch&#x27;s version and running configuration are read, parsed, and the template rendered against them, with the undo that puts back exactly what the program changes and the hash over both and the export&#x27;s; you confirm by that hash; refused unless the template is confirmed, planned again and the hash compared, the switch held while its lines are sent; verified on the switch and in the controller&#x27;s switch list; the undo sent on a failure; recorded. Nothing is saved to the startup configuration."><line class="dg-lane" x1="212" y1="20" x2="212" y2="514"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE SWITCH AND ITS CONTROLLER</text><path class="dg-repo" d="M14,50 V78 A93.0,6 0 0 0 200,78 V50"/><ellipse class="dg-repo" cx="107.0" cy="50" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="69.0" text-anchor="middle">The NSOT export</text><text class="dg-sm" x="107.0" y="83.0" text-anchor="middle">committed; its hash</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><rect class="dg-dev" x="232" y="44" width="156" height="40" rx="5"/><rect class="dg-dev" x="244" y="83" width="8" height="5"/><rect class="dg-dev" x="258" y="83" width="8" height="5"/><rect class="dg-dev" x="272" y="83" width="8" height="5"/><text class="dg-tb" x="310.0" y="62.0" text-anchor="middle">The switch</text><text class="dg-sm" x="310.0" y="76.0" text-anchor="middle">show version, running</text><path class="dg-box" d="M14,96 H190 L200,106 V132 H14 Z"/><path class="dg-box" d="M190,96 V106 H200"/><text class="dg-tb" x="107.0" y="112.0" text-anchor="middle">Read before</text><text class="dg-sm" x="107.0" y="126.0" text-anchor="middle">parsed, never kept as text</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><path class="dg-read" d="M230,66 L205.1,106.9"/><polygon class="dg-readh" points="202.0,112.0 210.0,107.5 202.3,102.8"/><path class="dg-box" d="M14,144 H190 L200,154 V180 H14 Z"/><path class="dg-box" d="M190,144 V154 H200"/><text class="dg-tb" x="107.0" y="160.0" text-anchor="middle">Render, and its undo</text><text class="dg-sm" x="107.0" y="174.0" text-anchor="middle">checked by parsing</text><circle class="dg-num" cx="14" cy="144" r="9"/><text class="dg-numt" x="14" y="147.6" text-anchor="middle">3</text><path class="dg-box" d="M14,192 H190 L200,202 V222 H14 Z"/><path class="dg-box" d="M190,192 V202 H200"/><text class="dg-tb" x="107.0" y="205.0" text-anchor="middle">The hash</text><text class="dg-sm" x="107.0" y="219.0" text-anchor="middle">program, undo, export</text><circle class="dg-num" cx="14" cy="192" r="9"/><text class="dg-numt" x="14" y="195.6" text-anchor="middle">5</text><rect class="dg-person" x="14" y="236" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="248.0" r="4"/><path class="dg-person" d="M23,259.0 Q30,250.0 37,259.0"/><text class="dg-tx" x="46" y="255.0" text-anchor="start">You confirm, bound to it</text><rect class="dg-band" x="0" y="226" width="400" height="128" rx="6"/><text class="dg-hd" x="30" y="242" text-anchor="start">THE CONFIRM</text><path class="dg-box" d="M14,276 H190 L200,286 V310 H14 Z"/><path class="dg-box" d="M190,276 V286 H200"/><text class="dg-tb" x="107.0" y="291.0" text-anchor="middle">Planned again, held</text><text class="dg-sm" x="107.0" y="305.0" text-anchor="middle">a moved hash sends nothing</text><circle class="dg-num" cx="14" cy="276" r="9"/><text class="dg-numt" x="14" y="279.6" text-anchor="middle">6</text><path class="dg-send" d="M202,300 L224.0,300.0"/><polygon class="dg-sendh" points="230.0,300.0 222.0,295.5 222.0,304.5"/><rect class="dg-dev" x="232" y="280" width="156" height="40" rx="5"/><rect class="dg-dev" x="244" y="319" width="8" height="5"/><rect class="dg-dev" x="258" y="319" width="8" height="5"/><rect class="dg-dev" x="272" y="319" width="8" height="5"/><text class="dg-tb" x="310.0" y="298.0" text-anchor="middle">The switch</text><text class="dg-sm" x="310.0" y="312.0" text-anchor="middle">its OpenFlow lines</text><rect class="dg-svc" x="232" y="334" width="156" height="34" rx="17.0"/><text class="dg-tb" x="310.0" y="349.0" text-anchor="middle">The controller</text><text class="dg-sm" x="310.0" y="363.0" text-anchor="middle">its switch list</text><path class="dg-box" d="M14,330 H190 L200,340 V364 H14 Z"/><path class="dg-box" d="M190,330 V340 H200"/><text class="dg-tb" x="107.0" y="345.0" text-anchor="middle">Verify</text><text class="dg-sm" x="107.0" y="359.0" text-anchor="middle">read back; in the list</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">8</text><path class="dg-read" d="M230,350 L208.0,348.4"/><polygon class="dg-readh" points="202.0,348.0 209.7,353.1 210.3,344.1"/><path class="dg-undo" d="M202,384 Q220,380 229.2,315.9"/><polygon class="dg-undoh" points="230.0,310.0 224.4,317.3 233.3,318.6"/><text class="dg-sm" x="14" y="392" text-anchor="start">On a failure: the undo sent, read again.</text><circle class="dg-num" cx="14" cy="378" r="9"/><text class="dg-numt" x="14" y="381.6" text-anchor="middle">9</text><rect class="dg-store" x="14" y="410" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="410" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="426.0" text-anchor="middle">The SDN operation record</text><text class="dg-sm" x="109.0" y="440.0" text-anchor="middle">History reads it</text><circle class="dg-num" cx="14" cy="410" r="9"/><text class="dg-numt" x="14" y="413.6" text-anchor="middle">10</text><circle class="dg-no" cx="310" cy="460" r="11"/><line class="dg-nol" x1="302.5" y1="467.5" x2="317.5" y2="452.5"/><text class="dg-sm" x="310" y="486" text-anchor="middle">no save</text><text class="dg-sm" x="310" y="499" text-anchor="middle">to startup</text></svg>
