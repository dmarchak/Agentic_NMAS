<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Merge-only, and Mode B. The tool compares intent with the device, section by section. A line intent has and the device lacks is sent, inside its section: that is all a deploy does. A line the device has and intent lacks is residue: merge-only leaves it, and names it. Mode B removes residue only when a person chooses the unit and states a reason, and only in a shape measured on that platform to remove exactly itself; verify reads it gone, and the undo puts back the device&#x27;s own line."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">INTENT</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">MERGE-ONLY · EVERY DEPLOY</text><path class="dg-intent" d="M14,44 H190 L200,54 V84 H14 Z"/><path class="dg-intent" d="M190,44 V54 H200"/><text class="dg-tb" x="107.0" y="62.0" text-anchor="middle">A line intent has</text><text class="dg-sm" x="107.0" y="76.0" text-anchor="middle">the device lacks</text><rect class="dg-dev" x="240" y="44" width="140" height="40" rx="5"/><rect class="dg-dev" x="252" y="83" width="8" height="5"/><rect class="dg-dev" x="266" y="83" width="8" height="5"/><rect class="dg-dev" x="280" y="83" width="8" height="5"/><text class="dg-tb" x="310.0" y="62.0" text-anchor="middle">Sent</text><text class="dg-sm" x="310.0" y="76.0" text-anchor="middle">inside its section</text><path class="dg-send" d="M202,64 L232.0,64.0"/><polygon class="dg-sendh" points="238.0,64.0 230.0,59.5 230.0,68.5"/><circle class="dg-num" cx="22" cy="112" r="9"/><text class="dg-numt" x="22" y="115.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="116" text-anchor="start">Added, never negated by default.</text><text class="dg-sm" x="36" y="130" text-anchor="start">A replaced value is sent; the device keeps</text><text class="dg-sm" x="36" y="143" text-anchor="start">the rest.</text><rect class="dg-band" x="0" y="176" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="192" text-anchor="start">RESIDUE · NAMED, LEFT</text><rect class="dg-dev" x="240" y="200" width="140" height="40" rx="5"/><rect class="dg-dev" x="252" y="239" width="8" height="5"/><rect class="dg-dev" x="266" y="239" width="8" height="5"/><rect class="dg-dev" x="280" y="239" width="8" height="5"/><text class="dg-tb" x="310.0" y="218.0" text-anchor="middle">A line it has</text><text class="dg-sm" x="310.0" y="232.0" text-anchor="middle">intent lacks</text><text class="dg-tb" x="14" y="216" text-anchor="start">Not in intent: left in place</text><text class="dg-sm" x="14" y="230" text-anchor="start">and named by the preview.</text><text class="dg-sm" x="14" y="266" text-anchor="start">No baseline while residue stands.</text><rect class="dg-band" x="0" y="302" width="400" height="162" rx="6"/><text class="dg-hd" x="30" y="318" text-anchor="start">MODE B · A PERSON CHOOSES</text><rect class="dg-person" x="14" y="326" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="338.0" r="4"/><path class="dg-person" d="M23,349.0 Q30,340.0 37,349.0"/><text class="dg-tx" x="46" y="345.0" text-anchor="start">You choose it, with a reason</text><circle class="dg-num" cx="14" cy="326" r="9"/><text class="dg-numt" x="14" y="329.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="376" text-anchor="start">Only a shape measured on the platform</text><text class="dg-sm" x="14" y="389" text-anchor="start">to remove exactly itself.</text><rect class="dg-dev" x="262" y="326" width="118" height="112" rx="5"/><rect class="dg-dev" x="274" y="437" width="8" height="5"/><rect class="dg-dev" x="288" y="437" width="8" height="5"/><rect class="dg-dev" x="302" y="437" width="8" height="5"/><text class="dg-tb" x="321.0" y="344" text-anchor="middle">The device</text><path class="dg-send" d="M202,404 L254.0,404.0"/><polygon class="dg-sendh" points="260.0,404.0 252.0,399.5 252.0,408.5"/><text class="dg-tb" x="14" y="408" text-anchor="start">Its negation, verbatim</text><path class="dg-read" d="M260,428 L208.0,428.0"/><polygon class="dg-readh" points="202.0,428.0 210.0,432.5 210.0,423.5"/><text class="dg-tb" x="14" y="432" text-anchor="start">Read back: gone</text><text class="dg-sm" x="14" y="452" text-anchor="start">The undo re-adds the device&#x27;s own line.</text></svg>
