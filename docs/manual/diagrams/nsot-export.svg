<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Committing a network&#x27;s NSOT export: Export from NetBox reads the network&#x27;s records from NetBox, read only, builds the export and compares it with the committed one by kind, and shows its hash; you confirm, bound to that hash and the committed file&#x27;s; NetBox is read again and a moved export, or a commit made since, commits nothing and says both; the export is committed to the network&#x27;s configuration repository as you, the commit is the record, and every page reading the export reads it again. No device is contacted and nothing is written to NetBox."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">NETBOX</text><rect class="dg-store" x="232" y="44" width="156" height="40" rx="3"/><rect class="dg-bar" x="232" y="44" width="4" height="40" rx="1"/><text class="dg-tb" x="312.0" y="62.0" text-anchor="middle">NetBox</text><text class="dg-sm" x="312.0" y="76.0" text-anchor="middle">read only, whole lists</text><path class="dg-box" d="M14,44 H190 L200,54 V80 H14 Z"/><path class="dg-box" d="M190,44 V54 H200"/><text class="dg-tb" x="107.0" y="60.0" text-anchor="middle">The export, read now</text><text class="dg-sm" x="107.0" y="74.0" text-anchor="middle">its hash; by kind</text><circle class="dg-num" cx="14" cy="44" r="9"/><text class="dg-numt" x="14" y="47.6" text-anchor="middle">1</text><path class="dg-read" d="M230,62 L210.0,62.0"/><polygon class="dg-readh" points="204.0,62.0 212.0,66.5 212.0,57.5"/><path class="dg-repo" d="M14,102 V130 A93.0,6 0 0 0 200,130 V102"/><ellipse class="dg-repo" cx="107.0" cy="102" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="121.0" text-anchor="middle">The committed export</text><text class="dg-sm" x="107.0" y="135.0" text-anchor="middle">its hash, its commit</text><circle class="dg-num" cx="14" cy="96" r="9"/><text class="dg-numt" x="14" y="99.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="152" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="164.0" r="4"/><path class="dg-person" d="M23,175.0 Q30,166.0 37,175.0"/><text class="dg-tx" x="46" y="171.0" text-anchor="start">You confirm, bound to its hash</text><circle class="dg-num" cx="14" cy="152" r="9"/><text class="dg-numt" x="14" y="155.6" text-anchor="middle">3</text><rect class="dg-band" x="0" y="198" width="400" height="126" rx="6"/><text class="dg-hd" x="30" y="214" text-anchor="start">THE CONFIRM</text><path class="dg-box" d="M14,222 H190 L200,232 V256 H14 Z"/><path class="dg-box" d="M190,222 V232 H200"/><text class="dg-tb" x="107.0" y="237.0" text-anchor="middle">Read again</text><text class="dg-sm" x="107.0" y="251.0" text-anchor="middle">a moved hash commits nothing</text><circle class="dg-num" cx="14" cy="222" r="9"/><text class="dg-numt" x="14" y="225.6" text-anchor="middle">4</text><path class="dg-repo" d="M14,272 V300 A93.0,6 0 0 0 200,300 V272"/><ellipse class="dg-repo" cx="107.0" cy="272" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="291.0" text-anchor="middle">nsot/export.json</text><text class="dg-sm" x="107.0" y="305.0" text-anchor="middle">one commit, as you</text><circle class="dg-num" cx="14" cy="266" r="9"/><text class="dg-numt" x="14" y="269.6" text-anchor="middle">5</text><text class="dg-sm" x="14" y="344" text-anchor="start">Every page reading it reads it again.</text><circle class="dg-num" cx="14" cy="330" r="9"/><text class="dg-numt" x="14" y="333.6" text-anchor="middle">6</text><circle class="dg-no" cx="310" cy="420" r="11"/><line class="dg-nol" x1="302.5" y1="427.5" x2="317.5" y2="412.5"/><text class="dg-sm" x="310" y="446" text-anchor="middle">no device</text><text class="dg-sm" x="310" y="459" text-anchor="middle">nothing to NetBox</text></svg>
