name: nmas-bootstrap-probe

# ---------------------------------------------------------------------------
# REVISED after the first probe failed. Both failures were divergences from
# rcn-lab1 that this file had aimed to mirror and did not:
#
#   1. NO STARTUP CONFIG. Every rcn-lab1 node has one. Without it vrnetlab
#      takes a different code path ("User provided startup configuration is
#      not found"), and for vIOS-L2 the management plane never comes up at
#      all — its Gi0/0 only gets an address because s1.cfg says
#      `ip address dhcp`. The probe's vIOS stalled and reset SSH.
#
#   2. ONE vCPU. Every c8000v in rcn-lab1 binds a PATCHED launch script:
#         binds: [patches/c8000v-launch.py:/launch.py]
#      The patch is one line — `smp="2"` — against a stock script that
#      otherwise matches (ram=4096 either way). Measured: r1 boots in 5m19s
#      on 2 vCPU; the probe never completed in ~40 minutes on 1.
#
# So "mirror rcn-lab1" now means reading rcn-lab1 rather than approximating
# it. The patch is COPIED into this directory rather than bound from
# ~/labs/lab: a read-only reference would still be a shared file, and the
# point of a throwaway lab is that destroying it cannot affect anything.
#
# ISOLATION (unchanged, and still required)
#   Own lab name, own docker network, own subnet. rcn-lab1 has no `mgmt:`
#   block precisely because a second network on 172.20.20.0/24 fails to
#   create. No br-mgmt dependency: this lab has no bridge node.
#
# THE LINK is unaddressed on purpose — it is what makes the capture record
# an *unconfigured* data interface, the line the wizard must tolerate.
# ---------------------------------------------------------------------------

mgmt:
  network: clab-bootstrap-probe
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    cisco_c8000v:
      image: vrnetlab/cisco_c8000v:17.06.01a       # identical to r1-r5
    cisco_vios:
      image: vrnetlab/cisco_vios:L2-20180619       # identical to s1-s4
      env:
        CLAB_MGMT_PASSTHROUGH: "false"             # required for 'ip address dhcp'

  nodes:
    bp-c8k:
      kind: cisco_c8000v
      mgmt-ipv4: 172.30.30.11
      startup-config: configs/bp-c8k.cfg
      binds:
        - patches/c8000v-launch.py:/launch.py      # smp="2" — the boot fix
    bp-vios:
      kind: cisco_vios
      mgmt-ipv4: 172.30.30.21
      startup-config: configs/bp-vios.cfg

  links:
    - endpoints: ["bp-c8k:Gi2", "bp-vios:Gi0"]
