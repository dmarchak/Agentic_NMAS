# HPE/H3C Comware 7 (a 5130, 5900 or the like): one numbered instance classifying the OpenFlow
# ports' VLAN, its controller (IPv4 or IPv6), its fail-open mode, then active. System-view lines.
# DRAFT: no driver sends it yet (hp_comware is a discovery driver, which refuses every write),
# and no line may be sent until this network has confirmed it. The sources are H3C's Comware 7
# references: no HPE-branded page could be read (2026-11-05). Comware has no version command
# (the configuration guide cites OpenFlow 1.3.3), and an active instance is deactivated
# (`undo active instance`) before its VLAN changes (seen only in a search result: unverified).
name: hp_comware
family: HP Comware
drivers: [hp_comware]
form: cli
versions: ["1.3"]
transports: [tcp]
ipv6_controller: true
instance_shape: number
lines:
  - text: "openflow instance {openflow.instance}"
    cite: [cw-instance]
  - text: " classification vlan {openflow.vlan}"
    cite: [cw-classification]
  - text: " controller {controller.id} address {comware.family} {controller.address} port {controller.port}"
    cite: [cw-controller]
  - text: " fail-open mode {openflow.fail_mode}"
    cite: [cw-fail-open]
  - text: " active instance"
    cite: [cw-active]
citations:
