# Nightly mutation testing of the CHANGED automation code (docs/TESTING.md, "Mutation testing";
# the operator, 2026-10-14). Coverage says a test ran a line; this says whether a test would
# notice the line being wrong. Each night: the automation functions changed since the commit the
# last night covered, and those the record keeps (unfinished, or holding an open survivor), at
# most a cap of them, the oldest first, mutated by mutmut, each mutant run against the tests
# MEASURED to execute its function (the coverage nightly's per-test contexts, mutmut's own
# statistics, and the night's measurement of each test's children; where the coverage map does
# not hold a function's text, the plan's own whole-suite refresh of it); a canary first. Never
# on a push or a pull request, never on the NMAS host, never in the gate.
#
# A night fails when an open VERDICT survivor remains (a mutant no test killed whose change can
# decide a result, not in tests/mutation_equivalent.py, the hand-kept list; MESSAGE survivors,
# words only, are listed and never fail it; a logging call's arguments are never mutated),
# or when the measurement or the run broke
# (the canary survived, a mutant outside the plan ran, mutmut failed): GitHub's own
# failed-workflow email is the notice; no issue is opened. The record is kept after every night
# whose results stand, so a large function is finished across nights and an open survivor is
# run again each night until a test kills it or a person lists it as equivalent (C769).
name: mutation-nightly

on:
  # WEEKLY, as a measurement (the operator, 2026-10-25: the deploy bar is CI and the change's
  # own tests; mutation gates only egress and masking, by a targeted run before their deploy,
  # once that code exists; no on-demand dispatch until the testing model is approved). Sunday
  # 14:00 UTC, outside the 08:30 to 09:10 UTC backup window; the `window` job below refuses a
  # start inside it, since a schedule can fire hours late (C772: 5 h 26 min). C835's reason for
  # no schedule (a late night held the one slot and a dispatched fix waited) is gone: a
  # labelled run has a concurrency group of its own.
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Functions to mutate whole tonight besides the night's own, space-separated,
          each path::qualname (e.g. modules/nsot/config_check.py::_check_device); empty for none
        required: false
        default: ""
      cap:
        description: >-
          At most this many functions this run, the named ones first (digits; empty for the
          plan's default, 20). With `functions` and a cap equal to their count, only the named
          functions run; what does not fit waits in the record, first in line
        required: false
        default: ""
      label:
        description: >-
          A name for a group of functions run beside other groups (lowercase letters, digits
          and hyphens; empty for the one-at-a-time night). A labelled run has its own
          concurrency group and keeps its record apart from the nights' own: its verdict stands
          in its run alone
        required: false
        default: ""
      stale_map:
        description: >-
          A function the coverage map does not hold at its text: empty or `refresh` measures
          it first (the plan's default); `defer` leaves it waiting in the record, so a named
          one turns the run red, named (C1616), with no refresh's cost
        required: false
        default: ""

permissions:
  contents: read

# One night at a time, holding the record; a labelled dispatch (Lab 9, 2026-10-23: the
# blocking function groups measured in parallel, the operator) runs in a group of its own
# label, beside the others and the night.
concurrency:
  group: mutation-nightly${{ inputs.label && format('-{0}', inputs.label) || '' }}
  cancel-in-progress: false

env:
  # THE setting: how long a night may mutate. What does not fit is named in the summary and
  # carried to the next night, first in line.
  MUTATION_BUDGET_MINUTES: "120"

jobs:
  # Never inside the backup window (the hypervisor's nightly backup loads the lab host; a
  # measurement taken then measures the backup): a start inside 08:30 to 09:10 UTC mutates
  # nothing and says so, the run green; the next week's runs as usual.
  window:
    name: outside the backup window (08:30 to 09:10 UTC)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.when.outputs.ok }}
    steps:
      - id: when
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -ge 830 ] && [ "$now" -lt 910 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::refused: ${now} UTC is inside the backup window, 08:30 to 09:10 UTC: nothing is mutated this time"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  mutate:
    needs: window
    if: needs.window.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    # `actions: read`, read-only and this repository's alone: to download the newest coverage
    # nightly's drill-down from its run (the step "Download it"), which needs it (C796, C834).
    permissions:
      contents: read
      actions: read
    # The budget, plus about 20 minutes for the install, mutmut's own setup run and the report,
    # plus the plan's refresh of a stale coverage map (its bound, REFRESH_TIMEOUT_S in
    # scripts/nmas-mutation: 5,200 s, about 87 minutes; about 27 to 35 expected, the coverage
    # nightly's own four shards' test steps summed).
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the night diffs from the last covered commit
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # the host's interpreter, as CI
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.txt
            requirements-test.txt
            requirements-mutation.txt

      # Bounded (C1631): ci.yml's comment (9 to 17 s measured here, runs #22 to #41).
      - name: Install the host's versions, CI's tools and mutmut, exactly
        timeout-minutes: 2
        run: |
          scripts/nmas-retry python -m pip install --require-hashes --no-deps -r requirements.lock
          scripts/nmas-retry python -m pip install --no-deps -r requirements-ci.txt
          scripts/nmas-retry python -m pip install --no-deps -r requirements-test.txt
          scripts/nmas-retry python -m pip install --no-deps -r requirements-mutation.txt

      # The setup ci.yml's tests stand on, step for step (its comments say why each is there):
      # a test that skips here for want of one kills no mutant, and the night would read a
      # missing setup as a weak test. tests/test_ci_workflow.py holds every setup step of
      # ci.yml's test job, its `run` word for word, to have a twin here, and the tests' own
      # environment (NMAS_REQUIRE_PG) to be the mutate step's (the operator, 2026-10-14: the
      # first GitHub night had none of PostgreSQL, promtool or NMAS_REQUIRE_PG).
      - name: The runner's environment (information, not a gate)
        run: python scripts/nmas-env-facts --annotate || true

      - name: Where PyPI's metadata disagrees with the host (information, not a gate)
        run: python -m pip check || true

      # The setup caches and their bounds: ci.yml's comment (C1637, C1631).
      - name: The runner image, for the setup caches' keys
        id: image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: promtool, cached by the runner image (C1637)
        id: promtool-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nmas-promtool
          key: nmas-promtool-${{ steps.image.outputs.key }}-v1

      - name: promtool for the PromQL tests, downloaded when not cached (unpacked, not installed)
        if: steps.promtool-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          R="$GITHUB_WORKSPACE/scripts/nmas-retry"   # one retry on failure (C1631)
          d=$(mktemp -d) && cd "$d"
          "$R" sudo apt-get update -qq
          "$R" bash -c 'apt-get download promtool 2>/dev/null || apt-get download prometheus'
          mkdir -p "$HOME/.local/share/nmas-promtool"   # dpkg -x makes only the last folder
          dpkg -x ./*.deb "$HOME/.local/share/nmas-promtool"

      - name: promtool answers
        run: |
          "$HOME/.local/share/nmas-promtool/usr/bin/promtool" --version

      - name: PostgreSQL 18's packages, cached by the runner image (C1637)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nmas-pg-debs
          key: nmas-pg18-debs-${{ steps.image.outputs.key }}-v1

      - name: PostgreSQL 18's packages from PGDG, downloaded when not cached
        if: steps.pg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          R="$GITHUB_WORKSPACE/scripts/nmas-retry"   # one retry on failure (C1631)
          "$R" sudo apt-get install -y -qq --no-install-recommends postgresql-common
          "$R" sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          deps=$(apt-cache depends postgresql-18 | sed -n 's/^ *Depends: \(lib[^ <>]*\)$/\1/p' | sort -u)
          debs="$HOME/.cache/nmas-pg-debs" && mkdir -p "$debs/partial"   # apt needs partial/
          "$R" sudo apt-get install -y -qq --no-install-recommends --download-only \
            -o Dir::Cache::archives="$debs" libpq5 $deps
          cd "$debs" && "$R" apt-get download postgresql-18
          sudo rm -rf "$debs/partial" "$debs/lock" && sudo chown -R "$(id -u)" "$debs"

      - name: PostgreSQL 18 for the records tests, from PGDG (libpq5 installed; the server unpacked)
        run: |
          debs="$HOME/.cache/nmas-pg-debs"
          libs=$(ls "$debs"/*.deb | grep -v '/postgresql-18_' || true)
          [ -z "$libs" ] || sudo dpkg -i $libs
          mkdir -p "$HOME/.local/share/nmas-pg"
          dpkg -x "$debs"/postgresql-18_*.deb "$HOME/.local/share/nmas-pg"
          bin=$(ls -d "$HOME"/.local/share/nmas-pg/usr/lib/postgresql/18/bin)
          if ldd "$bin/postgres" "$bin/initdb" | grep "not found"; then
            echo "::error::the unpacked PostgreSQL lacks a library (above)"; exit 1
          fi
          "$bin/postgres" --version | tee /dev/stderr | grep -q " 18\." \
            || { echo "::error::the unpacked server is not PostgreSQL 18"; exit 1; }
          python -c "import psycopg; print('psycopg', psycopg.__version__, 'libpq', psycopg.pq.version())"

      - name: Allow a network namespace for the tests (this VM only)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A labelled run takes its own group's newest record first (so a function the budget cut
      # short continues where it stopped: run #34, 2026-10-23, left 152 of `_phases`' 448), then
      # the nights' record.
      - name: The last night's record (the commit it covered, and what it left over)
        uses: actions/cache/restore@v4
        with:
          path: .mutation-state
          key: mutation-state-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.label && format('mutation-group-{0}-', inputs.label) || 'mutation-state-' }}
            mutation-state-

      # The tests that reach each function, MEASURED (C796, C834; the operator, 2026-10-15): the
      # newest successful coverage nightly's drill-down (each function's tests from its per-test
      # contexts, and each test's tier), from that run, outside the checkout. Its run, commit and
      # date go to the plan and the summary; a function changed since, or new, or every one when
      # none is found, has its reach refreshed by the plan (below).
      # Bounded (C1631): 0 to 1 s measured (runs #22 to #41), so the smallest whole minute.
      - name: The newest coverage drill-down (each function's tests, measured)
        id: reach
        timeout-minutes: 1
        env:
          REPO: ${{ github.repository }}
        run: |
          curl -sf --retry 1 --max-time 20 \
            "https://api.github.com/repos/$REPO/actions/workflows/coverage-nightly.yml/runs?status=success&per_page=1" \
            | python -c "import json,sys; r=(json.load(sys.stdin).get('workflow_runs') or [{}])[0]; print(f\"id={r.get('id','')}\nsha={r.get('head_sha','')}\ndate={r.get('created_at','')}\")" \
            >> "$GITHUB_OUTPUT" || echo "no coverage drill-down found: every function refreshed"

      - name: Download it
        if: steps.reach.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-drilldown
          path: ${{ runner.temp }}/coverage-reach
          run-id: ${{ steps.reach.outputs.id }}
          github-token: ${{ github.token }}

      # The dispatch's `functions` reach the script through the environment, never pasted into
      # it: each word becomes one --also argument, and the plan refuses a name it cannot find.
      # --fence: mutmut is given only the planned functions; every other function of a planned
      # module is fenced off in this checkout, which exists for the night alone (the second
      # night planned two functions of pipeline.py and mutmut made 5,030 mutants of 56).
      # The summary names the map's run, commit and date every night. A planned function the map
      # does not hold at its text tonight (its text hash there differs, or it is absent) is never
      # selected by the map, nor by the test files importing it (a caller's test imports
      # nothing of it, C842): the plan REFRESHES the map for it first, once, confined by
      # scripts/nmas-test, per-test contexts over its module alone: the test files the map's
      # module index says reach that module (any phase), import it, changed since, or reach a
      # module changed since (C1640; scripts/nmas_mutation.py, `refresh_scope`), or the whole
      # suite with no index (run #41: 3,207 s; bounded at 5,200 s). A refresh that cannot
      # finish leaves it waiting in the record, and the run red (C1616). NMAS_REQUIRE_PG as the mutate
      # step's: the refresh runs the tests ci.yml runs, and a skipped test reaches nothing.
      - name: Plan the night
        id: plan
        env:
          ALSO_FUNCTIONS: ${{ inputs.functions }}
          CAP: ${{ inputs.cap }}
          LABEL: ${{ inputs.label }}
          STALE_MAP: ${{ inputs.stale_map }}
          REACH_COMMIT: ${{ steps.reach.outputs.sha }}
          REACH_RUN: ${{ steps.reach.outputs.id }}
          REACH_DATE: ${{ steps.reach.outputs.date }}
          NMAS_REQUIRE_PG: "1"
        run: |
          mkdir -p .mutation-state
          set -f
          set --
          for f in $ALSO_FUNCTIONS; do set -- "$@" --also "$f"; done
          case "$CAP" in
            "") ;;
            *[!0-9]*) echo "the cap '$CAP' is not a number of functions" >&2; exit 1;;
            *) set -- "$@" --cap "$CAP";;
          esac
          case "$LABEL" in
            "") ;;
            *[!a-z0-9-]*) echo "the label '$LABEL' is not lowercase letters, digits and hyphens" >&2; exit 1;;
          esac
          case "$STALE_MAP" in
            "") ;;
            refresh|defer) set -- "$@" --stale-map "$STALE_MAP";;
            *) echo "the stale-map rule '$STALE_MAP' is not refresh or defer" >&2; exit 1;;
          esac
          # Its exit is kept, so a red plan (C1616: a named function not mutated, or a refresh
          # that measured nothing, with nothing left to mutate) still shows its summary first.
          set +e
          python scripts/nmas-mutation plan --state .mutation-state/state.json \
            --head "$GITHUB_SHA" --out mutation-out --summary mutation-out/summary.md --fence \
            --reach "$RUNNER_TEMP/coverage-reach" --reach-commit "$REACH_COMMIT" \
            --reach-run "$REACH_RUN" --reach-date "$REACH_DATE" "$@"
          code=$?
          set -e
          # The summary in the job's log too (readable through the API, which returns no job
          # summary), and on the run's page.
          if [ -f mutation-out/summary.md ]; then
            cat mutation-out/summary.md
            cat mutation-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -eq 0 ] && [ -s mutation-out/patterns.txt ] \
              && grep -q . mutation-out/patterns.txt; then
            echo "work=yes" >> "$GITHUB_OUTPUT"
          else
            echo "work=no" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      # Confined as scripts/nmas-test confines the suite: a namespace with only loopback, brought
      # up (a new namespace's loopback starts DOWN, and a test's own 127.0.0.1 listener then
      # reads "Network is unreachable": measured 2026-10-14). ONE mutant at a time
      # (--max-children 1): mutmut forks its children from a process that has already imported
      # the tests' conftest, so parallel children share one test store and fail each other's
      # tests, which mutmut counts as kills (measured 2026-10-14: in parallel a log.debug mutant
      # was "killed" and 13 real survivors were hidden; serially, two runs agreed mutant for
      # mutant). `nmas-mutation run` runs mutmut three times: the canary in process, then (each
      # test that starts a child added to the functions its children were measured to run) the
      # canary in a child, then the night. Bytecode is WRITTEN here (no PYTHONDONTWRITEBYTECODE): mutmut's copy of a
      # module holds every mutant of it (config_check.py: 2168, 7.5 MB, 7.7 s to compile), and a
      # test's child process compiled it afresh each time, so one surviving mutant's tests took
      # 107 s instead of 7 (measured 2026-10-14). The copy is scratch; no stale bytecode can
      # reach the checkout.
      # Its exit goes to the report: 0 finished, 124 the budget ran out, anything else a failed
      # setup or clean run, which fails the night (no verdict stands on it).
      - name: Mutate, within the budget, confined to loopback
        id: mutate
        if: steps.plan.outputs.work == 'yes'
        env:
          NMAS_REQUIRE_PG: "1"
        run: |
          set +e
          timeout "${MUTATION_BUDGET_MINUTES}m" unshare -rn sh -c '
            ip link set lo up || { echo "could not bring loopback up" >&2; exit 2; }
            exec unshare --map-user='"$(id -u)"' --map-group='"$(id -g)"' \
              env NMAS_REQUIRE_NETWORK_CONFINEMENT=1 \
              python scripts/nmas-mutation run --out mutation-out'
          code=$?
          echo "nmas-mutation run exit $code"
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      # Its summary in the job's log and on the run's page; the step's result is the report's.
      - name: The report
        if: steps.plan.outputs.work == 'yes'
        env:
          MUTMUT_EXIT: ${{ steps.mutate.outputs.exit }}
        run: |
          set +e
          python scripts/nmas-mutation report --plan mutation-out/plan.json \
            --summary mutation-out/summary.md --state-out .mutation-state/state.json \
            --budget "$MUTATION_BUDGET_MINUTES" --mutmut-exit "$MUTMUT_EXIT"
          code=$?
          cat mutation-out/summary.md
          cat mutation-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Kept after every night whose results stand, open survivors and all: the report writes the
      # record only then (a broken measurement or run leaves the restored one as it was). A
      # labelled run's is kept under a key outside the nights' prefix, so runs side by side never
      # overwrite the record a night restores.
      - name: Keep the record for the next night
        if: always() && hashFiles('.mutation-state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .mutation-state
          key: ${{ inputs.label && format('mutation-group-{0}-{1}', inputs.label, github.run_id) || format('mutation-state-{0}', github.run_id) }}

      - name: Keep the full report
        if: always() && steps.plan.outputs.work == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutation-out/
            setup.cfg
          retention-days: 30
