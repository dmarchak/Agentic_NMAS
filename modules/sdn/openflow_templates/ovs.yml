# Open vSwitch on a Linux server: the bridge, its OpenFlow version, its fail mode, its controller
# and its OpenFlow ports, as ONE ovs-vsctl invocation (each line one command, joined by " -- "),
# which ovs-vsctl runs as one atomic OVSDB transaction. OVSDB keeps it: nothing to save.
# Rendered by modules/sdn/openflow_templates.py from NetBox (modules/sdn/openflow_values.py);
# sent only by modules/sdn/ovs_config.py, and only once this network has confirmed it.
name: ovs
family: Open vSwitch
drivers: [ovs_linux]
form: ovs-vsctl
transports: [tcp]
ipv6_controller: true
instance_shape: name
lines:
  - text: "--may-exist add-br {openflow.instance}"
    cite: [vsctl-add-br]
    why: "The bridge the switch's OpenFlow ports join (input: the device's openflow_instance)."
  - text: "set bridge {openflow.instance} protocols={openflow.ovs_protocol}"
    cite: [vsctl-set, db-protocols]
    why: "The OpenFlow version the bridge speaks to the controller (input: the config context's openflow.version)."
  - text: "set bridge {openflow.instance} other-config:datapath-id={openflow.datapath_id}"
    when: openflow.datapath_id
    cite: [vsctl-set, db-datapath-id]
    why: "The datapath id the controller knows this switch by (input: the device's openflow_datapath_id)."
  - text: "set-fail-mode {openflow.instance} {openflow.fail_mode}"
    cite: [vsctl-fail-mode]
    why: "What the bridge forwards while the controller is unreachable (input: the config context's openflow.fail_mode)."
  - text: "set-controller {openflow.instance} tcp:{controller.host}:{controller.port}"
    cite: [vsctl-set-controller, vsctl-target]
    why: "The controller the bridge connects to (input: the openflow Service's address and port)."
  - text: "--may-exist add-port {openflow.instance} {port}"
    each: ports
    cite: [vsctl-add-port]
    why: "{port} is an OpenFlow port of this switch (input: the interface's openflow tag)."
  - text: "set interface {port} ofport_request={port.openflow_port}"
    each: ports
    when: "profile.openflow.port_numbering == add_order"
    cite: [harness-ofport-request]
    why: "{port} is OpenFlow port {port.openflow_port}, so flows written against NetBox's numbers reach it: Open vSwitch otherwise numbers ports in the order they are added (input: the interface's openflow_port)."
citations:
  harness-ofport-request:
    measured: "C2603"
    what: "set interface <port> ofport_request=<n> gives the port number n on Open vSwitch 3.3 in the container harness (the ring's ports at their requested numbers)"
    evidence: "lab/lab9/fabric_forwarding_acceptance.py"
    release: "Open vSwitch 3.3"
    read: "2026-11-07"
  vsctl-add-br:
    document: "ovs-vsctl(8)"
    section: "the command [--may-exist] add-br bridge"
    release: "Open vSwitch 4.0.0"
    url: "https://www.openvswitch.org/support/dist-docs/ovs-vsctl.8.txt"
    read: "2026-11-05"
    verified: true
  vsctl-add-port:
    document: "ovs-vsctl(8)"
