<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Planning a layer&#x27;s change sends nothing and writes nothing. You name the layer and each setting&#x27;s path, its value now and after; the layer as committed must hold the before. The devices the layer reaches come from the inventory. Each is planned twice through the deploy&#x27;s own plan, as committed and with the change in memory, and the lines its program gains are its change; devices with the same change form one group, a device whose own value wins is unchanged, and one hash binds the plan. Approving and running it comes later."><line class="dg-lane" x1="284" y1="20" x2="284" y2="464"/><text class="dg-hd" x="142.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="342.0" y="12" text-anchor="middle">DEVICES</text><rect class="dg-band" x="0" y="20" width="400" height="64" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE CHANGE</text><path class="dg-box" d="M14,40 H260 L270,50 V78 H14 Z"/><path class="dg-box" d="M260,40 V50 H270"/><text class="dg-tb" x="142.0" y="57.0" text-anchor="middle">A layer&#x27;s settings</text><text class="dg-sm" x="142.0" y="71.0" text-anchor="middle">path · holds now · becomes</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><rect class="dg-band" x="0" y="90" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="106" text-anchor="start">THE PLAN · A JOB, PER DEVICE</text><path class="dg-repo" d="M14,118 V146 A60.0,6 0 0 0 134,146 V118"/><ellipse class="dg-repo" cx="74.0" cy="118" rx="60.0" ry="6"/><text class="dg-tb" x="74.0" y="137.0" text-anchor="middle">Repository</text><text class="dg-sm" x="74.0" y="151.0" text-anchor="middle">the layer at HEAD</text><path class="dg-rec" d="M136,132 L154.0,132.0"/><polygon class="dg-rech" points="160.0,132.0 152.0,127.5 152.0,136.5"/><path class="dg-intent" d="M162,112 H260 L270,122 V152 H162 Z"/><path class="dg-intent" d="M260,112 V122 H270"/><text class="dg-tb" x="216.0" y="130.0" text-anchor="middle">Its devices</text><text class="dg-sm" x="216.0" y="144.0" text-anchor="middle">from the inventory now</text><circle class="dg-num" cx="162" cy="112" r="9"/><text class="dg-numt" x="162" y="115.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="178" text-anchor="start">Each device planned as committed and</text><text class="dg-sm" x="14" y="191" text-anchor="start">with the change in memory, through the</text><text class="dg-sm" x="14" y="204" text-anchor="start">deploy&#x27;s own plan: the lines its program</text><text class="dg-sm" x="14" y="217" text-anchor="start">gains are its change.</text><rect class="dg-band" x="0" y="246" width="400" height="210" rx="6"/><text class="dg-hd" x="30" y="262" text-anchor="start">THE PLAN</text><path class="dg-box" d="M14,270 H260 L270,280 V310 H14 Z"/><path class="dg-box" d="M260,270 V280 H270"/><text class="dg-tb" x="142.0" y="288.0" text-anchor="middle">Groups · unchanged · refused</text><text class="dg-sm" x="142.0" y="302.0" text-anchor="middle">one hash over them all</text><circle class="dg-num" cx="14" cy="270" r="9"/><text class="dg-numt" x="14" y="273.6" text-anchor="middle">3</text><text class="dg-sm" x="14" y="336" text-anchor="start">A device whose own value wins is</text><text class="dg-sm" x="14" y="349" text-anchor="start">unchanged, and says who holds it. A</text><text class="dg-sm" x="14" y="362" text-anchor="start">device the deploy refuses carries its</text><text class="dg-sm" x="14" y="375" text-anchor="start">reasons. Nothing is committed.</text><text class="dg-sm" x="14" y="410" text-anchor="start">Approving and running the plan,</text><text class="dg-sm" x="14" y="423" text-anchor="start">a canary first, comes later.</text><circle class="dg-no" cx="342" cy="250" r="11"/><line class="dg-nol" x1="334.5" y1="257.5" x2="349.5" y2="242.5"/><text class="dg-sm" x="342" y="276" text-anchor="middle">nothing is</text><text class="dg-sm" x="342" y="289" text-anchor="middle">sent</text></svg>
