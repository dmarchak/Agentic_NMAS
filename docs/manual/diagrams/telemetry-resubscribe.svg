<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Re-subscribe a lost telemetry stream: the plan reads each subscription&#x27;s receiver from the device&#x27;s committed intent and refuses one whose removal is not measured; you tick the subscriptions and confirm with a reason, each bound to its hash and the selection to its own; holding the device, the run is recorded before anything is sent, then each receiver&#x27;s state, the collector&#x27;s sessions and the configuration are read; every ticked receiver is removed, one after the other, the read-back after each showing exactly the lines removed so far gone; ten seconds pass, once; each is added back, once more if it did not land, and the configuration must read as before; then for each subscription the device&#x27;s receiver on a new connection, the stream&#x27;s data in Prometheus and a new session on the collector are read for up to 290 seconds; a receiver that did not come back is said, with Re-add the receiver; the run is recorded with each subscription&#x27;s own outcome, and History shows it. Nothing is saved to startup."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">The plan</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">intent&#x27;s receiver, measured</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="92" text-anchor="start">refused: nothing read or sent</text><rect class="dg-person" x="14" y="104" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="116.0" r="4"/><path class="dg-person" d="M23,127.0 Q30,118.0 37,127.0"/><text class="dg-tx" x="46" y="123.0" text-anchor="start">You tick and confirm, a reason</text><circle class="dg-num" cx="14" cy="104" r="9"/><text class="dg-numt" x="14" y="107.6" text-anchor="middle">2</text><rect class="dg-band" x="0" y="150" width="400" height="330" rx="6"/><text class="dg-hd" x="30" y="166" text-anchor="start">THE RUN · A JOB, THE DEVICE HELD</text><rect class="dg-dev" x="262" y="170" width="118" height="300" rx="5"/><rect class="dg-dev" x="274" y="469" width="8" height="5"/><rect class="dg-dev" x="288" y="469" width="8" height="5"/><rect class="dg-dev" x="302" y="469" width="8" height="5"/><text class="dg-tb" x="321.0" y="188" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="202" text-anchor="middle">never saved</text><circle class="dg-num" cx="22" cy="172" r="9"/><text class="dg-numt" x="22" y="175.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="176" text-anchor="start">Recorded first</text><text class="dg-sm" x="36" y="188" text-anchor="start">its own change is Mercury&#x27;s</text><circle class="dg-num" cx="22" cy="208" r="9"/><text class="dg-numt" x="22" y="211.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="212" text-anchor="start">Read before</text><text class="dg-sm" x="36" y="224" text-anchor="start">state, sessions, config</text><path class="dg-read" d="M260,208 L208.0,208.0"/><polygon class="dg-readh" points="202.0,208.0 210.0,212.5 210.0,203.5"/><circle class="dg-num" cx="22" cy="244" r="9"/><text class="dg-numt" x="22" y="247.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="248" text-anchor="start">Remove every ticked receiver</text><text class="dg-sm" x="36" y="260" text-anchor="start">each read back as gone</text><path class="dg-send" d="M202,244 L254.0,244.0"/><polygon class="dg-sendh" points="260.0,244.0 252.0,239.5 252.0,248.5"/><circle class="dg-num" cx="22" cy="280" r="9"/><text class="dg-numt" x="22" y="283.6" text-anchor="middle">6</text><text class="dg-tb" x="36" y="284" text-anchor="start">Wait 10 s, once</text><circle class="dg-clock" cx="214" cy="280" r="8"/><path class="dg-clock" d="M214,275 V280 L218,282"/><circle class="dg-num" cx="22" cy="316" r="9"/><text class="dg-numt" x="22" y="319.6" text-anchor="middle">7</text><text class="dg-tb" x="36" y="320" text-anchor="start">Add each back</text><text class="dg-sm" x="36" y="332" text-anchor="start">once more if not landed</text><path class="dg-send" d="M202,316 L254.0,316.0"/><polygon class="dg-sendh" points="260.0,316.0 252.0,311.5 252.0,320.5"/><circle class="dg-num" cx="22" cy="352" r="9"/><text class="dg-numt" x="22" y="355.6" text-anchor="middle">8</text><text class="dg-tb" x="36" y="356" text-anchor="start">Verify each, up to 290 s</text><text class="dg-sm" x="36" y="368" text-anchor="start">device, stream, collector</text><path class="dg-read" d="M260,352 L208.0,352.0"/><polygon class="dg-readh" points="202.0,352.0 210.0,356.5 210.0,347.5"/><text class="dg-sm" x="36" y="396" text-anchor="start">Not back: that receiver is removed,</text><text class="dg-sm" x="36" y="409" text-anchor="start">said, with Re-add the receiver.</text><rect class="dg-store" x="14" y="490" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="490" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="508.0" text-anchor="middle">The run&#x27;s record</text><text class="dg-sm" x="109.0" y="522.0" text-anchor="middle">who, why, each check</text><circle class="dg-num" cx="14" cy="490" r="9"/><text class="dg-numt" x="14" y="493.6" text-anchor="middle">9</text><text class="dg-sm" x="14" y="546" text-anchor="start">History shows it.</text></svg>
