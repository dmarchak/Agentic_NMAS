# CI for the APP repository only (NSOT_CI.md, P.4 step 3).
#
# It checks out THIS repository and nothing else. The config repository
# (<repo>) holds plaintext device secrets by design and is never
# read here: no `repository:` input, no secrets, read-only token, and
# tests/test_ci_workflow.py fails on any of those. Actions are also disabled
# in the config repository's own settings, as a second, independent layer.
#
# Versions: requirements.lock, compiled from requirements.txt by uv with a hash
# for every file (Phase 4 section 8.2), installed exactly as the host's
# virtualenv is built (section 8.3). Coverage is REPORTED, never a threshold.
name: ci

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# On any other ref a newer push makes the older run irrelevant: cancel it.
# On main every commit keeps its run (C440, the operator, 2026-10-04): the
# Update button offers the newest commit CI PASSED (C436), and a cancelled
# run is no verdict, so cancelling there left only a batch's last commit
# installable. Public repository, standard runner: the runs cost nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Three jobs at once (the operator, 2026-10-03: a run took 6.5 to 9 minutes, 93% of it the
    # tests): the browser tests' files and two more shares of the rest, each about a third of
    # the measured work (scripts/nmas-shards, tests/shard_weights.json). The gate runs the
    # same three commands (C349). Each job reports its own coverage; none gates on it.
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [browser, a, b]
    runs-on: ubuntu-24.04
    # From a measurement, not a round number (the operator, 2026-09-28), and
    # RE-DERIVED when it moves (2026-10-01): the tests step grew from 207 s
    # (#224) to 296 s (#236), and #241 crossed scripts/nmas-test's 300 s bound,
    # which was 2.5x the LAPTOP's serial run and had never been derived for
    # this runner. The step's own bound is now 2.5x CI's measured 296 s
    # (NMAS_TEST_TIMEOUT below, 740 s); the job's is that plus the ~35 s of
    # setup before it, rounded up. Every run now annotates when its last test
    # finished and how long the session took to end after it, so the next
    # re-derivation reads both numbers from the public API.
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the removal check diffs the pushed range
          persist-credentials: false # nothing later needs the token

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"   # the host's interpreter
          # The downloads, keyed on the exact sets installed: the install stays --no-deps.
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.txt
            requirements-test.txt

      # --require-hashes --no-deps: EXACTLY the lock's files, as the host's venv
      # installs them. The lock was compiled with overrides
      # (requirements-overrides.txt: netmiko 4.3.0 declares textfsm>=1.1.3; the
      # host runs 1.1.2), so a resolver here would install something else.
      - name: Install the host's versions, exactly
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-test.txt

      # Information, not a gate: the facts the lock does NOT pin. The host
      # stamps ext4 times from a 1 ms tick and this runner did not, and a test
      # passed here and failed there (2026-09-26). An annotation, because the
      # public API returns annotations and not logs.
      - name: The runner's environment (information, not a gate)
        run: python scripts/nmas-env-facts --annotate || true

      - name: Where PyPI's metadata disagrees with the host (information, not a gate)
        run: python -m pip check || true

      # C46: the suite runs where no process it starts can reach a network.
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
      # this runner is an ephemeral VM, so lifting the restriction here
      # changes nothing that outlives the job. nmas-test REQUIRES the
      # confinement (the conftest measures it), so a runner that cannot give
      # it fails the run rather than passing unconfined.
      # C411: promtool, Prometheus's own PromQL engine, for the device dashboard's tests on real
      # data (tests/promql.py). Unpacked from the distribution's package, never installed, so no
      # service starts; 24.04 ships it inside `prometheus`, later releases as `promtool`.
      - name: promtool for the PromQL tests (unpacked, not installed)
        run: |
          d=$(mktemp -d) && cd "$d"
          sudo apt-get update -qq
          apt-get download promtool 2>/dev/null || apt-get download prometheus
          mkdir -p "$HOME/.local/share/nmas-promtool"   # dpkg -x makes only the last folder
          dpkg -x ./*.deb "$HOME/.local/share/nmas-promtool"
          "$HOME/.local/share/nmas-promtool/usr/bin/promtool" --version

      # Phase 4's records tests run against a REAL PostgreSQL (the operator's decision, option
      # a), started by the suite inside its own network namespace (tests/pg_instance.py): a
      # service container on the runner's network would be out of the confined suite's reach.
      # libpq5 is INSTALLED, never assumed from the image (the operator, 2026-10-09: psycopg
      # loads it, "no pq wrapper available" without it), with the server's own libraries;
      # the server itself is unpacked, not installed, so no service starts. A missing library
      # or a psycopg that cannot load FAILS this step, and NMAS_REQUIRE_PG=1 below turns the
      # tests' skip into a failure: CI never passes by skipping them.
      # PostgreSQL 18, the host's major (the operator, 2026-10-09: the F2 Test checks 18, and
      # CI does not loosen it): Ubuntu 24.04 ships 16, so PGDG's repository, added by
      # postgresql-common's own script with PGDG's signing key.
      - name: PostgreSQL 18 for the records tests, from PGDG (libpq5 installed; the server unpacked)
        run: |
          sudo apt-get install -y -qq --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq --no-install-recommends libpq5
          deps=$(apt-cache depends postgresql-18 | sed -n 's/^ *Depends: \(lib[^ <>]*\)$/\1/p' | sort -u)
          sudo apt-get install -y -qq --no-install-recommends $deps
          d=$(mktemp -d) && cd "$d" && apt-get download postgresql-18
          mkdir -p "$HOME/.local/share/nmas-pg"
          dpkg -x ./*.deb "$HOME/.local/share/nmas-pg"
          bin=$(ls -d "$HOME"/.local/share/nmas-pg/usr/lib/postgresql/18/bin)
          if ldd "$bin/postgres" "$bin/initdb" | grep "not found"; then
            echo "::error::the unpacked PostgreSQL lacks a library (above)"; exit 1
          fi
          "$bin/postgres" --version | tee /dev/stderr | grep -q " 18\." \
            || { echo "::error::the unpacked server is not PostgreSQL 18"; exit 1; }
          python -c "import psycopg; print('psycopg', psycopg.__version__, 'libpq', psycopg.pq.version())"

      - name: Allow a network namespace for the suite (this VM only)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # sys.monitoring, not the C tracer: coverage's default tracer cost ~45%
      # on the suite (measured 2026-09-27, 747 tests: 10.7 s bare, 15.6 s
      # CTracer, 10.1 s SysMonitor, identical coverage figures). The tests
      # step is ~95% of a run. Line coverage only, which is what is reported.
      - name: Tests (R1, R4), confined to loopback, coverage reported
        env:
          COVERAGE_CORE: sysmon
          NMAS_TEST_TIMEOUT: "740"
          NMAS_REQUIRE_PG: "1"
        run: >
          scripts/nmas-test -q -p no:cacheprovider -n auto
          --cov=modules --cov=routes --cov=app --cov-report=term
          $(python scripts/nmas-shards ${{ matrix.shard }})

      # The two range checks read the pushed range, not the tests: once, in job a.
      - name: No removed definition is still called (R2)
        if: matrix.shard == 'a'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "checking $RANGE"
          python scripts/check_removed_definitions.py "$RANGE"

      # A commit that changes a file a person installs on the host (the
      # updater, nmas-deploy, the systemd units, the topology renderer) says
      # what the host needs: Host-Step or Host-Step-None (2026-09-30). The
      # commit-msg hook refuses it locally; this refuses a bypass.
      - name: Every host-installed change says what the host needs
        if: matrix.shard == 'a'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "checking $RANGE"
          python scripts/nmas-host-step-check --range "$RANGE"
