<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="The model. Intent is what a device should run, committed by a person. The golden is what it did run, recorded at its last capture. The device is what it runs now. A deploy moves the device toward intent; a capture moves the golden toward the device; seeding moves intent from the golden, once, for a device that has none."><line class="dg-lane" x1="212" y1="20" x2="212" y2="324"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">THE RECORD</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE NETWORK</text><path class="dg-intent" d="M14,40 H190 L200,50 V86 H14 Z"/><path class="dg-intent" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="61.0" text-anchor="middle">Intent</text><text class="dg-sm" x="107.0" y="75.0" text-anchor="middle">what it should run</text><path class="dg-golden" d="M14,236 H190 L200,246 V282 H14 Z"/><path class="dg-golden" d="M190,236 V246 H200"/><text class="dg-tb" x="107.0" y="257.0" text-anchor="middle">Golden</text><text class="dg-sm" x="107.0" y="271.0" text-anchor="middle">what it ran, last capture</text><rect class="dg-dev" x="240" y="138" width="140" height="50" rx="5"/><rect class="dg-dev" x="252" y="187" width="8" height="5"/><rect class="dg-dev" x="266" y="187" width="8" height="5"/><rect class="dg-dev" x="280" y="187" width="8" height="5"/><text class="dg-tb" x="310.0" y="161.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="175.0" text-anchor="middle">what it runs now</text><path class="dg-send" d="M202,70 Q290,70 299.1,128.1"/><polygon class="dg-sendh" points="300.0,134.0 303.2,125.4 294.3,126.8"/><text class="dg-tb" x="248" y="90" text-anchor="start">deploy</text><path class="dg-read" d="M300,192 Q290,258 208.0,258.0"/><polygon class="dg-readh" points="202.0,258.0 210.0,262.5 210.0,253.5"/><text class="dg-tb" x="248" y="232" text-anchor="start">capture</text><path class="dg-rec" d="M60,234 L60.0,96.0"/><polygon class="dg-rech" points="60.0,90.0 55.5,98.0 64.5,98.0"/><text class="dg-tb" x="68" y="166" text-anchor="start">seed, once</text><text class="dg-sm" x="14" y="312" text-anchor="start">Every change is a commit; every commit names who.</text></svg>
