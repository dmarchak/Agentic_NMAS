{#- The device list's toolbar, rendered by today's index. Its second caller, GET
    /devices/regions (the in-place redraw, Stage 7.0), was removed at 7.8; v2's Devices
    replaces this list. -#}
  {% if devices %}
  <div class="d-flex gap-2 align-items-center">
    <button class="btn btn-success btn-sm" onclick="saveAllConfigs()" id="saveAllBtn">
      <span class="btn-text">Save All Configs</span>
      <span class="spinner-border spinner-border-sm d-none" role="status"></span>
    </button>
    <button class="btn btn-outline-success btn-sm" id="captureNoGoldenBtn"
            onclick="previewCapture([], {scope: 'no_golden'})"
            title="Preview a first golden for every device in this list that has no committed golden; nothing is recorded until you confirm">
      Capture devices with no golden
    </button>
    <span class="badge bg-secondary" id="deviceCount">{{ devices|length }} device(s)</span>
    <input type="text"
           class="form-control form-control-sm"
           id="deviceSearch"
           placeholder="Search devices..."
           style="width: 250px;">
  </div>
  {% endif %}
