<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="The two ways out of a rollback. The rollback left a block against the device&#x27;s intent, and the device unchanged. Revert says the change was wrong: it reads the intent history, computes intent with that one commit undone, you confirm its hash, it commits as you, then measures the block and lifts it only if the failed lines are gone. Retry says the change was right: you state a reason, it is recorded in the retry log, and the block is lifted. Neither sends anything; the next deploy does."><line class="dg-lane" x1="212" y1="20" x2="212" y2="554"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="96" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">THE ROLLBACK LEFT</text><path class="dg-intent" d="M14,46 H94 L104,56 V86 H14 Z"/><path class="dg-intent" d="M94,46 V56 H104"/><text class="dg-tb" x="59.0" y="64.0" text-anchor="middle">Intent</text><text class="dg-sm" x="59.0" y="78.0" text-anchor="middle">at HEAD</text><rect class="dg-store" x="112" y="46" width="88" height="40" rx="3"/><rect class="dg-bar" x="112" y="46" width="4" height="40" rx="1"/><text class="dg-tb" x="158.0" y="64.0" text-anchor="middle">Block</text><text class="dg-sm" x="158.0" y="78.0" text-anchor="middle">on the plan</text><rect class="dg-devoff" x="240" y="44" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="87" width="8" height="5"/><rect class="dg-devoff" x="266" y="87" width="8" height="5"/><rect class="dg-devoff" x="280" y="87" width="8" height="5"/><text class="dg-tb" x="310.0" y="64.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="78.0" text-anchor="middle">unchanged</text><rect class="dg-band" x="0" y="122" width="400" height="238" rx="6"/><text class="dg-hd" x="30" y="138" text-anchor="start">REVERT · THE CHANGE WAS WRONG</text><path class="dg-repo" d="M14,154 V186 A93.0,6 0 0 0 200,186 V154"/><ellipse class="dg-repo" cx="107.0" cy="154" rx="93.0" ry="6"/><text class="dg-tb" x="107.0" y="175.0" text-anchor="middle">Intent history</text><text class="dg-sm" x="107.0" y="189.0" text-anchor="middle">the commit to undo</text><circle class="dg-num" cx="14" cy="154" r="9"/><text class="dg-numt" x="14" y="157.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,194 L107.0,208.0"/><polygon class="dg-rech" points="107.0,214.0 111.5,206.0 102.5,206.0"/><path class="dg-intent" d="M14,216 H190 L200,226 V256 H14 Z"/><path class="dg-intent" d="M190,216 V226 H200"/><text class="dg-tb" x="107.0" y="234.0" text-anchor="middle">Intent after the revert</text><text class="dg-sm" x="107.0" y="248.0" text-anchor="middle">later commits kept</text><circle class="dg-num" cx="14" cy="216" r="9"/><text class="dg-numt" x="14" y="219.6" text-anchor="middle">2</text><rect class="dg-person" x="14" y="266" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="278.0" r="4"/><path class="dg-person" d="M23,289.0 Q30,280.0 37,289.0"/><text class="dg-tx" x="46" y="285.0" text-anchor="start">You confirm its hash</text><circle class="dg-num" cx="14" cy="266" r="9"/><text class="dg-numt" x="14" y="269.6" text-anchor="middle">3</text><path class="dg-rec" d="M107,298 L107.0,310.0"/><polygon class="dg-rech" points="107.0,316.0 111.5,308.0 102.5,308.0"/><rect class="dg-store" x="14" y="318" width="186" height="34" rx="3"/><rect class="dg-bar" x="14" y="318" width="4" height="34" rx="1"/><text class="dg-tb" x="109.0" y="333.0" text-anchor="middle">Commit, Source: revert</text><text class="dg-sm" x="109.0" y="347.0" text-anchor="middle">block lifted only if gone</text><circle class="dg-num" cx="14" cy="318" r="9"/><text class="dg-numt" x="14" y="321.6" text-anchor="middle">4</text><circle class="dg-no" cx="310" cy="236" r="11"/><line class="dg-nol" x1="302.5" y1="243.5" x2="317.5" y2="228.5"/><text class="dg-sm" x="310" y="262" text-anchor="middle">nothing is sent:</text><text class="dg-sm" x="310" y="275" text-anchor="middle">intent only</text><rect class="dg-band" x="0" y="366" width="400" height="160" rx="6"/><text class="dg-hd" x="30" y="382" text-anchor="start">RETRY · THE CHANGE WAS RIGHT</text><rect class="dg-person" x="14" y="392" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="404.0" r="4"/><path class="dg-person" d="M23,415.0 Q30,406.0 37,415.0"/><text class="dg-tx" x="46" y="411.0" text-anchor="start">You state a reason</text><circle class="dg-num" cx="14" cy="392" r="9"/><text class="dg-numt" x="14" y="395.6" text-anchor="middle">1</text><path class="dg-rec" d="M107,424 L107.0,438.0"/><polygon class="dg-rech" points="107.0,444.0 111.5,436.0 102.5,436.0"/><rect class="dg-store" x="14" y="446" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="446" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="462.0" text-anchor="middle">Retry log</text><text class="dg-sm" x="109.0" y="476.0" text-anchor="middle">who, why, when</text><circle class="dg-num" cx="14" cy="446" r="9"/><text class="dg-numt" x="14" y="449.6" text-anchor="middle">2</text><text class="dg-sm" x="14" y="504" text-anchor="start">The block is lifted; the program is unchanged.</text><circle class="dg-no" cx="310" cy="440" r="11"/><line class="dg-nol" x1="302.5" y1="447.5" x2="317.5" y2="432.5"/><text class="dg-sm" x="310" y="466" text-anchor="middle">nothing is sent:</text><text class="dg-sm" x="310" y="479" text-anchor="middle">a record only</text><text class="dg-sm" x="14" y="548" text-anchor="start">Then plan and deploy: the device changes only there.</text></svg>
