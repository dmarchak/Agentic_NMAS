<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="Running the tests and their coverage. scripts/nmas-test runs pytest in CI&#x27;s Python inside a network namespace that holds loopback alone, with a temporary data folder, so no test reaches a device, a network or a real store. Each test&#x27;s tier (unit, spawns or browser) is recorded, and coverage.py records the lines each tier ran. scripts/nmas-coverage report reads both: the functions a unit test reached, module by module, the lines, and the ratchet against the committed baseline, written as HTML and JSON where you name them. The baseline moves only when a person runs nmas-coverage baseline. scripts/nmas-gate runs the suite as CI runs it, then the ratchet, before it commits."><rect class="dg-band" x="0" y="8" width="400" height="150" rx="6"/><text class="dg-hd" x="30" y="24" text-anchor="start">A LOOPBACK-ONLY NAMESPACE</text><rect class="dg-store" x="14" y="32" width="186" height="38" rx="3"/><rect class="dg-bar" x="14" y="32" width="4" height="38" rx="1"/><text class="dg-tb" x="109.0" y="49.0" text-anchor="middle">scripts/nmas-test</text><text class="dg-sm" x="109.0" y="63.0" text-anchor="middle">CI&#x27;s Python, -n by memory</text><circle class="dg-num" cx="14" cy="32" r="9"/><text class="dg-numt" x="14" y="35.6" text-anchor="middle">1</text><rect class="dg-svc" x="14" y="84" width="186" height="34" rx="17.0"/><text class="dg-tb" x="107.0" y="99.0" text-anchor="middle">pytest</text><text class="dg-sm" x="107.0" y="113.0" text-anchor="middle">a temporary data folder</text><path class="dg-rec" d="M107,70 L107.0,78.0"/><polygon class="dg-rech" points="107.0,84.0 111.5,76.0 102.5,76.0"/><rect class="dg-devoff" x="262" y="36" width="118" height="56" rx="5"/><rect class="dg-devoff" x="274" y="91" width="8" height="5"/><rect class="dg-devoff" x="288" y="91" width="8" height="5"/><rect class="dg-devoff" x="302" y="91" width="8" height="5"/><text class="dg-tb" x="321.0" y="62.0" text-anchor="middle">A device</text><text class="dg-sm" x="321.0" y="76.0" text-anchor="middle">never reached</text><circle class="dg-no" cx="232" cy="101" r="11"/><line class="dg-nol" x1="224.5" y1="108.5" x2="239.5" y2="93.5"/><text class="dg-sm" x="262" y="122" text-anchor="start">No network:</text><text class="dg-sm" x="262" y="135" text-anchor="start">loopback only</text><rect class="dg-store" x="14" y="172" width="186" height="38" rx="3"/><rect class="dg-bar" x="14" y="172" width="4" height="38" rx="1"/><text class="dg-tb" x="109.0" y="189.0" text-anchor="middle">The tier record</text><text class="dg-sm" x="109.0" y="203.0" text-anchor="middle">unit, spawns or browser</text><circle class="dg-num" cx="14" cy="172" r="9"/><text class="dg-numt" x="14" y="175.6" text-anchor="middle">2</text><rect class="dg-store" x="214" y="172" width="172" height="38" rx="3"/><rect class="dg-bar" x="214" y="172" width="4" height="38" rx="1"/><text class="dg-tb" x="302.0" y="189.0" text-anchor="middle">coverage.py</text><text class="dg-sm" x="302.0" y="203.0" text-anchor="middle">the lines each tier ran</text><circle class="dg-num" cx="214" cy="172" r="9"/><text class="dg-numt" x="214" y="175.6" text-anchor="middle">3</text><path class="dg-rec" d="M107,118 L107.0,166.0"/><polygon class="dg-rech" points="107.0,172.0 111.5,164.0 102.5,164.0"/><path class="dg-rec" d="M160,118 L294.4,169.8"/><polygon class="dg-rech" points="300.0,172.0 294.2,164.9 290.9,173.3"/><path class="dg-box" d="M14,236 H376 L386,246 V276 H14 Z"/><path class="dg-box" d="M376,236 V246 H386"/><text class="dg-tb" x="200.0" y="254.0" text-anchor="middle">scripts/nmas-coverage report</text><text class="dg-sm" x="200.0" y="268.0" text-anchor="middle">functions a unit test reached, lines, the ratchet</text><circle class="dg-num" cx="14" cy="236" r="9"/><text class="dg-numt" x="14" y="239.6" text-anchor="middle">4</text><path class="dg-rec" d="M107,210 L107.0,230.0"/><polygon class="dg-rech" points="107.0,236.0 111.5,228.0 102.5,228.0"/><path class="dg-rec" d="M300,210 L300.0,230.0"/><polygon class="dg-rech" points="300.0,236.0 304.5,228.0 295.5,228.0"/><rect class="dg-store" x="14" y="302" width="186" height="38" rx="3"/><rect class="dg-bar" x="14" y="302" width="4" height="38" rx="1"/><text class="dg-tb" x="109.0" y="319.0" text-anchor="middle">coverage.html, .json</text><text class="dg-sm" x="109.0" y="333.0" text-anchor="middle">where --html and --json say</text><path class="dg-repo" d="M214,304 V340 A86.0,6 0 0 0 386,340 V304"/><ellipse class="dg-repo" cx="300.0" cy="304" rx="86.0" ry="6"/><text class="dg-tb" x="300.0" y="327.0" text-anchor="middle">The baseline</text><text class="dg-sm" x="300.0" y="341.0" text-anchor="middle">moves only by a person</text><path class="dg-rec" d="M107,276 L107.0,296.0"/><polygon class="dg-rech" points="107.0,302.0 111.5,294.0 102.5,294.0"/><path class="dg-rec" d="M300,298 L300.0,282.0"/><polygon class="dg-rech" points="300.0,276.0 295.5,284.0 304.5,284.0"/><rect class="dg-store" x="14" y="372" width="372" height="40" rx="3"/><rect class="dg-bar" x="14" y="372" width="4" height="40" rx="1"/><text class="dg-tb" x="202.0" y="390.0" text-anchor="middle">scripts/nmas-gate</text><text class="dg-sm" x="202.0" y="404.0" text-anchor="middle">the suite as CI runs it, the ratchet, then the commit</text><circle class="dg-num" cx="14" cy="372" r="9"/><text class="dg-numt" x="14" y="375.6" text-anchor="middle">5</text></svg>
