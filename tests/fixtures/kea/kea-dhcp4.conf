{
    "Dhcp4": {
        "hooks-libraries": [
            {
                "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
            }
        ],
        "interfaces-config": {
            "interfaces": [
                "enp6s19"
            ]
        },
        "control-socket": {
            "socket-type": "unix",
            "socket-name": "/run/kea/kea4-ctrl-socket"
        },
        "lease-database": {
            "type": "memfile",
            "lfc-interval": 3600,
            "name": "/var/lib/kea/kea-leases4.csv"
        },
        "valid-lifetime": 31536000,
        "renew-timer": 15768000,
        "rebind-timer": 27594000,
        "subnet4": [
            {
                "id": 10,
                "reservations": <?include "/etc/kea/nmas/reservations-10.json"?>,
                "subnet": "10.10.10.0/24",
                "comment": "VLAN 10 - h1, h3",
                "relay": {
                    "ip-addresses": [
                        "10.10.10.2",
                        "10.10.10.3"
                    ]
                },
                "pools": [
                    {
                        "pool": "10.10.10.100 - 10.10.10.200"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "10.10.10.1"
                    },
                    {
                        "name": "domain-name-servers",
                        "data": "10.255.0.10"
                    },
                    {
                        "name": "domain-name",
                        "data": "rcn.lab"
                    }
                ]
            },
            {
                "id": 20,
                "reservations": <?include "/etc/kea/nmas/reservations-20.json"?>,
                "subnet": "10.10.20.0/24",
                "comment": "VLAN 20 - h2",
                "relay": {
                    "ip-addresses": [
                        "10.10.20.2",
                        "10.10.20.3"
                    ]
                },
                "pools": [
                    {
                        "pool": "10.10.20.100 - 10.10.20.200"
                    }
                ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "10.10.20.1"
                    },
                    {
                        "name": "domain-name-servers",
                        "data": "10.255.0.10"
                    },
                    {
                        "name": "domain-name",
                        "data": "rcn.lab"
                    }
                ]
            },
            {
                "id": 255,
                "subnet": "10.255.0.0/24",
                "interface": "enp6s19",
                "reservations-out-of-pool": true,
                "reservations": <?include "/etc/kea/nmas/reservations-255.json"?>
            }
        ],
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output_options": [
                    {
                        "output": "/var/log/kea/kea-dhcp4.log"
                    }
                ],
                "severity": "INFO",
                "debuglevel": 0
            }
        ]
    }
}
