<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="The approval queue. The drift check and the AI agent ADD items; nothing resolves one without a person. Approving a drift item opens the capture preview, which reads the device now; approving a revert item opens the restore preview at HEAD, which computes the program now. The queued diff is context only and is never sent. You confirm the preview&#x27;s hash; the operation runs and records; the item closes only for the devices it recorded. An item can also be withdrawn by a newer golden or expire after 48 hours, running nothing."><line class="dg-lane" x1="212" y1="20" x2="212" y2="534"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="110" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">QUEUED · NOTHING RUNS</text><rect class="dg-svc" x="14" y="44" width="88" height="30" rx="15.0"/><text class="dg-tb" x="58.0" y="63.0" text-anchor="middle">Drift check</text><rect class="dg-svc" x="110" y="44" width="90" height="30" rx="15.0"/><text class="dg-tb" x="155.0" y="63.0" text-anchor="middle">AI agent</text><path class="dg-rec" d="M58,76 L75.6,92.0"/><polygon class="dg-rech" points="80.0,96.0 77.1,87.3 71.1,93.9"/><path class="dg-rec" d="M155,76 L134.7,92.3"/><polygon class="dg-rech" points="130.0,96.0 139.1,94.5 133.4,87.5"/><rect class="dg-store" x="14" y="98" width="186" height="26" rx="3"/><rect class="dg-bar" x="14" y="98" width="4" height="26" rx="1"/><text class="dg-tb" x="109.0" y="115.0" text-anchor="middle">Approval queue</text><rect class="dg-devoff" x="240" y="50" width="140" height="44" rx="5"/><rect class="dg-devoff" x="252" y="93" width="8" height="5"/><rect class="dg-devoff" x="266" y="93" width="8" height="5"/><rect class="dg-devoff" x="280" y="93" width="8" height="5"/><text class="dg-tb" x="310.0" y="70.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="84.0" text-anchor="middle">not contacted</text><rect class="dg-band" x="0" y="136" width="400" height="120" rx="6"/><text class="dg-hd" x="30" y="152" text-anchor="start">APPROVE</text><rect class="dg-person" x="14" y="160" width="186" height="30" rx="15.0"/><circle class="dg-person" cx="30" cy="172.0" r="4"/><path class="dg-person" d="M23,183.0 Q30,174.0 37,183.0"/><text class="dg-tx" x="46" y="179.0" text-anchor="start">You approve</text><circle class="dg-num" cx="14" cy="160" r="9"/><text class="dg-numt" x="14" y="163.6" text-anchor="middle">1</text><text class="dg-sm" x="14" y="212" text-anchor="start">Drift item: the capture preview.</text><text class="dg-sm" x="14" y="226" text-anchor="start">Revert item: the restore preview,</text><text class="dg-sm" x="14" y="239" text-anchor="start">at HEAD. The queued diff is context only.</text><circle class="dg-no" cx="310" cy="196" r="11"/><line class="dg-nol" x1="302.5" y1="203.5" x2="317.5" y2="188.5"/><text class="dg-sm" x="310" y="222" text-anchor="middle">approving sends</text><text class="dg-sm" x="310" y="235" text-anchor="middle">nothing</text><rect class="dg-band" x="0" y="262" width="400" height="196" rx="6"/><text class="dg-hd" x="30" y="278" text-anchor="start">THE OPERATION, PREVIEWED NOW</text><rect class="dg-dev" x="262" y="284" width="118" height="150" rx="5"/><rect class="dg-dev" x="274" y="433" width="8" height="5"/><rect class="dg-dev" x="288" y="433" width="8" height="5"/><rect class="dg-dev" x="302" y="433" width="8" height="5"/><text class="dg-tb" x="321.0" y="302" text-anchor="middle">The device</text><circle class="dg-num" cx="22" cy="300" r="9"/><text class="dg-numt" x="22" y="303.6" text-anchor="middle">2</text><text class="dg-tb" x="36" y="304" text-anchor="start">Read now</text><text class="dg-sm" x="36" y="316" text-anchor="start">capture: the device as it is</text><path class="dg-read" d="M260,300 L208.0,300.0"/><polygon class="dg-readh" points="202.0,300.0 210.0,304.5 210.0,295.5"/><circle class="dg-num" cx="22" cy="340" r="9"/><text class="dg-numt" x="22" y="343.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="344" text-anchor="start">Confirm the hash</text><text class="dg-sm" x="36" y="356" text-anchor="start">of the preview you read</text><circle class="dg-num" cx="22" cy="380" r="9"/><text class="dg-numt" x="22" y="383.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="384" text-anchor="start">Restore only:</text><text class="dg-sm" x="36" y="396" text-anchor="start">the confirmed program</text><path class="dg-send" d="M202,380 L254.0,380.0"/><polygon class="dg-sendh" points="260.0,380.0 252.0,375.5 252.0,384.5"/><circle class="dg-num" cx="22" cy="420" r="9"/><text class="dg-numt" x="22" y="423.6" text-anchor="middle">5</text><text class="dg-tb" x="36" y="424" text-anchor="start">Recorded as you</text><text class="dg-sm" x="36" y="436" text-anchor="start">golden commit, receipt</text><rect class="dg-band" x="0" y="464" width="400" height="64" rx="6"/><text class="dg-hd" x="30" y="480" text-anchor="start">CLOSE</text><rect class="dg-store" x="14" y="482" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="482" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="498.0" text-anchor="middle">Item closed</text><text class="dg-sm" x="109.0" y="512.0" text-anchor="middle">only for devices recorded</text><circle class="dg-num" cx="14" cy="482" r="9"/><text class="dg-numt" x="14" y="485.6" text-anchor="middle">6</text><text class="dg-sm" x="214" y="504" text-anchor="start">Or withdrawn, or expired:</text><text class="dg-sm" x="214" y="517" text-anchor="start">runs nothing</text></svg>
