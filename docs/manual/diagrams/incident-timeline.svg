<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="An incident&#x27;s timeline, each time from a record Mercury wrote while it happened: detected is the event&#x27;s receive time, the incident&#x27;s first trigger (a log line&#x27;s receive time, an alert&#x27;s start, an adjacency&#x27;s loss, a drift check&#x27;s run); decided is the heal decision&#x27;s time, or the time a person approved the proposed fix; applied is the act&#x27;s check of each unit at intent, the first step after its program was sent; verified is the act&#x27;s record step, when its outcome is a passed verify. Time to repair is verified minus detected, in whole seconds, drawn only from a passed verify: an attempt whose verify failed reads applied, verify failed, and the incident needs a person. No time is read from a device&#x27;s clock."><line class="dg-lane" x1="212" y1="20" x2="212" y2="418"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-dev" x="262" y="40" width="118" height="250" rx="5"/><rect class="dg-dev" x="274" y="289" width="8" height="5"/><rect class="dg-dev" x="288" y="289" width="8" height="5"/><rect class="dg-dev" x="302" y="289" width="8" height="5"/><text class="dg-tb" x="321.0" y="58" text-anchor="middle">The device</text><text class="dg-sm" x="321.0" y="72" text-anchor="middle">its clock never read</text><path class="dg-box" d="M14,40 H190 L200,50 V76 H14 Z"/><path class="dg-box" d="M190,40 V50 H200"/><text class="dg-tb" x="107.0" y="56.0" text-anchor="middle">A trigger</text><text class="dg-sm" x="107.0" y="70.0" text-anchor="middle">the event&#x27;s receive time</text><circle class="dg-num" cx="14" cy="40" r="9"/><text class="dg-numt" x="14" y="43.6" text-anchor="middle">1</text><text class="dg-tb" x="36" y="104" text-anchor="start">Detected</text><text class="dg-sm" x="36" y="116" text-anchor="start">the first trigger&#x27;s time</text><path class="dg-read" d="M260,100 L208.0,100.0"/><polygon class="dg-readh" points="202.0,100.0 210.0,104.5 210.0,95.5"/><rect class="dg-store" x="14" y="126" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="126" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="142.0" text-anchor="middle">The decision</text><text class="dg-sm" x="109.0" y="156.0" text-anchor="middle">its time, or the approval&#x27;s</text><circle class="dg-num" cx="14" cy="126" r="9"/><text class="dg-numt" x="14" y="129.6" text-anchor="middle">2</text><circle class="dg-num" cx="22" cy="190" r="9"/><text class="dg-numt" x="22" y="193.6" text-anchor="middle">3</text><text class="dg-tb" x="36" y="194" text-anchor="start">Applied</text><text class="dg-sm" x="36" y="206" text-anchor="start">the intent check&#x27;s step</text><path class="dg-send" d="M202,190 L254.0,190.0"/><polygon class="dg-sendh" points="260.0,190.0 252.0,185.5 252.0,194.5"/><circle class="dg-num" cx="22" cy="234" r="9"/><text class="dg-numt" x="22" y="237.6" text-anchor="middle">4</text><text class="dg-tb" x="36" y="238" text-anchor="start">Verified</text><text class="dg-sm" x="36" y="250" text-anchor="start">the record step, verify passed</text><path class="dg-read" d="M260,234 L208.0,234.0"/><polygon class="dg-readh" points="202.0,234.0 210.0,238.5 210.0,229.5"/><circle class="dg-clock" cx="22" cy="280" r="8"/><path class="dg-clock" d="M22,275 V280 L26,282"/><text class="dg-tb" x="36" y="284" text-anchor="start">Time to repair</text><text class="dg-sm" x="36" y="296" text-anchor="start">verified − detected, in seconds</text><text class="dg-sm" x="14" y="326" text-anchor="start">A failed verify: applied, verify failed.</text><text class="dg-sm" x="14" y="339" text-anchor="start">Never fixed: the incident needs a person.</text><rect class="dg-store" x="14" y="358" width="186" height="40" rx="3"/><rect class="dg-bar" x="14" y="358" width="4" height="40" rx="1"/><text class="dg-tb" x="109.0" y="376.0" text-anchor="middle">The step log</text><text class="dg-sm" x="109.0" y="390.0" text-anchor="middle">each step&#x27;s own time</text><circle class="dg-num" cx="14" cy="358" r="9"/><text class="dg-numt" x="14" y="361.6" text-anchor="middle">5</text></svg>
