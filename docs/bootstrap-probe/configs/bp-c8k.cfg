! Minimal bootstrap for a C8000v joining this lab.
!
! Shaped from r1.cfg's management-plane lines and NOTHING else: no loopback,
! no addressed data interface, no routing process. What remains is what the
! wizard must generate for a new router, and what "factory default plus the
! bootstrap profile" means for this platform.
!
! Gi1 is deliberately absent. r1.cfg does not configure it either — vrnetlab
! owns the management interface on this kind.
!
hostname bp-c8k
!
no aaa new-model
!
username admin privilege 15 secret 0 admin
!
ip domain-name rcn.lab
!
line vty 0 4
 logging synchronous
 login local
 transport input all
!
end
