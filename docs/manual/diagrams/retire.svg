<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Retiring a device: the whole exit, sending nothing to it. The preview checks the break-glass export holds its current credential. The apply masks credentials NetBox holds in its context where the tool wrote them, clears the credential override, declares its lab startup file unmapped, commits the exit as you, removes its legacy file only if its content survives, and deletes its inventory row last. NetBox keeps the device and history is kept."><line class="dg-lane" x1="212" y1="20" x2="212" y2="464"/><text class="dg-hd" x="106.0" y="12" text-anchor="middle">IN THE TOOL</text><text class="dg-hd" x="306.0" y="12" text-anchor="middle">THE DEVICE</text><rect class="dg-band" x="0" y="20" width="400" height="70" rx="6"/><text class="dg-hd" x="30" y="36" text-anchor="start">PREVIEW</text><rect class="dg-store" x="14" y="40" width="186" height="36" rx="3"/><rect class="dg-bar" x="14" y="40" width="4" height="36" rx="1"/><text class="dg-tb" x="109.0" y="56.0" text-anchor="middle">Break-glass export</text><text class="dg-sm" x="109.0" y="70.0" text-anchor="middle">holds the current credential?</text><rect class="dg-devoff" x="240" y="36" width="140" height="40" rx="5"/><rect class="dg-devoff" x="252" y="75" width="8" height="5"/><rect class="dg-devoff" x="266" y="75" width="8" height="5"/><rect class="dg-devoff" x="280" y="75" width="8" height="5"/><text class="dg-tb" x="310.0" y="54.0" text-anchor="middle">The device</text><text class="dg-sm" x="310.0" y="68.0" text-anchor="middle">never contacted</text><rect class="dg-band" x="0" y="96" width="400" height="300" rx="6"/><text class="dg-hd" x="30" y="112" text-anchor="start">THE APPLY · IN ORDER</text><rect class="dg-svc" x="14" y="118" width="186" height="34" rx="17.0"/><text class="dg-tb" x="107.0" y="133.0" text-anchor="middle">NetBox context</text><text class="dg-sm" x="107.0" y="147.0" text-anchor="middle">credentials masked</text><circle 